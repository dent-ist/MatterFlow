name: nightly

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily (runs against the default branch)
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  backend-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - name: Build
        run: dotnet build --no-restore -c Release -warnaserror
      - name: Full test suite (unit, architecture, schema, integration)
        run: >
          dotnet test --no-build -c Release
          --collect:"XPlat Code Coverage"
          --logger "trx" --results-directory ../TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-backend-test-results
          path: TestResults
          if-no-files-found: ignore

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci || (sleep 15 && npm ci)
      - run: npm test
      - run: npm run build

  # Security review SEC-11: fail the night when a dependency has a known vulnerability (direct or transitive).
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - name: NuGet vulnerabilities (direct and transitive)
        working-directory: backend
        run: |
          dotnet list MatterFlow.sln package --vulnerable --include-transitive 2>&1 | tee ../nuget-audit.txt
          if grep -q "has the following vulnerable packages" ../nuget-audit.txt; then
            echo "::error::Vulnerable NuGet packages found (see the log). Bump or pin them in backend/Directory.Packages.props."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (production dependencies)
        working-directory: frontend
        run: npm ci || (sleep 15 && npm ci) && npm audit --omit=dev --audit-level=high
