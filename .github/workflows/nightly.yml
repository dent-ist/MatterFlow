name: nightly

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily (runs against the default branch)
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  backend-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - name: Build
        run: dotnet build --no-restore -c Release -warnaserror
      - name: Full test suite (unit, architecture, schema, integration)
        run: >
          dotnet test --no-build -c Release
          --collect:"XPlat Code Coverage"
          --logger "trx" --results-directory ../TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-backend-test-results
          path: TestResults
          if-no-files-found: ignore

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci || (sleep 15 && npm ci)
      - run: npm test
      - run: npm run build
