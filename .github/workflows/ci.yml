name: ci

on:
  push:
    branches: [dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release -warnaserror
      - name: OpenAPI drift check
        run: git diff --exit-code -- ../contracts/openapi/v1.json
      - name: Format check
        run: dotnet format --no-restore --verify-no-changes
      - name: Unit, architecture, schema and smoke integration tests
        run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage" --results-directory ../TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: TestResults
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit tests (Vitest)
        run: npm test
      - name: API client drift check
        run: |
          npm run api:generate
          git diff --exit-code -- src/app/api/generated
      - name: Production build
        run: npm run build
