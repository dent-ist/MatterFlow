name: e2e

# Browser end-to-end suite (Playwright, frontend/e2e). It starts a throwaway real stack (SQL Server in Docker, the published API serving the
# built Angular app on one origin, Dev authentication) and runs the tests against it. The same script is used locally:
#   frontend/e2e/run-local.sh     (see docs/qa/e2e.md)
#
# When it runs: manually, every night against the default branch, and on pull requests that carry the label `e2e`
# (add the label to run it; new commits to a labeled PR re-run it).
on:
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * *" # 03:43 UTC daily
  pull_request:
    types: [labeled, synchronize, reopened]

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  e2e:
    # Pull requests only run when labeled `e2e`; dispatch and schedule always run.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci || (sleep 15 && npm ci)
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run the suite (SQL Server container, build, publish, API, tests)
        working-directory: frontend
        run: npm run e2e
      - name: Upload Playwright report, traces, screenshots and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ github.run_id }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload API log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-api-log-${{ github.run_id }}
          path: artifacts/e2e-api.log
          if-no-files-found: ignore
          retention-days: 14
