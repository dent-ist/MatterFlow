name: e2e

# Browser end-to-end suite (Playwright, frontend/e2e). It starts a throwaway real stack (SQL Server in Docker, the published API serving the
# built Angular app on one origin, Dev authentication) and runs the tests against it. The same script is used locally:
#   frontend/e2e/run-local.sh     (see docs/qa/e2e.md)
#
# When it runs: manually, every night against the default branch, and on pull requests that carry the label `e2e`
# (add the label to run it; new commits to a labeled PR re-run it).
#
# History (#1354, #1356, #1357): one job ran the whole suite (324 spec files, one worker on CI) and hit its time limit. The Angular build hang was fixed
# in frontend/scripts/run-ng-build.mjs. The first split used `--shard=i/4`, but Playwright keeps a dependent project together with everything it depends
# on, so the `branding` project (depends on `chromium`) pulled the WHOLE suite into shard 1 and shards 2 to 4 found nothing to run. The second split
# (`--project=chromium --shard=i/12`) ran, but `--shard` balances by test count, not by time: shard 9 hit the 35-minute step limit on six tests of the
# Task Types permission matrix (17 minutes together) and 34 tests "did not run" behind the first failure of a serial file.
# Now: the chromium project is split by spec FILE with frontend/e2e/shard.mjs (greedy, balanced by frontend/e2e/shard-weights.json, about 19 minutes
# predicted per shard, one worker, own stack); the branding spec runs alone in its own job (`--project=branding --no-deps`, it changes the application
# name for everybody); the sensitive-matter specs keep their own job with the go-live switch on (shard.mjs leaves them out of the shards); every job
# writes a Markdown summary (frontend/e2e/summary.mjs) and a last job fails when any of them failed.

on:
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * 1" # Mondays 03:43 UTC (weekly keeps the free Actions minutes; run on demand before a release)
  pull_request:
    types: [labeled, synchronize, reopened]

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  e2e:
    name: e2e (${{ matrix.name }})
    # Pull requests only run when labeled `e2e`; dispatch and schedule always run.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    # Pinned: ubuntu-latest is 26.04 and Playwright 1.56 has no Chromium build for it.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false # a failed shard must not hide the verdict of the others
      matrix:
        include:
          # The 12 shards: `node e2e/shard.mjs <shard> 12` gives the spec files of a shard (frontend/e2e/shard-weights.json balances them by seconds).
          # If the number of shards changes, change it in the `Select` step below and in the matrix together.
          - name: shard 1 of 12
            id: shard-1
            shard: 1
          - name: shard 2 of 12
            id: shard-2
            shard: 2
          - name: shard 3 of 12
            id: shard-3
            shard: 3
          - name: shard 4 of 12
            id: shard-4
            shard: 4
          - name: shard 5 of 12
            id: shard-5
            shard: 5
          - name: shard 6 of 12
            id: shard-6
            shard: 6
          - name: shard 7 of 12
            id: shard-7
            shard: 7
          - name: shard 8 of 12
            id: shard-8
            shard: 8
          - name: shard 9 of 12
            id: shard-9
            shard: 9
          - name: shard 10 of 12
            id: shard-10
            shard: 10
          - name: shard 11 of 12
            id: shard-11
            shard: 11
          - name: shard 12 of 12
            id: shard-12
            shard: 12
          # The branding spec changes the application name and icon for everybody (epic #850): it needs a stack of its own (18 tests).
          - name: branding spec
            id: branding
            args: '--project=branding --no-deps'
          # The sensitive-matter specs need the go-live switch on (epic #788): run-local.sh starts that stack when the arguments name `sensitive-`.
          # They are not in the shards above (shard.mjs leaves them out).
          - name: sensitive-matter specs
            id: sensitive
            args: '--project=chromium sensitive-'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci || (sleep 15 && npm ci)
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Install the Inter font
        # The layout specs (column widths, no sideways scroll) are tuned on a machine where the app's font stack (Segoe UI, system-ui, ...)
        # resolves to Inter. Without it the runner falls back to DejaVu Sans, which is wider: the Task Types grid then scrolls sideways
        # and the row menu closes on the scroll (ty3-narrow-columns, ty9-audit, ty9-keyboard; #1359).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter
          fc-match system-ui
      - name: Select the spec files of this shard
        if: matrix.shard
        id: select
        working-directory: frontend
        run: |
          args="$(node e2e/shard.mjs ${{ matrix.shard }} 12 --args)"
          echo "$args" | tr ' ' '\n' | sed 's/^/  /'
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - name: Check that this job has tests to run
        # Playwright exits 0 when a --shard slice is empty, which is how three shards once "passed" without running anything (#1356).
        working-directory: frontend
        env:
          E2E_ARGS: ${{ matrix.args || steps.select.outputs.args }}
        run: |
          npx playwright test -c e2e/playwright.config.ts --list $E2E_ARGS | tail -n 1 | tee /dev/stderr | grep -qv '^Total: 0 '
      - name: Run the suite (SQL Server container, build, publish, API, tests)
        timeout-minutes: 35
        working-directory: frontend
        env:
          E2E_ARGS: ${{ matrix.args || steps.select.outputs.args }}
        run: npm run e2e -- $E2E_ARGS
      - name: Summary of this job (passed, failed, flaky, skipped, did not run, slowest tests)
        if: always()
        working-directory: frontend
        run: node e2e/summary.mjs playwright-json/results.json "e2e (${{ matrix.name }})"
      - name: Upload Playwright report, traces, screenshots and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.id }}-${{ github.run_id }}
          path: |
            frontend/playwright-report
            frontend/playwright-json
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload API log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-api-log-${{ matrix.id }}-${{ github.run_id }}
          path: artifacts/e2e-api.log
          if-no-files-found: ignore
          retention-days: 14

  # One verdict for the whole run (use this job as the required check): it fails when any shard failed, was cancelled or did not run, and is
  # skipped-as-success for a pull request without the `e2e` label.
  result:
    name: e2e (result)
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when any e2e job did not succeed
        env:
          RESULT: ${{ needs.e2e.result }}
        run: |
          echo "e2e jobs: $RESULT"
          [ "$RESULT" = "success" ] || [ "$RESULT" = "skipped" ]
