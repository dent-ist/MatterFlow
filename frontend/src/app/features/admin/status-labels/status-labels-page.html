<mf-fixed-page>
  <mf-page-header
    heading="Labels"
    [crumbs]="[{ label: 'Administration' }, { label: 'Labels' }]"
    description="You can rename how statuses appear. You can't add or remove them."
  >
    <nav class="tabs" aria-label="Priorities and status labels">
      <a *mfHasPermission="'Priority.Manage'" routerLink="/admin/priorities">Priorities</a>
      <a routerLink="/admin/status-labels" aria-current="page">Status labels</a>
    </nav>
  </mf-page-header>

  <div class="sr-only" role="status" aria-live="polite" data-announce>{{ announcement() }}</div>

  @if (failure()) {
    <p class="error" role="alert" data-failure>{{ failure() }}</p>
  }

  <mf-list-state noun="status labels" [state]="state()" [columns]="3" (retry)="load()">
    <div class="mf-table-wrap" mfScrollArea="Status labels list">
      <div class="mf-scroll">
        <table class="grid" data-status-labels>
          <caption class="sr-only">
            Task statuses and their display labels
          </caption>
          <thead>
            <tr>
              <th scope="col">Internal code</th>
              <th scope="col">Preview</th>
              <th scope="col">Display label</th>
            </tr>
          </thead>
          <tbody>
            @for (row of rows(); track row.code) {
              <tr [attr.data-row]="row.code">
                <th scope="row" class="code">{{ row.code }}</th>
                <td>
                  <mf-status-badge [code]="row.code" [label]="row.displayLabel" />
                </td>
                <td>
                  <span>{{ row.displayLabel }}</span>
                  <button
                    type="button"
                    class="mf-btn mf-btn--text"
                    *mfHasPermission="'StatusLabel.Manage'"
                    [attr.aria-label]="'Rename ' + row.displayLabel"
                    (click)="startEdit(row)"
                    data-rename
                  >
                    Rename
                  </button>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </mf-list-state>

  <mf-lookup-dialog
    [title]="renameCopy().title"
    [submitLabel]="renameCopy().confirm"
    [cancelLabel]="renameCopy().cancel"
    [visible]="editingCode() !== null"
    (visibleChange)="!$event && cancelEdit()"
    [dirty]="isDirty()"
    [saving]="busy()"
    [error]="saveError()"
    [summary]="summary()"
    (save)="commit()"
    (cancel)="cancelEdit()"
  >
    <p class="rename-help" data-rename-help>{{ renameCopy().body }}</p>
    <mf-text-field
      inputId="status-label-name"
      label="Display label"
      [required]="true"
      [maxLength]="limits.statusLabel"
      [counter]="true"
      [error]="fieldError()"
      [(value)]="draft"
    />
    <mf-status-badge mfPreview [code]="editingCode() ?? ''" [label]="draft().trim() || 'Label'" />
  </mf-lookup-dialog>
</mf-fixed-page>
