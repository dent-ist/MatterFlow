# Local development database: SQL Server 2022 with an empty MatterFlow database.
#   docker compose -f docker-compose.dev.yml up -d
# The API creates the schema itself at startup (Migrations:Enabled, default true). Development only: the password is not a secret.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: matterflow-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "MatterFlow_Dev1!"
    ports:
      - "127.0.0.1:1433:1433" # loopback only: the sa password above is public (security review SEC-19)
    volumes:
      - matterflow-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # One-shot: creates the (empty) database once SQL Server accepts connections.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    environment:
      MSSQL_SA_PASSWORD: "MatterFlow_Dev1!"
    entrypoint:
      - /bin/bash
      - -c
      - /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -b -Q "IF DB_ID('MatterFlow') IS NULL CREATE DATABASE MatterFlow;"

volumes:
  matterflow-sql-data:
