<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Matters (design mockup) - LPT Hub</title>
<meta name="description" content="Clickable design mockup of the My Matters page. Mock data only; nothing here is connected to the product.">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --alt:#EEF0F4; --border:#D5D9E1; --border-2:#C0C6D1; --border-strong:#6B7280;
  --text:#1B1F27; --muted:#4B5563; --faint:#6B7280;
  --primary:#1F4E9C; --primary-h:#173C79; --focus:#B45309;
  --nav:#1A3556; --nav-text:#EAF1FA; --nav-muted:#B4C3D8; --nav-hover:#2B4B75; --nav-sel-fg:#17324F; --nav-focus:#FFC15A;
  --red:#B42318; --red-bg:#FDECEA; --red-solid:#C62828; --red-line:#F4C7C2;
  --amber:#8A4B00; --amber-bg:#FFF4DB; --amber-solid:#B45309; --amber-line:#F1D9A0;
  --blue:#1F4E9C; --blue-bg:#E3ECFA; --blue-solid:#1F4E9C; --blue-line:#C3D5F2;
  --teal:#0B6B5F; --teal-bg:#DDF3EF; --teal-solid:#0F766E; --teal-line:#B5E0D9;
  --violet:#5B3FA6; --violet-bg:#EFEAFB; --violet-solid:#6D4BC2; --violet-line:#D6CBF1;
  --slate:#475569; --slate-bg:#EEF1F5; --slate-solid:#475569;
  --r:8px; --r-lg:12px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.06);
  --pop:0 12px 32px rgba(16,24,40,.18),0 2px 6px rgba(16,24,40,.1);
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:Consolas,"Cascadia Mono","SFMono-Regular",monospace;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;font:14px/1.45 var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px} svg.i.xs{width:14px;height:14px} svg.i.lg{width:22px;height:22px}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.nav :focus-visible{outline-color:var(--nav-focus)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:#fff;padding:8px 12px;border-radius:6px;z-index:100;border:1px solid var(--border)}
.skip:focus{top:8px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:56px minmax(0,1fr);height:100vh;height:100dvh}
.top{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border);min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:#1d4e89;width:196px;flex:none;letter-spacing:-.01em}
.brand svg{width:30px;height:30px;border-radius:8px}
.burger{display:none;border:0;background:none;padding:6px;border-radius:6px}
.search{flex:1 1 auto;max-width:640px;position:relative;min-width:0}
.search input{width:100%;height:36px;border:1px solid var(--border-strong);border-radius:6px;padding:0 12px 0 36px;background:#fff}
.search svg{position:absolute;left:11px;top:9px;color:var(--faint)}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--border-strong);background:#fff;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--alt)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-h)}
.btn.ghost{border-color:var(--border-2)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.top .spacer{flex:1}
.mock{display:flex;align-items:center;gap:6px;border:1px dashed var(--border-strong);border-radius:20px;padding:0 4px 0 10px;height:30px;background:#fff;font-size:12px;color:var(--muted)}
.mock select{border:0;background:transparent;font-weight:700;color:var(--text);padding:0 4px;height:26px;cursor:pointer}
.mock button{white-space:nowrap;border:0;background:var(--alt);border-radius:14px;height:22px;padding:0 8px;font-size:12px;font-weight:600}
.mock button[aria-pressed=true]{background:var(--primary);color:#fff}
.bell{position:relative;border:0;background:none;padding:6px;border-radius:6px}
.bell b{position:absolute;top:-3px;right:-5px;background:var(--red-solid);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:2px solid #fff;line-height:1}
.user{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:4px 6px;border-radius:6px;min-width:0}
.user .nm{font-weight:600;line-height:1.2}
.user small{display:block;color:var(--amber);font-size:12px;line-height:1.2}
.av{width:30px;height:30px;border-radius:50%;background:var(--blue-bg);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}

.nav{background:var(--nav);color:var(--nav-text);padding:12px 12px 0;overflow:auto;display:flex;flex-direction:column}
.nav a{display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;border-radius:999px;color:var(--nav-text);text-decoration:none;font-size:14px;margin-bottom:1px}
.nav a:hover{background:var(--nav-hover)}
.nav a.ind{padding-left:36px}
.nav a[aria-current=page]{background:#fff;color:var(--nav-sel-fg);font-weight:700}
.nav h2{font-size:11px;letter-spacing:.08em;color:var(--nav-muted);margin:14px 12px 6px;font-weight:600;border-top:1px solid #3E5C86;padding-top:12px}
.nav .ver{margin-top:auto;padding:12px;color:var(--nav-muted);font-size:12px;position:sticky;bottom:0;background:var(--nav)}
.scrim{display:none}

main{min-width:0;overflow:auto;background:var(--bg)}
.page{height:100%;min-height:600px;padding:20px 32px 0;display:flex;flex-direction:column;gap:16px;max-width:1760px;margin:0 auto}
.page::after{content:"";flex:0 0 8px}
.page>*,#body>*,#panel>*{flex:none;min-width:0}
.page .grow,#body>.grow,#panel>.grow{flex:1 1 0;min-height:340px}
.card.grow:has(>.empty){flex:none!important;min-height:0!important}

/* ---------- title row & filters ---------- */
.titlerow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.chip-i{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.titlerow h1{margin:0;font-size:28px;line-height:1.15;letter-spacing:-.01em}
.titlerow .tw{display:flex;align-items:baseline;column-gap:16px;row-gap:0;flex-wrap:wrap;min-width:0}
.titlerow .ctx{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.titlerow .ctx b{color:var(--text);font-weight:600}
.titlerow .acts{margin-left:auto;display:flex;gap:10px;align-items:center;position:relative}
.menu{position:absolute;right:0;top:44px;z-index:30;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--pop);padding:8px;width:290px}
.menu h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 8px 4px;font-weight:600}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px;border-radius:6px}
.menu button:hover{background:var(--alt)}
.menu .rad{width:16px;height:16px;border-radius:50%;border:2px solid var(--border-strong);flex:none;display:grid;place-items:center}
.menu [aria-checked=true] .rad{border-color:var(--primary)}
.menu [aria-checked=true] .rad::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary)}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 0}

.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filters .sep{color:var(--faint);display:flex}
.filters .clear{border:0;background:none;color:var(--primary);font-weight:600;text-decoration:underline;padding:6px 8px;border-radius:6px}
.dd{position:relative}
.dd-btn{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;background:#fff;border:1px solid var(--border-strong);border-radius:8px;min-width:0;max-width:100%}
.dd-btn:hover{background:#FAFBFC;border-color:#374151}
.dd-btn .pre{color:var(--muted);font-size:13px}
.dd-btn .val{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.dd-btn[aria-expanded=true]{border-color:var(--primary);box-shadow:0 0 0 3px var(--blue-bg)}
.dd-btn.on{background:var(--blue-bg);border-color:var(--blue-line)}
.dd-btn.on .val{color:var(--primary)}
.dd.sm .dd-btn{height:34px;border-radius:6px;font-size:13px}
.dd-panel{position:fixed;z-index:60;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--pop);display:flex;flex-direction:column;overflow:hidden}
.dd-search{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);color:var(--faint)}
.dd-search input{border:0;outline:0;flex:1;min-width:0;background:none;color:var(--text)}
.dd-panel ul{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
.dd-panel li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;cursor:pointer}
.dd-panel li:hover,.dd-panel li:focus{background:var(--alt);outline:0}
.dd-panel li:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.dd-panel li[aria-selected=true]{background:var(--blue-bg)}
.dd-panel li .t{flex:1;min-width:0}
.dd-panel li small{display:block;color:var(--muted);font-size:12px}
.dd-panel li .n{color:var(--muted);font-variant-numeric:tabular-nums}
.dd-panel li.mute{color:var(--faint)}
.dd-panel li .ck{width:18px;height:18px;border:1.5px solid var(--border-strong);border-radius:4px;display:grid;place-items:center;flex:none;color:#fff}
.dd-panel li[aria-selected=true] .ck{background:var(--primary);border-color:var(--primary)}
.dd-panel li .tick{width:18px;flex:none;color:var(--primary)}
.dd-panel .foot{border-top:1px solid var(--border);padding:8px 12px;display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.dd-panel .foot button{border:0;background:none;color:var(--primary);font-weight:600;text-decoration:underline;border-radius:4px}
.dd-panel .none{padding:14px;color:var(--muted)}

/* ---------- tabs ---------- */
.tabs{position:relative;display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:12px 16px;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px;white-space:nowrap;border-radius:6px 6px 0 0}
.tabs button:hover{color:var(--text);background:var(--alt)}
.tabs button[aria-selected=true]{color:var(--primary);font-weight:700;border-bottom-color:var(--primary)}
.badge{background:var(--primary);color:#fff;border-radius:10px;font-size:12px;font-weight:700;min-width:22px;height:20px;padding:0 7px;display:inline-grid;place-items:center;line-height:1}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);min-width:0}
.pad{padding:20px 24px}
.card-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--border)}
.card-h h2{margin:0;font-size:18px;line-height:1.2}
.card-h .sub{color:var(--muted);font-size:13px}
.card-h .r{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.healthy{color:var(--teal);font-weight:600;display:inline-flex;align-items:center;gap:6px}

/* hero decision cards (A) */
.hero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.hc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 20px 8px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);position:relative;min-width:0}
.hc .foot{padding-left:56px;font-size:13px;min-height:18px;line-height:18px;color:var(--muted)}
.hc .main{display:flex;align-items:center;gap:16px;border:0;background:none;text-align:left;padding:0;flex:1;min-width:0;border-radius:8px}
.hc .num{font-size:44px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hc .lbl{font-weight:700;font-size:16px;line-height:1.2}
.hc .desc{color:var(--muted);font-size:13px;line-height:1.3}
.hc .more{border:0;background:none;padding:2px 0;font-size:13px;font-weight:600;text-decoration:underline;border-radius:4px;text-align:left}
.hc.red{background:var(--red-bg);border-color:var(--red-line)} .hc.red .num,.hc.red .more{color:var(--red)}
.hc.amber{background:var(--amber-bg);border-color:var(--amber-line)} .hc.amber .num,.hc.amber .more{color:var(--amber)}
.hc.violet{background:var(--violet-bg);border-color:var(--violet-line)} .hc.violet .num,.hc.violet .more{color:var(--violet)}
.hc.teal{background:var(--teal-bg);border-color:var(--teal-line)} .hc.teal .num,.hc.teal .more{color:var(--teal)}
.hc .showing{position:absolute;top:10px;right:12px;font-size:12px;font-weight:700;display:flex;gap:4px;align-items:center;color:var(--text);background:#fff;border-radius:12px;padding:1px 8px 1px 6px}
.hc[data-on=true]{box-shadow:0 0 0 2px var(--text) inset,var(--shadow)}
.hc:hover{box-shadow:var(--pop)}
.hc .txt{min-width:0;flex:1}

.hc .lbl,.hc .desc{display:block}
.sub-chips{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}

/* grid */
.gridcard{display:flex;flex-direction:column;overflow:hidden}
.gscroll{flex:1 1 auto;overflow:auto;min-height:0}
table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
th{position:sticky;top:0;z-index:2;background:var(--alt);text-align:left;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);height:40px;padding:0 12px;border-bottom:1px solid var(--border);white-space:nowrap}
th button{border:0;background:none;display:inline-flex;align-items:center;gap:6px;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;padding:6px 4px;margin:0 -4px;border-radius:4px}
th button:hover{color:var(--text)}
th[aria-sort] button{color:var(--text)}
th .ar{opacity:.35} th[aria-sort] .ar{opacity:1;color:var(--primary)}
td{height:44px;padding:0 12px;border-bottom:1px solid #E7EAF0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
tbody tr:hover td{background:#F4F7FC}
tbody tr:last-child td{border-bottom:0}
td.pad0{padding:0}
.cell{display:flex;align-items:center;gap:8px;min-width:0}
.cell>span{overflow:hidden;text-overflow:ellipsis}
.ref{font-family:var(--mono);font-size:13px;color:var(--muted)}
.tt{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.tt svg{width:16px;height:16px}
.lnk{border:0;background:none;padding:0;text-align:left;color:var(--primary);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;border-radius:4px}
.lnk:hover{text-decoration:underline}
.m2{display:none;color:var(--muted);font-size:12px;font-weight:400}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px 2px 8px;font-size:12px;font-weight:700;line-height:18px;white-space:nowrap}
.pill.crit{background:var(--red-solid);color:#fff}
.pill.high{background:var(--amber-bg);color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber-line)}
.pill.hold{background:var(--slate-bg);color:var(--slate);box-shadow:inset 0 0 0 1px #CBD2DC}
.pill.risk{background:var(--amber-bg);color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber-line)}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.teal{background:var(--teal-bg);color:var(--teal)}
.pill.violet{background:var(--violet-bg);color:var(--violet)}
.pill.blue{background:var(--blue-bg);color:var(--blue)}
.una{color:var(--violet);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.due{display:inline-flex;align-items:center;gap:6px}
.due.over{color:var(--red);font-weight:700}
.due.soon{color:var(--amber);font-weight:700}
.due small{color:var(--muted);font-weight:400;font-size:12px}
.mini-av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;flex:none}
.pager{display:flex;align-items:center;gap:8px;padding:10px 24px;border-top:1px solid var(--border);background:#fff;flex-wrap:wrap;color:var(--muted)}
.pager .pg{margin-left:auto;display:flex;gap:4px}
.pager button{min-width:34px;height:34px;border:1px solid var(--border-2);background:#fff;border-radius:6px;font-weight:600;padding:0 8px}
.pager button:hover:not(:disabled){background:var(--alt)}
.pager button[aria-current=page]{background:var(--primary);color:#fff;border-color:var(--primary)}
.pager button:disabled{opacity:.45;cursor:default}
.empty{display:flex;align-items:center;gap:12px;padding:28px 24px;color:var(--muted);font-size:15px}
.empty.good{color:var(--teal);font-weight:600}
.empty button{border:0;background:none;color:var(--primary);font-weight:600;text-decoration:underline;border-radius:4px}
.icobtn{width:36px;height:36px;border:1px solid var(--border-strong);background:#fff;border-radius:8px;display:grid;place-items:center}
.icobtn:hover{background:var(--alt)}
.icobtn[aria-pressed=true]{background:var(--blue-bg);border-color:var(--primary);color:var(--primary)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:0 14px;height:34px;font-weight:600;display:flex;align-items:center;gap:6px;border-right:1px solid var(--border-2);color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--alt)}
.seg button[aria-pressed=true]{background:var(--blue-bg);color:var(--primary)}
.link{border:0;background:none;color:var(--primary);font-weight:600;text-decoration:underline;padding:4px;border-radius:4px}

/* calendar */
.cal{display:flex;flex-direction:column;flex:1;min-height:0}
.cal-h{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.cal-h h3{margin:0;font-size:18px;min-width:150px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));overflow:auto;flex:1;min-height:0;grid-auto-rows:minmax(92px,1fr)}
.cal-dow{padding:8px 12px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--alt);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:2;grid-row:1;height:34px}
.cal-grid{grid-template-rows:34px;}
.day{border-right:1px solid #E7EAF0;border-bottom:1px solid #E7EAF0;padding:6px;min-width:0;display:flex;flex-direction:column;gap:3px;position:relative;background:#fff}
.day.out{background:#FAFBFC;color:var(--faint)}
.day.we{background:#F8F9FB}
.day .dn{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;height:22px}
.day.today .dn span{background:var(--primary);color:#fff;border-radius:11px;min-width:22px;padding:0 6px;text-align:center}
.day .ev{display:flex;align-items:center;gap:5px;border:0;background:var(--slate-bg);border-radius:5px;padding:2px 6px;font-size:12px;text-align:left;min-width:0;height:22px;color:var(--text)}
.day .ev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .ev:hover{outline:1px solid var(--primary)}
.day .ev.over{background:var(--red-bg);color:var(--red);font-weight:600}
.day .ev.hold{background:var(--slate-bg)}
.day .more{border:0;background:none;color:var(--primary);font-size:12px;font-weight:700;text-align:left;padding:1px 6px;border-radius:4px}
.daypop{position:absolute;z-index:20;left:4px;top:4px;width:260px;max-width:90vw;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--pop);padding:8px;display:flex;flex-direction:column;gap:3px}
.daypop h4{margin:4px 6px 6px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.daypop .x{border:0;background:none;border-radius:4px;padding:2px}

/* B */
.chead{padding:24px;display:flex;flex-direction:column;gap:20px}
.chead .top2{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.chead .who{min-width:0}
.chead .eyebrow{color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chead h2{margin:2px 0 0;font-size:26px;line-height:1.2;letter-spacing:-.01em}
.chead .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.stat{border:1px solid var(--border);background:#fff;border-radius:10px;padding:12px 16px;text-align:left;display:flex;align-items:center;gap:12px;min-width:0}
.stat:hover{box-shadow:var(--pop)}
.stat .n{font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .l{font-weight:600;line-height:1.2}
.stat .l small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.stat.red{background:var(--red-bg);border-color:var(--red-line)} .stat.red .n{color:var(--red)}
.stat.amber{background:var(--amber-bg);border-color:var(--amber-line)} .stat.amber .n{color:var(--amber)}
.stat.violet{background:var(--violet-bg);border-color:var(--violet-line)} .stat.violet .n{color:var(--violet)}
.stat.blue{background:var(--blue-bg);border-color:var(--blue-line)} .stat.blue .n{color:var(--blue)}
.stat.slate{background:var(--slate-bg);border-color:#D3D9E2} .stat.slate .n{color:var(--slate)}
.stat[aria-pressed=true]{box-shadow:0 0 0 2px var(--text) inset}
.stat.zero{background:#fff;border-color:var(--border)} .stat.zero .n{color:var(--faint)}
.hbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--alt);gap:2px}
.hbar i{display:block;min-width:4px}
.hbar .r{background:var(--red-solid)} .hbar .a{background:#D97706} .hbar .g{background:var(--teal-solid)}
.hleg{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.hleg b{color:var(--text)}
.hleg span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.mcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.mc{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.mc:hover{box-shadow:var(--pop);border-color:var(--border-2)}
.mc .nm{font-weight:700;font-size:15px;line-height:1.25}
.mc .cl{color:var(--muted);font-size:13px}
.mc .cn{display:flex;gap:12px;font-size:13px;flex-wrap:wrap;color:var(--muted)}
.mc .cn b{font-variant-numeric:tabular-nums}
.mc .go{color:var(--primary);font-weight:600;font-size:13px;display:flex;align-items:center;gap:4px}
.prompt{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:15px}
.prompt b{color:var(--text)}

/* C board */
.lens{display:flex;gap:8px;flex-wrap:wrap}
.lens button{border:1px solid var(--border-2);background:#fff;border-radius:999px;height:36px;padding:0 14px 0 10px;display:flex;align-items:center;gap:8px;font-weight:600}
.lens button .c{min-width:24px;height:22px;border-radius:11px;display:grid;place-items:center;font-size:12px;padding:0 6px;font-variant-numeric:tabular-nums;background:var(--alt)}
.lens button:hover{background:var(--alt)}
.lens button[aria-pressed=true]{background:var(--text);color:#fff;border-color:var(--text)}
.lens button[aria-pressed=true] .c{background:#fff;color:var(--text)}
.lens .red .c{background:var(--red-bg);color:var(--red)} .lens .amber .c{background:var(--amber-bg);color:var(--amber)} .lens .violet .c{background:var(--violet-bg);color:var(--violet)} .lens .slate .c{background:var(--slate-bg);color:var(--slate)} .lens .blue .c{background:var(--blue-bg);color:var(--blue)}
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:16px;flex:1;min-height:0;overflow-x:auto;padding-bottom:4px}
.col{background:#E9ECF1;border-radius:var(--r-lg);display:flex;flex-direction:column;min-height:0;min-width:0}
.col-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;font-weight:700;font-size:15px}
.col-h .cc{background:#fff;border-radius:11px;min-width:26px;height:22px;display:grid;place-items:center;font-size:12px;padding:0 7px}
.col-h .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff}
.col-b{padding:0 12px 12px;overflow:auto;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.tc{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);min-width:0;width:100%}
.tc:hover{box-shadow:var(--pop)}
.tc .row1{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;min-width:0}
.tc .ti{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tc .mt{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc .row3{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.tc.done{opacity:.8}
.showmore{border:1px dashed var(--border-strong);background:transparent;border-radius:8px;height:34px;font-weight:600;color:var(--primary)}

/* breakdown */
.bd td,.bd th{text-align:center}
.bd td:first-child,.bd th:first-child{text-align:left}
.bd .tot{background:var(--alt);font-weight:700}
.bcell{border:0;background:none;width:76px;margin:0 auto;height:100%;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:6px;min-height:36px}
.bcell:hover{outline:2px solid var(--primary)}
.bcell.over{background:var(--red-bg);color:var(--red)}
.bcell.risk{background:var(--amber-bg);color:var(--amber)}
.bcell.zero{color:#9AA3B0;font-weight:400}
.bd td{height:52px;padding:4px 8px}
.legend{display:flex;gap:20px;flex-wrap:wrap;color:var(--muted);font-size:13px;padding:14px 24px;border-top:1px solid var(--border)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.sw{display:inline-grid;place-items:center;width:22px;height:20px;border-radius:5px;font-size:12px;font-weight:700}
.meter{display:flex;height:8px;background:var(--alt);border-radius:4px;overflow:hidden;min-width:80px}
.meter i{display:block}

/* data */
.selbar{display:flex;gap:12px;flex-wrap:wrap;padding:16px 24px;border-bottom:1px solid var(--border);align-items:center}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;padding:16px 24px}
.tile{border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 16px;display:flex;gap:14px;align-items:center;background:#fff;min-width:0}
.tile .n{font-size:30px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .n small{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px}
.tile .l{color:var(--muted);font-size:13px;margin-top:3px}
.tile .l small{font-size:12px}
.tile.amber{background:var(--amber-bg);border-color:var(--amber-line)} .tile.amber .n{color:var(--amber)}
.tile.teal .n{color:var(--teal)}
.dbody{padding:0 24px 24px;display:flex;flex-direction:column;gap:16px}
.dtools{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.dtools .sp{margin-left:auto}
.bars{display:flex;flex-direction:column;gap:12px;max-width:860px}
.barrow{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr) 120px;gap:14px;align-items:center}
.barrow .track{height:28px;background:var(--alt);border-radius:6px;overflow:hidden}
.barrow .fill{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:8px;color:#fff;font-weight:700;font-size:12px}
.barrow .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.barrow .v small{color:var(--muted);font-weight:400}
.pie{display:flex;gap:40px;align-items:center;flex-wrap:wrap}
.pie svg{width:220px;height:220px;flex:none}
.pie ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:260px;flex:1;max-width:520px}
.pie li{display:flex;align-items:center;gap:12px}
.pie li .nm{flex:1}
.pie li b{font-variant-numeric:tabular-nums}
.pie li span.pc{color:var(--muted);width:44px;text-align:right}
.sw2{width:14px;height:14px;border-radius:4px;flex:none}

/* activity */
.since{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 24px;background:var(--blue-bg);border-bottom:1px solid var(--blue-line);color:var(--text)}
.since.read{background:var(--teal-bg);border-color:var(--teal-line);color:var(--teal);font-weight:600}
.since .btn{margin-left:auto}
.unread{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--primary);margin-right:8px}
.unread.n{background:transparent}

/* drawer & toast */
.drawer-bg{position:fixed;inset:0;background:rgba(16,24,40,.35);z-index:80}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:#fff;z-index:81;box-shadow:var(--pop);display:flex;flex-direction:column}
.drawer header{display:flex;gap:12px;align-items:flex-start;padding:20px 24px;border-bottom:1px solid var(--border)}
.drawer header h2{margin:0;font-size:20px;line-height:1.25}
.drawer header .x{margin-left:auto;border:0;background:none;padding:6px;border-radius:6px}
.drawer dl{margin:0;padding:8px 24px;display:grid;grid-template-columns:120px 1fr;gap:0}
.drawer dt{color:var(--muted);padding:12px 0;border-bottom:1px solid #EDEFF3}
.drawer dd{margin:0;padding:12px 0;border-bottom:1px solid #EDEFF3;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.drawer footer{margin-top:auto;padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1B1F27;color:#fff;padding:10px 18px;border-radius:8px;z-index:120;box-shadow:var(--pop);max-width:90vw}
.note{color:var(--muted);font-size:13px}

/* ---------- responsive ---------- */
@media (min-width:1001px) and (max-height:820px){.page{gap:12px;padding-top:16px}}
@media (max-width:1280px){
  .page{padding:20px 24px 0}
  .hc .num{font-size:38px}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:1560px){
  .c-ref{display:none}
}
@media (max-width:1000px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .top{grid-column:1}
  .nav{position:fixed;top:56px;bottom:0;left:0;width:260px;z-index:70;transform:translateX(-100%);transition:transform .2s}
  .shell.navopen .nav{transform:none}
  .shell.navopen .scrim{display:block;position:fixed;inset:56px 0 0 0;background:rgba(16,24,40,.4);z-index:65}
  .burger{display:block}
  .brand{width:auto}
  .user .meta,.user>svg,.mock .lbl,.btn.create span,.filters .sep{display:none}
  .btn.create{padding:0 10px}
  .top{gap:10px;padding:0 16px}
  .hero{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .hc{padding:12px 14px 8px}
  .hc .chip-i,.hc .desc,.hc .showing{display:none}
  .hc .main{flex-direction:column;align-items:flex-start;gap:2px}
  .hc .num{font-size:30px}.hc .lbl{font-size:13px}
  .hc .foot{padding-left:0;font-size:12px;line-height:1.3}
  .hc .chip-i{display:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .c-prio,.c-status{display:none}
  .m2{display:block}
  .c-matter{display:none}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:700px){
  .top{padding:0 12px;gap:8px}
  .brand span{display:none}
  .search{display:none}

  .mock{position:fixed;right:10px;bottom:10px;z-index:50;box-shadow:var(--pop);padding:0 4px 0 8px;height:34px}
  .mock select{max-width:140px}
  .page{padding-bottom:56px}
  .page{padding:16px 16px 0;gap:12px}
  .titlerow h1{font-size:24px}
  .titlerow .acts{margin-left:0;width:100%}
  .c-asg{display:none}
  .col-b{max-height:none}
  .board{grid-template-columns:repeat(4,82%);scroll-snap-type:x mandatory}
  .col{scroll-snap-align:start}
  .barrow{grid-template-columns:90px minmax(0,1fr) 80px;gap:8px}
  .card-h,.pad,.pager,.selbar,.cal-h{padding-left:16px;padding-right:16px}
  .tiles,.dbody{padding-left:16px;padding-right:16px}
  .chead{padding:16px}
  .chead h2{font-size:22px}
  .cal-grid{grid-auto-rows:minmax(64px,1fr)}
  .day .ev span{display:none}
  .day .ev{height:10px;width:10px;padding:0;border-radius:50%;background:var(--slate-solid)}
  .day .ev.over{background:var(--red-solid)}
  .day .more{font-size:11px;padding:0}
  .daypop{position:fixed;left:16px;right:16px;top:90px;width:auto;max-width:none}
  .page{height:auto;min-height:0}
  .page>.grow{min-height:520px}
  .dd-btn .val{max-width:150px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

    TASKS.push({id:'TSK-'+(12+i*2+Math.floor(R()*2)),title:title,type:ty.id,matter:mats[i],prio:prio,asg:asg,off:off,status:st,risk:c==='risk'});
  }
  // other-PM matters (visible only with scope: All matters)
  for(var k=0;k<8;k++){var ty2=TYPES[Math.floor(R()*TYPES.length)];TASKS.push({id:'TSK-'+(200+k),title:ty2.tpl[0]+(k+2),type:ty2.id,matter:k<4?'m6':'m7',prio:pick(['Normal','High','Normal','Low']),asg:pick(PEOPLE),off:k<2?-(2+k):3+k*3,status:'In progress',risk:false})}
  TASKS.forEach(function(t){t.date=dOff(t.off)});
})();

  var mm=['m1','m1','m1','m1','m1','m1','m2','m2','m2','m2','m3','m3','m3','m3','m3','m3','m4','m4','m4','m4','m4','m5','m5','m5','m5','m5','m3','m1','m4','m2','m1','m5','m3','m4','m2','m5'];
  for(var i=0;i<36;i++){
    var ty=ASSET_TYPES[Math.floor(r()*ASSET_TYPES.length)];

  }
})();

(function(){

  data:{matters:new Set(),types:new Set(),size:'gb',period:'12m',mode:'table',metric:'count',group:'type'},

/* ================= HELPERS ================= */
function ic(id,cls){return '<svg class="i '+(cls||'')+'" aria-hidden="true"><use href="#'+id+'"/></svg>'}
function tyChip(id){var t=TM[id];return '<span class="tt" style="background:'+t.color+'" title="'+esc(t.name)+'">'+ic(t.ic)+'</span>'}
var AVC=[['#E3ECFA','#1F4E9C'],['#DDF3EF','#0B6B5F'],['#EFEAFB','#5B3FA6'],['#FFF4DB','#8A4B00'],['#FDE7F0','#9D174D'],['#EEF1F5','#475569']];
function initials(n){return n.split(' ').map(function(x){return x[0]}).join('').slice(0,2)}
function avatar(n){var k=0;for(var i=0;i<n.length;i++)k+=n.charCodeAt(i);var c=AVC[k%AVC.length];return '<span class="mini-av" aria-hidden="true" style="background:'+c[0]+';color:'+c[1]+'">'+initials(n)+'</span>'}
function asgHTML(t){return t.asg?'<span class="cell">'+avatar(t.asg)+'<span>'+esc(t.asg)+'</span></span>':'<span class="una">'+ic('i-userx','sm')+'Unassigned</span>'}
function isOpen(t){return t.status!=='Done'}
function isOver(t){return isOpen(t)&&t.off<0}
function isSoon(t){return isOpen(t)&&t.off>=0&&t.off<=7}
function urgency(t){
  if(!isOpen(t))return -1;
  if(t.off<0)return 1000-t.off;
  if(t.risk)return 800-t.off;
  if(t.off===0)return 750;
  if(!t.asg)return 600-t.off;
  if(t.status==='On hold')return 400;
  return 300-t.off;
}
function reasonRank(t){return urgency(t)}
function dueText(t){
  if(t.status==='Done')return '<span class="due">'+ic('i-check','sm')+'Done <small>'+fmt(t.date)+'</small></span>';
  var o=t.off;
  if(o<0)return '<span class="due over">'+ic('i-warn','sm')+(-o)+' d overdue <small>'+fmt(t.date)+'</small></span>';
  if(o===0)return '<span class="due soon">'+ic('i-clock','sm')+'Due today</span>';
  if(o===1)return '<span class="due soon">'+ic('i-clock','sm')+'Tomorrow</span>';
  if(o<=7)return '<span class="due">'+DOW[t.date.getDay()]+', '+fmt(t.date)+'</span>';
  return '<span class="due">'+fmt(t.date)+'</span>';
}
function dueShort(t){
  if(t.status==='Done')return '<span class="due">'+ic('i-check','xs')+'Done</span>';
  if(t.off<0)return '<span class="due over">'+ic('i-warn','xs')+(-t.off)+' d overdue</span>';

  var base=S.scope==='all'&&!S.single?MATTERS.filter(function(m){return m.managed||!m.sensitive}):managedList();
  if(S.role!=='any')base=base.filter(function(m){return !m.managed||m.role===S.role});

    if(!ms[t.matter])return false;

    if(!opts.noDue&&S.due!=='any'){
      var o=t.off;if(S.due==='7'&&!(o>=0&&o<=7))return false;if(S.due==='30'&&!(o>=0&&o<=30))return false;if(S.due==='month'&&!(t.date.getMonth()===9&&t.date.getFullYear()===2026))return false;
    }

  });

  open:{label:'All open',f:isOpen},
  over:{label:'Overdue',f:isOver},

  var list=baseTasks(opts);
  if(S.opt==='C'&&S.view==='main'){
    return list.filter(function(t){return S.pre==='open'?true:PRE[S.pre].f(t)});
  }
  return list.filter(PRE[S.pre].f);
}
function sortTasks(list){
  var k=S.sort.k,d=S.sort.d;
  var f={
    urgency:function(a,b){return urgency(b)-urgency(a)||a.off-b.off},
    ref:function(a,b){return parseInt(a.id.slice(4))-parseInt(b.id.slice(4))},
    title:function(a,b){return a.title.localeCompare(b.title)},
    matter:function(a,b){return MM[a.matter].name.localeCompare(MM[b.matter].name)},
    prio:function(a,b){var o={Critical:0,High:1,Normal:2,Low:3};return o[a.prio]-o[b.prio]},
    asg:function(a,b){return (a.asg||'~').localeCompare(b.asg||'~')},
    due:function(a,b){return a.off-b.off},
    status:function(a,b){return a.status.localeCompare(b.status)}
  }[k];
  var out=list.slice().sort(f);if(k!=='urgency'&&d<0)out.reverse();return out;
}

  function isSel(v){return d.multi?sel.has(v):sel===v}
  function liHTML(o,q){
    return '<li role="option" tabindex="-1" data-v="'+esc(o.v)+'" aria-selected="'+(isSel(o.v)?'true':'false')+'"'+(o.muted?' class="mute"':'')+'>'+
      (d.multi?'<span class="ck">'+(isSel(o.v)?ic('i-check','xs'):'')+'</span>':'<span class="tick">'+(isSel(o.v)?ic('i-check','sm'):'')+'</span>')+
      (o.icon||'')+'<span class="t">'+esc(o.label)+(o.sub?'<small>'+esc(o.sub)+'</small>':'')+'</span>'+(o.n!=null?'<span class="n">'+o.n+'</span>':'')+'</li>';
  }
  function build(q){
    q=(q||'').toLowerCase();
    var f=opts.filter(function(o){return !q||(o.label+' '+(o.sub||'')).toLowerCase().indexOf(q)>-1});
    panel.querySelector('ul').innerHTML=f.length?f.map(liHTML).join(''):'<div class="none">Nothing matches.</div>';
  }
  panel.innerHTML=(d.search?'<div class="dd-search">'+ic('i-search','sm')+'<input type="text" placeholder="'+(d.searchPh||'Search')+'" aria-label="Search the list" autocomplete="off"></div>':'')+'<ul role="listbox" aria-label="'+esc(d.name||id)+'"'+(d.multi?' aria-multiselectable="true"':'')+'></ul>'+(d.multi?'<div class="foot"><span class="cnt"></span><button type="button" data-clr>Clear</button></div>':'');
  document.body.appendChild(panel);
  build('');
  var r=btn.getBoundingClientRect();var w=Math.min(Math.max(r.width,d.minW||300),window.innerWidth-24);
  panel.style.width=w+'px';var left=Math.min(r.left,window.innerWidth-w-12);panel.style.left=Math.max(12,left)+'px';
  var top=r.bottom+6;panel.style.top=top+'px';panel.style.maxHeight=Math.max(200,window.innerHeight-top-16)+'px';
  btn.setAttribute('aria-expanded','true');
  openDD={id:id,panel:panel};
  function updFoot(){var f=panel.querySelector('.cnt');if(f)f.textContent=d.sel().size?d.sel().size+' selected':'None selected: all'}
  updFoot();
  function choose(v){
    if(d.multi){d.toggle(v);sel=d.sel();opts=d.options();var q=panel.querySelector('input');build(q?q.value:'');updFoot();refreshDD();var li=panel.querySelector('li[data-v="'+v.replace(/"/g,'\\"')+'"]');if(li)li.focus()}
    else{d.set(v);closeDD(true);}
  }
  panel.addEventListener('click',function(e){
    var li=e.target.closest('li[data-v]');if(li){choose(li.getAttribute('data-v'));return}
    if(e.target.closest('[data-clr]')){d.clear();sel=d.sel();var q=panel.querySelector('input');build(q?q.value:'');updFoot();refreshDD()}
  });
  panel.addEventListener('keydown',function(e){
    var lis=[].slice.call(panel.querySelectorAll('li'));var i=lis.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){e.preventDefault();(lis[i+1]||lis[0]||{focus:function(){}}).focus()}
    else if(e.key==='ArrowUp'){e.preventDefault();if(i<=0){var inp=panel.querySelector('input');if(inp)inp.focus();else if(lis.length)lis[lis.length-1].focus()}else lis[i-1].focus()}
    else if(e.key==='Enter'||e.key===' '){if(document.activeElement.matches&&document.activeElement.matches('li')){e.preventDefault();choose(document.activeElement.getAttribute('data-v'))}else if(e.key==='Enter'&&lis[0]&&document.activeElement.tagName==='INPUT'){e.preventDefault();choose(lis[0].getAttribute('data-v'))}}
    else if(e.key==='Escape'){e.stopPropagation();closeDD(true)}
    else if(e.key==='Tab'){closeDD(false)}
  });
  var inp=panel.querySelector('input');
  if(inp){inp.addEventListener('input',function(){build(inp.value)});inp.focus()}
  else{var s=panel.querySelector('li[aria-selected=true]')||panel.querySelector('li');if(s)s.focus()}
}

var COLS=[['ref','Ref','c-ref','80px'],['title','Title','c-title',''],['matter','Matter','c-matter','190px'],['prio','Priority','c-prio','116px'],['asg','Assignee','c-asg','168px'],['due','Due','c-due','184px'],['status','Status','c-status','112px']];
function gridTable(list,opts){
  var sorted=sortTasks(list);var per=25;var pages=Math.max(1,Math.ceil(sorted.length/per));if(S.page>pages)S.page=pages;
  var slice=sorted.slice((S.page-1)*per,S.page*per);
  var h='<div class="gscroll" tabindex="0" aria-label="Task grid, scrolls"><table><caption class="sr">Open tasks, '+(S.sort.k==='urgency'?'most urgent first':'sorted by '+S.sort.k)+'</caption><colgroup>'+COLS.map(function(c){return '<col class="'+c[2]+'"'+(c[3]?' style="width:'+c[3]+'"':'')+'>'}).join('')+'</colgroup><thead><tr>';
  COLS.forEach(function(c){
    var cur=S.sort.k===c[0]||(S.sort.k==='urgency'&&c[0]==='due');
    var as=S.sort.k===c[0]?(S.sort.d>0?'ascending':'descending'):'none';
    var arrow=S.sort.k===c[0]?ic(S.sort.d>0?'i-up':'i-down','xs'):ic('i-sortud','xs');
    h+='<th class="'+c[2]+'" scope="col"'+(S.sort.k===c[0]?' aria-sort="'+as+'"':'')+'><button data-act="sort" data-v="'+c[0]+'">'+c[1]+'<span class="ar">'+arrow+'</span></button></th>';
  });
  h+='</tr></thead><tbody>';
  slice.forEach(function(t){
    var m=MM[t.matter];
    h+='<tr><td class="c-ref ref">'+t.id+'</td>'+
      '<td><div class="cell">'+tyChip(t.type)+'<span style="min-width:0"><button class="lnk" data-act="task" data-v="'+t.id+'">'+esc(t.title)+'</button><span class="m2">'+esc(m.name)+' &middot; '+(t.asg?esc(t.asg):'Unassigned')+'</span></span></div></td>'+
      '<td class="c-matter" title="'+esc(m.no+' '+m.name+' ('+CM[m.client].name+')')+'">'+esc(m.name)+'</td>'+
      '<td class="c-prio">'+prioPill(t)+'</td><td class="c-asg">'+asgHTML(t)+'</td><td class="c-due">'+dueText(t)+'</td><td class="c-status">'+statusHTML(t)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  var from=sorted.length?(S.page-1)*per+1:0,to=Math.min(S.page*per,sorted.length);
  h+='<div class="pager"><span>Showing <b>'+from+'&ndash;'+to+'</b> of <b>'+sorted.length+'</b> &middot; 25 per page</span><div class="pg" role="navigation" aria-label="Grid pages"><button data-act="page" data-v="'+(S.page-1)+'" '+(S.page<=1?'disabled':'')+' aria-label="Previous page">'+ic('i-left','sm')+'</button>';
  for(var p=1;p<=pages;p++)h+='<button data-act="page" data-v="'+p+'" '+(p===S.page?'aria-current="page"':'')+' aria-label="Page '+p+'">'+p+'</button>';
  h+='<button data-act="page" data-v="'+(S.page+1)+'" '+(S.page>=pages?'disabled':'')+' aria-label="Next page">'+ic('i-right','sm')+'</button></div></div>';
  return h;
}

/* ================= CALENDAR ================= */
function calendarHTML(list){
  var y=S.cal.y,m=S.cal.m;var first=new Date(y,m,1);var start=(first.getDay()+6)%7;var dim=new Date(y,m+1,0).getDate();
  var cells=Math.ceil((start+dim)/7)*7;
  var byDay={};list.forEach(function(t){var k=t.date.getFullYear()+'-'+t.date.getMonth()+'-'+t.date.getDate();(byDay[k]=byDay[k]||[]).push(t)});
  var h='<div class="cal"><div class="cal-grid" role="grid" aria-label="'+MONL[m]+' '+y+'">';
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(function(d){h+='<div class="cal-dow" role="columnheader">'+d+'</div>'});
  for(var i=0;i<cells;i++){
    var d=new Date(y,m,1-start+i);var out=d.getMonth()!==m;var key=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
    var ts=(byDay[key]||[]).sort(function(a,b){return urgency(b)-urgency(a)});
    var isT=d.getTime()===TODAY.getTime();var we=((d.getDay()+6)%7)>=5;
    var ptr=key;
    h+='<div class="day'+(out?' out':'')+(we?' we':'')+(isT?' today':'')+'" role="gridcell"><div class="dn"><span>'+d.getDate()+'</span>'+(isT?'<span class="sr">Today</span>':'')+'</div>';
    ts.slice(0,2).forEach(function(t){var o=isOver(t);h+='<button class="ev'+(o?' over':'')+'" data-act="task" data-v="'+t.id+'" title="'+esc(t.title)+(o?' (overdue)':'')+'">'+(o?ic('i-warn','xs'):'<span class="dot" style="background:'+TM[t.type].color+';width:8px;height:8px;border-radius:50%"></span>')+'<span>'+esc(t.title)+'</span></button>'});
    if(ts.length>2)h+='<button class="more" data-act="calmore" data-v="'+key+'" aria-label="'+(ts.length-2)+' more tasks on '+fmt(d)+'">+'+(ts.length-2)+' more</button>';
    if(S.cal.pop===key&&ts.length){
      h+='<div class="daypop" role="dialog" aria-label="Tasks due '+fmt(d)+'"><h4>'+DOW[d.getDay()]+', '+fmt(d)+' &middot; '+ts.length+' tasks<button class="x" data-act="calmore" data-v="'+key+'" aria-label="Close">'+ic('i-x','sm')+'</button></h4>'+ts.map(function(t){var o=isOver(t);return '<button class="ev'+(o?' over':'')+'" data-act="task" data-v="'+t.id+'">'+(o?ic('i-warn','xs'):'')+'<span>'+esc(t.title)+'</span></button>'}).join('')+'</div>';
    }
    h+='</div>';
  }
  return h+'</div></div>';
}

  var ms=matterSet();
  var evs=EVENTS.filter(function(e){return !S.empty&&ms[TK[e.task].matter]});
  var k=S.act.sort.k,d=S.act.sort.d;
  evs=evs.slice().sort(function(a,b){
    var r;if(k==='when')r=b.hrs-a.hrs;else if(k==='who')r=a.who.localeCompare(b.who);else r=MM[TK[a.task].matter].name.localeCompare(MM[TK[b.task].matter].name);
    return k==='when'?(d<0?-r:r):r*d});
  var per=10,pages=Math.max(1,Math.ceil(evs.length/per));if(S.act.page>pages)S.act.page=pages;var slice=evs.slice((S.act.page-1)*per,S.act.page*per);
  var u=unreadCount();
  var h='<section class="card gridcard grow"><div class="card-h"><h2>Activity</h2></div>';
  if(!S.empty){
    h+=S.act.read?'<div class="since read">'+ic('i-checkc','sm')+'You are up to date.</div>':'<div class="since">'+ic('i-bell','sm')+'<span><b>'+u+(u===1?' change':' changes')+'</b> since your last visit on Tuesday 27 October</span><button class="btn sm" data-act="markread">'+ic('i-check','sm')+'Mark as read</button></div>';
  }
  if(!slice.length){return h+emptyLine().replace('No tasks match these filters.','No activity for these filters.').replace('You have no open tasks on your matters. Nothing is late.','No activity yet.')+'</section>'}
  function th(key,label,cls){var cur=S.act.sort.k===key;return '<th scope="col" class="'+(cls||'')+'"'+(cur?' aria-sort="'+(S.act.sort.d>0?'ascending':'descending')+'"':'')+'><button data-act="asort" data-v="'+key+'">'+label+'<span class="ar">'+ic(cur?(S.act.sort.d>0?'i-up':'i-down'):'i-sortud','xs')+'</span></button></th>'}
  h+='<div class="gscroll" tabindex="0" aria-label="Activity grid, scrolls"><table><thead><tr>'+th('when','When','')+th('who','Who','c-asg')+'<th scope="col">What</th><th scope="col" class="c-matter">Task</th>'+th('matter','Matter','c-matter')+'</tr></thead><tbody>';
  slice.forEach(function(e){
    var t=TK[e.task];var m=MM[t.matter];var nw=e.hrs<LAST_VISIT_HRS&&!S.act.read;
    h+='<tr><td style="width:170px">'+(nw?'<span class="unread" title="New since your last visit"></span><span class="sr">New. </span>':'<span class="unread n"></span>')+'<span style="'+(nw?'font-weight:700':'')+'">'+evTime(e).txt+'</span></td><td class="c-asg"><span class="cell">'+avatar(e.who)+'<span>'+e.who+'</span></span></td><td>'+tyChip(t.type).replace('class="tt"','class="tt" style="display:none"')+'<span class="m-who sr">'+e.who+' </span>'+e.what.replace(/^./,function(c){return c.toUpperCase()})+'</td><td class="c-matter"><button class="lnk" data-act="task" data-v="'+t.id+'">'+esc(t.title)+'</button></td><td class="c-matter">'+esc(m.name)+'</td></tr>';
  });
  h+='</tbody></table></div><div class="pager"><span>Showing <b>'+((S.act.page-1)*per+1)+'&ndash;'+Math.min(S.act.page*per,evs.length)+'</b> of <b>'+evs.length+'</b></span><div class="pg" role="navigation" aria-label="Activity pages"><button data-act="apage" data-v="'+(S.act.page-1)+'" '+(S.act.page<=1?'disabled':'')+' aria-label="Previous page">'+ic('i-left','sm')+'</button>';
  for(var p=1;p<=pages;p++)h+='<button data-act="apage" data-v="'+p+'" '+(p===S.act.page?'aria-current="page"':'')+'>'+p+'</button>';
  h+='<button data-act="apage" data-v="'+(S.act.page+1)+'" '+(S.act.page>=pages?'disabled':'')+' aria-label="Next page">'+ic('i-right','sm')+'</button></div></div></section>';
  return h;
}

/* ================= DRAWER ================= */
function drawerHTML(id){
  var t=TK[id];var m=MM[t.matter];var ty=TM[t.type];
  return '<div class="drawer-bg" data-act="closedrawer"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dtitle"><header>'+tyChip(t.type)+'<div><div class="ref">'+t.id+' &middot; '+ty.name+'</div><h2 id="dtitle">'+esc(t.title)+'</h2></div><button class="x" data-act="closedrawer" aria-label="Close task">'+ic('i-x','lg')+'</button></header><dl>'+
    '<dt>Matter</dt><dd>'+esc(m.name)+'</dd><dt>Client</dt><dd>'+esc(CM[m.client].name)+'</dd><dt>Due</dt><dd>'+dueText(t)+'</dd><dt>Status</dt><dd>'+statusHTML(t)+'</dd><dt>Priority</dt><dd>'+esc(t.prio)+' '+prioPill(t)+'</dd><dt>Assignee</dt><dd>'+asgHTML(t)+'</dd></dl><footer><button class="btn primary" data-act="toast" data-v="Mockup: the full Task page opens here.">Open task</button>'+(t.asg?'':'<button class="btn" data-act="toast" data-v="Mockup: assign dialog.">'+ic('i-userx','sm')+'Assign</button>')+'<button class="btn ghost" data-act="closedrawer" style="margin-left:auto">Close</button></footer></aside>';
}
var lastOpener=null;
function openDrawer(id,opener){lastOpener=opener;document.getElementById('overlay').innerHTML=drawerHTML(id);S.drawer=id;var x=document.querySelector('.drawer .x');if(x)x.focus()}
function closeDrawer(){document.getElementById('overlay').innerHTML='';S.drawer=null;if(lastOpener&&document.body.contains(lastOpener))lastOpener.focus()}

/* ================= TOAST ================= */
var tt;function toast(m){var el=document.getElementById('toast');el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(function(){el.hidden=true},2600)}

/* ================= RENDER ================= */
function focusKey(el){return el&&el.getAttribute?(el.getAttribute('data-act')?'a|'+el.getAttribute('data-act')+'|'+(el.getAttribute('data-v')||'')+'|'+(el.getAttribute('data-g')||'')+'|'+(el.getAttribute('data-t')||'')+'|'+(el.getAttribute('data-m')||''):el.getAttribute('data-ddbtn')?'d|'+el.getAttribute('data-ddbtn'):null):null}
function restoreFocus(k){if(!k)return;var parts=k.split('|');var sel;if(parts[0]==='d')sel='[data-ddbtn="'+parts[1]+'"]';else sel='[data-act="'+parts[1]+'"]'+(parts[2]?'[data-v="'+parts[2]+'"]':'')+(parts[3]?'[data-g="'+parts[3]+'"]':'')+(parts[4]?'[data-t="'+parts[4]+'"]':'')+(parts[5]?'[data-m="'+parts[5]+'"]':'');var el=document.querySelector(sel);if(el)el.focus()}
function bodyHTML(){return S.opt==='B'?bodyB():S.opt==='C'?bodyC():bodyA()}
function render(){
  var k=focusKey(document.activeElement);
  var page=document.getElementById('page');
  page.innerHTML='<div id="titlerow">'+titleRow()+'</div><div id="filters">'+filterBar()+'</div><div id="body" style="display:contents">'+bodyHTML()+'</div>';
  refreshDD();restoreFocus(k);
}
function renderBody(){
  var k=focusKey(document.activeElement);
  var b=document.getElementById('body');if(!b){render();return}
  var f=document.getElementById('filters');
  var scrollers=[];
  b.innerHTML=bodyHTML();
  // filter bar visibility depends on tab/view
  var fb=filterBar();
  if(f&&f.getAttribute('data-sig')!==sig()){f.innerHTML=fb;f.setAttribute('data-sig',sig())}
  refreshDD();restoreFocus(k);
}
function sig(){return [S.tab,S.view,S.single,S.client,S.matter,S.focus.size,S.due].join('|')}
function resetAll(){S.client='all';S.matter='all';S.focus.clear();S.due='any';S.pre='open';S.page=1;S.scope='my';S.role='any';S.sort={k:'urgency',d:1};syncDataMatters();S.cal.pop=null}

/* ================= EVENTS ================= */
document.addEventListener('click',function(e){
  var t=e.target;
  var ddb=t.closest('[data-ddbtn]');if(ddb){openDropdown(ddb.getAttribute('data-ddbtn'));return}
  if(S.optionsOpen&&!t.closest('.menu')&&!t.closest('[data-act="options"]')){S.optionsOpen=false;document.getElementById('titlerow').innerHTML=titleRow()}
  var a=t.closest('[data-act]');
  if(!a){var inert=t.closest('[data-inert]');if(inert){e.preventDefault();toast('Mockup: only My Matters is active.')}return}
  var act=a.getAttribute('data-act'),v=a.getAttribute('data-v');
  switch(act){
    case 'toast':toast(v);break;
    case 'options':S.optionsOpen=!S.optionsOpen;document.getElementById('titlerow').innerHTML=titleRow();var nb=document.querySelector('[data-act="options"]');if(nb)nb.focus();break;
    case 'opt':{var g=a.getAttribute('data-g');S[g]=v;S.client='all';S.matter='all';syncDataMatters();S.page=1;S.optionsOpen=true;render();break}
    case 'resetall':resetAll();S.optionsOpen=false;render();break;
    case 'clear':S.client='all';S.matter='all';S.focus.clear();S.due='any';S.pre='open';S.page=1;syncDataMatters();render();break;
    case 'tab':S.tab=v;S.view='main';render();break;
    case 'pre':S.pre=(S.pre===v&&v!=='open'&&(S.opt==='A'||S.opt==='B'))?'open':v;S.page=1;S.sort={k:'urgency',d:1};S.view='main';renderBody();break;
    case 'sort':if(S.sort.k===v)S.sort.d=-S.sort.d;else S.sort={k:v,d:1};S.page=1;renderBody();break;
    case 'resetsort':S.sort={k:'urgency',d:1};renderBody();break;
    case 'page':S.page=+v;renderBody();var gs=document.querySelector('.gscroll');if(gs)gs.scrollTop=0;break;
    case 'view':S.view=v;S.cal.pop=null;if(v==='calendar'){S.cal.y=2026;S.cal.m=9}renderBody();document.getElementById('filters').innerHTML=filterBar();refreshDD();break;
    case 'calnav':{if(v==='0'){S.cal.y=2026;S.cal.m=9}else{var d=new Date(S.cal.y,S.cal.m+(+v),1);S.cal.y=d.getFullYear();S.cal.m=d.getMonth()}S.cal.pop=null;renderBody();break}
    case 'calmore':S.cal.pop=S.cal.pop===v?null:v;renderBody();break;
    case 'task':openDrawer(v,a);break;
    case 'closedrawer':closeDrawer();break;
    case 'pickmatter':S.matter=v;S.client=MM[v].client;syncDataMatters();S.page=1;render();break;
    case 'more':S.board.more[v]=true;renderBody();break;
    case 'bd':S.bd=v;renderBody();break;
    case 'bdgo':S.tab='overview';S.view='main';S.focus=new Set([a.getAttribute('data-t')]);if(a.getAttribute('data-m')!=='all'){S.matter=a.getAttribute('data-m');S.client=MM[S.matter].client;syncDataMatters()}S.pre=a.getAttribute('data-p');S.page=1;render();toast('Showing those tasks. Focus is set to this task type.');break;
    case 'dmode':S.data.mode=v;renderData();break;
    case 'dgroup':S.data.group=v;renderData();break;
    case 'dmetric':S.data.metric=v;renderData();break;
    case 'markread':S.act.read=true;render();break;
    case 'asort':if(S.act.sort.k===v)S.act.sort.d=-S.act.sort.d;else S.act.sort={k:v,d:1};S.act.page=1;renderBody();break;
    case 'apage':S.act.page=+v;renderBody();break;
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(openDD)return;
    if(S.drawer){closeDrawer();return}
    if(S.optionsOpen){S.optionsOpen=false;document.getElementById('titlerow').innerHTML=titleRow();var b=document.querySelector('[data-act="options"]');if(b)b.focus();return}
    if(S.cal.pop){S.cal.pop=null;renderBody();return}
    document.getElementById('shell').classList.remove('navopen');
  }
  if(S.drawer&&e.key==='Tab'){var f=[].slice.call(document.querySelectorAll('.drawer button'));if(!f.length)return;var i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}
  var tab=e.target.closest&&e.target.closest('[role=tab]');
  if(tab&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){var tabs=[].slice.call(document.querySelectorAll('[role=tab]'));var i2=tabs.indexOf(tab);var n=tabs[(i2+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length];n.focus();n.click()}
});
document.getElementById('burger').addEventListener('click',function(){document.getElementById('shell').classList.toggle('navopen')});
document.getElementById('scrim').addEventListener('click',function(){document.getElementById('shell').classList.remove('navopen')});
var os=document.getElementById('optsel');os.value=S.opt;
os.addEventListener('change',function(){S.opt=os.value;S.view='main';S.pre='open';try{history.replaceState(null,'','#'+S.opt)}catch(e){}render()});
document.getElementById('tg-single').addEventListener('click',function(){S.single=!S.single;this.setAttribute('aria-pressed',S.single);S.client='all';S.matter='all';syncDataMatters();S.page=1;render()});
document.getElementById('tg-empty').addEventListener('click',function(){S.empty=!S.empty;this.setAttribute('aria-pressed',S.empty);S.page=1;render()});
window.addEventListener('hashchange',function(){var h=(location.hash||'').replace('#','').toUpperCase();if(/^[ABC]$/.test(h)&&h!==S.opt){S.opt=h;S.view='main';S.pre='open';os.value=h;render()}});
render();
window.__mock={S:S,render:render};
})();
</script>
</body>
