function editorCmd(v){
  bodyRange();const ex=(c,a)=>document.execCommand(c,false,a);
  if(v==='bold'||v==='italic'||v==='underline')ex(v);
  else if(v==='ul')ex('insertUnorderedList');else if(v==='ol')ex('insertOrderedList');
  else if(v==='quote')ex('formatBlock','blockquote');
  else if(v==='clear')ex('removeFormat');
  else if(v==='undo')ex('undo');else if(v==='redo')ex('redo');
  else if(v==='mention'||v==='asset'){const r=getSelection().getRangeAt(0),t=r.startContainer.textContent||'',pv=t[r.startOffset-1];ex('insertText',(!pv||/\s/.test(pv)?'':' ')+(v==='mention'?'@':'#'))}
  else if(v==='link')linkPop();
  else if(v==='table')tblPicker();
  updateTb();
}
function closeFloat(){['tblpop','linkpop'].forEach(i=>{const e=document.getElementById(i);e&&e.remove()})}
document.addEventListener('mousedown',e=>{if(!e.target.closest('#tblpop,#linkpop,[data-v=table],[data-v=link]'))closeFloat();if(e.target.closest('#tb [data-act],#tb2 button,#tblpop'))e.preventDefault()});
function floatAt(el,btn,w){document.body.appendChild(el);const r=btn.getBoundingClientRect();el.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';el.style.top=(r.bottom+4)+'px'}
function tblPicker(){
  closeFloat();const el=document.createElement('div');el.id='tblpop';el.className='tblpop';el.setAttribute('role','dialog');el.setAttribute('aria-label','Insert table');
  let g='';for(let r=1;r<=6;r++)for(let c=1;c<=8;c++)g+='<button type="button" data-act="tblpick" data-r="'+r+'" data-c="'+c+'" aria-label="'+r+' rows by '+c+' columns"></button>';
  el.innerHTML='<div class="tl" id="tbllab">Pick rows by columns</div><div class="tg">'+g+'</div><label class="chk" style="padding:6px 0 0"><input type="checkbox" id="tblhdr" checked>First row is a header</label><div class="note" style="margin-top:4px">Arrow keys move in the grid, Enter inserts.</div>';
  floatAt(el,$('#tb [data-v=table]'),250);
  const cells=$$('.tg button',el),mark=(r,c)=>{cells.forEach(b=>b.classList.toggle('on',+b.dataset.r<=r&&+b.dataset.c<=c));$('#tbllab').textContent=r?r+' x '+c+' table':'Pick rows by columns'};
  el.addEventListener('mouseover',e=>{const b=e.target.closest('.tg button');if(b)mark(+b.dataset.r,+b.dataset.c)});
  el.addEventListener('focusin',e=>{const b=e.target.closest('.tg button');if(b)mark(+b.dataset.r,+b.dataset.c)});
  el.addEventListener('keydown',e=>{const b=e.target.closest('.tg button');if(!b){if(e.key==='Escape'){closeFloat();restoreRange()}return}let r=+b.dataset.r,c=+b.dataset.c;
    if(e.key==='ArrowRight')c=Math.min(8,c+1);else if(e.key==='ArrowLeft')c=Math.max(1,c-1);else if(e.key==='ArrowDown')r=Math.min(6,r+1);else if(e.key==='ArrowUp')r=Math.max(1,r-1);else if(e.key==='Escape'){closeFloat();restoreRange();return}else return;
    e.preventDefault();$('.tg button[data-r="'+r+'"][data-c="'+c+'"]',el).focus()});
  mark(3,3);$('.tg button[data-r="3"][data-c="3"]',el).focus();
}
function tblInsert(r,c){
  const hdr=$('#tblhdr')?$('#tblhdr').checked:true;closeFloat();bodyRange();
  const body=Math.max(1,hdr?r-1:r);
  const h='<table>'+(hdr?'<thead><tr>'+'<th>Header</th>'.repeat(c)+'</tr></thead>':'')+'<tbody>'+('<tr>'+'<td><br></td>'.repeat(c)+'</tr>').repeat(body)+'</tbody></table><p><br></p>';
  document.execCommand('insertHTML',false,h);updateTb();toast('Table inserted ('+r+' x '+c+'). Use the Table bar to add or remove rows and columns.');
}
function linkPop(){
  closeFloat();const el=document.createElement('div');el.id='linkpop';el.className='tblpop';el.setAttribute('role','dialog');el.setAttribute('aria-label','Insert link');
  el.innerHTML='<label for="lk-u" style="font-weight:600;font-size:13px">Link address</label><div style="display:flex;gap:6px;margin-top:6px"><input id="lk-u" type="text" value="https://" style="flex:1;height:34px;border:1px solid var(--border-strong);border-radius:8px;padding:0 10px"><button type="button" class="btn sm primary" id="lk-ok">Apply</button></div>';
  floatAt(el,$('#tb [data-v=link]'),300);$('#lk-u').focus();
  const ok=()=>{const u=$('#lk-u').value.trim();closeFloat();bodyRange();if(!u)return;if(getSelection().isCollapsed)document.execCommand('insertHTML',false,'<a href="'+esc(u)+'">'+esc(u)+'</a>&nbsp;');else document.execCommand('createLink',false,u)};
  $('#lk-ok').onclick=ok;el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ok()}else if(e.key==='Escape'){closeFloat();restoreRange()}});
}
function tblOp(op){
  const n=LRANGE&&LRANGE.startContainer,el=n&&(n.nodeType===1?n:n.parentElement),cell=el&&el.closest('td,th');if(!cell)return;
  const tbl=cell.closest('table'),row=cell.parentElement,ci=Array.from(row.children).indexOf(cell);
  const mk=t=>{const d=document.createElement(t);d.innerHTML=t==='th'?'Header':'<br>';return d};
  if(op==='rowadd'){const tr=document.createElement('tr');for(let i=0;i<row.children.length;i++)tr.appendChild(mk('td'));if(row.parentNode.nodeName==='THEAD'){let tb=$('tbody',tbl);if(!tb){tb=document.createElement('tbody');tbl.appendChild(tb)}tb.insertBefore(tr,tb.firstChild)}else row.after(tr)}
  else if(op==='rowdel'){if($$('tr',tbl).length<=1){tbl.remove()}else{const th=row.parentNode.nodeName==='THEAD';row.remove();if(th)$('thead',tbl)&&!$('thead tr',tbl)&&$('thead',tbl).remove()}}
  else if(op==='coladd'){$$('tr',tbl).forEach(tr=>{const c2=mk(tr.parentNode.nodeName==='THEAD'?'th':'td');const ref=tr.children[ci];ref?ref.after(c2):tr.appendChild(c2)})}
  else if(op==='coldel'){if(row.children.length<=1){tbl.remove()}else $$('tr',tbl).forEach(tr=>tr.children[ci]&&tr.children[ci].remove())}
  else if(op==='hdr'){const th=$('thead',tbl);if(th){const tb=$('tbody',tbl)||tbl.appendChild(document.createElement('tbody'));const tr=$('tr',th);$$('th',tr).forEach(h=>{const d=mk('td');d.innerHTML=h.innerHTML;h.replaceWith(d)});tb.insertBefore(tr,tb.firstChild);th.remove()}else{const tb=$('tbody',tbl)||tbl,tr=$('tr',tb);if(tr){const nh=document.createElement('thead');$$('td',tr).forEach(d=>{const h=mk('th');h.innerHTML=d.innerHTML;d.replaceWith(h)});nh.appendChild(tr);tbl.insertBefore(nh,tbl.firstChild)}}}
  else if(op==='tbldel'){tbl.remove()}
  $('#ed').focus();updateTb();
}
document.addEventListener('click',e=>{const b=e.target.closest('#tb2 [data-t]');if(b)tblOp(b.dataset.t)});
/* splitter between the note list and the editor: mouse, touch and keyboard */
function setNW(v){v=Math.max(NW_MIN,Math.min(NW_MAX,Math.round(v)));S.nw=v;const l=$('#nlistc'),sp=$('#splitter');if(l)l.style.flexBasis=v+'px';if(sp)sp.setAttribute('aria-valuenow',v);try{localStorage.setItem('mdw',v)}catch(e){}}
document.addEventListener('pointerdown',e=>{const sp=e.target.closest('#splitter');if(!sp)return;e.preventDefault();sp.focus();try{sp.setPointerCapture(e.pointerId)}catch(x){}SPDRAG=true;sp.classList.add('drag')});
document.addEventListener('pointermove',e=>{if(!SPDRAG)return;const w=$('#nwrap');if(!w){SPDRAG=false;return}setNW(e.clientX-w.getBoundingClientRect().left)});
document.addEventListener('pointerup',()=>{SPDRAG=false;const sp=$('#splitter');sp&&sp.classList.remove('drag')});
document.addEventListener('keydown',e=>{if(e.target.id!=='splitter')return;const st=e.shiftKey?48:16;
  if(e.key==='ArrowLeft'){e.preventDefault();setNW(S.nw-st)}else if(e.key==='ArrowRight'){e.preventDefault();setNW(S.nw+st)}else if(e.key==='Home'){e.preventDefault();setNW(NW_MIN)}else if(e.key==='End'){e.preventDefault();setNW(NW_MAX)}});

/* ====================== init ====================== */
function init(){
  document.title=(ALT?'Matter detail, Specs as own tab':'Matter detail redesign')+' - mockup - LPT Hub';
  $('#page').innerHTML='<div id="hdr"></div><div class="tabswrap" id="tabs"></div><div class="fill" id="tabpanel" role="tabpanel" aria-labelledby="tab-summary"></div>';
  $('#mockhost').innerHTML=mockHTML();
  const q=new URLSearchParams(location.hash.slice(1));
  if(q.get('tab')&&TABS.some(t=>t[0]===q.get('tab')))S.tab=q.get('tab');
  if(q.get('ai')&&AIV[q.get('ai')])S.ai=M.ai=q.get('ai');
  if(q.get('warn'))S.warn=true;
  if(q.get('pv'))S.pv=q.get('pv');
  rerender();
  $('#burger').addEventListener('click',()=>$('#shell').classList.toggle('navopen'));
  $('#scrim').addEventListener('click',()=>$('#shell').classList.remove('navopen'));
  $$('#shell nav a[data-inert]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();toast('Mockup: this menu item is not part of the demo.')}));
}
init();

})();
</script>
