<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LPT Hub - Dashboard mockup</title>
<style>
:root{
  --navy:#1A3556; --navy-2:#24446b; --brand:#1d4e89;
  --bg:#F4F6FA; --card:#fff; --line:#E2E6ED; --line-2:#EEF1F5;
  --ink:#101828; --ink-2:#344054; --muted:#4B5565;
  --focus:#1B5FD6;
  --red:#C62828; --red-bg:#FDEDEB; --red-ink:#A31616; --red-bd:#F4C3BE;
  --amber:#B45309; --amber-bg:#FEF5E1; --amber-ink:#8A3F06; --amber-bd:#F3D9A0;
  --blue:#1D5FD1; --blue-bg:#EAF1FD; --blue-ink:#1A4DB0; --blue-bd:#C5D8F8;
  --teal:#0F766E; --teal-bg:#E5F5F2; --teal-ink:#0B5F58; --teal-bd:#B5E2DB;
  --violet:#6A3DBE; --violet-bg:#F2ECFC; --violet-ink:#55309C; --violet-bd:#D8C9F4;
  --slate:#475569; --slate-bg:#EEF1F6; --slate-ink:#334155; --slate-bd:#D5DBE5;
  --r:14px; --gut:32px;
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue-ink)}
h1,h2,h3,p{margin:0}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:16px;height:16px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.side :focus-visible,.mock :focus-visible{outline-color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:#fff;padding:10px 14px;border-radius:8px;z-index:200;font-weight:600}
.skip:focus{top:8px}

/* tones */
.t-red{--tone:var(--red);--tbg:var(--red-bg);--tink:var(--red-ink);--tbd:var(--red-bd)}
.t-amber{--tone:var(--amber);--tbg:var(--amber-bg);--tink:var(--amber-ink);--tbd:var(--amber-bd)}
.t-blue{--tone:var(--blue);--tbg:var(--blue-bg);--tink:var(--blue-ink);--tbd:var(--blue-bd)}
.t-teal{--tone:var(--teal);--tbg:var(--teal-bg);--tink:var(--teal-ink);--tbd:var(--teal-bd)}
.t-violet{--tone:var(--violet);--tbg:var(--violet-bg);--tink:var(--violet-ink);--tbd:var(--violet-bd)}
.t-slate{--tone:var(--slate);--tbg:var(--slate-bg);--tink:var(--slate-ink);--tbd:var(--slate-bd)}
.chip{width:44px;height:44px;border-radius:12px;background:var(--tone);color:#fff;display:grid;place-items:center;flex:none}
.chip.sm{width:32px;height:32px;border-radius:9px}
.chip.sm svg.i{width:18px;height:18px}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--tbg);color:var(--tink);font-weight:600;font-size:14px;white-space:nowrap;border:1px solid var(--tbd)}
.pill svg.i{width:15px;height:15px}
.ink{color:var(--tink)}

/* shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--navy);color:#DCE6F3;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:0 14px 12px;z-index:60}
.brand{display:flex;align-items:center;gap:12px;height:64px;color:#fff;font-weight:700;font-size:20px;letter-spacing:.1px;padding:0 6px;flex:none}
.brand svg{width:36px;height:36px;border-radius:10px;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.nav{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;height:34px;padding:0 12px;border-radius:999px;color:#DCE6F3;text-decoration:none;font-size:15px}
.nav a:hover{background:rgba(255,255,255,.1)}
.nav a[aria-current=page]{background:#fff;color:var(--navy);font-weight:700}
.nav a.ind{margin-left:22px;height:32px;font-size:14.5px}
.nav .svg-wrap{display:contents}
.nav svg.i{width:18px;height:18px}
.nav-h{font-size:13px;letter-spacing:.09em;font-weight:700;color:#9DB2CF;margin:14px 12px 6px}
.ver{margin-top:auto;padding:10px 12px 0;font-size:13px;color:#9DB2CF}
.scrim{display:none}
.col{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line);height:64px;display:flex;align-items:center;gap:16px;padding:0 var(--gut)}
.burger{display:none;width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;align-items:center;justify-content:center}
.search{position:relative;flex:1 1 auto;max-width:560px}
.search input{width:100%;height:42px;border:1px solid #CBD2DD;border-radius:10px;padding:0 70px 0 42px;background:#fff}
.search input::placeholder{color:#5C6677}
.search>svg{position:absolute;left:13px;top:11px;color:#5C6677}
.search kbd{position:absolute;right:10px;top:9px;font:12px var(--font);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);background:var(--bg)}
.pop{position:absolute;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(16,24,40,.16);z-index:70;padding:8px}
.spop{left:0;right:0;top:48px}
.pop .it{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:10px 12px;min-height:44px}
.pop .it:hover{background:var(--bg)}
.pop .hd{padding:6px 12px;font-weight:700;color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;border:1px solid #CBD2DD;background:#fff;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:#17406f}
.btn.ico{width:42px;padding:0}
.btn.sm{height:36px;padding:0 14px;font-size:15px}
.spacer{flex:1 1 0}
.bell{position:relative}
.bell .n{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:999px;min-width:22px;height:22px;font-size:13px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
.rel{position:relative}
.user{display:flex;align-items:center;gap:10px;height:44px;padding:0 10px 0 6px;border-radius:999px;border:1px solid var(--line);background:#fff}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--slate-bg);color:var(--slate-ink);flex:none}
.av.v{background:var(--violet-bg);color:var(--violet-ink)}
.av.b{background:var(--blue-bg);color:var(--blue-ink)}
.av.t{background:var(--teal-bg);color:var(--teal-ink)}
.av.lg{width:44px;height:44px;font-size:16px}
.user small{display:block;color:var(--muted);font-size:13px;line-height:1.1}
.user b{display:block;font-size:15px;line-height:1.2}
.right-pop{right:0;top:52px;width:340px}
main{padding:24px var(--gut) 96px;max-width:1560px;width:100%}

/* page head */
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hr{display:flex;align-items:center;gap:12px}
.head h1{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.2px}
.head p{color:var(--muted);margin-top:4px;font-size:16px}
.tabs{display:flex;gap:4px;margin-top:12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;height:48px;padding:0 18px;font-size:16px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{color:var(--blue-ink);border-bottom-color:var(--blue)}

/* filters */
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px;margin:20px 0}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.fld>span.l{font-size:14px;font-weight:600;color:var(--ink-2)}
.sel{position:relative}
.fld.c{width:230px}.fld.m{width:260px}.fld.t{width:190px}
.sel select{appearance:none;-webkit-appearance:none;height:44px;border:1px solid #CBD2DD;border-radius:10px;background:#fff;padding:0 40px 0 14px;width:100%;min-width:0;font-weight:500}
.sel select:hover{border-color:#98A2B3}
.sel>svg{position:absolute;right:12px;top:13px;pointer-events:none;color:var(--muted)}
.sep{align-self:flex-end;height:44px;display:grid;place-items:center;color:#7A8597}
.seg{display:inline-flex;background:#fff;border:1px solid #CBD2DD;border-radius:10px;padding:3px;gap:2px;height:44px}
.seg button{border:0;background:none;border-radius:8px;padding:0 14px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.seg button:hover{background:var(--bg)}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.vr{align-self:stretch;width:1px;background:var(--line);margin:0 4px}
.mf-btn{display:none}
.linkbtn{background:none;border:0;color:var(--blue-ink);font-weight:600;padding:0 6px;height:44px;text-decoration:underline;text-underline-offset:3px}
.scopeline{margin-left:auto;color:var(--muted);font-size:15px;align-self:flex-end;height:44px;display:flex;align-items:center}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;min-width:0}
.card.flush{padding:0}
.ch{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ch h2{font-size:20px;font-weight:700;line-height:1.25}
.ch .sub{color:var(--muted);font-size:15px;flex-basis:100%;margin-top:-6px}
.ch .grow{flex:1}
.cnt{background:var(--tbg,var(--slate-bg));color:var(--tink,var(--slate-ink));border-radius:999px;padding:2px 12px;font-weight:700;font-size:15px}
.card.flush .ch{padding:24px 24px 0;margin-bottom:12px}
.g21{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px;align-items:start}
.g11{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}
.stack{display:flex;flex-direction:column;gap:24px}
.sect-h{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:32px 0 12px}
.sect-h:first-child{margin-top:0}

/* hero tiles */
.hero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-bottom:24px}
.tile{display:flex;align-items:center;gap:20px;text-align:left;padding:20px 24px;border-radius:16px;border:1px solid var(--tbd);background:var(--tbg);color:var(--ink);position:relative;min-width:0;transition:box-shadow .15s,transform .15s}
.tile:hover{box-shadow:0 6px 18px rgba(16,24,40,.10);transform:translateY(-1px)}
.tile[aria-pressed=true]{box-shadow:0 0 0 3px var(--tone);border-color:var(--tone)}
.tile .chip{width:56px;height:56px;border-radius:16px}
.tile .chip svg.i{width:28px;height:28px}
.tile .num{font-size:56px;line-height:1;font-weight:700;color:var(--tink);letter-spacing:-1px}
.tile .lab{font-size:18px;font-weight:700;color:var(--ink)}
.tile .hint{font-size:15px;color:var(--ink-2);margin-top:2px}
.tile .go{position:absolute;right:18px;top:18px;color:var(--tink);opacity:.8}
.tile .tx{min-width:0}

/* tables */
.tbl-wrap{overflow-x:auto;container-type:inline-size}
@container (max-width:720px){.tref{display:none}}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{height:44px;text-align:left;font-size:14px;font-weight:700;color:var(--muted);background:#F8F9FB;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 12px;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{padding-left:24px}
.tbl th:last-child,.tbl td:last-child{padding-right:24px}
.tbl th button{background:none;border:0;font-weight:700;color:inherit;display:inline-flex;gap:6px;align-items:center;height:36px;padding:0 4px;margin:0 -4px;border-radius:6px}
.tbl th button:hover{color:var(--ink)}
.tbl th[aria-sort=ascending] button,.tbl th[aria-sort=descending] button{color:var(--blue-ink)}
.tbl td{height:44px;padding:0 12px;border-bottom:1px solid var(--line-2);font-size:15px;white-space:nowrap}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:#F7F9FC}
.tbl tbody tr.sel td{background:var(--blue-bg)}
.tbl tbody tr:last-child td{border-bottom:0}
.c-task{max-width:0;width:44%}
.tlink{background:none;border:0;padding:0;text-align:left;font-weight:600;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;height:36px}
.tlink:hover{color:var(--blue-ink);text-decoration:underline}
.tref{color:var(--muted);font-weight:500;margin-right:8px;font-size:14px}
.who{display:inline-flex;align-items:center;gap:10px}
.who .av{width:28px;height:28px;font-size:12px}
.who .av.lg{width:44px;height:44px;font-size:16px}
.un{color:var(--violet-ink);font-weight:600}
.late{color:var(--red-ink);font-weight:700;display:inline-flex;gap:6px;align-items:center}
.soon{color:var(--amber-ink);font-weight:700;display:inline-flex;gap:6px;align-items:center}
.asap{color:var(--blue-ink);font-weight:700;display:inline-flex;gap:6px;align-items:center}
.nrm{color:var(--ink-2)}
.pr{display:inline-flex;gap:6px;align-items:center;font-weight:600;color:var(--ink-2)}
.pr i{width:8px;height:8px;border-radius:50%;background:#98A2B3;display:inline-block}
.pr.High i{background:var(--violet)}
.pr.Low i{background:#CBD2DD}
.pr.ASAP{color:var(--blue-ink)} .pr.ASAP i{background:var(--blue)}
.foot{display:flex;align-items:center;gap:12px;padding:12px 24px 16px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.foot .grow{flex:1}
.btn.ghost{border-color:transparent;background:none;color:var(--blue-ink);padding:0 10px}
.btn.ghost:hover{background:var(--blue-bg)}
.smallbtn{height:32px;border-radius:8px;border:1px solid var(--violet-bd);background:var(--violet-bg);color:var(--violet-ink);font-weight:700;padding:0 12px;font-size:14px}
.smallbtn:hover{background:#E6DBF9}

/* radar + feed */
.radar{display:flex;flex-direction:column}
.radar button{display:flex;align-items:center;gap:14px;background:none;border:0;border-radius:12px;padding:10px 8px;text-align:left;width:100%;min-height:56px}
.radar button:hover{background:var(--bg)}
.radar button[aria-pressed=true]{background:var(--tbg)}
.radar .n{font-size:28px;font-weight:700;color:var(--tink);min-width:44px;text-align:right;line-height:1}
.radar .t{flex:1;font-weight:600}
.radar .t small{display:block;color:var(--muted);font-weight:400;font-size:14px}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line-2)}
.feed li:first-child{border-top:0}
.feed .tx{min-width:0;font-size:15px}
.feed .tm{color:var(--muted);font-size:14px;margin-top:2px}
.feed b{font-weight:600}
.feed button.ev{background:none;border:0;padding:0;text-align:left;color:var(--blue-ink);font-weight:600;text-decoration:underline;text-underline-offset:2px}

/* client cards (B) */
.clients{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.cc{display:flex;flex-direction:column;gap:12px;text-align:left;padding:20px;border:1px solid var(--line);background:#fff;border-radius:16px;position:relative;min-width:0}
.cc:hover{box-shadow:0 6px 18px rgba(16,24,40,.10)}
.cc[aria-pressed=true]{box-shadow:0 0 0 3px var(--brand);border-color:var(--brand)}
.cc .nm{font-weight:700;font-size:17px;line-height:1.25}
.cc .row{display:flex;align-items:center;gap:12px}
.cc .big{font-size:40px;font-weight:700;line-height:1;color:var(--tink)}
.cc .meta{color:var(--muted);font-size:15px}
.cc .accent{position:absolute;left:0;top:18px;bottom:18px;width:5px;border-radius:0 5px 5px 0;background:var(--tone)}
.bar{height:10px;border-radius:999px;background:var(--slate-bg);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--teal)} .bar .r{background:var(--red)} .bar .a{background:#E0A22B} .bar .b{background:var(--blue)} .bar .s{background:#94A3B8}
.mtitle{font-weight:600;color:var(--ink);background:none;border:0;padding:0;text-align:left;height:36px;white-space:nowrap}
.mtitle:hover{text-decoration:underline;color:var(--blue-ink)}
.msub{display:block;color:var(--muted);font-size:14px;font-weight:400}
.mt td{height:56px!important}
.numc{font-weight:700;font-size:17px}

/* KPI (C) */
.headline{display:flex;gap:24px;align-items:center;padding:28px;border-radius:16px;background:var(--navy);color:#fff;margin-bottom:24px;flex-wrap:wrap}
.headline h2{font-size:26px;line-height:1.25;font-weight:700;max-width:760px}
.headline p{color:#C9D7EA;margin-top:6px;font-size:17px;max-width:760px}
.headline .chip{width:60px;height:60px;border-radius:18px}
.headline .chip svg.i{width:30px;height:30px}
.headline .tx{flex:1;min-width:260px}
.headline .btn{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin-bottom:24px}
.kpi{padding:24px;border-radius:16px;background:#fff;border:1px solid var(--line);border-top:5px solid var(--tone);display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.kpi:hover{box-shadow:0 6px 18px rgba(16,24,40,.10)}
.kpi .lab{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.kpi .num{font-size:52px;line-height:1;font-weight:700;color:var(--tink);letter-spacing:-1px}
.kpi .dl{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:15px}
.kpi .dl.bad{color:var(--red-ink)} .kpi .dl.good{color:var(--teal-ink)} .kpi .dl.flat{color:var(--muted)}

/* charts */
.legend{display:flex;gap:8px;flex-wrap:wrap}
.lg{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:15px}
.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.lg[aria-pressed=false]{color:var(--muted);background:var(--bg)} .lg[aria-pressed=false] i{opacity:.35}
.chart{width:100%;min-height:200px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:13px var(--font);fill:#475467}
.chart .bar-c:hover{opacity:.8}
.insight{display:flex;gap:12px;align-items:flex-start;background:var(--tbg);border:1px solid var(--tbd);color:var(--ink);border-radius:12px;padding:14px 16px;margin-top:16px;font-size:16px}
.insight svg{color:var(--tink);margin-top:2px}
.brow{display:grid;grid-template-columns:150px minmax(0,1fr) 56px;gap:14px;align-items:center;min-height:48px;width:100%;background:none;border:0;text-align:left;border-radius:10px;padding:2px 8px;margin:0 -8px}
.brow:hover{background:var(--bg)}
.brow .nmx{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .v{font-weight:700;text-align:right;font-size:17px}
.brow .bar{height:14px}

/* swimlane */
.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;align-items:start}
.lane{background:#EDF0F5;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.lane h3{display:flex;align-items:center;gap:10px;font-size:17px}
.lane h3 .cnt{background:#fff}
.sc{background:#fff;border:1px solid var(--line);border-left:5px solid var(--lc,#98A2B3);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.sc:hover{box-shadow:0 6px 16px rgba(16,24,40,.10)}
.sc .tt{font-weight:600;line-height:1.3}
.sc .mm{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.empty-lane{color:var(--muted);text-align:center;padding:24px 8px;font-size:15px}

/* users */

function stats(L){
  const n=k=>L.filter(FIL[k]).length;
  return {open:n('open'),overdue:n('overdue'),dueSoon:n('dueSoon'),unassigned:n('unassigned'),asap:n('asap'),hold:n('hold'),
    done:L.filter(t=>!isOpen(t)&&t.doneAgo<=S.period).length,created:L.filter(t=>t.createdAgo<=S.period).length,
    donePrev:L.filter(t=>!isOpen(t)&&t.doneAgo>S.period&&t.doneAgo<=S.period*2).length,
    overdueWeekAgo:L.filter(t=>t.createdAgo>=7&&(t.doneAgo===null||t.doneAgo<7)&&t.prio!=='ASAP'&&t.dueIn!==null&&t.dueIn+7<0).length};
}
const health=(st,big)=>st.overdue>=(big?3:2)?'risk':(st.overdue>=1||st.dueSoon>=(big?4:2))?'watch':'ok';
const H={risk:{tone:'red',label:'Overdue work',icon:'alert'},watch:{tone:'amber',label:'Watch',icon:'clock'},ok:{tone:'teal',label:'On track',icon:'checkCircle'}};
const healthPill=h=>`<span class="pill t-${H[h].tone}">${ic(H[h].icon)}${H[h].label}</span>`;
const pn=id=>id?pById[id].name:'Unassigned';
const init=n=>n.split(' ').map(x=>x[0]).join('');
const plural=(n,w)=>n+' '+w+(n===1?'':'s');

/* ---------- sorting ---------- */
const PR={ASAP:0,High:1,Normal:2,Low:3};
function sorter(k,d){
  const v={task:t=>t.title.toLowerCase(),matter:t=>mById[t.matter].short,assignee:t=>t.who?pn(t.who):'~',
    due:t=>t.dueIn===null?-999:t.dueIn,priority:t=>PR[t.prio],created:t=>-t.createdAgo}[k];
  return (a,b)=>{const x=v(a),y=v(b);return (x<y?-1:x>y?1:a.i-b.i)*d};
}

/* ---------- small renderers ---------- */
function dueCell(t){
  if(!isOpen(t))return `<span class="nrm">Done ${fmt(-t.doneAgo,{month:'short',day:'numeric'})}</span>`;
  if(t.prio==='ASAP')return `<span class="asap">${ic('bolt','s')}ASAP, no date</span>`;
  if(t.dueIn<0)return `<span class="late">${ic('alert','s')}${plural(-t.dueIn,'day')} late</span>`;
  if(t.dueIn<=2)return `<span class="soon">${ic('clock','s')}${t.dueIn===0?'Today':t.dueIn===1?'Tomorrow':'In 2 days'}</span>`;
  return `<span class="nrm">${fmt(t.dueIn)}</span>`;
}
const whoCell=(t,compact)=>t.who?`<span class="who"><span class="av ${pById[t.who].cls}">${init(pn(t.who))}</span><span class="c-who-n">${esc(pn(t.who))}</span></span>`
  :(S.role==='tech'&&!compact?`<button class="smallbtn" data-act="assign-me" data-val="${t.id}" data-k="am-${t.id}">${ic('userPlus','s')} Assign to me</button>`:`<span class="un who">${ic('userPlus','s')} Unassigned</span>`);
const prCell=t=>`<span class="pr ${t.prio}"><i></i>${t.prio}</span>`;
const th=(k,label,cls,srt)=>{const on=S.sort.k===k;return `<th class="${cls}" scope="col" aria-sort="${on?(S.sort.d>0?'ascending':'descending'):'none'}"><button data-act="sort" data-val="${k}" data-k="th-${k}">${label}${on?ic(S.sort.d>0?'chevU':'chevD','s'):ic('sort','s')}</button></th>`};
function taskTable(L,opts={}){
  const lim=opts.limit||6, rows=L.slice().sort(sorter(S.sort.k,S.sort.d)), show=S.showAll?rows:rows.slice(0,lim);
  return `<div class="tbl-wrap"><table class="tbl"><caption class="sr">${esc(opts.cap||'Tasks')}</caption><thead><tr>${th('task','Task','c-task')}${th('matter','Matter','c-matter')}${th('assignee','Assignee','c-who')}${th('due','Due','c-due')}${th('priority','Priority','c-prio')}</tr></thead><tbody>${
   show.map(t=>`<tr data-act="open-task" data-val="${t.id}"><td class="c-task"><button class="tlink" data-act="open-task" data-val="${t.id}" data-k="tk-${t.id}" title="${esc(t.title)}"><span class="tref">${t.id}</span>${esc(t.title)}</button></td><td class="c-matter nrm" title="${esc(mById[t.matter].name)}">${esc(mById[t.matter].short)}</td><td class="c-who">${whoCell(t)}</td><td class="c-due">${dueCell(t)}</td><td class="c-prio">${prCell(t)}</td></tr>`).join('')
  }</tbody></table></div>${rows.length>lim?`<div class="foot"><span class="nrm">Showing ${show.length} of ${rows.length}</span><span class="grow"></span><button class="btn ghost sm" data-act="show-all" data-k="showall">${S.showAll?'Show fewer':'Show all '+rows.length}${ic(S.showAll?'chevU':'chevD','s')}</button></div>`:''}`;
}
const emptyBlock=(tone,icon,h,p,btn)=>`<div class="empty t-${tone}"><div class="chip">${ic(icon)}</div><h3>${h}</h3><p>${p}</p>${btn||''}</div>`;
const clearBtn=`<button class="btn" data-act="clear" data-k="clr-e">Clear filters</button>`;
const isFiltered=()=>S.client||S.matter||S.type;

const LIST_META={
 overdue:{label:'Overdue tasks',sub:'Past their due date, most late first.',tone:'red',icon:'alert',ok:'Nothing is overdue in this scope.'},
 dueSoon:{label:'Due in the next 2 days',sub:'Open, not ASAP, due today to day after tomorrow.',tone:'amber',icon:'clock',ok:'Nothing is due in the next 2 days.'},
 unassigned:{label:'Unassigned tasks',sub:'Waiting for a person. Highest priority first.',tone:'violet',icon:'userPlus',ok:'Everything has an owner.'},
 asap:{label:'ASAP tasks',sub:'Open work without a date that needs prompt handling.',tone:'blue',icon:'bolt',ok:'No ASAP work is open.'},
 hold:{label:'Tasks on hold',sub:'Waiting on something outside the team.',tone:'slate',icon:'pause',ok:'Nothing is on hold.'},
 open:{label:'All open tasks',sub:'New, in progress and on hold.',tone:'blue',icon:'list',ok:'No open tasks.'},
 done:{label:'Completed tasks',sub:'Finished in the chosen period.',tone:'teal',icon:'checkCircle',ok:'Nothing completed in this period.'},
 next:{label:'Next 7 days',sub:'Due within a week, plus ASAP work.',tone:'amber',icon:'calendar',ok:'Nothing is due in the next 7 days.'}};
function listCard(key,L){
  const mt=LIST_META[key]; let rows=L.filter(FIL[key]); if(key==='done')rows=rows.filter(t=>t.doneAgo<=S.period);
  const body=S.mode==='empty'||!L.length?emptyBlock('slate','inbox','No tasks to show',S.mode==='empty'?'This is the empty state: no tasks exist yet. Create a task or import a production to get started.':'No tasks match this client, matter and type.',isFiltered()?clearBtn:'')
   :rows.length?taskTable(rows,{limit:key==='overdue'?6:6,cap:mt.label}):emptyBlock('teal','checkCircle','All clear',mt.ok);
  return `<section class="card flush t-${mt.tone}" aria-labelledby="lh"><div class="ch"><div class="chip sm">${ic(mt.icon)}</div><h2 id="lh">${mt.label}</h2><span class="cnt">${rows.length}</span><span class="grow"></span><button class="btn ghost sm" data-act="toast" data-val="Would open Tasks filtered to: ${esc(mt.label)}" data-k="oq">Open in Tasks ${ic('arrowR','s')}</button><p class="sub">${mt.sub}</p></div>${body}</section>`;
}
function feedCard(L,n,title){
  const ids=new Set(L.map(t=>t.id)); const ev=S.mode==='empty'?[]:events.filter(e=>ids.has(e.t.id)&&e.ago<=S.period);
  const verb={done:'completed',created:'created',assigned:'was assigned to',moved:'moved the due date of'};
  const kicon={done:['teal','check'],created:['blue','plus'],assigned:['violet','userPlus'],moved:['amber','calendar']};
  const show=ev.slice(0,n);
  return `<section class="card" aria-labelledby="fh"><div class="ch"><h2 id="fh">${title||'What changed'}</h2><span class="grow"></span><span class="nrm" style="font-size:15px">Last ${S.period===90?'quarter':S.period+' days'}</span></div>${
   show.length?`<ul class="feed">${show.map(e=>{const k=kicon[e.kind];const t=e.t;
     const sent=e.kind==='assigned'?`<b>${esc(t.who?pn(t.who):'Someone')}</b> was assigned <button class="ev" data-act="open-task" data-val="${t.id}" data-k="ev-${t.id}-${e.kind}">${esc(t.title)}</button>`
       :`<b>${esc(pn(e.who))}</b> ${verb[e.kind]} <button class="ev" data-act="open-task" data-val="${t.id}" data-k="ev-${t.id}-${e.kind}">${esc(t.title)}</button>`;
     return `<li class="t-${k[0]}"><span class="chip sm">${ic(k[1])}</span><div class="tx">${sent}<div class="tm">${esc(mById[t.matter].short)} &middot; ${evTime(e)}</div></div></li>`}).join('')}</ul>
     ${ev.length>6?`<div class="foot" style="padding:12px 0 0;border:0"><button class="btn ghost sm" data-act="feed-more" data-k="fm">${n>6?'Show fewer':'Show more ('+(ev.length-6)+')'}${ic(n>6?'chevU':'chevD','s')}</button></div>`:''}`
   :emptyBlock('slate','activity','Nothing changed','No activity in this scope and period.')}</section>`;
}
function radar(st,key){
  const it=[['asap','bolt','blue','ASAP','No due date, handle promptly'],['hold','pause','slate','On hold','Waiting on something'],['open','list','blue','Open','New, in progress and on hold'],['done','checkCircle','teal','Completed','In the last '+(S.period===90?'quarter':S.period+' days')]];
  const nm={asap:st.asap,hold:st.hold,open:st.open,done:st.done};
  return `<section class="card" aria-labelledby="rh"><div class="ch" style="margin-bottom:8px"><h2 id="rh">Also on your radar</h2></div><div class="radar">${it.map(([k,i,tone,l,s])=>`<button class="t-${tone}" data-act="list" data-val="${k}" aria-pressed="${key===k}" data-k="rd-${k}"><span class="chip sm">${ic(i)}</span><span class="t">${l}<small>${s}</small></span><span class="n">${nm[k]}</span></button>`).join('')}</div></section>`;
}
function oldest(L,f,g){const a=L.filter(f);return a.length?a.reduce((m,t)=>Math.max(m,g(t)),0):0}
function tile(key,tone,icon,label,n,hint,pressed){
  const emp=S.mode==='empty'||(n===0&&!scope().length);
  const zero=!emp&&n===0&&(key==='overdue'||key==='dueSoon'||key==='unassigned');
  const tn=emp?'slate':zero?'teal':tone;
  return `<button class="tile t-${tn}" data-act="list" data-val="${key}" aria-pressed="${pressed}" data-k="tile-${key}"><span class="chip">${ic(zero?'checkCircle':icon)}</span><span class="tx"><span class="lab">${label}</span><span class="num" style="display:block;margin:6px 0 4px">${n}</span><span class="hint" style="display:block">${emp?'No tasks yet':zero?'All clear':hint}</span></span><span class="go">${ic('arrowR','s')}</span></button>`;
}
function heroTiles(L,st){
  const oD=oldest(L,FIL.overdue,t=>-t.dueIn), td=L.filter(t=>FIL.dueSoon(t)&&t.dueIn===0).length, tm=L.filter(t=>FIL.dueSoon(t)&&t.dueIn===1).length, oU=oldest(L,FIL.unassigned,t=>t.createdAgo);
  return `<div class="hero" role="group" aria-label="What needs attention">`+
   tile('overdue','red','alert','Overdue',st.overdue,`Worst: ${plural(oD,'day')} late`,S.list==='overdue')+
   tile('dueSoon','amber','clock','Due in 2 days',st.dueSoon,`${td} today, ${tm} tomorrow`,S.list==='dueSoon')+
   tile('unassigned','violet','userPlus','Unassigned',st.unassigned,`Oldest waiting ${plural(oU,'day')}`,S.list==='unassigned')+`</div>`;
}

/* chart */
function bins(L,P){
  const n=P===7?7:P===30?10:13, w=P/n, out=[];
  for(let b=0;b<n;b++){const hi=Math.round(b*w), lo=Math.round((b+1)*w); // ago in [hi, lo)
    const lbl=(()=>{const a=-(lo-1), z=-hi; return w<=1?fmt(z,{month:'short',day:'numeric'}):fmt(a,{month:'short',day:'numeric'})})();
    out.push({lbl,created:L.filter(t=>t.createdAgo>=hi&&t.createdAgo<lo).length,done:L.filter(t=>!isOpen(t)&&t.doneAgo>=hi&&t.doneAgo<lo).length,range:w<=1?fmt(-hi):fmt(-(lo-1),{month:'short',day:'numeric'})+' to '+fmt(-hi,{month:'short',day:'numeric'})});
  }
  return out.reverse();
}
function chartSVG(el,B,H,tr){
  const W=Math.max(el.clientWidth,260),h=H,pl=34,pb=28,pt=10,pr=6;
  const max=Math.max(3,...B.map(b=>Math.max(tr.created?b.created:0,tr.completed?b.done:0)));
  const y=v=>pt+(h-pt-pb)*(1-v/max), cw=(W-pl-pr)/B.length;
  const nseries=(tr.created?1:0)+(tr.completed?1:0)||1, bw=Math.min(24,(cw-8)/nseries);
  let g='';
  const step=max>8?Math.ceil(max/4):1; for(let v=0;v<=max;v+=step)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#E4E8EF"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const every=Math.max(1,Math.ceil(B.length*56/(W-pl)));
  B.forEach((b,i)=>{const cx=pl+cw*i+cw/2;let k=0;const x0=cx-bw*nseries/2;
    if(tr.created){g+=`<rect class="bar-c" x="${x0+bw*k}" y="${y(b.created)}" width="${bw-2}" height="${h-pb-y(b.created)}" rx="3" fill="#3B7DE0"><title>${b.range}: ${b.created} created</title></rect>`;k++}
    if(tr.completed){g+=`<rect class="bar-c" x="${x0+bw*k}" y="${y(b.done)}" width="${bw-2}" height="${h-pb-y(b.done)}" rx="3" fill="#0F9488"><title>${b.range}: ${b.done} completed</title></rect>`}
    if(i%every===0||i===B.length-1)g+=`<text x="${cx}" y="${h-8}" text-anchor="middle">${b.lbl}</text>`;
  });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${h}" width="${W}" height="${h}" role="img" aria-label="Tasks created and completed, ${esc(S.period)} days. Created ${B.reduce((a,b)=>a+b.created,0)}, completed ${B.reduce((a,b)=>a+b.done,0)}.">${g}</svg>`;
}
function drawCharts(){document.querySelectorAll('[data-chart]').forEach(el=>{const L=scope();chartSVG(el,bins(L,S.period),+el.dataset.chart,el.dataset.mini?{created:true,completed:true}:S.tr)})}
function trendCard(L,mini){
  const st=stats(L),net=st.created-st.done;
  const tone=net>0?'amber':'teal';
  return `<section class="card" aria-labelledby="th2"><div class="ch"><h2 id="th2">Created vs completed</h2><span class="grow"></span>${mini?'':`<div class="legend"><button class="lg" aria-pressed="${S.tr.created}" data-act="tr" data-val="created" data-k="lg1"><i style="background:#3B7DE0"></i>Created ${st.created}</button><button class="lg" aria-pressed="${S.tr.completed}" data-act="tr" data-val="completed" data-k="lg2"><i style="background:#0F9488"></i>Completed ${st.done}</button></div>`}</div>
   ${S.mode==='empty'||!L.length?emptyBlock('slate','chart','No data yet','Charts fill in once tasks are created and completed.'):`<div class="chart" data-chart="${mini?200:280}" ${mini?'data-mini="1"':''}></div>
   <div class="insight t-${tone}">${ic(net>0?'up':'check')}<span>${net>0?`<b>The backlog grew by ${net}.</b> ${st.created} tasks were created and ${st.done} completed in the last ${S.period===90?'quarter':S.period+' days'}.`:`<b>The backlog shrank by ${-net}.</b> ${st.done} tasks were completed and ${st.created} created in the last ${S.period===90?'quarter':S.period+' days'}.`}</span></div>`}</section>`;
}

/* ---------- OPTION A ---------- */
function optA(){
  const L=scope(),st=stats(L);
  return heroTiles(L,st)+`<div class="g21"><div class="stack">${listCard(S.list,L)}</div><div class="stack">${radar(st,S.list)}${feedCard(L,S.feedN)}</div></div>`;
}
/* ---------- OPTION B ---------- */
function optB(){
  const Lc=scope({noClient:true,noMatter:true});
  const cards=clients.map(c=>{const st=stats(Lc.filter(t=>t.client===c.id)),h=health(st,true),tone=H[h].tone,ms=matters.filter(m=>m.client===c.id).length;
    const tot=st.open||1;
    return `<button class="cc t-${tone}" data-act="pick-client" data-val="${c.id}" aria-pressed="${S.client===c.id}" data-k="cc-${c.id}"><span class="accent"></span><div class="row"><span class="av lg">${init(c.short)}</span><div><div class="nm">${esc(c.name)}</div><div class="meta">${ms} matters &middot; ${st.open} open</div></div></div>
     <div class="row"><span class="big">${st.overdue}</span><span class="pill">${ic(H[h].icon)}${st.overdue?'overdue':H[h].label}</span></div>
     <div class="bar" role="img" aria-label="${st.overdue} overdue, ${st.dueSoon} due soon, ${st.open-st.overdue-st.dueSoon} other open"><i class="r" style="width:${st.overdue/tot*100}%"></i><i class="a" style="width:${st.dueSoon/tot*100}%"></i><i class="s" style="width:${(st.open-st.overdue-st.dueSoon)/tot*100}%"></i></div></button>`}).join('');
  const Lm=scope({noMatter:true});
  let ms=matters.filter(m=>!S.client||m.client===S.client).map(m=>{const l=Lm.filter(t=>t.matter===m.id),st=stats(l),all=l.length||1,dn=l.filter(t=>!isOpen(t)).length;
    const nx=l.filter(t=>isOpen(t)&&t.dueIn!==null&&t.dueIn>=0).sort((a,b)=>a.dueIn-b.dueIn)[0];
    return {m,st,h:health(st),prog:dn/all,nx:nx?nx.dueIn:999,total:l.length}});
  const mk=S.mSort.k,md=S.mSort.d,val={matter:x=>x.m.short,health:x=>({risk:0,watch:1,ok:2})[x.h],open:x=>x.st.open,overdue:x=>x.st.overdue,dueSoon:x=>x.st.dueSoon,prog:x=>x.prog,next:x=>x.nx};
  ms.sort((a,b)=>{const x=val[mk](a),y=val[mk](b);return (x<y?-1:x>y?1:0)*md||a.m.short.localeCompare(b.m.short)});
  const lim=S.mAll?99:5, mshow=ms.slice(0,lim);
  const mth=(k,l)=>`<th scope="col" aria-sort="${mk===k?(md>0?'ascending':'descending'):'none'}"><button data-act="msort" data-val="${k}" data-k="mth-${k}">${l}${mk===k?ic(md>0?'chevU':'chevD','s'):ic('sort','s')}</button></th>`;
  const mt=S.mode==='empty'||!ms.length?emptyBlock('slate','inbox','No matters to show','Matters appear here once a client has work.'):`<div class="tbl-wrap"><table class="tbl mt"><caption class="sr">Matters</caption><thead><tr>${mth('matter','Matter')}${mth('health','Status')}${mth('overdue','Overdue')}${mth('dueSoon','Due soon')}${mth('open','Open')}${mth('prog','Done')}${mth('next','Next due')}</tr></thead><tbody>${mshow.map(x=>`<tr class="${S.matter===x.m.id?'sel':''}" data-act="pick-matter" data-val="${x.m.id}" aria-selected="${S.matter===x.m.id}"><td><button class="mtitle" data-act="pick-matter" data-val="${x.m.id}" data-k="mt-${x.m.id}">${esc(x.m.name)}<span class="msub">${x.m.ref} &middot; ${esc(cById[x.m.client].short)}</span></button></td><td>${healthPill(x.h)}</td><td><span class="numc ${x.st.overdue?'late':'nrm'}">${x.st.overdue}</span></td><td><span class="numc ${x.st.dueSoon?'soon':'nrm'}">${x.st.dueSoon}</span></td><td><span class="numc nrm">${x.st.open}</span></td><td style="min-width:130px"><div class="bar" style="width:100px"><i class="g" style="width:${x.prog*100}%"></i></div></td><td class="nrm">${x.nx===999?'-':x.nx===0?'Today':x.nx===1?'Tomorrow':fmt(x.nx)}</td></tr>`).join('')}</tbody></table></div>${ms.length>5?`<div class="foot"><span class="nrm">Showing ${mshow.length} of ${ms.length} matters</span><span class="grow"></span><button class="btn ghost sm" data-act="m-all" data-k="mall">${S.mAll?'Show fewer':'Show all '+ms.length}${ic(S.mAll?'chevU':'chevD','s')}</button></div>`:''}`;
  const L=scope(),st=stats(L);
  const tabs=[['late','What is late',st.overdue,'red'],['next','What is next',L.filter(FIL.next).length,'amber'],['changed','What changed',S.mode==='empty'?0:events.filter(e=>L.some(t=>t.id===e.t.id)&&e.ago<=S.period).length,'blue']];
  const key=S.bTab==='late'?'overdue':'next';
  const res=S.bTab==='changed'?feedCard(L,12,'What changed'):listCard(key,L);
  const scopeName=S.matter?mById[S.matter].short:S.client?cById[S.client].short:'all clients';
  return `<h2 class="sect-h">1 &middot; Client</h2><div class="clients" role="group" aria-label="Choose a client">${cards}</div>
   <h2 class="sect-h">2 &middot; Matter${S.client?' of '+esc(cById[S.client].short):''}</h2><section class="card flush" aria-label="Matters">${mt}</section>
   <h2 class="sect-h">3 &middot; Results for ${esc(scopeName)}</h2><div class="seg" role="group" aria-label="Result type" style="margin-bottom:16px;height:auto;flex-wrap:wrap">${tabs.map(t=>`<button class="t-${t[3]}" aria-pressed="${S.bTab===t[0]}" data-act="btab" data-val="${t[0]}" data-k="bt-${t[0]}" style="height:42px">${t[1]} &middot; ${t[2]}</button>`).join('')}</div>${res}`;
}
/* ---------- OPTION C ---------- */
function optC(){
  const L=scope(),st=stats(L), Lm=scope({noMatter:true});
  const ms=matters.filter(m=>!S.client||m.client===S.client).map(m=>{const l=Lm.filter(t=>t.matter===m.id),s=stats(l);return{m,s,h:health(s),l}}).sort((a,b)=>({risk:0,watch:1,ok:2})[a.h]-({risk:0,watch:1,ok:2})[b.h]||b.s.overdue-a.s.overdue||b.s.dueSoon-a.s.dueSoon);
  const risky=ms.filter(x=>x.h==='risk').length, who=ME[S.role].name.split(' ')[0];
  const tone=risky?'red':ms.some(x=>x.h==='watch')?'amber':'teal';
  const dOver=st.overdue-st.overdueWeekAgo, dDone=st.done-st.donePrev;
  const delta=(d,lowerBetter,unit)=>{const bad=lowerBetter?d>0:d<0,good=lowerBetter?d<0:d>0;return `<span class="dl ${d===0?'flat':bad?'bad':'good'}">${ic(d>0?'up':d<0?'down':'flat','s')}${d===0?'No change':(d>0?'+':'')+d+' '+unit}</span>`};
  const kpi=(tn,icon,lab,n,dl,key)=>`<button class="kpi t-${tn}" data-act="kpi" data-val="${key}" data-k="kpi-${key}"><span class="lab"><span class="chip sm">${ic(icon)}</span>${lab}</span><span class="num">${n}</span>${dl}</button>`;
  const empty=S.mode==='empty'||!L.length;

function tabBreakdowns(){

  const calc=(names,get)=>names.map(n=>{const a=f.filter(t=>get(t)===n);return{name:n,n:a.length,od:a.filter(FIL.overdue).length,open:Math.max(...names.map(m=>f.filter(t=>get(t)===m).length))}}).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);

  $('#page').innerHTML=header()+(tech?'':tabsHtml())+filtersHtml()+`<div id="panel" role="${tech?'region':'tabpanel'}" ${tech?'aria-label="Unassigned queue"':'aria-labelledby="tab-'+S.tab+'"'} tabindex="-1">${panelHtml()}</div>`;
  renderMock(); renderDrawer(); drawCharts(); saveHash();
  if(ak){const el=document.querySelector('[data-k="'+ak.replace(/"/g,'\\"')+'"]');if(el)el.focus({preventScroll:true})}
}
function renderMock(){
  const o=(v,t,d)=>`<label><input type="radio" name="opt" value="${v}"${S.opt===v?' checked':''}><span>${t}<small>${d}</small></span></label>`;
  const r=(n,v,t,cur)=>`<label><input type="radio" name="${n}" value="${v}"${cur===v?' checked':''}><span>${t}</span></label>`;
  $('#mock').innerHTML=`<button data-act="mock" aria-expanded="${S.mockOpen}" aria-controls="mpanel" id="mbtn">${ic('sliders','s')}<span class="mk">Mockup &middot; </span>Option ${S.opt}</button>${S.mockOpen?`<div class="panel" id="mpanel" role="group" aria-label="Mockup controls"><fieldset><legend>Design option</legend>${o('A','A &middot; What is late','Three big tiles, one list')}${o('B','B &middot; Client and matter story','Client cards, matter table, results')}${o('C','C &middot; Executive summary','Headline, KPIs, matters at risk')}</fieldset><fieldset><legend>State</legend>${r('state','live','Live data',S.mode)}${r('state','empty','Show empty state',S.mode)}${r('state','loading','Show loading state',S.mode)}</fieldset><fieldset><legend>View as</legend>${r('role','director','Director (all tabs)',S.role)}${r('role','tech','Technician (unassigned queue only)',S.role)}</fieldset></div>`:''}`;
}
function renderDrawer(){
  const el=$('#drawer'); if(!S.drawer){el.innerHTML='';return}
  const t=eff(tasks.find(x=>x.id===S.drawer)),m=mById[t.matter],c=cById[t.client];
  const evs=events.filter(e=>e.t.id===t.id).slice(0,3);
  el.innerHTML=`<div class="drawer-scrim" data-act="close-drawer"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dh"><header><div style="flex:1;min-width:0"><div class="crumb">${esc(c.name)} &rsaquo; ${esc(m.name)}</div><h2 id="dh">${esc(t.title)}</h2></div><button class="btn ico sm" data-act="close-drawer" aria-label="Close" id="dclose">${ic('x')}</button></header><div class="body"><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill t-${t.status==='Completed'?'teal':t.status==='On hold'?'slate':'blue'}">${t.status}</span>${FIL.overdue(t)?`<span class="pill t-red">${ic('alert')}Overdue</span>`:''}${FIL.dueSoon(t)?`<span class="pill t-amber">${ic('clock')}Due soon</span>`:''}${t.prio==='ASAP'?`<span class="pill t-blue">${ic('bolt')}ASAP</span>`:''}${!t.who&&isOpen(t)?`<span class="pill t-violet">${ic('userPlus')}Unassigned</span>`:''}</div>
  <dl class="kv"><dt>Reference</dt><dd>${t.id}</dd><dt>Task type</dt><dd>${esc(t.type)}</dd><dt>Assignee</dt><dd>${t.who?esc(pn(t.who)):'<span class="un">Unassigned</span>'}</dd><dt>Due</dt><dd>${dueCell(t)}</dd><dt>Priority</dt><dd>${prCell(t)}</dd><dt>Created</dt><dd>${fmt(-t.createdAgo)}</dd><dt>Checklist</dt><dd>${t.sub[0]} of ${t.sub[1]} done<div class="bar" style="margin-top:8px"><i class="g" style="width:${t.sub[0]/t.sub[1]*100}%"></i></div></dd></dl>
  <div><h3 style="font-size:17px;margin-bottom:8px">Recent activity</h3><ul class="feed">${evs.length?evs.map(e=>`<li><span class="chip sm t-slate">${ic('activity')}</span><div class="tx"><b>${esc(pn(e.who))}</b> ${({done:'completed this task',created:'created this task',assigned:'was assigned this task',moved:'moved the due date'})[e.kind]}<div class="tm">${evTime(e)}</div></div></li>`).join(''):'<li class="nrm">No recent activity.</li>'}</ul></div></div>
  <footer><button class="btn pri" data-act="toast" data-val="Would open the full task page" data-k="ot">Open task ${ic('ext','s')}</button>${!t.who&&isOpen(t)?`<button class="btn" data-act="assign-me" data-val="${t.id}">${ic('userPlus','s')} Assign to ${S.role==='tech'?'me':'Marcus Oyelaran'}</button>`:''}<button class="btn" data-act="close-drawer">Close</button></footer></aside>`;
  $('#dclose').focus();
}
let toastT; function toast(m){const el=$('#toast');el.innerHTML=`<div class="toast">${ic('checkCircle')}<span>${esc(m)}</span></div>`;clearTimeout(toastT);toastT=setTimeout(()=>el.innerHTML='',2800)}
let lastFocus=null;

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b){ if(S.pop&&!e.target.closest('.rel')){S.pop=null;render()} return }
  const a=b.dataset.act,v=b.dataset.val;
  if(a==='inert'){e.preventDefault();toast('Mockup: only Dashboard is clickable');return}
  if(a==='open-task'){ if(e.target.closest('button.smallbtn'))return; lastFocus=b.dataset.k||null;S.drawer=v;render();return}
  if(a==='close-drawer'){S.drawer=null;render();if(lastFocus){const el=document.querySelector('[data-k="'+lastFocus+'"]');if(el)el.focus()}return}
  if(a==='assign-me'){e.stopPropagation();const who=S.role==='tech'?'p3':'p2';assigned[v]=who;S.drawer=null;render();toast(`${v} assigned to ${S.role==='tech'?'you':'Marcus Oyelaran'}`);return}
  if(a==='toast'){toast(v);return}
  if(a==='nav-open'){document.body.classList.add('nav-open');return}
  if(a==='nav-close'){document.body.classList.remove('nav-open');return}
  if(a==='pop'){S.pop=S.pop===v?null:v;render();return}
  if(a==='mock'){S.mockOpen=!S.mockOpen;render();return}
  if(a==='refresh'){S.mode='loading';render();setTimeout(()=>{S.mode='live';render();toast('Dashboard refreshed')},700);return}
  if(a==='tab'){S.tab=v;S.showAll=false;}
  else if(a==='list'){S.list=S.list===v&&false?v:v;sortDefault()}
  else if(a==='sort'){S.sort=S.sort.k===v?{k:v,d:-S.sort.d}:{k:v,d:1}}
  else if(a==='show-all'){S.showAll=!S.showAll}
  else if(a==='feed-more'){S.feedN=S.feedN>6?6:12}
  else if(a==='period'){S.period=+v}
  else if(a==='clear'){S.client='';S.matter='';S.type=''}
  else if(a==='pick-client'){S.client=S.client===v?'':v;S.matter=''}
  else if(a==='pick-matter'){if(S.matter===v)S.matter='';else{S.matter=v;S.client=mById[v].client}}
  else if(a==='btab'){S.bTab=v}
  else if(a==='msort'){S.mSort=S.mSort.k===v?{k:v,d:-S.mSort.d}:{k:v,d:v==='matter'||v==='next'||v==='health'?1:-1}}
  else if(a==='m-all'){S.mAll=!S.mAll}
  else if(a==='c-all'){S.cAll=!S.cAll}
  else if(a==='kpi'){S.list=v;sortDefault();S.opt='C'}
  else if(a==='tr'){S.tr[v]=!S.tr[v]; if(!S.tr.created&&!S.tr.completed)S.tr[v==='created'?'completed':'created']=true}
  else if(a==='bd'){S.bd=v}
  else if(a==='bd-pick'){if(b.dataset.key==='type'){S.type=v;toast('Filtered to task type: '+v)}else{toast('Would open Tasks filtered to priority '+v)}}
  else if(a==='sw-done'){S.sw.hideDone=v==='hide'}
  else if(a==='sw-more'){S.sw.more[v]=!S.sw.more[v]}
  else if(a==='us-view'){S.us.view=v}
  else if(a==='us-mode'){S.us.mode=v}
  else if(a==='more-f'){S.moreF=!S.moreF}
  else return;
  S.pop=null;render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.name==='opt'){S.opt=t.value;S.tab='summary';render();return}
  if(t.name==='state'){S.mode=t.value;render();return}
  if(t.name==='role'){S.role=t.value;S.tab='summary';S.list=t.value==='tech'?'unassigned':'overdue';sortDefault();render();return}
  const s=t.dataset&&t.dataset.sel; if(!s)return;
  if(s==='client'){S.client=t.value;if(S.matter&&S.client&&mById[S.matter].client!==S.client)S.matter=''}
  else if(s==='matter'){S.matter=t.value;if(S.matter)S.client=mById[S.matter].client}
  else if(s==='type'){S.type=t.value}
  else if(s==='swho'){S.sw.who=t.value}
  else if(s==='usort'){S.us.sort=t.value}
  else if(s==='uav'){S.us.avail=t.value}
  render();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(S.drawer){S.drawer=null;render();if(lastFocus){const el=document.querySelector('[data-k="'+lastFocus+'"]');if(el)el.focus()}} else if(S.pop){S.pop=null;render()} else if(S.mockOpen){S.mockOpen=false;render();$('#mbtn').focus()} else document.body.classList.remove('nav-open') }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#q').focus()}
  const tb=e.target.closest&&e.target.closest('[role=tab]');
  if(tb&&(e.key==='ArrowRight'||e.key==='ArrowLeft'||e.key==='Home'||e.key==='End')){e.preventDefault();const i=TABS.findIndex(t=>t[0]===S.tab);const n=e.key==='Home'?0:e.key==='End'?TABS.length-1:(i+(e.key==='ArrowRight'?1:-1)+TABS.length)%TABS.length;S.tab=TABS[n][0];render();$('#tab-'+S.tab).focus()}
  if(e.key==='Tab'&&S.drawer){const f=[...document.querySelectorAll('.drawer button')];if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
});
document.addEventListener('input',e=>{
  if(e.target.id!=='q')return;
  const q=e.target.value.trim().toLowerCase(),box=$('#sres');
  if(!q){box.classList.add('hidden');return}
  const r=[...matters.filter(m=>m.name.toLowerCase().includes(q)).map(m=>({k:'m',m,t:m.name,s:'Matter '+m.ref})),...tasks.filter(t=>t.title.toLowerCase().includes(q)||t.id.toLowerCase().includes(q)).slice(0,5).map(t=>({k:'t',t:t.title,s:t.id,id:t.id}))].slice(0,6);
  box.innerHTML=r.length?`<div class="hd">Results</div>`+r.map(x=>`<button class="it" data-act="${x.k==='m'?'pick-matter':'open-task'}" data-val="${x.k==='m'?x.m.id:x.id}">${ic(x.k==='m'?'briefcase':'list')}<span>${esc(x.t)}<br><small class="nrm">${esc(x.s)}</small></span></button>`).join(''):'<div class="hd">No results</div>';
  box.classList.remove('hidden');
});
document.addEventListener('focusout',e=>{const box=$('#sres');if(box&&!e.relatedTarget&&e.target.id==='q'){setTimeout(()=>box.classList.add('hidden'),150)}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(drawCharts,120)});
hash();renderNav();sortDefault();if(S.role==='tech'){S.list='unassigned';sortDefault()}render();
})();
</script>
</body>
</html>
