/* ===== docs/ux/tokens.css (inlined, unchanged) ===== */
/* MatterFlow design tokens (light theme, Phase 1). Contrast ratios noted are against --mf-surface (#FFFFFF) unless stated. */
:root {
  /* Neutrals */
  --mf-bg: #f5f6f8; /* app background */
  --mf-surface: #ffffff; /* cards, tables */
  --mf-surface-alt: #eef0f4; /* table header, zebra hover */
  --mf-row-hover: #eaf0fb; /* the row under the pointer in every grid (MD-28); text 4.5:1 and links checked on it, never the only signal of selection or focus */
  --mf-border: #c9ced8; /* 1.7:1 decorative borders only */
  --mf-border-strong: #6b7280; /* 4.8:1 input borders (WCAG 1.4.11 >=3:1) */
  --mf-text: #1b1f27; /* 16.0:1 */
  --mf-text-muted: #4b5563; /* 7.6:1 */
  --mf-text-disabled: #6b7280; /* 4.8:1 (disabled text exempt, kept legible) */
  /* Brand / interactive */
  --mf-primary: #1f4e9c; /* 7.9:1 on white; white text on it 7.9:1 */
  --mf-primary-hover: #173c79;
  --mf-link: #1f4e9c;
  --mf-focus: #b45309; /* focus ring colour, 2px solid + 2px offset; >=3:1 on bg and surface */
  --mf-selected-bg: #e3ecfa;
  /* Navigation panel (MM-43 #939, MM-58 #950): dark navy, clearly apart from the page (--mf-bg) and the header (--mf-surface); light text and
     icons. Contrast (WCAG 1.4.3) on --mf-nav-bg #1A3556: text 10.9:1, muted text (headings, version) 7.0:1, hover text on #2B4B75 7.8:1
     (muted 5.0:1), selected text #17324F on the white pill 13.1:1, focus ring #FFC15A 7.7:1 (5.5:1 on hover; needs 3:1). The selected item is a
     white pill (rounded square in the rail) with bold type, never colour alone and never a thick border. The pending badge keeps its red with a
     white ring. Dark theme values: see the [data-theme="dark"] block below (the app has no dark theme yet). */
  --mf-nav-bg: #1a3556;
  --mf-nav-text: #eaf1fa;
  --mf-nav-text-muted: #b4c3d8;
  --mf-nav-hover-bg: #2b4b75;
  --mf-nav-selected-bg: #ffffff;
  --mf-nav-selected-fg: #17324f;
  --mf-nav-border: #3e5c86;
  --mf-nav-focus: #ffc15a;
  /* Feedback */
  --mf-danger: #b42318;
  --mf-danger-bg: #fdecea;
  --mf-warning: #8a4b00;
  --mf-warning-bg: #fff4db;
  --mf-success: #146c2e;
  --mf-success-bg: #e5f5ea;
  --mf-info: #1f4e9c;
  --mf-info-bg: #e3ecfa;
  /* Status badges (text / bg / border) */
  /* Priority badges: default set; admin may override colour but must pass 4.5:1 (validated in designer) */
  --mf-pr-critical-fg: #ffffff;
  --mf-pr-critical-bg: #b42318;
  --mf-pr-high-fg: #5c2e00;
  --mf-pr-high-bg: #ffd9a8;
  --mf-pr-normal-fg: #1b1f27;
  --mf-pr-normal-bg: #e3e7ee;
  --mf-pr-low-fg: #3b4350;
  --mf-pr-low-bg: #f1f3f6;
  /* Due */
  --mf-due-overdue: #b42318;
  --mf-due-soon: #8a4b00;
  --mf-asap: #1f4e9c;
  /* Typography */
  --mf-font:
    "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mf-font-mono:
    Consolas, "Cascadia Mono", monospace; /* matter numbers, task refs */
  --mf-fs-xs: 12px;
  --mf-fs-sm: 13px;
  --mf-fs-md: 14px;
  --mf-fs-lg: 16px;
  --mf-fs-h3: 18px;
  --mf-fs-h2: 22px;
  --mf-fs-h1: 28px;
  --mf-lh: 1.45;
  /* Spacing (4px base) */
  --mf-s1: 4px;
  --mf-s2: 8px;
  --mf-s3: 12px;
  --mf-s4: 16px;
  --mf-s5: 24px;
  --mf-s6: 32px;
  --mf-s7: 48px;
  --mf-radius: 4px;
  --mf-radius-lg: 8px;
  --mf-row-h: 40px;
  --mf-row-h-compact: 32px;
  --mf-target-min: 24px; /* WCAG 2.2 target size, exceeds 2.1 */
  /* Work grid (mf-task-table: Task Queue, My Work, Pod Work, Matter and Project task lists; ux-spec 5.2). These are the documented
     numbers; the grid's styles (task-table.scss, src/styles/_tables.scss) carry them as literals, so change both together.
     --mf-row-h above is for generic tables and pickers, not the work grid. */
  --mf-grid-row-h: 44px; /* Comfortable row, exact, in every state (2 px padding, 1 px line, at most 39 px of content) */
  --mf-grid-row-h-compact: 36px; /* Compact row, exact, one line per cell */
  --mf-grid-line-h: 18px; /* the two-line cells (Title, Due): two lines are 36 px */
  --mf-grid-head-h: 40px; /* header row and inline filter row */
  --mf-grid-group-h: 36px; /* Due-sort divider rows, both densities */
  /* Work grid column widths in CSS px at the default zoom (the grid applies them in rem at the app's 14 px root, so text zoom scales them).
     -w default, -min and -max a user may resize to (columns panel, header menu, drag). The Title is the spring: no width, 160 px minimum,
     never stored. A unit test (column-prefs.spec.ts) keeps these equal to WORK_COLUMNS in column-prefs.ts. */
  --mf-col-ref-w: 112px;
  --mf-col-ref-min: 80px;
  --mf-col-ref-max: 120px;
  --mf-col-matter-w: 142px;
  --mf-col-matter-min: 112px;
  --mf-col-matter-max: 320px;
  --mf-col-onHoldReason-w: 176px;
  --mf-col-onHoldReason-min: 120px;
  --mf-col-onHoldReason-max: 280px;
  --mf-col-matterName-w: 160px;
  --mf-col-matterName-min: 112px;
  --mf-col-matterName-max: 360px;
  --mf-col-client-w: 140px;
  --mf-col-client-min: 96px;
  --mf-col-client-max: 280px;
  --mf-col-project-w: 140px;
  --mf-col-project-min: 96px;
  --mf-col-project-max: 280px;
  --mf-col-type-w: 112px;
  --mf-col-type-min: 96px;
  --mf-col-type-max: 260px;
  --mf-col-workflow-w: 150px;
  --mf-col-workflow-min: 96px;
  --mf-col-workflow-max: 280px;
  --mf-col-progress-w: 120px;
  --mf-col-progress-min: 120px;
  --mf-col-progress-max: 320px;
  --mf-col-priority-w: 112px;
  --mf-col-priority-min: 96px;
  --mf-col-priority-max: 160px;
  --mf-col-pod-w: 140px;
  --mf-col-pod-min: 96px;
  --mf-col-pod-max: 280px;
  --mf-col-assignee-w: 136px;
  --mf-col-assignee-min: 112px;
  --mf-col-assignee-max: 240px;
  --mf-col-creator-w: 140px;
  --mf-col-creator-min: 96px;
  --mf-col-creator-max: 280px;
  --mf-col-requestor-w: 140px;
  --mf-col-requestor-min: 96px;
  --mf-col-requestor-max: 280px;
  --mf-col-due-w: 136px;
  --mf-col-due-min: 120px;
  --mf-col-due-max: 200px;
  --mf-col-status-w: 140px;
  --mf-col-status-min: 112px;
  --mf-col-status-max: 200px;
  --mf-col-closed-w: 104px;
  --mf-col-closed-min: 88px;
  --mf-col-closed-max: 160px;
  --mf-col-age-w: 64px;
  --mf-col-age-min: 56px;
  --mf-col-age-max: 100px;
  --mf-col-created-w: 104px;
  --mf-col-created-min: 88px;
  --mf-col-created-max: 160px;
  --mf-col-updated-w: 120px;
  --mf-col-updated-min: 96px;
  --mf-col-updated-max: 180px;
  --mf-col-title-min: 160px;
  --mf-col-assignee-pod-work-w: 216px; /* Assignee on Pod Work, where "Assign to me" shares the cell */
  --mf-narrow-title-min: 200px; /* the narrow-box rule: autoHide columns drop out while the Title would be narrower than this */
  /* Clients, Matters and Projects (epic #245, ux-spec 5.9 and S05 to S07): NO token was added. The record pages and lists are built on the
     tokens above. Numbers they rely on: record lists use the Comfortable work-grid row height (grid-row-h, 44px, in page.scss for .pg-table);
     the record header title is the H2 size (fs-h2, 22px) and the H3 size (fs-h3, 18px) below 640px; the crumb is fs-sm (13px); the
     Sensitive note is one 32px line; the summary strip is 28px plus 8px of margin; a phone card is at least 64px; copy button and count
     hit areas on a card are 44px; every other target is at least target-min (24px). Phone breakpoint 640px (639px is cards, 640px is the
     table); the Matters Client column shows from 900px and the Projects Client column from 1100px. These are literals in the component
     styles (record-header.scss, record-card-list.scss, client-overview.scss), like the work grid's, so change docs and styles together. */
  /* Task page (Task Detail epic #288, ux-spec S10 and S09): NO token was added. The page is built on the tokens above. Numbers it relies on:
     the facts strip (src/styles/_facts-strip.scss, mf-task-facts and its skeleton) is one rounded box of six tiles with 1px dividers drawn by
     the gap over --mf-border: six across from 1100px, three by two from 640px, two by three below; a tile is at least 54px tall (label
     fs-xs, value fs-md semibold); the title is the H2 size (22px, 18px below 640px) in the shared record header (--rh-fs); the Task tab strip
     is dense (2.5rem tabs, 4px below, #347); the Details panel and its disclosure switch at 1100px
     (DETAIL_WIDE_QUERY); the Workflow head is one row of at most 56px; the Description is cut at 12 lines (line height 1.4); the Edit dialog
     is 720px wide; the Create task column is 720px with one input width, --mf-field-max (default 480px for every other form). Status and
     Hold colours follow section T of the decisions addendum (grey, never a warning colour, for the status note). Phone breakpoint 640px.
     These are literals in the component styles, like the work grid's, so change docs and styles together. */
  --mf-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.12);
  --mf-shadow-2: 0 4px 16px rgba(0, 0, 0, 0.18);
}
/* ==========================================================================================================================================
   UI update (epic #953, UI-01 #954): the shared theme layer, "option A" of the owner decision: ONE set of tokens in code that every component
   reads. Three layers, so a theme editor or a dark theme can later change values without touching a component:
     1. Palette   --mf-p-<hue>[-bg|-solid|-line]     raw hues; only this layer and the neutrals above hold hex values.
     2. Semantic  --mf-sem-<meaning>-*               what a colour MEANS (overdue, at risk, info, healthy, needs a person, critical, neutral).
     3. Component --mf-status-*, --mf-event-*, --mf-nav-*, --mf-chip-*   the look of one thing; they point at layer 2 or 1 with var().
   Components use layers 2 and 3 (or the neutrals/feedback tokens above); a component never contains a colour literal (checked by
   frontend/scripts/check-theme-colours.mjs; contrast of every pairing below checked by check-theme-contrast.mjs). No dark theme and no editor yet.
   Guide, contrast table and the "change one token" example: docs/ux/theme-guide.md.
   ========================================================================================================================================== */
:root {
  /* 1. Palette. For each hue: text colour on its tint (-fg, 4.5:1 or better), the tint (-bg), a solid for dots, bars and icons on white
     (-solid, 3:1 or better) and a hairline (-line, decorative). */
  --mf-p-red-fg: #b42318;
  --mf-p-red-bg: #fdecea;
  --mf-p-red-solid: #c62828;
  --mf-p-red-line: #f4c7c2;
  --mf-p-amber-fg: #8a4b00;
  --mf-p-amber-bg: #fff4db;
  --mf-p-amber-solid: #b45309;
  --mf-p-amber-line: #f1d9a0;
  --mf-p-blue-fg: #1f4e9c;
  --mf-p-blue-bg: #e3ecfa;
  --mf-p-blue-solid: #1f4e9c;
  --mf-p-blue-line: #c3d5f2;
  --mf-p-teal-fg: #0b6b5f;
  --mf-p-teal-bg: #ddf3ef;
  --mf-p-teal-solid: #0f766e;
  --mf-p-teal-line: #b5e0d9;
  --mf-p-violet-fg: #5b3fa6;
  --mf-p-violet-bg: #efeafb;
  --mf-p-violet-solid: #6d4bc2;
  --mf-p-violet-line: #d6cbf1;
  --mf-p-orange-fg: #9a3a06;
  --mf-p-orange-bg: #fdebdc;
  --mf-p-orange-solid: #c2410c;
  --mf-p-orange-line: #f5cdae;
  --mf-p-slate-fg: #475569;
  --mf-p-slate-bg: #eef1f5;
  --mf-p-slate-solid: #475569;
  --mf-p-slate-line: #cbd2dc;

  /* 2. Semantic colours (what the colour says). Red = overdue, amber = at risk, blue = information, teal = healthy / done, violet = needs a
     person, deep orange = critical, slate = neutral. Colour is never the only signal: the UI always adds an icon or a word. */
  --mf-sem-overdue-fg: var(--mf-p-red-fg);
  --mf-sem-overdue-bg: var(--mf-p-red-bg);
  --mf-sem-overdue-solid: var(--mf-p-red-solid);
  --mf-sem-overdue-line: var(--mf-p-red-line);
  --mf-sem-risk-fg: var(--mf-p-amber-fg);
  --mf-sem-risk-bg: var(--mf-p-amber-bg);
  --mf-sem-risk-solid: var(--mf-p-amber-solid);
  --mf-sem-risk-line: var(--mf-p-amber-line);
  --mf-sem-info-fg: var(--mf-p-blue-fg);
  --mf-sem-info-bg: var(--mf-p-blue-bg);
  --mf-sem-info-solid: var(--mf-p-blue-solid);
  --mf-sem-info-line: var(--mf-p-blue-line);
  --mf-sem-healthy-fg: var(--mf-p-teal-fg);
  --mf-sem-healthy-bg: var(--mf-p-teal-bg);
  --mf-sem-healthy-solid: var(--mf-p-teal-solid);
  --mf-sem-healthy-line: var(--mf-p-teal-line);
  /* Note tag chips (MD-36, #1049): a light tint of the colour, dark text and a solid dot. The same ten colours as the Task Type palette. */
  --mf-tag-slate-bg: #e3e7ee;
  --mf-tag-slate-fg: #2f3846;
  --mf-tag-slate-dot: #5b6678;
  --mf-tag-blue-bg: #dce8fb;
  --mf-tag-blue-fg: #173c79;
  --mf-tag-blue-dot: #2b66c4;
  --mf-tag-teal-bg: #d5f0ee;
  --mf-tag-teal-fg: #0b4f4a;
  --mf-tag-teal-dot: #0a7d72;
  --mf-tag-green-bg: #ddf1e2;
  --mf-tag-green-fg: #14532d;
  --mf-tag-green-dot: #1f7a3a;
  --mf-tag-amber-bg: #fdebb8;
  --mf-tag-amber-fg: #5c3b00;
  --mf-tag-amber-dot: #a8590a;
  --mf-tag-orange-bg: #ffe0cc;
  --mf-tag-orange-fg: #6b2a00;
  --mf-tag-orange-dot: #b8400c;
  --mf-tag-red-bg: #fbdad6;
  --mf-tag-red-fg: #7a1b12;
  --mf-tag-red-dot: #c62828;
  --mf-tag-rose-bg: #fadcea;
  --mf-tag-rose-fg: #7a1546;
  --mf-tag-rose-dot: #bf1a5a;
  --mf-tag-violet-bg: #e9e0fa;
  --mf-tag-violet-fg: #45248a;
  --mf-tag-violet-dot: #6a45c0;
  --mf-tag-indigo-bg: #dfe3fa;
  --mf-tag-indigo-fg: #2a2f85;
  --mf-tag-indigo-dot: #4650c0;
  --mf-tag-neutral-bg: #eef0f4;
  --mf-tag-neutral-fg: #3b4350;
  --mf-tag-neutral-dot: #5b6678;
  /* Note text colours (MD-30, #1034): the fixed palette of the Notes editor; each is dark enough for 4.5:1 on a card and on the quote tint. */
  --mf-note-red: var(--mf-p-red-fg);
  --mf-note-orange: var(--mf-p-orange-fg);
  --mf-note-amber: var(--mf-p-amber-fg);
  --mf-note-green: #146c2e;
  --mf-note-teal: var(--mf-p-teal-fg);
  --mf-note-blue: var(--mf-p-blue-fg);
  --mf-note-violet: var(--mf-p-violet-fg);
  --mf-note-slate: var(--mf-p-slate-fg);
  --mf-sem-person-fg: var(--mf-p-violet-fg);
  --mf-sem-person-bg: var(--mf-p-violet-bg);
  --mf-sem-person-solid: var(--mf-p-violet-solid);
  --mf-sem-person-line: var(--mf-p-violet-line);
  --mf-sem-critical-fg: var(--mf-p-orange-fg);
  --mf-sem-critical-bg: var(--mf-p-orange-bg);
  --mf-sem-critical-solid: var(--mf-p-orange-solid);
  --mf-sem-critical-line: var(--mf-p-orange-line);
  --mf-sem-neutral-fg: var(--mf-p-slate-fg);
  --mf-sem-neutral-bg: var(--mf-p-slate-bg);
  --mf-sem-neutral-solid: var(--mf-p-slate-solid);
  --mf-sem-neutral-line: var(--mf-p-slate-line);
  --mf-border-soft: #d5d9e1; /* hairlines inside cards (decorative) */
  --mf-border-mid: #c0c6d1; /* control and chip outlines that are not the only cue */

  /* 3a. Task status (New, In Progress, On Hold, Completed, Cancelled) as used by the new My Matters and every converted page.
     fg / bg / line per status. (The older old-st-* tokens were retired in TH-13, #995.) */
  --mf-status-new-fg: #2b4a78;
  --mf-status-new-bg: #ffffff;
  --mf-status-new-line: #8ea2c2;
  --mf-status-progress-fg: var(--mf-sem-info-fg);
  --mf-status-progress-bg: var(--mf-sem-info-bg);
  --mf-status-progress-line: var(--mf-sem-info-line);
  --mf-status-hold-fg: var(--mf-sem-neutral-fg);
  --mf-status-hold-bg: var(--mf-sem-neutral-bg);
  --mf-status-hold-line: var(--mf-sem-neutral-line);
  --mf-status-done-fg: var(--mf-sem-healthy-fg);
  --mf-status-done-bg: var(--mf-sem-healthy-bg);
  --mf-status-done-line: var(--mf-sem-healthy-line);
  --mf-status-cancel-fg: #374151;
  --mf-status-cancel-bg: #e5e7eb;
  --mf-status-cancel-line: #c9ced8;

  /* 3b. Calendar event types (8 fixed types; code list and icon keys come from the API, GET /matter-event-types): text/icon colour on its tint. */
  --mf-event-court-fg: #1e3a8a;
  --mf-event-court-bg: #e4e9f7;
  --mf-event-trial-fg: #86198f;
  --mf-event-trial-bg: #f6e4f8;
  --mf-event-deposition-fg: #0b627d;
  --mf-event-deposition-bg: #d9eff5;
  --mf-event-production-fg: #4d6310;
  --mf-event-production-bg: #e9f1ce;
  --mf-event-filing-fg: #a3194f;
  --mf-event-filing-bg: #fbe3ec;
  --mf-event-mediation-fg: #17683a;
  --mf-event-mediation-bg: #daf1e2;
  --mf-event-meeting-fg: #6b4600;
  --mf-event-meeting-bg: #f3e8cf;
  --mf-event-other-fg: var(--mf-sem-neutral-fg);
  --mf-event-other-bg: #e8ecf1;

  /* 3c. Navigation panel (colours are the ones above: --mf-nav-*). Geometry of the new menu: a 36 px row with 6 px corners, 19 px icons, 220 px panel,
     a 56 px rail. The selected item is a white 6 px rounded row with bold type, never a coloured left border. */
  --mf-nav-w: 220px;
  --mf-nav-rail-w: 56px;
  --mf-nav-item-h: 36px;
  --mf-nav-item-radius: var(--mf-radius-md); /* 6 px (SH-01, #1044) */
  --mf-nav-icon: 19px;
  --mf-nav-indent: 36px; /* Projects and Assets under Matters */
  --mf-nav-heading: #b4c3d8; /* ADMINISTRATION heading (same as --mf-nav-text-muted: 7.0:1 on the panel) */

  /* Radius scale. --mf-radius (4px) and --mf-radius-lg (8px) above stay. */
  --mf-radius-md: 6px;
  --mf-radius-xl: 12px;
  --mf-radius-pill: 999px;

  /* Type scale. Body 14 px (--mf-fs-md); page title 19 px on the fixed pages (My Matters), 22 px (--mf-fs-h2) on record pages. */
  --mf-fs-title: 19px;
  --mf-fs-title-lg: 22px;
  --mf-fs-chip: 12px;
  --mf-fw-semibold: 600;
  --mf-fw-bold: 700;

  /* Density: control and chip heights. A later "compact" density only changes these. */
  --mf-ctl-h: 36px;
  --mf-ctl-h-sm: 30px;
  --mf-chip-h: 26px;
  --mf-gutter: 16px; /* page gutter of the fixed pages */

  /* Shadows. --mf-shadow-1 and --mf-shadow-2 above stay. */
  --mf-shadow-card:
    0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.06);
  --mf-shadow-pop:
    0 12px 32px rgba(16, 24, 40, 0.18), 0 2px 6px rgba(16, 24, 40, 0.1);

  /* Focus ring (WCAG 2.4.7 / 1.4.11): 2px solid, 2px offset; --mf-focus on the page, --mf-nav-focus on the navy panel. */
  --mf-focus-width: 2px;
  --mf-focus-offset: 2px;

  /* PrimeNG toasts (the preset reads these; values as before). */
  --mf-toast-success-bg: #e6f4ea;
  --mf-toast-success-border: #9ed2ad;
  --mf-toast-success-fg: #14532d;
  --mf-toast-success-hover: #cde9d5;
  --mf-toast-info-bg: #e3ecfa;
  --mf-toast-info-border: #9db9e6;
  --mf-toast-info-fg: #173c79;
  --mf-toast-info-hover: #c5d6f2;
  --mf-toast-warn-bg: #fef3c7;
  --mf-toast-warn-border: #ebc663;
  --mf-toast-warn-fg: #78350f;
  --mf-toast-warn-hover: #fce79a;
  --mf-toast-error-bg: #fdecea;
  --mf-toast-error-border: #f4b6ae;
  --mf-toast-error-fg: #7f1710;
  --mf-toast-error-hover: #fadbd7;
  --mf-toast-detail: #1b1f27;

.rec .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:row dense;gap:10px 28px;margin:0;padding:var(--mf-s1) 0 0}
.rec .fd{min-width:0;min-height:42px}
.rec .fd.c1{grid-column:1}.rec .fd.c2{grid-column:2}
.rec .fl{margin:0;font-size:var(--mf-fs-xs);font-weight:600;line-height:16px;color:var(--mf-text-muted)}
.rec .fv{margin:2px 0 0;min-height:24px;display:flex;align-items:center;gap:var(--mf-s2);line-height:20px;min-width:0}
.rec .fv>span:not(.bd):not(.av){min-width:0;overflow-wrap:anywhere}
.rec .fv .grow{flex:1 1 auto}
.rec .fv .mf-btn--text{margin-block:-4px;margin-left:auto}
.rec .fv.long{align-items:flex-start;line-height:18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rec .dash{color:var(--mf-text-muted)}
.rec .cm{display:flex;align-items:center;gap:var(--mf-s2);height:42px;padding:0 var(--mf-s1) 0 var(--mf-s3);border-radius:var(--mf-radius-md);background:var(--mf-sem-info-bg);border:1px solid var(--mf-sem-info-line);min-width:0}
.rec .cm .fl{color:var(--mf-sem-info-fg);margin:0;white-space:nowrap}
.rec .cm .num{font-family:var(--mf-font-mono);font-size:var(--mf-fs-lg);font-weight:700;color:var(--mf-text);white-space:nowrap}
.rec .cm .copy{margin-left:auto;color:var(--mf-sem-info-fg)}
.rec .cm .copy:hover{background:#fff}
@container c (max-width:560px){.rec .fields{grid-template-columns:minmax(0,1fr)}.rec .fd.c1,.rec .fd.c2{grid-column:auto}}
.rec .feed{margin:0;padding:0;list-style:none}
.rec .feed li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--mf-border-soft);min-height:52px}
.rec .feed li:first-child{border-top:0}
.rec .ki{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--kb);color:var(--kf);border:1px solid var(--kl)}
.rec .ki svg.i{width:15px;height:15px}
.k-info{--kb:var(--mf-sem-info-bg);--kf:var(--mf-sem-info-fg);--kl:var(--mf-sem-info-line)}
.k-ok{--kb:var(--mf-sem-healthy-bg);--kf:var(--mf-sem-healthy-fg);--kl:var(--mf-sem-healthy-line)}
.k-neutral{--kb:var(--mf-sem-neutral-bg);--kf:var(--mf-sem-neutral-fg);--kl:var(--mf-sem-neutral-line)}
.k-person{--kb:var(--mf-sem-person-bg);--kf:var(--mf-sem-person-fg);--kl:var(--mf-sem-person-line)}
.k-crit{--kb:var(--mf-sem-critical-bg);--kf:var(--mf-sem-critical-fg);--kl:var(--mf-sem-critical-line)}
.rec .what{margin:0;line-height:20px;overflow-wrap:anywhere}
.rec .who{display:flex;align-items:center;gap:6px;margin-top:2px;color:var(--mf-text-muted);font-size:var(--mf-fs-sm);line-height:18px;min-width:0}
.rec .who .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--mf-text)}
.rec .who .nm.rawn{font-family:var(--mf-font-mono);font-size:12px}
.rec .who time{white-space:nowrap}
.rec .cf{display:flex;align-items:center;justify-content:space-between;gap:var(--mf-s2);padding:4px var(--mf-s3) var(--mf-s2);border-top:1px solid var(--mf-border-soft);flex:none}
.rec .cf .note{font-size:var(--mf-fs-xs)}
.rec .scroll.pad0{padding-bottom:var(--mf-s2)}

/* narrow or short windows: the page scrolls and cards are plain (as the app does below 768 px or 561 px high) */
@container fr (max-width:999.98px) or (max-height:560.98px){
  .main{display:block;overflow:auto}
  .main>.tabpanel{min-height:auto}
  .tabpanel{display:block}
  .tabpanel>*+*{margin-top:var(--mf-s3)}
  .before .grid,.rec .grid{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-auto-rows:auto}
  .rec .card{max-height:none}
  .scroll{overflow:visible}
  .before .side>.card{flex:none}
}
@container fr (max-width:999.98px){
  .shell{grid-template-columns:56px minmax(0,1fr)}
  .nav{padding:12px 8px 0}
  .nav a{padding:0;justify-content:center;font-size:0;gap:0}
  .nav a.ind{padding-left:0}
  .nav h2,.nav .ver{display:none}
  .brand span{display:none}.brand{width:auto}
  .top{padding:0 12px;gap:10px}
  .main{padding:12px 16px}
  .gsearch{flex-basis:200px}
}
@container fr (max-width:639.98px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .nav{display:none}
  .burger{display:block}
  .gsearch,.user .meta{display:none}
  .main{padding:12px 16px}
  .mh__title{font-size:var(--mf-fs-h3)}
  .tabs button{padding:10px 12px;font-size:14px}
  .mh__actions{width:100%}
  .rec .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}


/* short desktop windows (for example 1366x600): tighter spacing so the inner regions get more room */
@container fr (max-height:700px) and (min-width:1000px){
  .main{padding-top:8px;padding-bottom:8px}
  .mh{margin-bottom:4px}
  .rec .mh__note{margin-top:4px;padding:2px 10px}
  .tabs{margin-top:4px}.tabs button{padding:6px 14px}
  .tabpanel{gap:8px;padding-top:8px}
  .ch{padding:8px 12px 4px}
  .rec .tile{min-height:36px;padding:3px 12px}.rec .tchip{width:28px;height:28px}
  .rec .fields{gap:6px 28px}.rec .fd,.rec .cm{min-height:38px}.rec .cm{height:38px}
  .rec .feed li{padding:6px 0;min-height:46px}
  .rec .cf{padding-top:2px}
}

/* ---- dialog ---- */
#overlay{position:absolute;inset:0;z-index:200;display:grid;place-items:center;background:rgba(16,24,40,.45);padding:12px}
#overlay[hidden]{display:none}
.dlg{background:#fff;border-radius:var(--mf-radius-xl);box-shadow:var(--mf-shadow-pop);width:576px;max-width:100%;max-height:90%;display:flex;flex-direction:column}
.dlg.small{width:416px}
.dlg header{padding:14px 16px 8px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.dlg h2{margin:0;font-size:var(--mf-fs-h3)}
.dlg .sub{color:var(--mf-text-muted);font-size:var(--mf-fs-sm)}
.dlg .body{padding:4px 16px 12px;overflow:auto;display:grid;gap:10px}
.dlg label{display:grid;gap:3px;font-weight:600;font-size:var(--mf-fs-sm)}
.dlg input,.dlg select{height:36px;border:1px solid var(--mf-border-strong);border-radius:6px;padding:0 10px;background:#fff;font-weight:400}
.dlg input:disabled{background:var(--mf-surface-alt);color:var(--mf-text-muted)}
.dlg footer{display:flex;justify-content:space-between;gap:8px;padding:10px 16px;border-top:1px solid var(--mf-border-soft)}
@container fr (max-width:639.98px){.dlg{width:100%;max-height:100%;height:100%;border-radius:0}#overlay{padding:0}}

var MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function p2(n){ return (n<10?'0':'')+n; }
function clock12(d,lead){ var h=d.getHours(),ap=h>=12?'PM':'AM'; h=h%12||12; return (lead?p2(h):h)+':'+p2(d.getMinutes())+' '+ap; }
function dayGap(d){ var a=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()), b=new Date(d.getFullYear(),d.getMonth(),d.getDate()); return Math.round((a-b)/864e5); }
/* today's formats (mfDate and activityTime) */
function oldStamp(d){ return MONS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear()+', '+clock12(d,false)+' EST'; }
function oldWhen(d){ var g=dayGap(d); if(g<=0) return clock12(d,false); return g===1?'Yesterday':MONS[d.getMonth()]+' '+d.getDate(); }
/* recommended: My Matters numeric style (theme guide 8): MM/DD hh:mm AM/PM, year only when it is not the current year */
function numDay(d){ return p2(d.getMonth()+1)+'/'+p2(d.getDate())+(d.getFullYear()!==NOW.getFullYear()?'/'+d.getFullYear():''); }
function numWhen(d){ var g=dayGap(d); var c=clock12(d,true); if(g<=0) return 'Today '+c; if(g===1) return 'Yesterday '+c; return numDay(d)+' '+c; }
function numFull(d){ return p2(d.getMonth()+1)+'/'+p2(d.getDate())+'/'+d.getFullYear()+' '+clock12(d,true); }
function readable(d){ return MON[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear()+', '+clock12(d,false)+' Eastern Standard Time'; }

/* ===================== window size ===================== */
function fit(){
 var st=document.getElementById('stage'), fr=document.getElementById('frame'), lab=document.getElementById('sizelabel');
 if(window.__TB==='0') document.getElementById('mockbar').style.display='none';
 if(S.size==='win'){ st.className='win'; fr.style.cssText=''; lab.textContent=''; return; }
 var wh=S.size.split('x').map(Number), W=wh[0], H=wh[1];
 st.className='sized'; fr.style.width=W+'px'; fr.style.height=H+'px';
 var aw=window.innerWidth-24, ah=window.innerHeight-56;
 var s=Math.min(1,aw/W,ah/H);
 fr.style.transform='translate('+Math.round((window.innerWidth-W*s)/2)+'px,48px) scale('+s+')';
 lab.textContent=W+' x '+H+(s<1?' (shown at '+Math.round(s*100)+'%)':'');
}
window.addEventListener('resize',fit);

 lastFocus=document.activeElement;
 var o=document.getElementById('overlay');
 o.innerHTML='<div class="dlg'+(small?' small':'')+'" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><header><div><h2 id="dlg-t">'+title+'</h2>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div><button type="button" class="mf-btn mf-btn--icon mf-btn--text" data-act="closedlg" aria-label="Close">'+ic('i-x')+'</button></header><div class="body">'+body+'</div><footer><button type="button" class="mf-btn" data-act="closedlg">Cancel</button><button type="button" class="mf-btn mf-btn--primary" data-act="savedlg">Save</button></footer></div>';
 o.hidden=false; var f=o.querySelector('input:not([disabled]),select'); if(f) f.focus();
}
function closeDlg(){ var o=document.getElementById('overlay'); o.hidden=true; o.innerHTML=''; if(lastFocus&&lastFocus.focus) try{lastFocus.focus();}catch(e){} }
function opt(list,sel){ return list.map(function(x){return '<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>';}).join(''); }
function editDialog(){
 var b='<label>Client<input disabled value="'+M.clientNo+' '+esc(M.client)+'"></label><label>Matter number<input value="'+M.no+'"></label><label>Matter name<input value="'+esc(M.name)+'"></label>'
  +'<label>Status<select>'+opt(['Active','Inactive'],'Active')+'</select></label><label>Sensitive<select>'+opt(['No','Yes'],S.sens==='1'?'Yes':'No')+'</select></label>'
  +'<label>AI allowed<select>'+opt(['No','On-prem AI only','Company-approved AI services'],AIL[S.ai][0])+'</select></label>';
 customFields().forEach(function(f){ b+='<label>'+esc(f[0])+'<input value="'+(f[1]==null?'':esc(f[1]))+'"></label>'; });
 dialog('Edit Matter','CM number '+M.ref,b,false);
}
function pmDialog(){
 var names=[nm(P.A),nm(P.B),'Test User 27','None'];
 dialog('Change Project Managers','CM number '+M.ref,'<label>Primary PM<select>'+opt(names,nm(P.A))+'</select></label><label>Secondary PM<select>'+opt(names,S.sec==='set'?nm(P.B):'None')+'</select></label>',true);
}
var tt=document.getElementById('tt'), ttEl=null;
function showTip(el){ var t=el.getAttribute('data-tip'); if(!t) return; ttEl=el; tt.textContent=t; tt.hidden=false; var r=el.getBoundingClientRect(), fr=document.getElementById('frame').getBoundingClientRect();
 var w=tt.offsetWidth,h=tt.offsetHeight, x=Math.max(8,Math.min(r.left+r.width/2-w/2,window.innerWidth-w-8)), y=r.top-h-6; if(y<8) y=r.bottom+6; tt.style.left=x+'px'; tt.style.top=y+'px'; }
function hideTip(){ tt.hidden=true; ttEl=null; }
document.addEventListener('mouseover',function(e){ var el=e.target.closest&&e.target.closest('[data-tip]'); if(el) showTip(el); else if(ttEl) hideTip(); });
document.addEventListener('focusin',function(e){ var el=e.target.closest&&e.target.closest('[data-tip]'); if(el) showTip(el); });
document.addEventListener('focusout',hideTip);
document.addEventListener('scroll',hideTip,true);

/* ===================== events ===================== */
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act],[data-set]'); if(!el) return;
 if(el.dataset.set){ S[el.dataset.set]=el.dataset.v; render(); return; }
 var a=el.dataset.act;
 if(a==='inert'){ e.preventDefault(); toast('Mockup: this link goes to another page.'); }
 else if(a==='toast') toast(el.dataset.v);
 else if(a==='tab'){ TAB=el.dataset.v; render(); var t=document.querySelector('[role=tab][aria-selected=true]'); if(t) t.focus(); }
 else if(a==='copy'){ navigator.clipboard&&navigator.clipboard.writeText(M.ref).catch(function(){}); el.classList.add('ok'); el.innerHTML=ic('i-check','sm'); toast('Copied '+M.ref); setTimeout(function(){ if(el.isConnected){ el.classList.remove('ok'); el.innerHTML=ic('i-copy','sm'); } },1500); }
 else if(a==='edit') editDialog();
 else if(a==='pm') pmDialog();
 else if(a==='closedlg') closeDlg();
 else if(a==='savedlg'){ closeDlg(); toast('Mockup: saved.'); }
 else if(a==='retry'){ S.load='ready'; render(); }
 else if(a==='reset'){ S=Object.assign({},DEF); render(); }
});
document.getElementById('tbbtn').addEventListener('click',function(){ setTB(!OPEN_TB); });
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'){ var o=document.getElementById('overlay'); if(!o.hidden) closeDlg(); else if(OPEN_TB){ setTB(false); document.getElementById('tbbtn').focus(); } }
 if(e.key==='Tab'){ var o2=document.getElementById('overlay'); if(!o2.hidden){ var f=o2.querySelectorAll('button,input:not([disabled]),select'); if(!f.length) return; var first=f[0],last=f[f.length-1]; if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();} else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();} } }
 var tl=e.target.closest&&e.target.closest('[role=tablist]');
 if(tl&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){ var ts=[].slice.call(tl.querySelectorAll('[role=tab]')); var i=ts.indexOf(document.activeElement); if(i<0) return; var n=ts[(i+(e.key==='ArrowRight'?1:ts.length-1))%ts.length]; TAB=n.dataset.v; render(); document.querySelector('[role=tab][aria-selected=true]').focus(); }
});
render();
if(window.__OPEN==='toolbox') setTB(true);
if(window.__OPEN==='edit') editDialog();
if(window.__OPEN==='pm') pmDialog();
})();

</script>
