<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes on a Matter - mockup r3 - LPT Hub</title>
<meta name="description" content="Mockup: a Notes entity under Matter (rich text, tags, tables, links, name mentions, last updated by) and the admin Notes Tags page. Mock data only.">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --alt:#EEF0F4; --soft:#F7F8FA; --border:#D5D9E1; --border-2:#C0C6D1; --border-strong:#6B7280;
  --text:#1B1F27; --muted:#4B5563; --faint:#6B7280;
  --primary:#1F4E9C; --primary-h:#173C79; --focus:#B45309;
  --nav:#1A3556; --nav-text:#EAF1FA; --nav-muted:#B4C3D8; --nav-hover:#2B4B75; --nav-sel-fg:#17324F; --nav-focus:#FFC15A;
  --red:#B42318; --red-bg:#FDECEA; --red-solid:#C62828;
  --amber:#8A4B00; --amber-bg:#FFF4DB; --amber-line:#F1D9A0;
  --blue:#1F4E9C; --blue-bg:#E3ECFA; --blue-line:#C3D5F2;
  --teal:#0B6B5F; --teal-bg:#DDF3EF;
  --green:#146C2E; --green-bg:#E5F5EA;
  --slate:#475569; --slate-bg:#EEF1F5;
  --mark:#FFE58F;
  --r:8px; --r-lg:12px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.06);
  --pop:0 12px 32px rgba(16,24,40,.18),0 2px 6px rgba(16,24,40,.1);
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:Consolas,"Cascadia Mono","SFMono-Regular",monospace;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;font:14px/1.45 var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px} svg.i.xs{width:14px;height:14px} svg.i.lg{width:22px;height:22px}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.nav :focus-visible{outline-color:var(--nav-focus)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:#fff;padding:8px 12px;border-radius:6px;z-index:200;border:1px solid var(--border)}
.skip:focus{top:8px}
[hidden]{display:none!important}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:56px minmax(0,1fr);height:100vh;height:100dvh}
.top{position:relative;z-index:90;grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border);min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:#1d4e89;width:196px;flex:none;letter-spacing:-.01em}
.brand svg{width:30px;height:30px;border-radius:8px}
.burger{display:none;border:0;background:none;padding:6px;border-radius:6px}
.search{flex:1 1 auto;max-width:640px;position:relative;min-width:0}
.search input{width:100%;height:36px;border:1px solid var(--border-strong);border-radius:6px;padding:0 12px 0 36px;background:#fff}
.search svg{position:absolute;left:11px;top:9px;color:var(--faint)}
.top .spacer{flex:1}
.bell{position:relative;border:0;background:none;padding:6px;border-radius:6px}
.bell b{position:absolute;top:-3px;right:-5px;background:var(--red-solid);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:2px solid #fff;line-height:1}
.user{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:4px 6px;border-radius:6px;min-width:0}
.user .nm{font-weight:600;line-height:1.2;display:block}
.user small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.av{width:30px;height:30px;border-radius:50%;background:var(--av-bg,var(--blue-bg));color:var(--av-fg,var(--primary));display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.av.sm{width:24px;height:24px;font-size:10px}
.av.md{width:32px;height:32px;font-size:12px}
.nav{background:var(--nav);color:var(--nav-text);padding:12px 12px 0;overflow:auto;display:flex;flex-direction:column}
.nav a{display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;border-radius:999px;color:var(--nav-text);text-decoration:none;font-size:14px;margin-bottom:1px;flex:none}
.nav a:hover{background:var(--nav-hover)}
.nav a.ind{padding-left:36px}
.nav a[aria-current=page]{background:#fff;color:var(--nav-sel-fg);font-weight:700}
.nav h2{font-size:11px;letter-spacing:.08em;color:var(--nav-muted);margin:14px 12px 6px;font-weight:600;border-top:1px solid #3E5C86;padding-top:12px}
.nav .ver{margin-top:auto;padding:12px;color:var(--nav-muted);font-size:12px;position:sticky;bottom:0;background:var(--nav)}
.scrim{display:none}
main{min-width:0;min-height:0;overflow:hidden;background:var(--bg)}
.page{height:100%;padding:20px 32px 16px;display:flex;flex-direction:column;gap:12px;max-width:1760px;margin:0 auto;min-height:0}
.page>*{flex:none;min-width:0}
.page>.grow{flex:1 1 0;min-height:0}
@media (max-height:800px) and (min-width:1001px){.nav a{height:32px}.nav h2{margin:10px 12px 4px;padding-top:10px}}
@media (max-height:560px) and (min-width:1001px){main{overflow:auto}.page{height:auto;min-height:100%}.page>.grow{min-height:420px}}

/* ---------- common bits ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--border-strong);background:#fff;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--alt)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-h)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger:hover{background:#8F1B12}
.btn.ghost{border-color:var(--border-2)}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn[disabled],.btn[aria-disabled=true]{opacity:1;background:#EEF0F4;border-color:var(--border-2);color:#6B7280;cursor:not-allowed}
.ibtn{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid transparent;border-radius:6px;background:none;color:var(--text)}
.ibtn:hover{background:var(--alt)}
.ibtn[aria-disabled=true]{color:#6B7280;cursor:default}
.ibtn[aria-disabled=true]:hover{background:none}
.ibtn[aria-pressed=true]{background:var(--blue-bg);color:var(--primary);border-color:var(--blue-line)}
.note{color:var(--muted);font-size:12.5px}
.mono{font-family:var(--mono)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px 2px 8px;font-size:12px;font-weight:700;line-height:18px;white-space:nowrap;border:0}
.pill svg{width:13px;height:13px}
.pill.teal{background:var(--teal-bg);color:var(--teal)}
.pill.slate{background:var(--slate-bg);color:var(--slate);box-shadow:inset 0 0 0 1px #CBD2DC}
.pill.blue{background:var(--blue-bg);color:var(--blue)}
.pill.amber{background:var(--amber-bg);color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber-line)}
.pill.green{background:var(--green-bg);color:var(--green)}
button.pill{cursor:pointer}
button.pill:hover{box-shadow:inset 0 0 0 2px currentColor}
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px 0 8px;border-radius:999px;background:var(--tb);color:var(--tf);font-size:12px;font-weight:600;white-space:nowrap;max-width:100%;line-height:1}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--tf);flex:none}
.tag span{overflow:hidden;text-overflow:ellipsis}
.tag.here{box-shadow:inset 0 0 0 1.5px var(--tf)}
.tag.off{background:#fff;box-shadow:inset 0 0 0 1px var(--border-strong);color:var(--muted)}
.tag.off i{background:var(--muted)}
.tag .x{border:0;background:none;color:inherit;width:18px;height:18px;margin:0 -6px 0 0;border-radius:50%;display:grid;place-items:center;padding:0}
.tag .x:hover{background:rgba(0,0,0,.12)}
.tag .x svg{width:12px;height:12px}
mark{background:var(--mark);color:var(--text);border-radius:2px;padding:0 1px}
.cnt{display:inline-grid;place-items:center;min-width:24px;height:20px;padding:0 7px;border-radius:10px;background:var(--alt);color:var(--muted);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.cnt.pri{background:var(--primary);color:#fff}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);min-width:0}

/* ---------- page header, tabs ---------- */
.crumb{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--primary);text-decoration:none;font-weight:600}
.crumb a:hover{text-decoration:underline}
.hdr{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.chip-i{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;background:var(--primary);flex:none}
.hdr h1{margin:0;font-size:22px;line-height:1.2;letter-spacing:-.005em}
.hdr>div:not(.chips):not(.acts){min-width:0;flex:1 1 260px}
.hdr .sub{color:var(--muted);font-size:13px;display:flex;gap:2px 14px;align-items:center;flex-wrap:wrap}
.hdr .chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hdr .acts{margin-left:auto;display:flex;gap:10px;align-items:center}
.tabs{position:relative;display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 16px;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px;white-space:nowrap;border-radius:6px 6px 0 0}
.tabs button:hover{color:var(--text);background:var(--alt)}
.tabs button[aria-selected=true]{color:var(--primary);font-weight:700;border-bottom-color:var(--primary)}
.tabs .cnt{font-weight:700}
.atabs .newdot,.tabs .newdot{font-size:11px;font-weight:700;color:var(--teal);background:var(--teal-bg);border-radius:8px;padding:1px 6px}
.tabpanel{min-height:0}
.tabpanel.grow{display:flex;flex-direction:column}
.tabpanel>.ncard,.tabpanel>.card{flex:1 1 0;min-height:0}
.mmr>.grow{flex:1 1 0;min-height:0}
.mmr>*{flex:none}
.stub{padding:20px 24px;display:grid;gap:16px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{display:block;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--border);border-radius:10px;background:#fff}
button.tile:hover{border-color:var(--primary);background:#FAFBFF}
.tile b{display:block;font-size:22px;line-height:1.1}
.tile span{color:var(--muted);font-size:13px}
.latest{display:grid;gap:0}
.latest button{display:flex;gap:12px;align-items:center;border:0;background:none;text-align:left;padding:10px 4px;border-bottom:1px solid #EDEFF3;width:100%;border-radius:0}
.latest button:hover{background:var(--soft)}
.latest .t{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.latest .w{color:var(--muted);font-size:12.5px;white-space:nowrap}
.stub h2{margin:0;font-size:16px}

/* ---------- dropdown (shared style: rounded popover list, check at right, counts right-aligned) ---------- */
.dd-btn{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;background:#fff;border:1px solid var(--border-strong);border-radius:8px;min-width:0;max-width:100%;white-space:nowrap}
.dd-btn:hover{background:#FAFBFC;border-color:#374151}
.dd-btn .pre{color:var(--muted);font-size:13px}
.dd-btn .val{font-weight:600;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.dd-btn[aria-expanded=true]{border-color:var(--primary);box-shadow:0 0 0 3px var(--blue-bg)}
.dd-btn.on{background:var(--blue-bg);border-color:var(--blue-line)}
.dd-btn.on .val{color:var(--primary)}
.dd-panel{position:fixed;z-index:130;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--pop);display:flex;flex-direction:column;overflow:hidden}
.dd-search{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);color:var(--faint)}
.dd-search input{border:0;outline:0;flex:1;min-width:0;background:none;color:var(--text)}
.dd-panel ul{list-style:none;margin:0;padding:6px;overflow:auto;flex:1;outline:0}
.dd-panel li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;cursor:pointer}
.dd-panel li:hover{background:var(--alt)}
.dd-panel li.act{background:var(--alt);box-shadow:inset 0 0 0 2px var(--focus)}
.dd-panel li[aria-selected=true]{background:var(--blue-bg)}
.dd-panel li[aria-disabled=true]{color:var(--faint);cursor:not-allowed}
.dd-panel li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-panel li .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;min-width:22px;text-align:right}
.dd-panel li .tick{width:18px;flex:none;color:var(--primary);display:grid;place-items:center}
.dd-panel li .dot{width:10px;height:10px;border-radius:50%;flex:none}
.dd-panel .foot{border-top:1px solid var(--border);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.dd-panel .foot button{border:0;background:none;color:var(--primary);font-weight:600;text-decoration:underline;border-radius:4px}
.dd-panel .none{padding:14px;color:var(--muted)}

/* ---------- segmented ---------- */
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;height:34px;padding:0 12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;border-radius:0}
.seg button+button{border-left:1px solid var(--border)}
.seg button:hover{background:var(--alt)}
.seg button[aria-pressed=true]{background:var(--blue-bg);color:var(--primary)}
.seg button:focus-visible{outline-offset:-3px}

/* ---------- tab icons ---------- */
.tabs button svg,.atabs button svg{color:currentColor}
/* ---------- splitter ---------- */
.split{display:none;position:relative;flex:0 0 1px;background:var(--border);cursor:col-resize;touch-action:none;z-index:6;outline:0}
.split::before{content:"";position:absolute;top:0;bottom:0;left:-22px;right:-22px}
.split .grip{position:absolute;top:50%;left:50%;width:8px;height:44px;margin:-22px 0 0 -4px;border-radius:4px;background:#fff;border:1px solid var(--border-strong);pointer-events:none}
.split .grip::after{content:"";position:absolute;left:2px;right:2px;top:14px;bottom:14px;border-left:1px solid var(--faint);border-right:1px solid var(--faint)}
.split:hover,.split.drag{background:var(--primary)}
.split:focus-visible{background:var(--primary)}
.split:focus-visible .grip{outline:2px solid var(--focus);outline-offset:2px}
.nbody.docked:not(.wide) #split{display:block}
.dsplit{display:block;position:absolute;left:0;top:0;bottom:0;flex:none;width:1px;z-index:7}
body.dragging{cursor:col-resize;user-select:none}
/* ---------- asset references ---------- */
.at{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--tb);color:var(--tf);flex:none}
.at.lg{width:44px;height:44px;border-radius:10px}
.at.lg svg{width:24px;height:24px}
.assetref{display:inline-flex;align-items:center;gap:5px;background:#fff;color:var(--text);box-shadow:inset 0 0 0 1px var(--border-strong);border-radius:8px;padding:0 9px 0 6px;font-weight:600;font-size:.93em;line-height:1.6;cursor:default;user-select:all;vertical-align:baseline;max-width:100%}
.assetref svg{width:15px;height:15px}
.assetref[data-st]::after{content:attr(data-st);margin-left:4px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--amber);background:var(--amber-bg);border-radius:5px;padding:0 5px;line-height:1.5}
.assetref[data-st=disposed]::after{color:var(--red);background:var(--red-bg)}
.assetref[data-st=inactive]::after{color:var(--slate);background:var(--slate-bg)}
.assetref.gone{color:var(--muted);background:var(--soft);font-weight:500}
.assetref.gone::after{color:var(--muted);background:#fff;box-shadow:inset 0 0 0 1px var(--border-2)}
.read .assetref[data-asset-id]:not(.gone),.refs .assetref[data-asset-id]:not(.gone){cursor:pointer;color:var(--primary)}
.read .assetref[data-asset-id]:not(.gone):hover,.refs .assetref[data-asset-id]:not(.gone):hover{box-shadow:inset 0 0 0 2px var(--primary)}
.refs{border-top:1px solid var(--border);padding-top:12px;margin-top:6px}
.refs h3{margin:0 0 8px;font-size:13px;display:flex;gap:8px;align-items:center;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.refchips{display:flex;gap:8px;flex-wrap:wrap}
.refchips .assetref{font-size:13px;line-height:2}
.pill.red{background:var(--red-bg);color:var(--red)}
.mpop.wide{width:380px}
.mpop .nm{flex:1;min-width:0}
.mpop .nm small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* simulated new browser window */
.bw-bg{position:fixed;inset:0;background:rgba(16,24,40,.55);z-index:170;display:grid;place-items:center;padding:3vh 3vw}
.bwin{background:#fff;width:min(1000px,100%);height:min(720px,100%);border-radius:10px;box-shadow:var(--pop);display:flex;flex-direction:column;overflow:hidden;border:1px solid #8892a4}
.bchrome{background:#DDE1E8;padding:8px 10px 8px}
.btab{display:flex;align-items:center;gap:8px;background:#fff;border-radius:8px;padding:6px 6px 6px 12px;font-size:13px;max-width:360px}
.btab span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btab .x{border:0;background:none;border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
.btab .x:hover{background:var(--alt)}
.bbar{display:flex;align-items:center;gap:10px;margin-top:8px}
.bdots{display:flex;gap:5px}.bdots i{width:10px;height:10px;border-radius:50%;background:#9AA3B2;display:block}
.burl{flex:1;background:#fff;border-radius:16px;padding:4px 12px;font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;min-width:0;overflow:hidden;white-space:nowrap}
.bpage{flex:1;overflow:auto;background:var(--bg)}
.simnote{display:flex;gap:8px;align-items:center;background:var(--blue-bg);color:#173C79;padding:8px 20px;font-size:12.5px}
.bcont{padding:18px 24px 28px}
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px}
.adl{display:grid;grid-template-columns:110px 1fr;margin:0}
.adl dt{color:var(--muted);padding:9px 0;border-bottom:1px solid #EDEFF3}
.adl dd{margin:0;padding:9px 0;border-bottom:1px solid #EDEFF3;font-weight:600}
.lt{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #EDEFF3}
.lt>span:nth-child(2){flex:1;min-width:0}
@media (max-width:800px){.bgrid{grid-template-columns:1fr}}
/* ---------- r3: split button, lock, panel body, history, templates, slash ---------- */
.splitbtn{display:inline-flex;flex:none}
.splitbtn .btn:first-child{border-radius:6px 0 0 6px}
.splitbtn .btn.caret{border-radius:0 6px 6px 0;padding:0 9px;border-left:1px solid rgba(255,255,255,.55)}
.lockic{color:var(--amber)}
.lockbadge{font-weight:700}
.ibtn.red{color:var(--red)}
.ibtn[aria-disabled=true] svg{opacity:.7}
.panel>header{flex-wrap:wrap;row-gap:6px}
.panel>header .ph{flex:1 1 90px}
.updline{font-size:12.5px;color:var(--muted);margin-top:-8px}
.updline b{color:var(--text);font-weight:600}
.pbody{flex:1;min-height:0;display:flex;container-type:inline-size;container-name:pb}
.pmain{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.pmain>.pscroll{flex:1}
.pedit{padding:10px 14px 12px;gap:8px}
.erow{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.erow>.field{flex:1 1 240px;min-width:0}
.erow>.field.sc{flex:0 0 200px}
.erow>.tagfield{flex:1 1 280px;min-width:0}
.field input.big.cmp{height:36px;font-size:15px}
.field input.cmp{height:36px}
.field select.cmp{height:36px;border:1px solid var(--border-strong);border-radius:8px;padding:0 8px;background:#fff;width:100%}
.tagfield.cmp{min-height:36px;padding:3px 6px;gap:5px;align-items:center}
.tagfield .tl{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted);margin-right:2px}
.pedit .edwrap{flex:1;display:flex;flex-direction:column;min-height:0}
.pedit .edtop{position:static}
.pedit .ed{flex:1;min-height:0;overflow:auto}
.pedit .tb{padding:4px 6px}
.banner.slim{padding:6px 10px;font-size:13px;align-items:center;gap:8px}
.banner.slim svg{margin-top:0}
.tok{background:#FFE58F;color:#1B1F27;border-radius:3px;padding:0 3px;font-family:var(--mono);font-size:.92em;white-space:nowrap}
::highlight(tok){background:#FFE58F;color:#1B1F27}
.hsplit,.phist{display:none}
.phist{flex:0 0 var(--hw,300px);flex-direction:column;min-height:0;min-width:0;background:var(--soft)}
.phist .hh{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;border-bottom:1px solid var(--border)}
.phist h3{margin:0;font-size:14px;flex:1;display:flex;gap:8px;align-items:center}
.hlist{overflow:auto;flex:1;padding:4px 14px 10px;outline-offset:-3px}
.hlist h4{margin:12px 0 4px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hlist ol{list-style:none;margin:0;padding:0}
.hlist li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #E6E9EF}
.hlist .when{display:block;color:var(--muted);font-size:12px}
.hnote{margin:0;padding:10px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);background:var(--soft)}
.phist .hmin{display:none}
.phist.min{flex-basis:46px}
.phist.min .hlist,.phist.min .hnote,.phist.min h3{display:none}
.phist.min .hh{padding:8px 6px;justify-content:center}
.phist.min .hmin{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0}
.vt{writing-mode:vertical-rl;color:var(--muted);font-size:12px;font-weight:600}
.phist.inline{display:flex;background:none}
@container pb (min-width:820px){.phist{display:flex}.hsplit{display:block}}
.thead2{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--soft);border-bottom:1px solid var(--border);font-size:13px;color:var(--muted)}
.tplli{display:flex;align-items:stretch;border-bottom:1px solid #EDEFF3}
.tplli .nr{flex:1;border-bottom:0;grid-template-columns:44px minmax(0,1fr)}
.tacts{display:flex;gap:6px;align-items:center;padding:0 16px 0 0;flex-wrap:wrap;max-width:330px;justify-content:flex-end}
.tchoose{display:grid;gap:10px}
.tcard{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--border);border-radius:10px;background:#fff;padding:10px 12px}
.tcard:hover{border-color:var(--primary);background:#FAFBFF}
.tcard small{display:block;color:var(--muted);font-size:12.5px}
.tcard .meta2{display:grid;gap:4px;justify-items:end}
.mpop .hd{display:flex;gap:8px;align-items:center}
.mpop .bc{display:inline-flex;align-items:center;gap:2px;font-weight:700;color:var(--text);text-transform:none;letter-spacing:0;font-size:12.5px}
.kbdhint{margin-left:auto;font-size:11.5px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
.mpop li .pill{flex:none}
.refgrp{margin-top:8px}
.refgrp h4{margin:0 0 6px;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.assetref .mono{font-size:.9em;color:var(--muted);margin-right:4px}
.assetref[data-st="completed"]::after,.assetref[data-st="cancelled"]::after{color:var(--slate);background:var(--slate-bg)}
.assetref[data-st="no access"]::after{color:var(--muted);background:#fff;box-shadow:inset 0 0 0 1px var(--border-2)}
/* ---------- Notes ---------- */
.ncard{display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative;container-type:inline-size;container-name:notes}
.nhead{border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.nrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nrow h2{margin:0;font-size:18px;line-height:1.2}
.nrow .sp{flex:1}
.nrow.one{flex-wrap:nowrap;gap:8px}
.nrow.one h2{white-space:nowrap}
.nrow.one .nsearch{flex:1 1 140px;min-width:110px;max-width:none}
.nrow.one .dd-btn,.nrow.one .seg,.nrow.one .btn,.nrow.one .ibtn,.nrow.one .pill{flex:none}
.ibtn.bord{border:1px solid var(--border-strong);border-radius:8px;height:36px;width:36px;background:#fff}
.ibtn.bord:hover{background:var(--alt)}
.nhead{padding:12px 20px}
.nsearch{position:relative;flex:1 1 200px;min-width:160px;max-width:380px}
.nsearch input{width:100%;height:36px;border:1px solid var(--border-strong);border-radius:8px;padding:0 32px 0 34px;background:#fff}
.nsearch>svg{position:absolute;left:10px;top:9px;color:var(--faint)}
.nsearch .clr{position:absolute;right:4px;top:3px;width:30px;height:30px;border:0;background:none;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.sensline{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--slate);background:var(--slate-bg);border-radius:8px;padding:6px 10px}
.rolebar{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.nbody{flex:1;min-height:0;display:flex}
.nscroll{flex:1;min-width:0;min-height:0;overflow:auto;position:relative}
.nlist{display:flex;flex-direction:column;min-width:0;flex:1;min-height:0}
.pcol{display:none}
.nbody.docked .pcol{display:flex;flex:1 1 0;min-width:0;flex-direction:column;min-height:0}
.nbody.docked:not(.wide) .nlist{flex:0 0 var(--lw,380px)}
.nbody.docked.wide .rail{display:none}
.nbody.docked.wide .pcol{flex:1}
.nbody.wide .nlist{display:none}
.nbody.wide .pscroll>*{max-width:940px;width:100%;margin-left:auto;margin-right:auto}
.grp{margin:0}
.grp>h3{margin:0;position:sticky;top:0;z-index:2;background:var(--soft);font-size:14px}
.grp>h3>button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 20px;border:0;border-bottom:1px solid var(--border);border-top:1px solid var(--border);background:var(--soft);text-align:left;font-weight:600;border-radius:0}
.grp:first-child>h3>button{border-top:0}
.grp>h3>button:hover{background:var(--alt)}
.grp>h3>button:focus-visible{outline-offset:-3px}
.grp .chev{transition:transform .15s;color:var(--muted)}
.grp.closed .chev{transform:rotate(-90deg)}
.grp.closed ul{display:none}
.grp .gname{font-weight:700}
.grp .inact{font-size:11.5px;color:var(--muted);font-weight:600;border:1px solid var(--border-2);border-radius:5px;padding:0 6px;background:#fff}
ul.nl{list-style:none;margin:0;padding:0}
.nr{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;width:100%;text-align:left;border:0;background:none;padding:13px 20px;border-bottom:1px solid #EDEFF3;border-radius:0;color:inherit}
.nr:hover{background:#F7F9FC}
.nr:focus-visible{outline-offset:-3px}
.nr[aria-current=true]{background:var(--blue-bg)}
.nr.twin{background:#EAF1FC;box-shadow:inset 0 0 0 2px var(--primary)}
.nr .tt{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14.5px;min-width:0}
.nr .tt span.ti{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.nr .tt svg{color:var(--amber);flex:none}
.nr .pv{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);margin:2px 0 8px;line-height:1.4}
.nr .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.nr .also{font-size:12px;color:var(--muted);font-weight:600}
.nr .meta{margin-top:8px;font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.nr .meta b{color:var(--text);font-weight:600}
.nr .plain{font-size:12px;color:var(--muted)}
.empty{display:grid;place-items:center;text-align:center;gap:10px;padding:48px 24px;color:var(--muted)}
.empty .eic{width:56px;height:56px;border-radius:16px;background:var(--blue-bg);color:var(--primary);display:grid;place-items:center}
.empty h3{margin:0;color:var(--text);font-size:17px}
.empty p{margin:0;max-width:420px}
.skel{padding:8px 20px}
.skel div{height:14px;border-radius:7px;background:linear-gradient(90deg,#E6E9EF,#F3F5F8,#E6E9EF);background-size:200% 100%;animation:sh 1.2s infinite linear;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}

/* rail (design B) */
.rail{flex:0 0 220px;border-right:1px solid var(--border);display:none;flex-direction:column;min-height:0;background:#fff}
.nbody.b .rail{display:flex}
.nbody.b .nlist{flex:0 0 var(--lw,360px)}
.rail h3{margin:0;padding:12px 16px 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center}
.rail h3 .sp{flex:1}
.rail ul{list-style:none;margin:0;padding:0 8px 8px;overflow:auto;flex:1}
.rail li button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left}
.rail li button:hover{background:var(--alt)}
.rail li button[aria-current=true]{background:var(--blue-bg);color:var(--primary);font-weight:700}
.rail .dot{width:10px;height:10px;border-radius:50%;flex:none}
.rail .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.rail hr{border:0;border-top:1px solid var(--border);margin:6px 8px}
.rail .foot{padding:10px 14px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted)}
.rail.min{flex-basis:56px}
.rail.min h3 span,.rail.min .t,.rail.min .foot{display:none}
.rail.min li button{justify-content:center;padding:8px 0;position:relative}
.rail.min .n{position:absolute;right:2px;top:-1px;font-size:10px}
.rail.min h3{justify-content:center;padding:12px 0 8px}
.rail.min li button .all{display:block}
.railtoggle{border:1px solid var(--border-2);background:#fff;border-radius:6px;width:30px;height:30px;display:grid;place-items:center;color:var(--muted)}
.chiprow{display:none;gap:8px;padding:10px 20px;overflow-x:auto;border-bottom:1px solid var(--border);scrollbar-width:thin}
.chiprow button{border:0;background:none;padding:0;border-radius:999px;flex:none}
.chiprow .tag{height:30px;padding:0 12px 0 10px;font-size:13px}
.chiprow button[aria-current=true] .tag{box-shadow:inset 0 0 0 2px var(--tf)}
.chiprow .tag.all{--tb:#fff;--tf:#1B1F27;box-shadow:inset 0 0 0 1px var(--border-strong)}
.chiprow button[aria-current=true] .tag.all{box-shadow:inset 0 0 0 2px var(--tf)}

/* board (design C) */
.board{display:flex;gap:14px;padding:16px 20px;overflow:auto;flex:1;min-height:0;align-items:stretch}
.col{flex:0 0 272px;display:flex;flex-direction:column;min-height:0;background:var(--soft);border:1px solid var(--border);border-radius:12px}
.col>h3{margin:0;padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:14px;border-bottom:1px solid var(--border)}
.col>h3 .sp{flex:1}
.col ul{list-style:none;margin:0;padding:10px;display:flex;flex-direction:column;gap:10px;overflow:auto;flex:1;min-height:0}
.cardn{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px;box-shadow:var(--shadow)}
.cardn:hover{border-color:var(--primary)}
.cardn[aria-current=true]{background:var(--blue-bg);border-color:var(--blue-line)}
.cardn.twin{box-shadow:0 0 0 2px var(--primary);background:#EAF1FC}
.cardn .tt{font-weight:700;display:flex;gap:6px;align-items:center}
.cardn .tt svg{color:var(--amber)}
.cardn .pv{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);margin:2px 0 8px;font-size:13px}
.cardn .tags{display:flex;gap:4px;flex-wrap:wrap}
.cardn .tags .tag{height:22px;font-size:11.5px}
.cardn .meta{margin-top:8px;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}

/* ---------- panel (reader / editor) ---------- */
.panel{display:flex;flex-direction:column;min-height:0;flex:1;background:#fff;min-width:0}
.panel>header{display:flex;align-items:center;gap:8px;padding:12px 16px 12px 20px;border-bottom:1px solid var(--border)}
.panel>header .ph{flex:1;font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel>header .ph b{color:var(--text)}
.pscroll{flex:1;min-height:0;overflow:auto;padding:0 20px 20px;display:flex;flex-direction:column;gap:14px}
.pscroll>*:first-child{margin-top:16px}
.ncard:has(.nbody.docked.wide) .nhead{display:none}
.panel>footer{border-top:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--soft)}
.panel>footer .who{flex:1 1 220px;font-size:12.5px;color:var(--muted);display:grid;gap:2px;min-width:0}
.panel>footer .who b{color:var(--text);font-weight:600}
.panel .btns{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.ptitle{margin:0;font-size:20px;line-height:1.25;outline:0}
.pempty{display:grid;place-items:center;text-align:center;padding:40px 24px;color:var(--muted);gap:8px;flex:1}
.field label,.field .lbl{display:block;font-weight:600;margin-bottom:6px;font-size:13px}
.field .hint{font-weight:400;color:var(--muted)}
.field input[type=text]{width:100%;height:40px;border:1px solid var(--border-strong);border-radius:8px;padding:0 12px;background:#fff}
.field input.big{font-size:17px;font-weight:700;height:44px}
.field input[aria-invalid=true]{border-color:var(--red);box-shadow:0 0 0 3px var(--red-bg)}
.err{color:var(--red);font-size:12.5px;margin-top:4px;display:flex;gap:6px;align-items:center}
.tagfield{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:42px;padding:6px 8px;border:1px solid var(--border-strong);border-radius:8px;background:#fff}
.tagfield .add{display:inline-flex;align-items:center;gap:6px;height:28px;border:1px dashed var(--border-strong);background:#fff;border-radius:999px;padding:0 12px 0 8px;color:var(--primary);font-weight:600;font-size:13px}
.tagfield .add:hover{background:var(--blue-bg)}
.tagfield .add[aria-expanded=true]{background:var(--blue-bg);border-style:solid}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;font-size:13.5px}
.banner svg{margin-top:2px}
.banner.warn{background:var(--amber-bg);color:#5C3B00;box-shadow:inset 0 0 0 1px var(--amber-line)}
.banner.info{background:var(--blue-bg);color:#173C79}
.banner .bb{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.banner b{font-weight:700}
.savestate{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.savestate i{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.savestate.dirty i{background:var(--amber)}
.savestate.dirty{color:var(--amber);font-weight:600}

/* editor */
.edtop{position:sticky;top:0;z-index:5}
.tb{display:flex;flex-wrap:wrap;gap:2px;align-items:center;padding:6px 8px;border:1px solid var(--border);border-bottom:0;border-radius:8px 8px 0 0;background:var(--soft)}
.tb .ibtn{width:30px;height:30px}
.tb .sepv{width:1px;height:20px;background:var(--border-2);margin:0 4px}
.tb .styl{display:flex;align-items:center;gap:6px;height:32px;padding:0 8px;border:1px solid var(--border-2);background:#fff;border-radius:6px;min-width:118px;justify-content:space-between;font-weight:600;font-size:13px}
.tb .glyph{font-weight:800;font-size:15px;line-height:1}
.tb2{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;border:1px solid var(--blue-line);border-bottom:0;background:var(--blue-bg)}
.tb2 .lb{font-size:12px;font-weight:700;color:var(--primary);margin-right:4px}
.tb2 button{height:28px;padding:0 8px;border:1px solid var(--blue-line);background:#fff;border-radius:6px;font-size:12.5px;font-weight:600}
.tb2 button:hover{background:#F3F7FE}
.tb2 button[aria-pressed=true]{background:var(--primary);color:#fff;border-color:var(--primary)}
.edwrap{position:relative}
.ed{min-height:240px;padding:14px 16px;border:1px solid var(--border-strong);border-radius:0 0 8px 8px;background:#fff;overflow-wrap:anywhere}
.ed:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:0 0 8px 8px}
.ed.ph::before{content:attr(data-ph);position:absolute;left:17px;top:15px;color:var(--faint);pointer-events:none}
.edwrap .hint2{margin-top:6px;font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
/* rich text content (editor and reader) */
.prose{line-height:1.55;overflow-wrap:anywhere}
.prose>*:first-child{margin-top:0}
.prose p{margin:0 0 .7em}
.prose h1{font-size:20px;margin:1em 0 .4em;line-height:1.25}
.prose h2{font-size:17px;margin:1em 0 .4em;line-height:1.3}
.prose h3{font-size:15px;margin:1em 0 .3em;line-height:1.3}
.prose ul,.prose ol{margin:0 0 .8em;padding-left:1.5em}
.prose li{margin:.15em 0}
.prose blockquote{margin:0 0 .8em;padding:8px 14px;background:var(--soft);border-radius:8px;color:#374151;font-style:italic;box-shadow:inset 0 0 0 1px var(--border)}
.prose a{color:var(--primary);text-decoration:underline;text-underline-offset:2px}
.prose table{border-collapse:collapse;width:100%;margin:.2em 0 1em;table-layout:fixed;font-size:13.5px}
.prose th,.prose td{border:1px solid var(--border-strong);padding:6px 9px;vertical-align:top;text-align:left;min-width:40px;overflow-wrap:anywhere}
.prose th{background:var(--alt);font-weight:700}
.prose td:empty::after,.prose th:empty::after{content:"\200b"}
.prose .tblscroll{overflow-x:auto}
.mention{display:inline-flex;align-items:center;gap:3px;background:var(--blue-bg);color:var(--primary);border-radius:999px;padding:0 9px;font-weight:600;font-size:.93em;line-height:1.6;white-space:nowrap;cursor:default;user-select:all}
.read .mention{cursor:pointer}
.read .mention:hover{box-shadow:inset 0 0 0 1px var(--primary)}
.ed .mention{user-select:all}
.mpop{position:fixed;z-index:140;width:268px;max-height:240px;overflow:auto;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--pop);padding:6px;list-style:none;margin:0}
.mpop li{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:6px;cursor:pointer}
.mpop li.act{background:var(--blue-bg);box-shadow:inset 0 0 0 2px var(--primary)}
.mpop li small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.mpop .none{padding:10px;color:var(--muted)}
.mpop .hd{padding:4px 8px 6px;font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}

/* overlay drawer for the panel (design C, narrow containers, phones) */
.dscrim{position:fixed;inset:56px 0 0 0;background:rgba(16,24,40,.35);z-index:80}
.dpanel{position:fixed;top:56px;right:0;bottom:0;width:min(var(--dw,580px),100vw);z-index:85;background:#fff;box-shadow:var(--pop);display:flex;flex-direction:column}
.dpanel.wide{width:min(980px,100vw)}
.dpanel .panel{flex:1}

/* dialogs, toast */
.dlg-bg{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:150;display:grid;place-items:center;padding:16px;overflow:auto}
.dlg{background:#fff;border-radius:14px;box-shadow:var(--pop);width:520px;max-width:100%;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.dlg>header{display:flex;align-items:center;gap:12px;padding:18px 24px 6px}
.dlg>header h2{margin:0;font-size:19px;flex:1;line-height:1.25}
.dlg>header .x{border:0;background:none;padding:6px;border-radius:6px}
.dlg .dic{width:36px;height:36px;border-radius:10px;background:var(--blue-bg);color:var(--primary);display:grid;place-items:center;flex:none}
.dlg .dic.red{background:var(--red-bg);color:var(--red)}
.dlg .dic.amb{background:var(--amber-bg);color:var(--amber)}
.dlg .body{padding:8px 24px 18px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.dlg .body p{margin:0}
.dlg>footer{display:flex;gap:10px;padding:14px 24px;border-top:1px solid var(--border);align-items:center;justify-content:flex-end;flex-wrap:wrap}
.dlg>footer .sp{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1B1F27;color:#fff;padding:10px 18px;border-radius:8px;z-index:220;box-shadow:var(--pop);max-width:90vw}

/* admin */
.atabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.atabs button{border:0;background:none;padding:10px 16px;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center;white-space:nowrap;border-radius:6px 6px 0 0}
.atabs button:hover{background:var(--alt);color:var(--text)}
.atabs button[aria-selected=true]{color:var(--primary);font-weight:700;border-bottom-color:var(--primary)}
.acard{display:flex;flex-direction:column;overflow:hidden}
.agrid{flex:1;min-height:0;overflow:auto}
table.tt2{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
table.tt2 th{position:sticky;top:0;background:var(--alt);text-align:left;font-size:12.5px;letter-spacing:.03em;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--border);z-index:1;white-space:nowrap}
table.tt2 td{padding:10px 16px;border-bottom:1px solid #EDEFF3;vertical-align:middle}
table.tt2 tr:hover td{background:#FAFBFD}
table.tt2 td.num{text-align:right;font-variant-numeric:tabular-nums}
table.tt2 th.num{text-align:right}
.rowacts{display:flex;gap:6px;justify-content:flex-end}
.rowacts .btn:nth-child(2){min-width:104px}
.sw{display:inline-block;width:18px;height:18px;border-radius:5px;vertical-align:middle;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.swatches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.swatches label{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:8px;cursor:pointer;font-size:13px;position:relative}
.swatches label:hover{background:var(--alt)}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches input:checked+.sw+span{font-weight:700}
.swatches label:has(input:checked){border-color:var(--primary);box-shadow:0 0 0 2px var(--blue-bg);background:var(--blue-bg)}
.swatches label:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.permnote{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);padding:10px 16px;border-top:1px solid var(--border);background:var(--soft)}
.denied{display:grid;place-items:center;text-align:center;gap:10px;padding:56px 24px}

/* my matters layout */
.mm{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;flex:1;min-height:0}
.mm.tmin{grid-template-columns:52px minmax(0,1fr)}
.tree{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tree>header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
.tree>header h2{margin:0;font-size:14px;flex:1}
.tree ul{list-style:none;margin:0;padding:8px;overflow:auto;flex:1}
.tree li>button,.tree li>div{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:7px 8px;border-radius:8px;font-size:13.5px}
.tree li>button:hover{background:var(--alt)}
.tree li.sel>button{background:var(--blue-bg);font-weight:700;color:var(--primary)}
.tree ul ul{padding:0 0 0 18px}
.tree .dotc{width:8px;height:8px;border-radius:50%;background:var(--teal);flex:none}
.tree .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree.min ul,.tree.min h2,.tree.min .note{display:none}
.mm .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mmr{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}

/* mock panel */
.mockbtn{display:flex;gap:8px;align-items:center;height:34px;padding:0 14px;border-radius:17px;border:1px dashed var(--primary);background:#fff;color:var(--primary);font-weight:700;flex:none;white-space:nowrap}
.mockbtn[aria-expanded=true]{background:var(--primary);color:#fff;border-style:solid}
.mockpanel{position:fixed;right:16px;top:64px;z-index:101;width:330px;max-width:calc(100vw - 32px);background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--pop);padding:16px 18px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 80px);overflow:auto}
.mockpanel h2{margin:0;font-size:15px}
.mockpanel fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:2px}
.mockpanel legend{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:0;margin-bottom:4px}
.mockpanel label{display:flex;gap:10px;align-items:flex-start;padding:5px 8px;border-radius:6px;cursor:pointer}
.mockpanel label:hover{background:var(--alt)}
.mockpanel label small{display:block;color:var(--muted);font-size:12px}
.mockpanel input{margin-top:3px;accent-color:var(--primary);width:16px;height:16px;flex:none}
.mockpanel .row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- responsive ---------- */
@container notes (max-width:1120px){.nrow.one .dd-btn .pre{display:none}.nrow.one .seg button[aria-pressed=false] .lbl{display:none}.nrow.one .seg button[aria-pressed=false]{padding:0 10px}}
@container notes (max-width:1000px){
  .nrow.one .seg .lbl{display:none}
  .nrow.one .seg button{padding:0 10px}
}
@container notes (max-width:690px){.nrow.one{flex-wrap:wrap}.nrow.one .nsearch{flex-basis:100%;order:9}.nrow.one .btn .lbl{display:inline}}
@container notes (max-width:900px){
  .nbody.b .rail{display:none}
  .nbody.b .chiprow{display:flex}
  .nbody.b{flex-direction:column}
  .nbody.b .nlist{flex:1;border-right:0}
}
@media (max-width:1280px){.page{padding:20px 24px 16px}}
@media (max-width:1000px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .top{grid-column:1;gap:10px;padding:0 16px}
  .nav{position:fixed;top:56px;bottom:0;left:0;width:260px;z-index:70;transform:translateX(-100%);transition:transform .2s}
  .shell.navopen .nav{transform:none}
  .shell.navopen .scrim{display:block;position:fixed;inset:56px 0 0 0;background:rgba(16,24,40,.4);z-index:65}
  .burger{display:block}
  .brand{width:auto}
  .user .meta,.user>svg{display:none}
  main{overflow:auto}
  .page{height:auto;padding:16px 24px 80px}
  .page>.grow,.mmr>.grow,.tabpanel>.ncard,.tabpanel>.card{flex:none;min-height:0}
  .acard{overflow:visible!important}
  .ncard,.tabpanel.grow{overflow:visible;display:block}
  .nbody{display:block}
  .nscroll{overflow:visible}
  .nlist{display:block}
  .nbody.b.docked .nlist,.nbody.b .nlist{border:0}
  .mm{display:block}
  .tree{display:none}
  .hdr .acts{margin-left:0;width:100%}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{overflow-x:auto}
  .col{max-height:none}
  .col ul{overflow:visible}
  .agrid{overflow:auto}
  .grp>h3{top:0}
}
@media (max-width:700px){
  .top{padding:0 12px;gap:8px}
  .brand span,.search{display:none}
  .page{padding:14px 16px 80px}
  .hdr h1{font-size:20px}
  .hdr .stubacts{display:none}
  .hdr>div:not(.chips):not(.acts){flex:1 1 0}
  .hdr .chips{flex-basis:100%}
  .hdr .chip-i{width:34px;height:34px}
  .nhead{padding:12px 16px}
  .nr{padding:12px 16px}
  .grp>h3>button{padding:9px 16px}
  .seg button{padding:0 10px}
  .nsearch{max-width:none;flex-basis:100%}
  .nrow .seg{flex:1 1 100%}.nrow .seg button{flex:1;justify-content:center}
  .nrow .dd-btn{flex:1 1 0;min-width:0}.nrow .dd-btn .val{max-width:none;flex:1;text-align:left}
  .dpanel{width:100vw}
  .dsplit{display:none}
  .nrow.one{flex-wrap:wrap}.nrow.one .nsearch{flex-basis:100%;order:9}
  .mockbtn{padding:0 10px}.mockbtn span{display:none}
  .swatches{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tabs button{padding:10px 12px}
  .pscroll{padding:0 16px 20px}
  .panel>footer{padding:10px 16px}
  table.tt2,table.tt2 tbody{display:block}
  table.tt2 thead{display:none}
  table.tt2 tr{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:12px 16px;border-bottom:1px solid #EDEFF3;align-items:center}
  table.tt2 td{padding:0;border:0;display:block}
  table.tt2 td:nth-child(2){display:none}
  table.tt2 td.num{text-align:left;color:var(--muted);grid-column:1}
  table.tt2 td.num::before{content:'Notes using it: ';}
  table.tt2 td:nth-child(4){grid-column:2;grid-row:1}
  table.tt2 td:nth-child(5){grid-column:1/-1}
  .rowacts{justify-content:flex-start;flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

let DD=null;
function ddClose(refocus){
  if(!DD)return;const d=DD;DD=null;
  d.el.remove();d.anchor.setAttribute('aria-expanded','false');
  document.removeEventListener('mousedown',d.out,true);
  if(refocus!==false&&document.body.contains(d.anchor))d.anchor.focus();
}
function dropdown(o){
  ddClose(false);
  const id='dd'+(++UID);let q='',act=0;
  const el=document.createElement('div');el.className='dd-panel';
  el.innerHTML=(o.search?'<div class="dd-search">'+ic('i-search','sm')+'<input type="text" role="combobox" aria-expanded="true" aria-autocomplete="list" aria-controls="'+id+'l" placeholder="'+esc(o.placeholder||'Search')+'" aria-label="'+esc(o.label)+'" autocomplete="off"></div>':'')
   +'<ul id="'+id+'l" role="listbox" aria-label="'+esc(o.label)+'"'+(o.multi?' aria-multiselectable="true"':'')+(o.search?'':' tabindex="0"')+'></ul><div class="foot"></div>';
  document.body.appendChild(el);
  const ul=$('ul',el),foot=$('.foot',el),inp=$('input',el),holder=inp||ul;
  let sel=new Set(o.selected||[]);
  const items=()=>o.items(sel).filter(it=>!q||it.label.toLowerCase().includes(q.toLowerCase()));
  function render(){
    const its=items();if(act>=its.length)act=Math.max(0,its.length-1);
    ul.innerHTML=its.length?its.map((it,i)=>'<li role="option" id="'+id+'o'+i+'" data-id="'+esc(it.id)+'" aria-selected="'+sel.has(it.id)+'"'+(it.disabled?' aria-disabled="true"':'')+(i===act?' class="act"':'')+'>'
      +(it.dot?'<span class="dot" style="background:'+it.dot+'"></span>':'')+'<span class="t">'+esc(it.label)+(it.sub?' <span class="note">'+esc(it.sub)+'</span>':'')+'</span>'+(it.count!=null?'<span class="n">'+it.count+'</span>':'')+'<span class="tick">'+(sel.has(it.id)?ic('i-check','sm'):'')+'</span></li>').join('')
      :'<li class="none" role="presentation">'+esc(o.none||'Nothing matches')+'</li>';
    holder.setAttribute('aria-activedescendant',its.length?id+'o'+act:'');
    foot.innerHTML=o.multi?'<span>'+(o.footNote?o.footNote(sel):sel.size+' selected')+'</span><span><button type="button" data-c>Clear</button> <button type="button" data-d>Done</button></span>':'';
    foot.style.display=o.multi?'':'none';
    const a=$('li.act',ul);if(a&&a.scrollIntoView)a.scrollIntoView({block:'nearest'});
  }
  function toggle(i){
    const it=items()[i];if(!it||it.disabled)return;
    if(o.multi){sel.has(it.id)?sel.delete(it.id):sel.add(it.id);o.onChange(new Set(sel));render()}
    else{o.onChange(it.id);ddClose()}
  }
  function place(){
    const r=o.anchor.getBoundingClientRect(),w=Math.min(o.width||Math.max(r.width,260),innerWidth-16);
    el.style.width=w+'px';el.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';
    const below=innerHeight-r.bottom-12,above=r.top-12,h=Math.min(o.maxH||340,Math.max(below,above)<200?Math.max(below,above):340);
    if(below>=Math.min(280,h)||below>=above){el.style.top=(r.bottom+4)+'px';el.style.maxHeight=Math.max(160,Math.min(h,below))+'px'}
    else{el.style.bottom=(innerHeight-r.top+4)+'px';el.style.maxHeight=Math.max(160,Math.min(h,above))+'px'}
  }
  el.addEventListener('mousedown',e=>{if(!e.target.closest('input'))e.preventDefault()});
  el.addEventListener('click',e=>{
    const li=e.target.closest('li[data-id]');
    if(li){act=Array.from(ul.children).indexOf(li);toggle(act);return}
    if(e.target.closest('[data-c]')){sel=new Set();o.onChange(new Set());render()}
    if(e.target.closest('[data-d]'))ddClose();
  });
  holder.addEventListener('keydown',e=>{
    const n=items().length;
    if(e.key==='ArrowDown'){e.preventDefault();act=Math.min(n-1,act+1);render()}
    else if(e.key==='ArrowUp'){e.preventDefault();act=Math.max(0,act-1);render()}
    else if(e.key==='Home'){e.preventDefault();act=0;render()}
    else if(e.key==='End'){e.preventDefault();act=Math.max(0,n-1);render()}
    else if(e.key==='Enter'||(e.key===' '&&!inp)){e.preventDefault();toggle(act)}
    else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();ddClose()}
    else if(e.key==='Tab'){ddClose(false)}
  });
  if(inp)inp.addEventListener('input',()=>{q=inp.value;act=0;render()});
  const out=e=>{if(!el.contains(e.target)&&!o.anchor.contains(e.target))ddClose(false)};
  document.addEventListener('mousedown',out,true);
  DD={el,anchor:o.anchor,out};
  o.anchor.setAttribute('aria-expanded','true');
  const idx=items().findIndex(it=>sel.has(it.id));act=idx>=0?idx:0;
  render();place();holder.focus();
}

function openDlg(o){
  const prev=document.activeElement;
  const bg=document.createElement('div');bg.className='dlg-bg';
  const tid='dt'+(++UID);
  bg.innerHTML='<div class="dlg" role="'+(o.alert?'alertdialog':'dialog')+'" aria-modal="true" aria-labelledby="'+tid+'" style="'+(o.w?'width:'+o.w+'px':'')+'"><header><span class="dic '+(o.iconCls||'')+'">'+ic(o.icon||'i-info','lg')+'</span><h2 id="'+tid+'">'+esc(o.title)+'</h2><button type="button" class="x" data-close aria-label="Close dialog">'+ic('i-x')+'</button></header><div class="body">'+o.body+'</div><footer>'+(o.footer||'')+'</footer></div>';
  $('#overlay').appendChild(bg);
  const h={el:bg,close(restore){bg.remove();document.removeEventListener('keydown',kd,true);if(restore!==false&&prev&&document.body.contains(prev)&&prev.focus)prev.focus()}};
  function kd(e){
    if(!bg.isConnected)return;
    if(e.key==='Escape'&&!DD){e.stopPropagation();e.preventDefault();(o.onCancel||h.close)()}
    if(e.key==='Tab'){
      const f=$$('button,input,select,textarea,a[href]',bg).filter(x=>!x.disabled&&x.offsetParent!==null);
      if(!f.length)return;const a=f[0],z=f[f.length-1];
      if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}
      else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
    }
  }
  document.addEventListener('keydown',kd,true);
  $('[data-close]',bg).addEventListener('click',()=>(o.onCancel||h.close)());
  if(o.onMount)o.onMount(h);
  const f=$(o.focus||'[data-focus]',bg)||$('input,button',bg);if(f)f.focus();
  return h;
}

/* ---- resizable boundary between the list and the note (options A and B) and the drawer edge (C, narrow) ---- */
const SPK='notesSplit.r2';let SPLIT={};try{SPLIT=JSON.parse(localStorage.getItem(SPK))||{}}catch(e){}
const SPDEF={A:380,B:360,D:580,H:300},SPMIN={A:260,B:260,D:420,H:220},SPSTEP=16;
function splitSave(){try{localStorage.setItem(SPK,JSON.stringify(SPLIT))}catch(e){}}
const splitKey=()=>S.opt==='B'?'B':'A';
function splitMax(k){if(k==='H'){const pb=$('#pbody');return Math.max(SPMIN.H+SPSTEP,Math.min(480,(pb?pb.clientWidth:900)-480))}if(k==='D')return Math.min(1100,innerWidth-120);const nb=$('#nbody');const rail=(k==='B'&&$('#rail'))?$('#rail').offsetWidth:0;return Math.max(SPMIN[k]+SPSTEP,(nb?nb.clientWidth:900)-rail-420-12)}
const splitVal=k=>Math.round(Math.min(splitMax(k),Math.max(SPMIN[k],SPLIT[k]||SPDEF[k])));
function splitAria(el,k,v){el.setAttribute('aria-valuemin',SPMIN[k]);el.setAttribute('aria-valuemax',splitMax(k));el.setAttribute('aria-valuenow',v);el.setAttribute('aria-valuetext',(k==='D'?'Note panel ':k==='H'?'History panel ':'Note list ')+v+' pixels wide')}
function splitApply(){
  const nb=$('#nbody');
  if(nb){const k=splitKey(),v=splitVal(k);nb.style.setProperty('--lw',v+'px');const sp=$('#split');if(sp)splitAria(sp,k,v)}
  const pb=$('#pbody');if(pb){const v=splitVal('H');pb.style.setProperty('--hw',v+'px');const hs=$('#hsplit');if(hs)splitAria(hs,'H',v)}
  const dp=$('.dpanel');if(dp){const v=splitVal('D');dp.style.setProperty('--dw',v+'px');const ds=$('.dsplit',dp);if(ds)splitAria(ds,'D',v)}
}
function splitSet(k,v,persist){SPLIT[k]=Math.round(Math.min(splitMax(k),Math.max(SPMIN[k],v)));if(k==='D'&&S.wide){S.wide=false;const dp=$('.dpanel');if(dp)dp.classList.remove('wide')}splitApply();if(persist)splitSave()}
function splitReset(k){k=k||splitKey();delete SPLIT[k];splitSave();splitApply();toast('Width reset to the default')}
function bindSplit(el,kf,fromX,dir){
  el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);el.classList.add('drag');document.body.classList.add('dragging')});
  el.addEventListener('pointermove',e=>{if(el.hasPointerCapture&&el.hasPointerCapture(e.pointerId))splitSet(kf(),fromX(e.clientX),false)});
  const end=e=>{if(el.classList.contains('drag')){el.classList.remove('drag');document.body.classList.remove('dragging');splitSave()}};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  el.addEventListener('dblclick',()=>splitReset(kf()));
  el.addEventListener('keydown',e=>{
    const k=kf(),cur=splitVal(k);let v=null;
    if(e.key==='ArrowRight')v=cur+SPSTEP*dir;else if(e.key==='ArrowLeft')v=cur-SPSTEP*dir;
    else if(e.key==='Home')v=SPMIN[k];else if(e.key==='End')v=splitMax(k);
    else if(e.key==='Enter'){e.preventDefault();splitReset(k);return}
    if(v===null)return;e.preventDefault();splitSet(k,v,true);
  });
}

    const dp=$('.dpanel'),f=$$('button,input,select,textarea,a[href],[contenteditable=true],[tabindex="0"]',dp).filter(x=>!x.disabled&&x.offsetParent!==null&&x.getAttribute('tabindex')!=='-1'||x===document.activeElement);
    if(!f.length)return;

    if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus()}
    else if(!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus()}
  }
});

/* ====================== sanitiser (what the SERVER would do) ====================== */
const ALLOW={P:1,BR:1,STRONG:1,EM:1,U:1,UL:1,OL:1,LI:1,BLOCKQUOTE:1,H1:1,H2:1,H3:1,A:1,TABLE:1,THEAD:1,TBODY:1,TR:1,TH:1,TD:1,SPAN:1};
const DROP=new Set(['svg','SCRIPT','STYLE','IFRAME','OBJECT','EMBED','IMG','SVG','LINK','META','FORM','INPUT','BUTTON','VIDEO','AUDIO','CANVAS','NOSCRIPT','TEMPLATE']);
const RA=[['data-user-id',/^u\d+$/,n=>n.textContent.replace(/\s+/g,' ').trim().slice(0,80)],['data-asset-id',/^a\d+$/,(n,id)=>((ASSET(id)||{}).name||n.textContent).slice(0,120)],['data-task-id',/^t\d+$/,(n,id)=>{const t=TASK(id);return (t?tcode(t)+' '+t.title:n.textContent).slice(0,160)}],['data-project-id',/^p\d+$/,(n,id)=>((PROJECT(id)||{}).name||n.textContent).slice(0,120)]];
function sanitize(html){
  const doc=new DOMParser().parseFromString('<body>'+html+'</body>','text/html');
  const out=doc.createElement('div');
  (function walk(src,dst){
    src.childNodes.forEach(n=>{
      if(n.nodeType===3){dst.appendChild(doc.createTextNode(n.textContent));return}
      if(n.nodeType!==1)return;
      let tag=n.nodeName;if(DROP.has(tag))return;
      if(tag==='B')tag='STRONG';if(tag==='I')tag='EM';if(tag==='DIV')tag='P';
      if(tag==='SPAN'){
        // a mention or a reference: ONE data attribute, no class, no style, no other attribute
        const hit=RA.find(r=>n.hasAttribute(r[0])&&r[1].test(n.getAttribute(r[0])));
        if(hit){const sp=doc.createElement('span'),id=n.getAttribute(hit[0]);sp.setAttribute(hit[0],id);sp.textContent=hit[2](n,id);dst.appendChild(sp)}
        else walk(n,dst);return}
      if(!ALLOW[tag]){walk(n,dst);return}
      if(tag==='A'){const h=n.getAttribute('href')||'';if(!URL_OK(h.trim())){walk(n,dst);return}const a=doc.createElement('a');a.setAttribute('href',h.trim());a.setAttribute('rel','noopener');walk(n,a);dst.appendChild(a);return}
      const e=doc.createElement(tag.toLowerCase());walk(n,e);dst.appendChild(e);
    });
  })(doc.body,out);
  return out.innerHTML.replace(/<p><br><\/p>$/,'');
}

    return;
  }
  const h=openDlg({title:'Delete “'+t.name+'”?',icon:'i-trash',iconCls:'red',alert:true,w:480,
    body:'<p>No note uses this tag. Deleting it removes it from the list for good.</p>',
    footer:'<button type="button" class="btn" data-close data-focus>Cancel</button><button type="button" class="btn danger" data-ok>Delete tag</button>'});
  $('[data-close]',h.el).onclick=()=>h.close();
  $('[data-ok]',h.el).onclick=()=>{TAGS=TAGS.filter(x=>x.id!==id);S.ftags=S.ftags.filter(x=>x!==id);h.close(false);renderAdmin();toast('Tag deleted')};
}

/* ====================== page-level events ====================== */
const ACT={
  new:()=>newNote(),
  view:()=>{},
  toggleall:()=>{const open=groupsOf(NOTES).some(g=>!S.collapsed[g.id]);groupsOf(NOTES).forEach(g=>S.collapsed[g.id]=open);renderList();const b=$('[data-act=toggleall]');if(b)b.focus()},
  clearq:()=>{S.q='';const q=$('#nq');if(q){q.value='';q.focus()}$('[data-act=clearq]').hidden=true;renderList()},
  clearfilters:()=>{S.q='';S.ftags=[];S.rail='all';renderHead();renderList()},
  railmin:()=>{S.railMin=!S.railMin;renderList();const b=$('[data-act=railmin]');if(b)b.focus()},
  treemin:()=>{S.treeMin=!S.treeMin;const b=S.treeMin;renderMy();syncLayout();const x=$('[data-act=treemin]');if(x)x.focus()},
  tagfilter:el=>{
    const lab=()=>{const ft=S.ftags.map(t=>t==='_none'?'Untagged':(TAG(t)||{}).name);if(S.onlyLocked)ft.push('Locked');return ft};
    dropdown({anchor:el,label:'Filter by tag or lock',multi:true,search:true,placeholder:'Search tags',width:300,selected:S.ftags.concat(S.onlyLocked?['_locked']:[]),none:'No tag with that name',
      items:()=>[{id:'_locked',label:'Locked',count:NOTES.filter(n=>n.lock).length}].concat(sortedTags().map(t=>({id:t.id,label:t.name+(t.active?'':' (inactive)'),dot:PAL(t.c).fg,count:tagCount(t.id)}))).concat([{id:'_none',label:'Untagged',count:NOTES.filter(n=>!n.tags.length).length}]),
      footNote:sel=>sel.size?sel.size+' selected':'All notes shown',
      onChange:set=>{S.onlyLocked=set.has('_locked');S.ftags=Array.from(set).filter(x=>x!=='_locked');renderList();const b=$('[data-act=tagfilter]');if(b){const ft=lab();b.classList.toggle('on',ft.length>0);b.querySelector('.val').textContent=ft.length?ft[0]+(ft.length>1?' +'+(ft.length-1):''):'All';b.setAttribute('aria-label','Filter by tag or lock: '+(ft.length?ft.join(', '):'all'))}}});
  },
  newmenu:el=>{
    dropdown({anchor:el,label:'New note',selected:[],width:240,items:()=>[{id:'blank',label:'Blank note'},{id:'tpl',label:'From template...'}],onChange:id=>{setTimeout(()=>{if(id==='blank')newNote();else chooseTemplateDialog()},0)}});
  },
  tplnew:()=>guard(()=>{E={tpl:true,isNew:true,mode:'edit',tags:[],dirty:false};S.openId='tpl_new';renderList();syncLayout();if(panelHost()==='dock')S.wide=true;syncLayout();fillPanel();hashWrite();const t=$('#ntitle');if(t)t.focus()}),
  tpluse:el=>useTemplate(el.dataset.id),
  tpldup:el=>dupTemplate(el.dataset.id),
  tpldel:el=>delTemplate(el.dataset.id),
  tpledit:el=>{const t=TPL(el.dataset.id);if(!t)return;guard(()=>{E={tpl:true,id:t.id,isNew:false,mode:'edit',tags:t.tags.slice(),dirty:false};S.openId='tpl_'+t.id;renderList();syncLayout();if(panelHost()==='dock')S.wide=true;syncLayout();fillPanel();hashWrite();const ti=$('#ntitle');if(ti)ti.focus()})},
  sort:el=>{
    dropdown({anchor:el,label:'Sort notes',selected:[S.sort],width:240,items:()=>[{id:'upd',label:'Updated, newest'},{id:'updasc',label:'Updated, oldest'},{id:'title',label:'Title A to Z'},{id:'cr',label:'Created, newest'}],
      onChange:id=>{S.sort=id;renderHead();renderList();const b=$('[data-act=sort]');if(b)setTimeout(()=>b.focus(),0)}});
  },
  tagnew:()=>tagDialog(null),tagedit:el=>tagDialog(el.dataset.id),tagtoggle:el=>tagToggle(el.dataset.id),tagdel:el=>tagDelete(el.dataset.id)
};
$('#page').addEventListener('click',e=>{
  const dis=e.target.closest('[aria-disabled=true][data-reason]');if(dis){toast(dis.dataset.reason);return}
  const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act]){ACT[a.dataset.act](a,e);return}
  const v=e.target.closest('[data-view]');if(v){S.view=v.dataset.view;S.wide=false;renderHead();renderList();syncLayout();hashWrite();const b=$('[data-view="'+v.dataset.view+'"]');if(b)b.focus();return}
  const g=e.target.closest('[data-grp]');if(g){const id=g.dataset.grp;S.collapsed[id]=!S.collapsed[id];g.setAttribute('aria-expanded',String(!S.collapsed[id]));g.closest('.grp').classList.toggle('closed',!!S.collapsed[id]);setToggleAll();return}
  const r=e.target.closest('[data-rail]');if(r){S.rail=r.dataset.rail;renderList();const b=$('[data-rail="'+S.rail+'"]'+(e.target.closest('.chiprow')?'':'')) ;if(b)b.focus();return}
  const n=e.target.closest('[data-note]');if(n){openNote(n.dataset.note,e.detail===0);return}
  const j=e.target.closest('[data-jump]');if(j){guard(()=>{E=null;S.openId=null;S.tab=j.dataset.tab;renderScreen();const t=$('#tab-notes');if(t)t.focus()});return}
  const on=e.target.closest('[data-opennote]');if(on){const id=on.dataset.opennote;guard(()=>{E=null;S.tab='notes';renderScreen();openNote(id,true)});return}
  const go=e.target.closest('[data-go]');if(go){e.preventDefault();navTo(go.dataset.go);return}
  const t=e.target.closest('[data-toast]');if(t){toast(t.dataset.toast)}
});
$('#page').addEventListener('input',e=>{
  if(e.target.id==='nq'){S.q=e.target.value;const c=$('[data-act=clearq]');if(c)c.hidden=!S.q;renderList()}
});
$('#page').addEventListener('mouseover',e=>{const n=e.target.closest('[data-note]');if(n)twin(n.dataset.note,true)});
$('#page').addEventListener('mouseout',e=>{const n=e.target.closest('[data-note]');if(n)twin(n.dataset.note,false)});
$('#page').addEventListener('focusin',e=>{const n=e.target.closest('[data-note]');if(n)twin(n.dataset.note,true)});
$('#page').addEventListener('focusout',e=>{const n=e.target.closest('[data-note]');if(n)twin(n.dataset.note,false)});
function navTo(s){guard(()=>{E=null;S.openId=null;S.screen=s;if(s==='matter'&&!['overview','tasks','projects','assets','notes'].includes(S.tab))S.tab='notes';renderScreen()})}
$('#nav').addEventListener('click',e=>{
  const a=e.target.closest('a');if(!a)return;e.preventDefault();
  if(a.dataset.go)navTo(a.dataset.go);else toast('Mockup: this menu item is not part of the Notes review.');
  $('#shell').classList.remove('navopen');$('#burger').setAttribute('aria-expanded','false');
});
document.addEventListener('click',e=>{const t=e.target.closest('.top [data-toast]');if(t)toast(t.dataset.toast)});
$('#burger').addEventListener('click',()=>{const s=$('#shell');s.classList.toggle('navopen');$('#burger').setAttribute('aria-expanded',String(s.classList.contains('navopen')))});
$('#scrim').addEventListener('click',()=>{$('#shell').classList.remove('navopen');$('#burger').setAttribute('aria-expanded','false')});

/* ====================== Mockup panel ====================== */
function radio(name,opts,cur){return '<fieldset><legend>'+opts.legend+'</legend>'+opts.items.map(o=>'<label><input type="radio" name="'+name+'" value="'+o[0]+'"'+(o[0]===cur?' checked':'')+'><span>'+o[1]+(o[2]?'<small>'+o[2]+'</small>':'')+'</span></label>').join('')+'</fieldset>'}
function mockHTML(){
  return '<div class="mockpanel" id="mockpanel" role="group" aria-label="Mockup controls" hidden><h2>Mockup controls</h2>'
   +radio('screen',{legend:'Screen',items:[['matter','Matter page, Notes tab'],['mymatters','My Matters page, Notes tab'],['admin','Admin: Labels, Notes tags']]},S.screen)
   +radio('opt',{legend:'Design option',items:[['A','A  Grouped list + editor panel','Recommended'],['B','B  Tag rail + notes + reader'],['C','C  Tag board']]},S.opt)
   +radio('role',{legend:'Role (note permissions)',items:[['reader','Reader','Matter Note Read: read only'],['editor','Editor','Read + Edit: no Delete (button disabled with the reason)'],['editdel','Editor + Delete','Read + Edit + Delete'],['admin','Administrator','All three, and Label manage (Notes tags)']]},S.role)
   +radio('data',{legend:'Notes on the matter',items:[['normal','12 notes'],['locked','12 notes, 2 locked (by Priya Nair)'],['many','120 notes (scrolls in its frame)'],['empty','None (empty matter)']]},S.data)
   +radio('tagmode',{legend:'Tags per note',items:[['many','Many tags (notes repeat in groups)'],['one','One tag only (no repeats)']]},S.tagmode)
   +'<fieldset><legend>More</legend><label><input type="checkbox" id="mSens"'+(S.sens?' checked':'')+'><span>Sensitive matter</span></label><label><input type="checkbox" id="mLoad"'+(S.loading?' checked':'')+'><span>Loading state (skeleton)</span></label></fieldset>'
   +'<div class="row"><button type="button" class="btn sm" id="mConf">Simulate: someone else saved</button><button type="button" class="btn sm" id="mLock">Simulate: someone locks the note</button><button type="button" class="btn sm" id="mHtml">Show stored HTML</button><button type="button" class="btn sm ghost" id="mReset">Reset</button></div>'
   +'<p class="note" style="margin:0">The address keeps these settings, so a link opens the same state. Sample data only; nothing is saved.</p></div>';
}
function syncMock(){
  const set=(n,v)=>$$('input[name='+n+']').forEach(i=>i.checked=i.value===v);
  set('screen',S.screen);set('opt',S.opt);set('role',S.role);set('data',S.data);set('tagmode',S.tagmode);
  const a=$('#mSens'),b=$('#mLoad');if(a)a.checked=S.sens;if(b)b.checked=S.loading;
}
function mountMock(){
  $('#mockhost').innerHTML=mockHTML();
  const btn=$('#mockbtn'),pn=$('#mockpanel');
  btn.addEventListener('click',()=>{pn.hidden=!pn.hidden;btn.setAttribute('aria-expanded',String(!pn.hidden))});
  pn.addEventListener('keydown',e=>{if(e.key==='Escape'){pn.hidden=true;btn.setAttribute('aria-expanded','false');btn.focus()}});
  pn.addEventListener('change',e=>{
    const t=e.target,n=t.name;
    if(t.id==='mSens'){S.sens=t.checked;guard(()=>{renderScreen()});syncMock();return}
    if(t.id==='mLoad'){S.loading=t.checked;if($('#ncontent'))renderList();return}
    const v=t.value;
    guard(()=>{
      E=null;
      if(n==='screen'){S.screen=v;S.openId=null;if(v==='matter'&&!['overview','tasks','projects','assets','notes'].includes(S.tab))S.tab='notes'}
      else if(n==='opt'){S.opt=v;S.wide=false;S.openId=null;S.view=v==='C'?'board':'tag';if(v==='B')S.rail='all'}
      else if(n==='role'){S.role=v}
      else if(n==='data'){S.data=v;S.openId=null;loadNotes()}
      else if(n==='tagmode'){S.tagmode=v;S.openId=null;loadNotes()}
      renderScreen();syncMock();
    });
    syncMock();
  });
  $('#mConf',pn).onclick=simulateConflict;$('#mLock',pn).onclick=simulateLock;
  $('#mHtml',pn).onclick=()=>{
    const n=(S.openId&&S.openId!=='new'?noteById(S.openId):null)||NOTES[0];
    if(!n){toast('No note to show.');return}
    const html=(E&&E.mode==='edit'&&ED&&E.id===n.id)?sanitize(ED.innerHTML):sanitize(n.html);
    const h=openDlg({title:'Stored HTML after the server allow-list',icon:'i-info',w:720,
      body:'<p class="note">What the server keeps for <b>'+esc(n.title)+'</b>: sanitised HTML (allow-list), plus a plain-text copy for search. '+html.length+' characters.</p><div><b>HTML</b><pre style="white-space:pre-wrap;word-break:break-all;background:var(--soft);border:1px solid var(--border);border-radius:8px;padding:10px;max-height:220px;overflow:auto;font:12px/1.4 var(--mono);margin:6px 0 0">'+esc(html)+'</pre></div><div><b>Plain text for search</b><pre style="white-space:pre-wrap;background:var(--soft);border:1px solid var(--border);border-radius:8px;padding:10px;max-height:120px;overflow:auto;font:12px/1.4 var(--mono);margin:6px 0 0">'+esc(plain(html))+'</pre></div>',
      footer:'<button type="button" class="btn" data-close data-focus>Close</button>'});
    $('[data-close]',h.el).onclick=()=>h.close();
  };
  $('#mReset',pn).onclick=()=>guard(()=>{Object.assign(S,{histMin:false,onlyLocked:false,screen:'matter',opt:'A',role:'editdel',data:'normal',tagmode:'many',sens:false,loading:false,tab:'notes',view:'tag',q:'',ftags:[],sort:'upd',collapsed:{},rail:'all',openId:null,wide:false,atab:'notes'});E=null;TAGS=BASE_TAGS();loadNotes();renderScreen();syncMock()});
}
const BASE_TAGS=()=>[
{id:'g1',name:'Client instructions',c:'green',active:true},{id:'g2',name:'Custodians',c:'blue',active:true},{id:'g3',name:'Deadlines',c:'rose',active:true},{id:'g4',name:'Hold notices',c:'amber',active:true},{id:'g5',name:'Hosting',c:'teal',active:true},{id:'g6',name:'Legacy workflow',c:'slate',active:false},{id:'g7',name:'Privilege',c:'red',active:true},{id:'g8',name:'Production specs',c:'indigo',active:true},{id:'g9',name:'QC findings',c:'orange',active:true},{id:'g10',name:'Search terms',c:'violet',active:true}];
window.addEventListener('hashchange',()=>{
  const before=location.hash;
  guard(()=>{hashRead();E=null;loadNotes();S.openId=null;renderScreen();syncMock()});
});

/* ====================== start ====================== */
hashRead();
loadNotes();
mountMock();
renderScreen();
})();
</script>
