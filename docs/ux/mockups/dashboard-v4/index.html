<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LPT Hub - Dashboard mockup v4</title>
<style>
:root{
  /* Tokens inlined from docs/ux/tokens.css (neutrals, feedback, palette, semantic). Names kept (--mf-*). */
  --mf-bg:#f5f6f8;--mf-surface:#fff;--mf-surface-alt:#eef0f4;--mf-row-hover:#eaf0fb;--mf-border:#c9ced8;--mf-border-strong:#6b7280;
  --mf-text:#1b1f27;--mf-text-muted:#4b5563;--mf-primary:#1f4e9c;--mf-primary-hover:#173c79;--mf-link:#1f4e9c;--mf-focus:#b45309;--mf-selected-bg:#e3ecfa;
  --mf-nav-bg:#1a3556;--mf-nav-text:#eaf1fa;--mf-nav-text-muted:#b4c3d8;--mf-nav-hover-bg:#2b4b75;--mf-nav-focus:#ffc15a;
  --mf-danger:#b42318;--mf-danger-bg:#fdecea;
  --mf-p-red-fg:#b42318;--mf-p-red-bg:#fdecea;--mf-p-red-solid:#c62828;--mf-p-red-line:#f4c7c2;
  --mf-p-amber-fg:#8a4b00;--mf-p-amber-bg:#fff4db;--mf-p-amber-solid:#b45309;--mf-p-amber-line:#f1d9a0;
  --mf-p-blue-fg:#1f4e9c;--mf-p-blue-bg:#e3ecfa;--mf-p-blue-solid:#1f4e9c;--mf-p-blue-line:#c3d5f2;
  --mf-p-teal-fg:#0b6b5f;--mf-p-teal-bg:#ddf3ef;--mf-p-teal-solid:#0f766e;--mf-p-teal-line:#b5e0d9;
  --mf-p-violet-fg:#5b3fa6;--mf-p-violet-bg:#efeafb;--mf-p-violet-solid:#6d4bc2;--mf-p-violet-line:#d6cbf1;
  --mf-p-orange-fg:#9a3a06;--mf-p-orange-bg:#fdebdc;--mf-p-orange-solid:#c2410c;--mf-p-orange-line:#f5cdae;
  --mf-p-slate-fg:#475569;--mf-p-slate-bg:#eef1f5;--mf-p-slate-solid:#475569;--mf-p-slate-line:#cbd2dc;
  --mf-tag-red-fg:#7a1b12;--mf-border-soft:#d5d9e1;
  --mf-font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  /* PROPOSED new tokens (capacity ramp, light = free, dark = loaded; derived from existing blue). Not in the app yet. */
  --mf-cap-0:color-mix(in srgb,var(--mf-p-blue-solid) 12%,#fff);
  --mf-cap-1:color-mix(in srgb,var(--mf-p-blue-solid) 32%,#fff);
  --mf-cap-2:color-mix(in srgb,var(--mf-p-blue-solid) 55%,#fff);
  --mf-cap-3:var(--mf-primary-hover);
  /* PROPOSED unassigned-wait ramp, level 0 to 5 */
  --mf-wait-0:var(--mf-p-teal-solid);--mf-wait-1:var(--mf-p-amber-line);--mf-wait-2:var(--mf-p-amber-solid);
  --mf-wait-3:var(--mf-p-orange-solid);--mf-wait-4:var(--mf-p-red-solid);--mf-wait-5:var(--mf-tag-red-fg);
  --gut:24px;--rc:340px;--pop:0 12px 32px rgba(16,24,40,.18),0 2px 6px rgba(16,24,40,.1);
}
@media (max-width:1100px){:root{--rc:300px}}
@media (max-width:767px){:root{--gut:16px}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--mf-bg);color:var(--mf-text);font:14px/1.45 var(--mf-font);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}button{cursor:pointer}
h1,h2,h3,p{margin:0}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:15px;height:15px}svg.i.xs{width:13px;height:13px}
:focus-visible{outline:2px solid var(--mf-focus);outline-offset:2px;border-radius:6px}
.side :focus-visible,.top .mkb:focus-visible{outline-color:var(--mf-nav-focus)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:#fff;padding:10px 14px;border-radius:8px;z-index:200;font-weight:600}.skip:focus{top:8px}
/* tones */
.t-red{--tone:var(--mf-p-red-solid);--tbg:var(--mf-p-red-bg);--tink:var(--mf-p-red-fg);--tbd:var(--mf-p-red-line)}
.t-amber{--tone:var(--mf-p-amber-solid);--tbg:var(--mf-p-amber-bg);--tink:var(--mf-p-amber-fg);--tbd:var(--mf-p-amber-line)}
.t-blue{--tone:var(--mf-p-blue-solid);--tbg:var(--mf-p-blue-bg);--tink:var(--mf-p-blue-fg);--tbd:var(--mf-p-blue-line)}
.t-teal{--tone:var(--mf-p-teal-solid);--tbg:var(--mf-p-teal-bg);--tink:var(--mf-p-teal-fg);--tbd:var(--mf-p-teal-line)}
.t-violet{--tone:var(--mf-p-violet-solid);--tbg:var(--mf-p-violet-bg);--tink:var(--mf-p-violet-fg);--tbd:var(--mf-p-violet-line)}
.t-orange{--tone:var(--mf-p-orange-solid);--tbg:var(--mf-p-orange-bg);--tink:var(--mf-p-orange-fg);--tbd:var(--mf-p-orange-line)}
.t-slate{--tone:var(--mf-p-slate-solid);--tbg:var(--mf-p-slate-bg);--tink:var(--mf-p-slate-fg);--tbd:var(--mf-p-slate-line)}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;background:var(--tbg);color:var(--tink);font-weight:600;font-size:12px;white-space:nowrap;border:1px solid var(--tbd)}
.pill svg.i{width:12px;height:12px}
/* buttons (theme rule: secondary = white outline, primary = filled, text = link, icon) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--mf-border-strong);background:#fff;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--mf-bg)}.btn.on{background:var(--mf-selected-bg);border-color:var(--mf-primary);color:var(--mf-primary)}
.btn.pri{background:var(--mf-primary);border-color:var(--mf-primary);color:#fff}
.btn.txt{border-color:transparent;background:none;color:var(--mf-link);font-weight:400;padding:0 8px}.btn.txt:hover{background:var(--mf-p-blue-bg)}
.btn.ico{width:32px;padding:0}
.btn[disabled]{color:#6b7280;border-color:var(--mf-border);cursor:not-allowed}
.badge{background:var(--mf-primary);color:#fff;border-radius:999px;min-width:18px;height:18px;padding:0 5px;font-size:12px;display:inline-grid;place-items:center}
/* shell */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{background:var(--mf-nav-bg);color:var(--mf-nav-text);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:0 10px 10px;z-index:60}
.brand{display:flex;align-items:center;gap:10px;height:56px;color:#fff;font-weight:700;font-size:18px;padding:0 6px;flex:none}
.brand b{width:30px;height:30px;border-radius:8px;background:#1d4e89;box-shadow:0 0 0 1px rgba(255,255,255,.25);display:grid;place-items:center;font-size:14px}
.nav{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;border-radius:6px;color:var(--mf-nav-text);text-decoration:none}
.nav a:hover{background:var(--mf-nav-hover-bg)}
.nav a[aria-current=page]{background:#fff;color:#17324f;font-weight:700}
.ver{margin-top:auto;padding:10px 12px 0;font-size:13px;color:var(--mf-nav-text-muted)}
.scrim{display:none}
.col{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.top{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--mf-border);height:56px;display:flex;align-items:center;gap:12px;padding:0 var(--gut);flex:none}
.burger{display:none}
.gs{position:relative;flex:1 1 auto;max-width:460px}
.gs input{width:100%;height:34px;border:1px solid var(--mf-border-strong);border-radius:6px;padding:0 10px 0 34px;background:#fff}
.gs svg{position:absolute;left:10px;top:8px;color:var(--mf-text-muted)}
.spacer{flex:1 1 0}
.mkb{display:inline-flex;gap:6px;align-items:center;height:34px;padding:0 12px;border-radius:6px;border:1px dashed var(--mf-primary);background:#fff;color:var(--mf-primary);font-weight:600}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--mf-p-slate-bg);color:var(--mf-p-slate-fg);flex:none}
/* fixed page */
main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:14px var(--gut) 16px}
.page{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:12px}
.hrow{display:flex;align-items:center;gap:12px;flex:none}
.ttl{display:flex;align-items:center;gap:10px}
.ttl .chip{width:30px;height:30px;border-radius:8px;background:var(--mf-primary);color:#fff;display:grid;place-items:center}
.ttl h1{font-size:19px;font-weight:600;line-height:1.2}
.ttl small{display:block;color:var(--mf-text-muted);font-size:13px}
.hr{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--mf-text-muted);font-size:13px}
.trow{display:flex;align-items:flex-end;gap:12px;flex:none;border-bottom:1px solid var(--mf-border)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;height:38px;padding:0 14px;font-weight:400;color:var(--mf-text-muted);white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.tabs button:hover{color:var(--mf-text)}
.tabs button[aria-selected=true]{color:var(--mf-primary);border-bottom-color:var(--mf-primary);font-weight:700}
.scope{display:flex;align-items:center;gap:8px;padding-bottom:4px;flex:none;font-size:13px;color:var(--mf-text-muted)}
.dd{position:relative}
.dd select{appearance:none;-webkit-appearance:none;height:32px;border:1px solid var(--mf-border-strong);border-radius:6px;background:#fff;padding:0 30px 0 10px;font-weight:600;max-width:200px}
.dd svg{position:absolute;right:9px;top:8px;pointer-events:none;color:var(--mf-text-muted)}
/* cards */
.cards{display:grid;grid-template-columns:repeat(var(--nc,4),minmax(0,1fr));gap:12px;flex:none}
.card{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:1px solid var(--mf-border-soft);border-radius:12px;padding:10px 14px;min-height:72px;position:relative;width:100%}
.card:hover{background:var(--mf-row-hover)}
.card .ci{width:38px;height:38px;border-radius:10px;background:var(--tone);color:#fff;display:grid;place-items:center;flex:none}
.card .n{font-size:28px;font-weight:700;line-height:1;color:var(--mf-text)}
.card .l{font-weight:600;line-height:1.2}
.card .h{font-size:12px;color:var(--mf-text-muted);line-height:1.25}
.card .chk{position:absolute;right:10px;top:8px;width:20px;height:20px;border-radius:50%;background:var(--tone);color:#fff;display:none;place-items:center}
.card[aria-pressed=true]{background:var(--tbg);box-shadow:0 0 0 2px var(--tone);border-color:transparent}
.card[aria-pressed=true] .chk{display:grid}
.card.zero .ci{background:var(--mf-p-teal-solid)}
.card.zero .h{color:var(--mf-p-teal-fg);font-weight:600}
/* body */
.body{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--rc);gap:12px}
.body.one{grid-template-columns:minmax(0,1fr)}
.frame{position:relative;background:#fff;border:1px solid var(--mf-border-soft);border-radius:12px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.ghd{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;flex-wrap:wrap}
.ghd h2{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;margin-right:4px}
.cnt{background:var(--mf-surface-alt);border-radius:999px;padding:0 9px;font-size:13px;font-weight:600;line-height:22px}
.sbox{position:relative;width:190px;max-width:100%}
.sbox input{width:100%;height:32px;border:1px solid var(--mf-border-strong);border-radius:6px;padding:0 26px 0 30px;background:#fff}
.sbox svg{position:absolute;left:9px;top:8px;color:var(--mf-text-muted)}
.sbox .x{position:absolute;right:2px;top:2px;width:28px;height:28px;border:0;background:none;display:grid;place-items:center}
.sp{flex:1 1 0}
.sorted{font-size:13px;color:var(--mf-text-muted);min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchips{display:flex;gap:6px;align-items:center;padding:0 12px 8px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 4px 0 10px;border-radius:999px;background:var(--mf-selected-bg);color:var(--mf-primary);font-size:13px;font-weight:600;border:1px solid var(--mf-p-blue-line)}
.fchip button{border:0;background:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:inherit;padding:0}
.fchip button:hover{background:#fff}
.frow{display:flex;gap:8px;flex-wrap:wrap;padding:0 12px 8px}
.frow label{font-size:13px;color:var(--mf-text-muted);display:flex;align-items:center;gap:6px}
.scroll{position:relative;flex:1 1 auto;min-height:0;overflow:auto;border-top:1px solid var(--mf-border-soft)}
table.tt{border-collapse:separate;border-spacing:0;min-width:100%;width:max-content}
.tt th{position:sticky;top:0;z-index:3;background:var(--mf-surface-alt);text-align:left;font-size:13px;font-weight:700;height:40px;padding:0 10px;white-space:nowrap;border-bottom:1px solid var(--mf-border)}
.tt th button{background:none;border:0;padding:0;font-weight:700;display:inline-flex;gap:4px;align-items:center;height:32px}
.tt td{height:44px;padding:2px 10px;border-bottom:1px solid var(--mf-border-soft);vertical-align:middle;white-space:nowrap;background:#fff}
.tt tbody tr:hover td{background:var(--mf-row-hover)}
.tt .pin{position:sticky;left:0;z-index:2;border-right:1px solid var(--mf-border-soft)}
.tt th.pin{z-index:4}
.tt .ttl2{min-width:230px;max-width:340px;white-space:normal;line-height:1.25}
.ref{font-family:Consolas,"Cascadia Mono",monospace;color:var(--mf-link);font-size:13px}
.sub{display:block;font-size:12px;color:var(--mf-text-muted)}
.od{color:var(--mf-danger);font-weight:600}
.prog{display:inline-flex;align-items:center;gap:6px}
.prog i{display:block;width:56px;height:6px;border-radius:3px;background:var(--mf-surface-alt);overflow:hidden}
.prog i b{display:block;height:100%;background:var(--mf-p-blue-solid)}
.pg{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--mf-border-soft);flex-wrap:wrap;font-size:13px;color:var(--mf-text-muted);flex:none}
.pg .btn{height:28px;padding:0 8px;font-size:13px}
.pg select{height:28px;border:1px solid var(--mf-border-strong);border-radius:6px;background:#fff}
.msg{padding:28px 16px;text-align:center;color:var(--mf-text-muted)}
.msg b{display:block;color:var(--mf-text);font-size:15px;margin-bottom:4px}
.tcards{display:none}
/* right column */
.rcol{position:relative;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;padding:2px}
.panel{background:#fff;border:1px solid var(--mf-border-soft);border-radius:12px;padding:12px 14px;flex:none}
.panel h2{white-space:nowrap;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.panel .ph{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.panel .ph .btn{margin-left:auto}
.big{font-size:34px;font-weight:700;line-height:1}
.bigrow{display:flex;align-items:flex-end;gap:10px;margin-bottom:10px}
.bigrow small{display:block;color:var(--mf-text-muted);font-size:12px;line-height:1.3}
.state-w{margin-left:auto}
/* battery */
.bat{display:flex;align-items:stretch}
.shellb{flex:1 1 auto;min-width:0;border:2px solid var(--mf-border-strong);border-radius:10px;padding:5px;background:#fff}
.cap{width:6px;margin:12px 0;background:var(--mf-border-strong);border-radius:0 4px 4px 0;flex:none}
.cells{display:flex;flex-wrap:wrap;gap:3px}
.cells.bars{flex-wrap:nowrap}
.cell{border:0;border-radius:4px;display:grid;place-items:center;font-weight:700;font-size:12px;padding:0;position:relative;flex:none;color:var(--mf-text)}
.cells.bars .cell{flex:1 1 0;min-width:0;max-width:64px;height:72px;align-content:center;gap:2px;font-size:18px}
.cells.bars .cell small{font-size:12px;font-weight:600;line-height:1}
.cells.sq .cell{width:var(--s);height:var(--s);font-size:11px;border-radius:3px;align-content:center;gap:1px}
.cells.sq .cell small{font-size:10px;font-weight:600;line-height:1}
.cells.sq.big .cell{font-size:15px}
.c-av{background:var(--mf-cap-0)}.c-oc{background:var(--mf-cap-1)}.c-bu{background:var(--mf-cap-2)}
.c-ov{background:var(--mf-cap-3);color:#fff}
.c-out{background:repeating-linear-gradient(45deg,var(--mf-p-slate-bg) 0 4px,var(--mf-p-slate-line) 4px 7px);color:var(--mf-p-slate-fg)}
.c-off{background:#fff;color:var(--mf-p-slate-fg);box-shadow:inset 0 0 0 2px var(--mf-p-slate-solid)}
.c-off{box-shadow:none;border:2px dashed var(--mf-p-slate-solid)}
.cell:hover{outline:2px solid var(--mf-text);outline-offset:1px}
.cell[aria-pressed=true]{outline:3px solid var(--mf-focus);outline-offset:1px}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:10px}
.lg{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:6px;align-items:center;border:1px solid var(--mf-border-soft);background:#fff;border-radius:8px;padding:4px 8px;text-align:left;font-size:12px;line-height:1.2}
.lg:hover{background:var(--mf-row-hover)}
.lg[aria-pressed=true]{background:var(--mf-selected-bg);box-shadow:0 0 0 2px var(--mf-primary);border-color:transparent}
.lg .sw{width:16px;height:16px;border-radius:3px}
.lg b{font-size:17px;line-height:1.1}
.lg span.t{grid-column:1/-1;color:var(--mf-text-muted)}
.fine{font-size:12px;color:var(--mf-text-muted);margin-top:8px}
details.how{margin-top:8px;font-size:12px;color:var(--mf-text-muted)}
details.how summary{cursor:pointer;color:var(--mf-link)}
details.how ul{margin:6px 0 0;padding-left:18px}
/* gauge */
.lvl{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-weight:700;font-size:13px;background:var(--lbg,#fff);color:var(--lfg,#000);border:1px solid var(--lbd,transparent);position:relative}
.lvl.pulse::after{content:"";position:absolute;inset:-3px;border-radius:999px;border:2px solid var(--lbd);opacity:0;animation:pl 2.4s ease-out infinite}
@keyframes pl{0%{opacity:.7;transform:scale(.96)}100%{opacity:0;transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.lvl.pulse::after{animation:none;opacity:0}}
.rm .lvl.pulse::after{animation:none;opacity:0}
.L-1{--lbg:var(--mf-p-teal-bg);--lfg:var(--mf-p-teal-fg);--lbd:var(--mf-p-teal-line)}
.L0{--lbg:var(--mf-p-slate-bg);--lfg:var(--mf-p-slate-fg);--lbd:var(--mf-p-slate-line)}
.L1{--lbg:var(--mf-p-amber-bg);--lfg:var(--mf-p-amber-fg);--lbd:var(--mf-p-amber-line)}
.L2{--lbg:var(--mf-p-amber-bg);--lfg:var(--mf-p-amber-fg);--lbd:var(--mf-p-amber-solid)}
.L3{--lbg:var(--mf-p-orange-bg);--lfg:var(--mf-p-orange-fg);--lbd:var(--mf-p-orange-solid)}
.L4{--lbg:var(--mf-p-red-bg);--lfg:var(--mf-p-red-fg);--lbd:var(--mf-p-red-solid)}
.L5{--lbg:var(--mf-p-red-fg);--lfg:#fff;--lbd:var(--mf-tag-red-fg)}
.gbtn{display:block;width:100%;background:none;border:0;padding:0;text-align:center}
.gcount{font-size:26px;font-weight:700;line-height:1;display:block}
.gstats{display:flex;justify-content:center;gap:28px;margin-top:6px;text-align:center}
.gstats small{font-size:12px;color:var(--mf-text-muted)}
.gtxt{margin-top:6px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.gdo{font-size:13px;color:var(--mf-text);text-align:center;margin-top:6px}
.lamps{display:flex;gap:6px;justify-content:center;background:var(--mf-text);padding:8px 10px;border-radius:999px;width:max-content;margin:0 auto}
.lamp{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;border:2px solid #6b7280;color:#fff;background:#2b303a}
.lamp.on{border-color:#fff;color:#fff}
.lamp.cur{box-shadow:0 0 0 3px #fff}
.tube{display:flex;align-items:center;gap:0;margin:6px auto 0;max-width:260px}
.bulb{width:34px;height:34px;border-radius:50%;background:var(--bf);color:#fff;display:grid;place-items:center;flex:none;margin-right:-6px;z-index:1;border:2px solid var(--mf-border-strong)}
.tb{flex:1;height:18px;border:2px solid var(--mf-border-strong);border-radius:0 9px 9px 0;background:#fff;overflow:hidden}
.tb i{display:block;height:100%;background:var(--bf)}
.ticks{display:flex;justify-content:space-between;max-width:228px;margin:2px 0 0 auto;font-size:11px;color:var(--mf-text-muted);padding:0 2px 0 6px}

.pop{position:absolute;background:#fff;border:1px solid var(--mf-border);border-radius:12px;box-shadow:var(--pop);z-index:70;padding:8px}
#tip{position:fixed;z-index:300;background:var(--mf-text);color:#fff;border-radius:6px;padding:6px 9px;font-size:12px;max-width:260px;pointer-events:none;display:none;line-height:1.35}
.mock{position:relative}
.mpanel{right:0;top:42px;width:340px;max-height:calc(100vh - 70px);overflow:auto;font-size:13px}
.mpanel fieldset{border:1px solid var(--mf-border-soft);border-radius:8px;margin:0 0 8px;padding:6px 10px 8px}
.mpanel legend{font-weight:700;padding:0 4px}
.mpanel label{display:flex;gap:8px;align-items:flex-start;padding:2px 0}
.mpanel small{color:var(--mf-text-muted);display:block}
.mpanel .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mpanel input[type=number]{width:60px;height:28px;border:1px solid var(--mf-border-strong);border-radius:6px}
.people{position:absolute;right:14px;top:44px;width:min(380px,calc(100vw - 32px));max-height:330px;overflow:auto;z-index:60}
.people table{width:100%;border-collapse:collapse;font-size:13px}
.people td,.people th{padding:5px 6px;text-align:left;border-bottom:1px solid var(--mf-border-soft)}
.people button.rowb{background:none;border:0;padding:0;text-align:left;color:var(--mf-link)}
.alert{display:flex;gap:10px;align-items:center;background:var(--mf-p-amber-bg);color:var(--mf-p-amber-fg);border:1px solid var(--mf-p-amber-line);border-radius:8px;padding:6px 12px;font-size:13px;flex:none}
.err{background:var(--mf-danger-bg);color:var(--mf-danger);border-color:var(--mf-p-red-line)}
.sk{background:linear-gradient(90deg,var(--mf-surface-alt),#f8f9fb,var(--mf-surface-alt));background-size:200% 100%;border-radius:6px;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.rm .sk{animation:none}
.note{background:var(--mf-p-blue-bg);color:var(--mf-p-blue-fg);border:1px solid var(--mf-p-blue-line);border-radius:8px;padding:8px 12px;font-size:13px}
/* responsive */
@media (max-width:1023px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:-260px;top:0;width:240px;transition:left .15s}
  .side.open{left:0}.scrim.open{display:block;position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:55}
  .burger{display:inline-flex}.gs{display:none}
}
@media (max-width:767px),(max-height:560px){
  .col{min-height:0}

  .page{flex:none}

  .hr .upd{display:none}
}
@media (min-width:768px) and (min-height:561px){
  html,body{height:100%}

  .col{height:100vh;min-height:0}
}

function sorted(rows){const [k,d]=sortKey();const f={att:t=>[isOd(t)?0:1,PR[t.prio],t.due?+t.due:9e15],ref:t=>t.ref,type:t=>t.type[0],title:t=>t.title.toLowerCase(),cm:t=>t.cm,matter:t=>t.matter,proj:t=>t.proj,prio:t=>PR[t.prio],asg:t=>(t.who?nameOf(t.who):''),due:t=>t.due?+t.due:9e15,age:t=>-ageMs(t),status:t=>t.status,prog:t=>t.step}[k];

function batteryHtml(){
  const ws=workers();
  const head=`<div class="ph"><h2>${ic('battery')}Team capacity</h2>${ws.length?`<button class="btn" data-act="people" aria-expanded="${S.people}" data-k="people">${ic('users','s')}People</button>`:''}</div>`;
  if(!ws.length)return `<div class="panel" style="position:relative">${head}<div class="msg" style="padding:16px 4px"><b>No workers in this scope.</b>${S.n===0?'No one holds Workflow.Execute and belongs to a pod yet. Add the permission to a role and people to a pod in Administration.':'No pod member in this scope.'}<div style="margin-top:8px"><a class="btn" href="#">Open Pods</a></div></div></div>`;
  const cnt={};WORDER.forEach(k=>cnt[k]=0);ws.forEach(w=>cnt[w.st]++);
  const slots=3*ws.length;const free=ws.reduce((a,w)=>a+(w.st==='out'||w.st==='off'?0:Math.max(0,3-w.load)),0);
  const pct=Math.round(free/slots*100);const can_=ws.filter(w=>w.st!=='out'&&w.st!=='off'&&w.load<3).length;
  const lv=pct>=50?['Healthy','teal','check']:pct>=25?['Limited','amber','alert']:['Low','red','alert'];
  const sorted_=ws.slice().sort((a,b)=>WORDER.indexOf(a.st)-WORDER.indexOf(b.st)||a.name.localeCompare(b.name));
  const N=ws.length;const bars=N<=8;
  const cols=N<=12?6:N<=24?8:N<=48?13:16;const s=Math.floor((S.cardW-52-(cols-1)*3)/cols);
  const cell_=w=>{const tip=`${w.name}, ${w.pods}: ${WSTATE[w.st][0]}${w.st==='out'||w.st==='off'?'. '+w.note:''}. ${w.load} open task${w.load===1?'':'s'}`;
    const glyph=w.st==='out'?ic('ban','xs'):w.st==='off'?ic('moon','xs'):null;
    const num=glyph||(w.st==='ov'&&!bars?'3+':(w.load>=3?'3+':w.load));
    const inner=(bars||s>=28)?`${glyph||`<span>${w.load>=3?'3+':w.load}</span>`}<small>${w.ini}</small>`:num;
    return `<button class="cell c-${w.st}" data-tip="${esc(tip)}" aria-label="${esc(tip)}" aria-pressed="${!!S.wf&&S.wf.k==='w'&&S.wf.v===w.id}" data-act="worker" data-val="${w.id}" data-k="w-${w.id}">${inner}</button>`;};
  const legend=WORDER.filter(k=>cnt[k]||k!=='off').map(k=>`<button class="lg" data-act="wstate" data-val="${k}" aria-pressed="${!!S.wf&&S.wf.k==='s'&&S.wf.v===k}" data-k="ws-${k}"><span class="sw c-${k}" aria-hidden="true"></span><b>${cnt[k]}</b><span class="t">${k==='out'?'Out of office':k==='off'?'Off hours':WSTATE[k][0]}</span></button>`).join('');
  return `<div class="panel" style="position:relative" data-battery>${head}
   <div class="bigrow"><span class="big">${pct}%</span><small>free capacity<br>${can_} of ${N} people can take work now</small><span class="pill t-${lv[1]} state-w">${ic(lv[2])}${lv[0]}</span></div>
   <div class="bat"><div class="shellb"><div class="cells ${bars?'bars':'sq'} ${s>=28?'big':''}" style="--s:${s}px" role="group" aria-label="Capacity, one cell per person, lightest is most free">${sorted_.map(cell_).join('')}</div></div><div class="cap" aria-hidden="true"></div></div>
   <div class="legend" role="group" aria-label="Filter the task list by capacity state">${legend}</div>
      <details class="how"><summary>As of ${hm(now())}. How it is counted</summary><ul><li>Cell number = open tasks. Each person has 3 slots; free capacity = free slots / all slots.</li><li>Worker: holds Workflow.Execute${S.rule==='pod'?' and belongs to a pod':''}.</li><li>0 tasks Available, 1 Occupied, 2 Busy, 3 or more Overloaded${S.hold?'':' (On hold tasks not counted)'}.</li><li>Out of office or outside work hours: hatched or dashed, adds no free capacity.</li></ul></details>
   ${S.people?peopleHtml(ws):''}</div>`;}
function peopleHtml(ws){return `<div class="pop people" role="dialog" aria-label="People in the battery"><div style="display:flex;align-items:center;margin-bottom:4px"><b>People (${ws.length})</b><button class="btn ico" style="margin-left:auto" data-act="people" aria-label="Close people list" data-k="peopleclose">${ic('x','s')}</button></div><table><thead><tr><th>Name</th><th>State</th><th>Tasks</th></tr></thead><tbody>${ws.slice().sort((a,b)=>WORDER.indexOf(b.st)-WORDER.indexOf(a.st)||a.name.localeCompare(b.name)).map(w=>`<tr><td><button class="rowb" data-act="worker" data-val="${w.id}">${esc(w.name)}</button><span class="sub">${w.pods}${w.note?' - '+esc(w.note):''}</span></td><td>${WSTATE[w.st][0]}</td><td>${w.load}</td></tr>`).join('')}</tbody></table></div>`;}
/* gauge */
function arc(cx,cy,r,a0,a1){const f=a=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];const [x0,y0]=f(a0),[x1,y1]=f(a1);return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;}
function gaugeHtml(){
  const g=gauge();const L=g.lvl;const clsL='L'+L;
  const badge=`<span class="lvl ${clsL} ${L>=4?'pulse':''}" style="margin-left:auto">${L<0?ic('check','s')+'All clear':ic(L>=4?'flame':'alert','s')+(L===0?'Normal':'Level '+L+' <span aria-hidden="true">&middot;</span><span class="sr"> of 5, </span> '+LVLN[L])}</span>`;
  const title=`<div class="ph"><h2>${ic('gauge')}Unassigned wait</h2>${badge}</div>`;
  const colour=['var(--mf-wait-0)','var(--mf-wait-1)','var(--mf-wait-2)','var(--mf-wait-3)','var(--mf-wait-4)','var(--mf-wait-5)'];
  let vis='';
  if(S.gauge==='A'){
    const segs=[0,1,2,3,4,5].map(i=>{const a0=180+i*30+1.5,a1=180+(i+1)*30-1.5;const on=L>=0&&i<=L;
      return `<path d="${arc(130,122,96,a0,a1)}" stroke="${colour[i]}" stroke-width="20" fill="none" opacity="${L<0?.35:on?1:.28}"/>`;}).join('');
    const nums=[0,1,2,3,4,5].map(i=>{const a=(180+i*30+15)*Math.PI/180;return `<text x="${(130+118*Math.cos(a)).toFixed(1)}" y="${(126+118*Math.sin(a)).toFixed(1)}" text-anchor="middle" font-size="11" fill="#4b5563">${i}</text>`}).join('');
    const na=(L<0?180+3:180+L*30+15)*Math.PI/180;
    vis=`<svg viewBox="0 0 260 134" width="100%" style="max-width:215px;display:block;margin:0 auto" role="img" aria-label="Gauge, ${L<0?'clear':'level '+L+' of 5'}">${segs}${nums}<line x1="130" y1="122" x2="${(130+80*Math.cos(na)).toFixed(1)}" y2="${(122+80*Math.sin(na)).toFixed(1)}" stroke="#1b1f27" stroke-width="4" stroke-linecap="round"/><circle cx="130" cy="122" r="7" fill="#1b1f27"/></svg>`;
  } else if(S.gauge==='B'){
    vis=`<div class="lamps" role="img" aria-label="Signal lamps, ${L<0?'none lit':'level '+L}">${[0,1,2,3,4,5].map(i=>`<span class="lamp ${L>=0&&i<=L?'on':''} ${i===L?'cur':''}" style="${L>=0&&i<=L?`background:${colour[i]};${i===1?'color:#1b1f27':''}`:''}">${i}</span>`).join('')}</div>`;
  } else {
    const w=L<0?4:Math.max(8,(L+1)/6*100);
    vis=`<div class="tube" style="--bf:${L<0?colour[0]:colour[L]}"><span class="bulb">${ic(L>=4?'flame':'thermo')}</span><div class="tb"><i style="width:${w}%"></i></div></div><div class="ticks" aria-hidden="true"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>`;
  }
  const stats=`<div class="gstats"><div><span class="gcount">${g.n}</span><small>unassigned</small></div><div><span class="gcount">${g.n?fage(g.oldest):'-'}</span><small>oldest${S.hours==='work'?', working time':''}</small></div></div>`;
  const why=g.bonus>0?`<span class="fine" style="display:block;text-align:center;margin-top:2px">Oldest age gives level ${g.al}; ${g.n} waiting add ${g.bonus}.</span>`:'';
  return `<div class="panel" data-gauge data-level="${L}">${title}${vis}${stats}<p class="gdo">${DO[L+1]}</p>${why}
   ${g.n?`<button class="btn" style="width:100%;margin-top:8px" data-act="gauge-go" data-k="gauge-go">${ic('userMinus','s')}Show them, longest waiting first</button>`:''}</div>`;}

/* ---------- events ---------- */
function setCard(v){S.card=S.card===v?null:v;if(S.card==='unassigned'||S.card===null)S.sort=null;if(S.card)S.wf=S.card==='unassigned'?null:S.wf;S.page=1;S._resetScroll=true;
  const ca=document.querySelector('[data-cards]');if(S.card)$('#live').textContent='Filtered to '+{unassigned:'Unassigned',overdue:'Overdue',hold:'On hold',asap:'ASAP open'}[S.card]+': '+gridRows().length+' tasks.';else $('#live').textContent='Filter cleared.';}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b){if(S.colsOpen||S.people){/* click outside */const inside=e.target.closest('.pop');if(!inside){S.colsOpen=false;S.people=false;render();}}return;}
  const a=b.dataset.act,v=b.dataset.val;
  if(['q','fsel','scope','size','num'].includes(a)||b.tagName==='SELECT'||b.type==='number')return;
  if(b.type==='radio'||b.type==='checkbox')return;
  switch(a){
    case 'tab':S.tab=v;break;
    case 'card':setCard(v);break;
    case 'clearall':S.card=null;S.wf=null;S.q='';S.fprio=S.ftype=S.fstat='';S.sort=null;S.page=1;break;
    case 'rm':if(v==='card'){S.card=null;S.sort=null}else if(v==='wf')S.wf=null;else S[v]='';S.page=1;break;
    case 'worker':S.wf=(S.wf&&S.wf.k==='w'&&S.wf.v===v)?null:{k:'w',v};if(S.wf&&S.card==='unassigned')S.card=null;S.page=1;S._resetScroll=true;S.people=false;break;
    case 'wstate':S.wf=(S.wf&&S.wf.k==='s'&&S.wf.v===v)?null:{k:'s',v};if(S.wf&&S.card==='unassigned')S.card=null;S.page=1;S._resetScroll=true;break;
    case 'gauge-go':S.card='unassigned';S.wf=null;S.sort=null;S.page=1;S._resetScroll=true;break;
    case 'sort':S.sort=v;S.dir=(sortKey()[0]===v&&sortKey()[1]==='asc')?'desc':'asc';if(S.sort===sortKeyPrev&&false){}S.page=1;break;
    case 'sortreset':S.sort=null;break;
    case 'page':S.page=+v;S._resetScroll=true;break;
    case 'fopen':S.fopen=!S.fopen;break;
    case 'cols':S.colsOpen=!S.colsOpen;break;
    case 'col':S.hid[v]=(v==='age')?(S.hid.age===0?1:0):(S.hid[v]?0:1);break;
    case 'colsreset':S.hid={age:1};break;
    case 'people':S.people=!S.people;break;
    case 'qclear':S.q='';break;
    case 'mock':S.mock=!S.mock;break;
    case 'role-reset':S.perm=new Set(ROLES[S.role].p);break;
    case 'adv':S.adv=v==='0'?0:S.adv+ +v;break;
    case 'refresh':case 'nav-toggle':if(a==='nav-toggle')S.nav=!S.nav;else{ $('#live').textContent='Dashboard refreshed.';}break;
    case 'nav-close':S.nav=false;break;
    default:return;}
  render();});
let sortKeyPrev=null;
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.act;if(!a)return;
  if(a==='set'){const k=t.dataset.key;let v=t.dataset.val;S[k]=['n','cards'].includes(k)?+v:v;if(k==='role'){S.role=v;S.perm=new Set(ROLES[v].p);S.scope=null;S.tab='summary';S.card=null;S.wf=null;}S.page=1;if(k==='state'&&v==='error')S.mock=S.mock;render();return;}
  if(a==='perm'){t.checked?S.perm.add(t.dataset.val):S.perm.delete(t.dataset.val);render();return;}
  if(a==='tog'){S[t.dataset.key]=t.checked;S.page=1;render();return;}
  if(a==='col'){return;}
  if(a==='scope'){S.scope=t.value;S.card=null;S.wf=null;S.page=1;render();return;}
  if(a==='fsel'){S[t.dataset.key]=t.value;S.page=1;render();return;}
  if(a==='size'){S.size=+t.value;S.page=1;render();return;}
  if(a==='num'){S[t.dataset.key]=Math.max(0,+t.value||0);render();return;}});
document.addEventListener('click',e=>{const b=e.target.closest('button[data-act=set]');if(b&&b.dataset.key){const k=b.dataset.key;S[k]=['n','cards'].includes(k)?+b.dataset.val:b.dataset.val;render();}});
let qt=null;
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;S.page=1;clearTimeout(qt);qt=setTimeout(()=>{const pos=e.target.selectionStart;render();const q=$('#q');if(q){q.focus();q.setSelectionRange(pos,pos)}},250);}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){let ch=false;if(S.colsOpen){S.colsOpen=false;ch=true}if(S.people){S.people=false;ch=true}if(S.mock){S.mock=false;ch=true}if(S.nav){S.nav=false;ch=true}$('#tip').style.display='none';if(ch){render();}}
  const c=e.target.closest&&e.target.closest('[data-cards]');
  if(c&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const bs=$$('.card',c);const i=bs.indexOf(e.target.closest('.card'));const n=bs[(i+(e.key==='ArrowRight'?1:bs.length-1))%bs.length];n.focus();e.preventDefault();}});
/* tooltip */
const tip=$('#tip');
function showTip(el){tip.textContent=el.dataset.tip;tip.style.display='block';const r=el.getBoundingClientRect();const tw=tip.offsetWidth;tip.style.left=Math.max(6,Math.min(innerWidth-tw-6,r.left+r.width/2-tw/2))+'px';tip.style.top=(r.top-tip.offsetHeight-6<4?r.bottom+6:r.top-tip.offsetHeight-6)+'px';}
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');if(el)showTip(el)});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]'))tip.style.display='none'});
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el);else tip.style.display='none'});
document.addEventListener('focusout',()=>{tip.style.display='none'});
/* battery inner width for cell size */
S.cardW=300;
function measure(){const w=innerWidth<768?innerWidth-32:parseInt(getComputedStyle(document.documentElement).getPropertyValue('--rc'))||340;S.cardW=Math.max(240,w);}
window.addEventListener('resize',()=>{measure();render();});
window.addEventListener('hashchange',()=>{parseHash();render();});
parseHash();measure();render();
})();
</script>
</body>
</html>
