<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MatterFlow - Dashboard Calendar mockup (WPx CAL-00)</title>
<style>
:root{
  /* Tokens inlined from docs/ux/tokens.css (neutrals, feedback, palette, semantic, tags). Names kept (--mf-*). */
  --mf-bg:#f5f6f8;--mf-surface:#fff;--mf-surface-alt:#eef0f4;--mf-row-hover:#eaf0fb;--mf-border:#c9ced8;--mf-border-strong:#6b7280;
  --mf-text:#1b1f27;--mf-text-muted:#4b5563;--mf-primary:#1f4e9c;--mf-primary-hover:#173c79;--mf-link:#1f4e9c;--mf-focus:#b45309;--mf-selected-bg:#e3ecfa;
  --mf-nav-bg:#1a3556;--mf-nav-text:#eaf1fa;--mf-nav-text-muted:#b4c3d8;--mf-nav-hover-bg:#2b4b75;--mf-nav-focus:#ffc15a;
  --mf-danger:#b42318;--mf-danger-bg:#fdecea;
  --mf-p-red-fg:#b42318;--mf-p-red-bg:#fdecea;--mf-p-red-solid:#c62828;--mf-p-red-line:#f4c7c2;
  --mf-p-amber-fg:#8a4b00;--mf-p-amber-bg:#fff4db;--mf-p-amber-solid:#b45309;--mf-p-amber-line:#f1d9a0;
  --mf-p-blue-fg:#1f4e9c;--mf-p-blue-bg:#e3ecfa;--mf-p-blue-solid:#1f4e9c;--mf-p-blue-line:#c3d5f2;
  --mf-p-teal-fg:#0b6b5f;--mf-p-teal-bg:#ddf3ef;--mf-p-teal-solid:#0f766e;--mf-p-teal-line:#b5e0d9;
  --mf-p-violet-fg:#5b3fa6;--mf-p-violet-bg:#efeafb;--mf-p-violet-solid:#6d4bc2;--mf-p-violet-line:#d6cbf1;
  --mf-p-orange-fg:#9a3a06;--mf-p-orange-bg:#fdebdc;--mf-p-orange-solid:#c2410c;--mf-p-orange-line:#f5cdae;
  --mf-p-slate-fg:#475569;--mf-p-slate-bg:#eef1f5;--mf-p-slate-solid:#475569;--mf-p-slate-line:#cbd2dc;
  --mf-tag-red-fg:#7a1b12;--mf-border-soft:#d5d9e1;
  --mf-font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --gut:24px;--rc:340px;--pop:0 12px 32px rgba(16,24,40,.18),0 2px 6px rgba(16,24,40,.1);
  /* Tag colours (docs/ux/tokens.css, existing): admin picks one per holiday category. */
  --mf-tag-slate-bg:#e3e7ee;--mf-tag-slate-fg:#2f3846;--mf-tag-slate-dot:#5b6678;
  --mf-tag-blue-bg:#dce8fb;--mf-tag-blue-fg:#173c79;--mf-tag-blue-dot:#2b66c4;
  --mf-tag-teal-bg:#d5f0ee;--mf-tag-teal-fg:#0b4f4a;--mf-tag-teal-dot:#0a7d72;
  --mf-tag-green-bg:#ddf1e2;--mf-tag-green-fg:#14532d;--mf-tag-green-dot:#1f7a3a;
  --mf-tag-amber-bg:#fdebb8;--mf-tag-amber-fg:#5c3b00;--mf-tag-amber-dot:#a8590a;
  --mf-tag-orange-bg:#ffe0cc;--mf-tag-orange-fg:#6b2a00;--mf-tag-orange-dot:#b8400c;
  --mf-tag-rose-bg:#fadcea;--mf-tag-rose-fg:#7a1546;--mf-tag-rose-dot:#bf1a5a;
  --mf-tag-violet-bg:#e9e0fa;--mf-tag-violet-fg:#45248a;--mf-tag-violet-dot:#6a45c0;
  --mf-tag-indigo-bg:#dfe3fa;--mf-tag-indigo-fg:#2a2f85;--mf-tag-indigo-dot:#4650c0;
  --mf-border-mid:#c0c6d1;--mf-white:#fff;--mf-shade-soft:rgba(0,0,0,.18);--mf-scrim:rgba(0,0,0,.4);
  /* Capacity ramp of the battery (existing, blue: a LOAD scale). Used only for the small person-state chips in the day panel. */
  --mf-cap-0:#e8f0fb;--mf-cap-1:#bbd2f3;--mf-cap-2:#7faae6;--mf-cap-3:#1f4e9c;
  /* PROPOSED tokens (not in the app yet): the coverage ramp is a traffic light built ONLY from existing semantic tokens, because the capacity ramp is blue (load) and cannot say good or bad. */
  --mf-cov-good-bg:var(--mf-p-teal-bg);--mf-cov-good-fg:var(--mf-p-teal-fg);--mf-cov-good-solid:var(--mf-p-teal-solid);
  --mf-cov-watch-bg:var(--mf-p-amber-bg);--mf-cov-watch-fg:var(--mf-p-amber-fg);--mf-cov-watch-solid:var(--mf-p-amber-solid);
  --mf-cov-low-bg:var(--mf-p-orange-bg);--mf-cov-low-fg:var(--mf-p-orange-fg);--mf-cov-low-solid:var(--mf-p-orange-solid);
  --mf-cov-crit-bg:var(--mf-p-red-bg);--mf-cov-crit-fg:var(--mf-p-red-fg);--mf-cov-crit-solid:var(--mf-p-red-solid);
  --mf-cov-none-bg:var(--mf-surface-alt);
  /* PROPOSED: the five absence types (bar colour). Sick = orange, Vacation = blue, Training = teal, Conference = violet, Other = slate. A glyph and the word always go with the colour. */
  --mf-abs-vac:var(--mf-p-blue-solid);--mf-abs-sick:var(--mf-p-orange-solid);--mf-abs-trn:var(--mf-p-teal-solid);--mf-abs-conf:var(--mf-p-violet-solid);--mf-abs-oth:var(--mf-p-slate-solid);
}
@media (max-width:1100px){:root{--rc:300px}}
@media (max-width:767px){:root{--gut:16px}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--mf-bg);color:var(--mf-text);font:14px/1.45 var(--mf-font);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}button{cursor:pointer}
h1,h2,h3,p{margin:0}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:15px;height:15px}svg.i.xs{width:13px;height:13px}
:focus-visible{outline:2px solid var(--mf-focus);outline-offset:2px;border-radius:6px}
.side :focus-visible,.top .mkb:focus-visible{outline-color:var(--mf-nav-focus)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:#fff;padding:10px 14px;border-radius:8px;z-index:200;font-weight:600}.skip:focus{top:8px}
/* tones */
.t-red{--tone:var(--mf-p-red-solid);--tbg:var(--mf-p-red-bg);--tink:var(--mf-p-red-fg);--tbd:var(--mf-p-red-line)}
.t-amber{--tone:var(--mf-p-amber-solid);--tbg:var(--mf-p-amber-bg);--tink:var(--mf-p-amber-fg);--tbd:var(--mf-p-amber-line)}
.t-blue{--tone:var(--mf-p-blue-solid);--tbg:var(--mf-p-blue-bg);--tink:var(--mf-p-blue-fg);--tbd:var(--mf-p-blue-line)}
.t-teal{--tone:var(--mf-p-teal-solid);--tbg:var(--mf-p-teal-bg);--tink:var(--mf-p-teal-fg);--tbd:var(--mf-p-teal-line)}
.t-violet{--tone:var(--mf-p-violet-solid);--tbg:var(--mf-p-violet-bg);--tink:var(--mf-p-violet-fg);--tbd:var(--mf-p-violet-line)}
.t-orange{--tone:var(--mf-p-orange-solid);--tbg:var(--mf-p-orange-bg);--tink:var(--mf-p-orange-fg);--tbd:var(--mf-p-orange-line)}
.t-slate{--tone:var(--mf-p-slate-solid);--tbg:var(--mf-p-slate-bg);--tink:var(--mf-p-slate-fg);--tbd:var(--mf-p-slate-line)}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;background:var(--tbg);color:var(--tink);font-weight:600;font-size:12px;white-space:nowrap;border:1px solid var(--tbd)}
.pill svg.i{width:12px;height:12px}
/* buttons (theme rule: secondary = white outline, primary = filled, text = link, icon) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--mf-border-strong);background:#fff;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--mf-bg)}.btn.on{background:var(--mf-selected-bg);border-color:var(--mf-primary);color:var(--mf-primary)}
.btn.pri{background:var(--mf-primary);border-color:var(--mf-primary);color:#fff}
.btn.txt{border-color:transparent;background:none;color:var(--mf-link);font-weight:400;padding:0 8px}.btn.txt:hover{background:var(--mf-p-blue-bg)}
.btn.ico{width:32px;padding:0}
.btn[disabled]{color:#6b7280;border-color:var(--mf-border);cursor:not-allowed}
.badge{background:var(--mf-primary);color:#fff;border-radius:999px;min-width:18px;height:18px;padding:0 5px;font-size:12px;display:inline-grid;place-items:center}
/* shell */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{background:var(--mf-nav-bg);color:var(--mf-nav-text);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:0 10px 10px;z-index:60}
.brand{display:flex;align-items:center;gap:10px;height:56px;color:#fff;font-weight:700;font-size:18px;padding:0 6px;flex:none}
.brand b{width:30px;height:30px;border-radius:8px;background:#1d4e89;box-shadow:0 0 0 1px rgba(255,255,255,.25);display:grid;place-items:center;font-size:14px}
.nav{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;border-radius:6px;color:var(--mf-nav-text);text-decoration:none}
.nav a:hover{background:var(--mf-nav-hover-bg)}
.nav a[aria-current=page]{background:#fff;color:#17324f;font-weight:700}
.ver{margin-top:auto;padding:10px 12px 0;font-size:13px;color:var(--mf-nav-text-muted)}
.scrim{display:none}
.col{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.top{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--mf-border);height:56px;display:flex;align-items:center;gap:12px;padding:0 var(--gut);flex:none}
.burger{display:none}
.gs{position:relative;flex:1 1 auto;max-width:460px}
.gs input{width:100%;height:34px;border:1px solid var(--mf-border-strong);border-radius:6px;padding:0 10px 0 34px;background:#fff}
.gs svg{position:absolute;left:10px;top:8px;color:var(--mf-text-muted)}
.spacer{flex:1 1 0}
.mkb{display:inline-flex;gap:6px;align-items:center;height:34px;padding:0 12px;border-radius:6px;border:1px dashed var(--mf-primary);background:#fff;color:var(--mf-primary);font-weight:600}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--mf-p-slate-bg);color:var(--mf-p-slate-fg);flex:none}
/* fixed page */
main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:14px var(--gut) 16px}
.page{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:12px}
.hrow{display:flex;align-items:center;gap:12px;flex:none}
.ttl{display:flex;align-items:center;gap:10px}
.ttl .chip{width:30px;height:30px;border-radius:8px;background:var(--mf-primary);color:#fff;display:grid;place-items:center}
.ttl h1{font-size:19px;font-weight:600;line-height:1.2}
.ttl small{display:block;color:var(--mf-text-muted);font-size:13px}
.hr{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--mf-text-muted);font-size:13px}
.trow{display:flex;align-items:flex-end;gap:12px;flex:none;border-bottom:1px solid var(--mf-border)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;height:38px;padding:0 14px;font-weight:400;color:var(--mf-text-muted);white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.tabs button:hover{color:var(--mf-text)}
.tabs button[aria-selected=true]{color:var(--mf-primary);border-bottom-color:var(--mf-primary);font-weight:700}
.scope{display:flex;align-items:center;gap:8px;padding-bottom:4px;flex:none;font-size:13px;color:var(--mf-text-muted)}
.dd{position:relative}
.dd select{appearance:none;-webkit-appearance:none;height:32px;border:1px solid var(--mf-border-strong);border-radius:6px;background:#fff;padding:0 30px 0 10px;font-weight:600;max-width:200px}
.dd svg{position:absolute;right:9px;top:8px;pointer-events:none;color:var(--mf-text-muted)}
.body{flex:1 1 auto;min-height:0;display:grid;gap:12px}
.frame{position:relative;background:#fff;border:1px solid var(--mf-border-soft);border-radius:12px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.cnt{background:var(--mf-surface-alt);border-radius:999px;padding:0 9px;font-size:13px;font-weight:600;line-height:22px}
.sbox{position:relative;width:190px;max-width:100%}
.sbox input{width:100%;height:32px;border:1px solid var(--mf-border-strong);border-radius:6px;padding:0 26px 0 30px;background:#fff}
.sbox svg{position:absolute;left:9px;top:8px;color:var(--mf-text-muted)}
.sbox .x{position:absolute;right:2px;top:2px;width:28px;height:28px;border:0;background:none;display:grid;place-items:center}
.sp{flex:1 1 0}
.mock{position:relative}
.pop{position:absolute;background:#fff;border:1px solid var(--mf-border);border-radius:12px;box-shadow:var(--pop);z-index:130;padding:8px}
.mpanel{right:0;top:42px;width:360px;max-height:calc(100vh - 70px);overflow:auto;font-size:13px}
.mpanel fieldset{border:1px solid var(--mf-border-soft);border-radius:8px;margin:0 0 8px;padding:6px 10px 8px}
.mpanel legend{font-weight:700;padding:0 4px}
.mpanel label{display:flex;gap:8px;align-items:flex-start;padding:2px 0}
.mpanel small{color:var(--mf-text-muted);display:block}
.mpanel .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mpanel input[type=number]{width:60px;height:28px;border:1px solid var(--mf-border-strong);border-radius:6px}
.note{background:var(--mf-p-blue-bg);color:var(--mf-p-blue-fg);border:1px solid var(--mf-p-blue-line);border-radius:8px;padding:8px 12px;font-size:13px}
.alert{display:flex;gap:10px;align-items:center;background:var(--mf-p-amber-bg);color:var(--mf-p-amber-fg);border:1px solid var(--mf-p-amber-line);border-radius:8px;padding:6px 12px;font-size:13px;flex:none}
#tip{position:fixed;z-index:300;background:var(--mf-text);color:#fff;border-radius:6px;padding:6px 9px;font-size:12px;max-width:260px;pointer-events:none;display:none;line-height:1.35}
.sk{background:linear-gradient(90deg,var(--mf-surface-alt),#f8f9fb,var(--mf-surface-alt));background-size:200% 100%;border-radius:6px;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk,.skel i{animation:none}}
.crumb{font-size:13px;color:var(--mf-text-muted)}
@media (max-width:1023px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:-260px;top:0;width:240px;transition:left .15s}
  .side.open{left:0}.scrim.open{display:block;position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:55}
  .burger{display:inline-flex}.gs{display:none}
}
@media (max-width:767px),(max-height:560px){
  .col{min-height:0}
  main{overflow:visible}
  .page{flex:none}
  .body{display:flex;flex-direction:column}
  .frame{overflow:visible}
  .hrow,.trow{flex-wrap:wrap}
}
@media (max-width:767px){
  .tabs{flex-basis:100%}
  .hr .upd{display:none}
  .mpanel{position:fixed;left:8px;right:8px;top:60px;width:auto}
}
@media (min-width:768px) and (min-height:561px){
  html,body{height:100%}
  .shell{height:100vh;min-height:0;overflow:hidden}
  .col{height:100vh;min-height:0}
}
/* ===== Calendar mockup styles ===== */
.t-green{--tone:var(--mf-tag-green-dot);--tbg:var(--mf-tag-green-bg);--tink:var(--mf-tag-green-fg);--tbd:var(--mf-tag-green-dot)}
.h-indigo{--hb:var(--mf-tag-indigo-bg);--hf:var(--mf-tag-indigo-fg);--hd:var(--mf-tag-indigo-dot)}
.h-rose{--hb:var(--mf-tag-rose-bg);--hf:var(--mf-tag-rose-fg);--hd:var(--mf-tag-rose-dot)}
.h-green{--hb:var(--mf-tag-green-bg);--hf:var(--mf-tag-green-fg);--hd:var(--mf-tag-green-dot)}
.h-blue{--hb:var(--mf-tag-blue-bg);--hf:var(--mf-tag-blue-fg);--hd:var(--mf-tag-blue-dot)}
.h-teal{--hb:var(--mf-tag-teal-bg);--hf:var(--mf-tag-teal-fg);--hd:var(--mf-tag-teal-dot)}
.h-amber{--hb:var(--mf-tag-amber-bg);--hf:var(--mf-tag-amber-fg);--hd:var(--mf-tag-amber-dot)}
.h-orange{--hb:var(--mf-tag-orange-bg);--hf:var(--mf-tag-orange-fg);--hd:var(--mf-tag-orange-dot)}
.h-violet{--hb:var(--mf-tag-violet-bg);--hf:var(--mf-tag-violet-fg);--hd:var(--mf-tag-violet-dot)}
.h-slate{--hb:var(--mf-tag-slate-bg);--hf:var(--mf-tag-slate-fg);--hd:var(--mf-tag-slate-dot)}
.a-V{--ab:var(--mf-abs-vac);--ai:var(--mf-p-blue-fg);--at:var(--mf-p-blue-bg);--al:var(--mf-p-blue-line)}
.a-S{--ab:var(--mf-abs-sick);--ai:var(--mf-p-orange-fg);--at:var(--mf-p-orange-bg);--al:var(--mf-p-orange-line)}
.a-T{--ab:var(--mf-abs-trn);--ai:var(--mf-p-teal-fg);--at:var(--mf-p-teal-bg);--al:var(--mf-p-teal-line)}
.a-C{--ab:var(--mf-abs-conf);--ai:var(--mf-p-violet-fg);--at:var(--mf-p-violet-bg);--al:var(--mf-p-violet-line)}
.a-O{--ab:var(--mf-abs-oth);--ai:var(--mf-p-slate-fg);--at:var(--mf-p-slate-bg);--al:var(--mf-p-slate-line)}
.a-X{--ab:var(--mf-p-slate-solid);--ai:var(--mf-p-slate-fg);--at:var(--mf-p-slate-bg);--al:var(--mf-p-slate-line)}
.apill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;background:var(--at);color:var(--ai);border:1px solid var(--al);font-weight:600;font-size:12px;white-space:nowrap}
.apill svg.i{width:12px;height:12px}
.hchip{display:inline-flex;align-items:center;gap:3px;max-width:100%;min-width:0;height:18px;padding:0 6px;border-radius:999px;background:var(--hb);color:var(--hf);font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hchip svg.i{width:11px;height:11px;flex:none}
.hchip.big{height:22px;font-size:12px;padding:0 8px}
.cv-good{--cb:var(--mf-cov-good-bg);--cf:var(--mf-cov-good-fg);--cs:var(--mf-cov-good-solid)}
.cv-watch{--cb:var(--mf-cov-watch-bg);--cf:var(--mf-cov-watch-fg);--cs:var(--mf-cov-watch-solid)}
.cv-low{--cb:var(--mf-cov-low-bg);--cf:var(--mf-cov-low-fg);--cs:var(--mf-cov-low-solid)}
.cv-crit{--cb:var(--mf-cov-crit-bg);--cf:var(--mf-cov-crit-fg);--cs:var(--mf-cov-crit-solid)}
.cv-none,.cv-wknd{--cb:var(--mf-cov-none-bg);--cf:var(--mf-p-slate-fg);--cs:var(--mf-p-slate-solid)}
.seg{display:inline-flex;border:1px solid var(--mf-border-strong);border-radius:6px;overflow:hidden;background:#fff;flex:none}
.seg button{border:0;background:#fff;height:30px;padding:0 12px;font-weight:600;display:inline-flex;gap:6px;align-items:center;border-right:1px solid var(--mf-border-mid)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--mf-selected-bg);color:var(--mf-primary);box-shadow:inset 0 -2px 0 var(--mf-primary)}
.seg button:hover{background:var(--mf-row-hover)}
/* toolbar */
.tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:none}
.tbar .dd select{max-width:210px}
.tbar label.lb{font-size:13px;color:var(--mf-text-muted);display:flex;align-items:center;gap:6px}
.btn[aria-disabled=true]{color:#6b7280;border-color:var(--mf-border);cursor:not-allowed;background:#fff}
.btn.pri[aria-disabled=true]{background:var(--mf-border-strong);color:#fff;border-color:transparent}
.btn.dng{color:var(--mf-danger);border-color:var(--mf-danger)}
.btn.dng.solid{background:var(--mf-danger);color:#fff}
/* insights */
.ins{display:flex;gap:10px;align-items:stretch;flex:none;flex-wrap:wrap}
.risk{display:flex;gap:10px;align-items:center;border-radius:12px;padding:6px 12px;border:1px solid var(--tbd);background:var(--tbg);color:var(--tink);flex:1 1 320px;min-width:0;min-height:44px}
.risk b{font-weight:700}
.risk .btn{margin-left:auto;height:28px}

    else if(selS){const el=$(selS);if(el)el.focus()}}

document.addEventListener('change',e=>{

  if(a==='feat'){S.feat[t.dataset.key]=t.checked;render();return}
  if(a==='tog'){S[t.dataset.key]=t.checked;render();return}
  if(a==='num'){S[t.dataset.key]=Math.max(0,+t.value||0);render();return}
  if(a==='podmin'){S.podMin[t.dataset.key]=Math.max(0,+t.value||0);render();return}
  if(a==='pod'){S.pod=t.value;render();return}
  if(a==='rolef'){S.roleF=t.value;render();return}

});
function dlgInput(t,isChange){
  const dg=S.dlg;if(!dg)return;const k=t.dataset.f;if(!k)return;
  let v=t.type==='checkbox'?t.checked:t.value;
  dg.dirty=true;
  if(dg.t==='entry'){if(k==='uid'){dg.uid=v}else dg.f[k]=v;dg.touch[k]=true;if(k==='from'&&dg.f.to&&dg.f.to<v&&!dg.touch.to)dg.f.to=v;
    if(k==='from'&&!dg.f.to){dg.f.to=v;const el=$('#f-to');if(el)el.value=v}
    if(k==='from'||k==='type')dg.touch.to=dg.touch.to||false;dlgRefresh();if(isChange&&k==='uid')dlgRefresh();return}
  if(dg.t==='thr'){if(k.startsWith('pm-'))dg.f.podMin[k.slice(3)]=+v;else dg.f[k]=+v;return}
  if(dg.t==='hol'){dg.f[k]=v;if(t.dataset.rerender&&isChange){if(k==='k'){if(v==='range-y'||v==='range-1'){}}render();return}holPreview();return}
  if(dg.t==='import'){dg.f[k]=v;importRefresh();return}
  if(dg.t==='cal'){dg.f[k]=v;if(t.dataset.rerender&&isChange)render();return}
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f){dlgInput(t,false);return}
  const a=t.dataset.act;if(!a)return;
  const deb=(key,setter)=>{setter(t.value);clearTimeout(deb.t);deb.t=setTimeout(()=>{const pos=t.selectionStart;render();const q=$('#'+t.id);if(q){q.focus();q.setSelectionRange(pos,pos)}},250)};
  if(a==='pq')deb('pq',v=>S.pq=v);
  if(a==='tlq')deb('tlq',v=>S.tlq=v);
  if(a==='aq')deb('aq',v=>S.adminQ=v);
});
document.addEventListener('toggle',e=>{if(e.target.dataset&&e.target.dataset.act==='pastd')S.pastOpen=e.target.open},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){let ch=false;
    if(S.conf){S.conf=null;ch=true}else if(S.dlg){if(S.dlg.t==='reassign'){S.dlg=S.dlg.back;ch=true}else{tryCancel();e.preventDefault();return}}
    else if(S.pop){S.pop=null;ch=true}else if(S.mock){S.mock=false;ch=true}else if(S.nav){S.nav=false;ch=true}else if(S.panel&&(isTab())){S.panel=false;ch=true}
    $('#tip').style.display='none';if(ch)render();return}
  if(e.key==='Tab'&&(S.dlg||S.conf)){const box=$(S.conf?'[role=alertdialog]':'[data-dlg]');if(box){const f=$$('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled])',box).filter(x=>x.offsetParent);if(f.length){const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){f[f.length-1].focus();e.preventDefault()}else if(!e.shiftKey&&i===f.length-1){f[0].focus();e.preventDefault()}}}}
  /* arrow keys inside the month grid: what My Matters does (a week up and down, a day left and right, Home and End within the week). Not a shortcut. */
  const cur=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.day;
  if(cur&&document.activeElement.classList.contains('day')){
    const dates=$$('.day[data-day]').map(x=>x.dataset.day);const i=dates.indexOf(cur);let to=i;
    switch(e.key){case 'ArrowLeft':to=i-1;break;case 'ArrowRight':to=i+1;break;case 'ArrowUp':to=i-7;break;case 'ArrowDown':to=i+7;break;case 'Home':to=i-(i%7);break;case 'End':to=i-(i%7)+6;break;default:return}
    e.preventDefault();if(to<0||to>=dates.length)return;const el=$(`.day[data-day="${dates[to]}"]`);if(el){$$('.day[data-day]').forEach(x=>x.tabIndex=-1);el.tabIndex=0;el.focus()}}
});
const tip=$('#tip');
function showTip(el){tip.textContent=el.dataset.tip;tip.style.display='block';const r=el.getBoundingClientRect();const tw=tip.offsetWidth;tip.style.left=Math.max(6,Math.min(innerWidth-tw-6,r.left+r.width/2-tw/2))+'px';tip.style.top=(r.top-tip.offsetHeight-6<4?r.bottom+6:r.top-tip.offsetHeight-6)+'px'}
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');if(el)showTip(el)});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]'))tip.style.display='none'});
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el);else tip.style.display='none'});
document.addEventListener('focusout',()=>{tip.style.display='none'});
window.addEventListener('resize',()=>render());
/* ---------- deep links ---------- */
function parseHash(){
  const h=new URLSearchParams(location.hash.slice(1));const g=k=>h.get(k);
  if(g('role')&&ROLES[g('role')]){S.role=g('role');S.perm=new Set(ROLES[S.role].p);S.pod=null}
  if(g('without'))g('without').split(',').forEach(x=>S.perm.delete(x));
  if(g('with'))g('with').split(',').forEach(x=>S.perm.add(x));
  if(g('screen'))S.screen=g('screen');if(g('view')){S.view=g('view')}if(g('month'))S.month=g('month');if(g('day')){S.day=g('day');if(!g('month'))S.month=S.day.slice(0,7)}
  if(g('tlm'))S.tlMonth=g('tlm');else if(S.view==='timeline')S.tlMonth=S.day.slice(0,7);
  if(g('pod'))S.pod=g('pod');if(g('rolef'))S.roleF=g('rolef');if(g('scale'))S.tlScale=g('scale');if(g('state'))S.state=g('state');
  if(g('panel'))S.panel=g('panel')==='1';else if(S.view==='timeline')S.panel=false;
  if(g('mock'))S.mock=g('mock')==='1';if(g('off'))g('off').split(',').forEach(k=>S.feat[k]=false);if(g('rm'))S.rm=g('rm')==='1';
  if(g('atab'))S.adminTab=g('atab');if(g('acal'))S.adminCal=g('acal');if(g('ayear'))S.adminYear=+g('ayear');if(g('pfk'))S.pfk=g('pfk');if(g('grp'))S.grp=g('grp')==='1';
  if(g('coll'))g('coll').split(',').forEach(k=>S.coll[k]=true);if(g('pop'))S.pop=g('pop');if(g('pq'))S.pq=g('pq');if(g('tlq'))S.tlq=g('tlq');
  if(g('min'))S.minCov=+g('min');
  if(g('past'))S.pastOpen=g('past')==='1';
}
function openDeepDlg(){
  const h=new URLSearchParams(location.hash.slice(1));const d=h.get('dlg');if(!d)return;
  if(d==='add')openEntry('add',null,S.screen==='calendar');
  else if(d==='addself')openEntry('add',null,false);
  else if(d==='edit'){const e=ENT.find(x=>x.uid===me().id&&x.from>TODAY);openEntry('edit',e.id,S.screen==='calendar')}
  else if(d==='overlap'){openEntry('add',null,false);S.dlg.f={type:'V',from:'2027-07-14',to:'2027-07-30',note:''};S.dlg.tried=true}
  else if(d==='past'){openEntry('add',null,false);S.dlg.f={type:'V',from:'2026-10-20',to:'2026-10-22',note:''};S.dlg.tried=true}
  else if(d==='warn'){openEntry('add',null,true);const p=byName('Hana Sato');S.dlg.uid=p.id;S.dlg.f={type:'V',from:'2026-11-24',to:'2026-11-27',note:''}}
  else if(d==='thr')S.dlg={t:'thr',f:{minCov:S.minCov,podMin:{...S.podMin}}};
  else if(d==='hol'){const c=calOf(S.adminCal);S.dlg={t:'hol',mode:'add',calId:c.id,f:{name:'Thanksgiving',k:'nth',m:11,d:1,n:4,wd:4,plus:0,off:0,date:'2027-01-01',date2:'2027-01-02',obs:'none',note:''}}}
  else if(d==='import'){S.dlg={t:'import',calId:S.adminCal,f:{text:'12/24/2027, Christmas Eve (half day)\n03/12/2027 - 03/13/2027, Office move\nJuly 4 2027, Independence Day\n11/25/2027, Thanksgiving',yearly:false}}}
  else if(d==='cal')S.dlg={t:'cal',mode:'add',f:{n:'',note:'',hue:'amber',every:false}};
  else if(d==='user')S.dlg={t:'user'};
  else if(d==='reassign'){const p=byName('Carlos Vega');S.dlg={t:'reassign',uid:p.id,from:'2026-11-02',to:'2026-11-06',sel:{},back:null};TASKS.filter(x=>x.uid===p.id&&x.due>=TODAY&&x.due<='2026-11-06').forEach(x=>{const c=coverCandidates(x,PEOPLE);if(c[0])S.dlg.sel[x.id]=c[0].p.id})}
  else if(d==='del'){const e=ENT.find(x=>x.uid===me().id&&x.from>TODAY);S.conf={title:'Delete this out of office?',body:`${TYPES[e.type].n}, ${fn(e.from)} to ${fn(e.to)}. This cannot be undone.`,ok:'Delete',cancel:'Keep it',danger:true,act:'del-ooo',arg:e.id}}
  S.fresh=false;
}
window.addEventListener('hashchange',()=>{parseHash();openDeepDlg();render()});
seedEntries();build();seedTasks();
parseHash();openDeepDlg();render();
