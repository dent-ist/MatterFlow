<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Matters v3 C - Recommended - LPT Hub</title>
<meta name="description" content="Sample C: recommended design that combines the PM layout, the active matters list and a browse tree. Mock data only.">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --alt:#EEF0F4; --border:#D5D9E1; --border-2:#C0C6D1; --border-strong:#6B7280;
  --text:#1B1F27; --muted:#4B5563; --faint:#6B7280;
  --primary:#1F4E9C; --primary-h:#173C79; --focus:#B45309;
  --nav:#1A3556; --nav-text:#EAF1FA; --nav-muted:#B4C3D8; --nav-hover:#2B4B75; --nav-sel-fg:#17324F; --nav-focus:#FFC15A;
  --red:#B42318; --red-bg:#FDECEA; --red-solid:#C62828; --red-line:#F4C7C2;
  --amber:#8A4B00; --amber-bg:#FFF4DB; --amber-solid:#B45309; --amber-line:#F1D9A0;
  --blue:#1F4E9C; --blue-bg:#E3ECFA; --blue-solid:#1F4E9C; --blue-line:#C3D5F2;
  --teal:#0B6B5F; --teal-bg:#DDF3EF; --teal-solid:#0F766E; --teal-line:#B5E0D9;
  --violet:#5B3FA6; --violet-bg:#EFEAFB; --violet-solid:#6D4BC2; --violet-line:#D6CBF1;
  --slate:#475569; --slate-bg:#EEF1F5; --slate-solid:#475569;
  --r:8px; --r-lg:12px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.06);
  --pop:0 12px 32px rgba(16,24,40,.18),0 2px 6px rgba(16,24,40,.1);
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:Consolas,"Cascadia Mono","SFMono-Regular",monospace;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;font:14px/1.45 var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px} svg.i.xs{width:14px;height:14px} svg.i.lg{width:22px;height:22px}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.nav :focus-visible{outline-color:var(--nav-focus)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:#fff;padding:8px 12px;border-radius:6px;z-index:100;border:1px solid var(--border)}
.skip:focus{top:8px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:56px minmax(0,1fr);height:100vh;height:100dvh}
.top{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border);min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:#1d4e89;width:196px;flex:none;letter-spacing:-.01em}
.brand svg{width:30px;height:30px;border-radius:8px}
.burger{display:none;border:0;background:none;padding:6px;border-radius:6px}
.search{flex:1 1 auto;max-width:640px;position:relative;min-width:0}
.search input{width:100%;height:36px;border:1px solid var(--border-strong);border-radius:6px;padding:0 12px 0 36px;background:#fff}
.search svg{position:absolute;left:11px;top:9px;color:var(--faint)}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--border-strong);background:#fff;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--alt)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-h)}
.btn.ghost{border-color:var(--border-2)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.top .spacer{flex:1}
.mock{display:flex;align-items:center;gap:6px;border:1px dashed var(--border-strong);border-radius:20px;padding:0 4px 0 10px;height:30px;background:#fff;font-size:12px;color:var(--muted)}
.mock select{border:0;background:transparent;font-weight:700;color:var(--text);padding:0 4px;height:26px;cursor:pointer}
.mock button{white-space:nowrap;border:0;background:var(--alt);border-radius:14px;height:22px;padding:0 8px;font-size:12px;font-weight:600}
.mock button[aria-pressed=true]{background:var(--primary);color:#fff}
.bell{position:relative;border:0;background:none;padding:6px;border-radius:6px}
.bell b{position:absolute;top:-3px;right:-5px;background:var(--red-solid);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:2px solid #fff;line-height:1}
.user{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:4px 6px;border-radius:6px;min-width:0}
.user .nm{font-weight:600;line-height:1.2}
.user small{display:block;color:var(--amber);font-size:12px;line-height:1.2}
.av{width:30px;height:30px;border-radius:50%;background:var(--blue-bg);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}

.nav{background:var(--nav);color:var(--nav-text);padding:12px 12px 0;overflow:auto;display:flex;flex-direction:column}
.nav a{display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;border-radius:999px;color:var(--nav-text);text-decoration:none;font-size:14px;margin-bottom:1px}
.nav a:hover{background:var(--nav-hover)}
.nav a.ind{padding-left:36px}
.nav a[aria-current=page]{background:#fff;color:var(--nav-sel-fg);font-weight:700}
.nav h2{font-size:11px;letter-spacing:.08em;color:var(--nav-muted);margin:14px 12px 6px;font-weight:600;border-top:1px solid #3E5C86;padding-top:12px}
.nav .ver{margin-top:auto;padding:12px;color:var(--nav-muted);font-size:12px;position:sticky;bottom:0;background:var(--nav)}
.scrim{display:none}

main{min-width:0;overflow:auto;background:var(--bg)}
.page{height:100%;min-height:600px;padding:20px 32px 0;display:flex;flex-direction:column;gap:16px;max-width:1760px;margin:0 auto}
.page::after{content:"";flex:0 0 8px}
.page>*,#body>*,#panel>*{flex:none;min-width:0}
.page .grow,#body>.grow,#panel>.grow{flex:1 1 0;min-height:340px}
.card.grow:has(>.empty){flex:none!important;min-height:0!important}

/* ---------- title row & filters ---------- */
.titlerow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.chip-i{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.titlerow h1{margin:0;font-size:28px;line-height:1.15;letter-spacing:-.01em}
.titlerow .tw{display:flex;align-items:baseline;column-gap:16px;row-gap:0;flex-wrap:wrap;min-width:0}
.titlerow .ctx{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.titlerow .ctx b{color:var(--text);font-weight:600}
.titlerow .acts{margin-left:auto;display:flex;gap:10px;align-items:center;position:relative}
.menu{position:absolute;right:0;top:44px;z-index:30;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--pop);padding:8px;width:290px}
.menu h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 8px 4px;font-weight:600}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px;border-radius:6px}
.menu button:hover{background:var(--alt)}
.menu .rad{width:16px;height:16px;border-radius:50%;border:2px solid var(--border-strong);flex:none;display:grid;place-items:center}
.menu [aria-checked=true] .rad{border-color:var(--primary)}
.menu [aria-checked=true] .rad::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary)}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 0}

.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filters .sep{color:var(--faint);display:flex}
.filters .clear{border:0;background:none;color:var(--primary);font-weight:600;text-decoration:underline;padding:6px 8px;border-radius:6px}
.dd{position:relative}
.dd-btn{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;background:#fff;border:1px solid var(--border-strong);border-radius:8px;min-width:0;max-width:100%}
.dd-btn:hover{background:#FAFBFC;border-color:#374151}
.dd-btn .pre{color:var(--muted);font-size:13px}
.dd-btn .val{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.dd-btn[aria-expanded=true]{border-color:var(--primary);box-shadow:0 0 0 3px var(--blue-bg)}
.dd-btn.on{background:var(--blue-bg);border-color:var(--blue-line)}
.dd-btn.on .val{color:var(--primary)}
.dd.sm .dd-btn{height:34px;border-radius:6px;font-size:13px}
.dd-panel{position:fixed;z-index:60;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--pop);display:flex;flex-direction:column;overflow:hidden}
.dd-search{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);color:var(--faint)}
.dd-search input{border:0;outline:0;flex:1;min-width:0;background:none;color:var(--text)}
.dd-panel ul{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
.dd-panel li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;cursor:pointer}
.dd-panel li:hover,.dd-panel li:focus{background:var(--alt);outline:0}
.dd-panel li:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.dd-panel li[aria-selected=true]{background:var(--blue-bg)}
.dd-panel li .t{flex:1;min-width:0}
.dd-panel li small{display:block;color:var(--muted);font-size:12px}
.dd-panel li .n{color:var(--muted);font-variant-numeric:tabular-nums}
.dd-panel li.mute{color:var(--faint)}
.dd-panel li .ck{width:18px;height:18px;border:1.5px solid var(--border-strong);border-radius:4px;display:grid;place-items:center;flex:none;color:#fff}
.dd-panel li[aria-selected=true] .ck{background:var(--primary);border-color:var(--primary)}
.dd-panel li .tick{width:18px;flex:none;color:var(--primary)}
.dd-panel .foot{border-top:1px solid var(--border);padding:8px 12px;display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.dd-panel .foot button{border:0;background:none;color:var(--primary);font-weight:600;text-decoration:underline;border-radius:4px}
.dd-panel .none{padding:14px;color:var(--muted)}
/* ---------- tabs ---------- */
.tabs{position:relative;display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:12px 16px;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px;white-space:nowrap;border-radius:6px 6px 0 0}
.tabs button:hover{color:var(--text);background:var(--alt)}
.tabs button[aria-selected=true]{color:var(--primary);font-weight:700;border-bottom-color:var(--primary)}
.badge{background:var(--primary);color:#fff;border-radius:10px;font-size:12px;font-weight:700;min-width:22px;height:20px;padding:0 7px;display:inline-grid;place-items:center;line-height:1}
/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);min-width:0}
.pad{padding:20px 24px}
.card-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--border)}
.card-h h2{margin:0;font-size:18px;line-height:1.2}
.card-h .sub{color:var(--muted);font-size:13px}
.card-h .r{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.healthy{color:var(--teal);font-weight:600;display:inline-flex;align-items:center;gap:6px}
/* grid */
.gridcard{display:flex;flex-direction:column;overflow:hidden}
.gscroll{flex:1 1 auto;overflow:auto;min-height:0}
table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
th{position:sticky;top:0;z-index:2;background:var(--alt);text-align:left;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);height:40px;padding:0 12px;border-bottom:1px solid var(--border);white-space:nowrap}
th button{border:0;background:none;display:inline-flex;align-items:center;gap:6px;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;padding:6px 4px;margin:0 -4px;border-radius:4px}
th button:hover{color:var(--text)}
th[aria-sort] button{color:var(--text)}
th .ar{opacity:.35} th[aria-sort] .ar{opacity:1;color:var(--primary)}
td{height:44px;padding:0 12px;border-bottom:1px solid #E7EAF0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
tbody tr:hover td{background:#F4F7FC}
tbody tr:last-child td{border-bottom:0}
td.pad0{padding:0}
.cell{display:flex;align-items:center;gap:8px;min-width:0}
.cell>span{overflow:hidden;text-overflow:ellipsis}
.ref{font-family:var(--mono);font-size:13px;color:var(--muted)}
.tt{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.tt svg{width:16px;height:16px}
.lnk{border:0;background:none;padding:0;text-align:left;color:var(--primary);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;border-radius:4px}
.lnk:hover{text-decoration:underline}
.m2{display:none;color:var(--muted);font-size:12px;font-weight:400}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px 2px 8px;font-size:12px;font-weight:700;line-height:18px;white-space:nowrap}
.pill.crit{background:var(--red-solid);color:#fff}
.pill.high{background:var(--amber-bg);color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber-line)}
.pill.hold{background:var(--slate-bg);color:var(--slate);box-shadow:inset 0 0 0 1px #CBD2DC}
.pill.risk{background:var(--amber-bg);color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber-line)}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.teal{background:var(--teal-bg);color:var(--teal)}
.pill.violet{background:var(--violet-bg);color:var(--violet)}
.pill.blue{background:var(--blue-bg);color:var(--blue)}
.una{color:var(--violet);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.due{display:inline-flex;align-items:center;gap:6px}
.due.over{color:var(--red);font-weight:700}
.due.soon{color:var(--amber);font-weight:700}
.due small{color:var(--muted);font-weight:400;font-size:12px}
.mini-av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;flex:none}
.pager{display:flex;align-items:center;gap:8px;padding:10px 24px;border-top:1px solid var(--border);background:#fff;flex-wrap:wrap;color:var(--muted)}
.pager .pg{margin-left:auto;display:flex;gap:4px}
.pager button{min-width:34px;height:34px;border:1px solid var(--border-2);background:#fff;border-radius:6px;font-weight:600;padding:0 8px}
.pager button:hover:not(:disabled){background:var(--alt)}
.pager button[aria-current=page]{background:var(--primary);color:#fff;border-color:var(--primary)}
.pager button:disabled{opacity:.45;cursor:default}
.empty{display:flex;align-items:center;gap:12px;padding:28px 24px;color:var(--muted);font-size:15px}
.empty.good{color:var(--teal);font-weight:600}
.empty button{border:0;background:none;color:var(--primary);font-weight:600;text-decoration:underline;border-radius:4px}
.icobtn{width:36px;height:36px;border:1px solid var(--border-strong);background:#fff;border-radius:8px;display:grid;place-items:center}
.icobtn:hover{background:var(--alt)}
.icobtn[aria-pressed=true]{background:var(--blue-bg);border-color:var(--primary);color:var(--primary)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:0 14px;height:34px;font-weight:600;display:flex;align-items:center;gap:6px;border-right:1px solid var(--border-2);color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--alt)}
.seg button[aria-pressed=true]{background:var(--blue-bg);color:var(--primary)}
.link{border:0;background:none;color:var(--primary);font-weight:600;text-decoration:underline;padding:4px;border-radius:4px}
/* breakdown */
.bd td,.bd th{text-align:center}
.bd td:first-child,.bd th:first-child{text-align:left}
.bd .tot{background:var(--alt);font-weight:700}
.bcell{border:0;background:none;width:76px;margin:0 auto;height:100%;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:6px;min-height:36px}
.bcell:hover{outline:2px solid var(--primary)}
.bcell.over{background:var(--red-bg);color:var(--red)}
.bcell.risk{background:var(--amber-bg);color:var(--amber)}
.bcell.zero{color:#6B7280;font-weight:400}
.bd td{height:52px;padding:4px 8px}
.legend{display:flex;gap:20px;flex-wrap:wrap;color:var(--muted);font-size:13px;padding:14px 24px;border-top:1px solid var(--border)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.sw{display:inline-grid;place-items:center;width:22px;height:20px;border-radius:5px;font-size:12px;font-weight:700}
.meter{display:flex;height:8px;background:var(--alt);border-radius:4px;overflow:hidden;min-width:80px}
.meter i{display:block}
/* data */
.selbar{display:flex;gap:12px;flex-wrap:wrap;padding:16px 24px;border-bottom:1px solid var(--border);align-items:center}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;padding:16px 24px}
.tile{border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 16px;display:flex;gap:14px;align-items:center;background:#fff;min-width:0}
.tile .n{font-size:30px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .n small{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px}
.tile .l{color:var(--muted);font-size:13px;margin-top:3px}
.tile .l small{font-size:12px}
.tile.amber{background:var(--amber-bg);border-color:var(--amber-line)} .tile.amber .n{color:var(--amber)}
.tile.teal .n{color:var(--teal)}
.dbody{padding:0 24px 24px;display:flex;flex-direction:column;gap:16px}
.dtools{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.dtools .sp{margin-left:auto}
.bars{display:flex;flex-direction:column;gap:12px;max-width:860px}
.barrow{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr) 120px;gap:14px;align-items:center}
.barrow .track{height:28px;background:var(--alt);border-radius:6px;overflow:hidden}
.barrow .fill{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:8px;color:#fff;font-weight:700;font-size:12px}
.barrow .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.barrow .v small{color:var(--muted);font-weight:400}
.pie{display:flex;gap:40px;align-items:center;flex-wrap:wrap}
.pie svg{width:220px;height:220px;flex:none}
.pie ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:260px;flex:1;max-width:520px}
.pie li{display:flex;align-items:center;gap:12px}
.pie li .nm{flex:1}
.pie li b{font-variant-numeric:tabular-nums}
.pie li span.pc{color:var(--muted);width:44px;text-align:right}
.sw2{width:14px;height:14px;border-radius:4px;flex:none}
/* drawer & toast */
.drawer-bg{position:fixed;inset:0;background:rgba(16,24,40,.35);z-index:80}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:#fff;z-index:81;box-shadow:var(--pop);display:flex;flex-direction:column}
.drawer header{display:flex;gap:12px;align-items:flex-start;padding:20px 24px;border-bottom:1px solid var(--border)}
.drawer header h2{margin:0;font-size:20px;line-height:1.25}
.drawer header .x{margin-left:auto;border:0;background:none;padding:6px;border-radius:6px}
.drawer dl{margin:0;padding:8px 24px;display:grid;grid-template-columns:120px 1fr;gap:0}
.drawer dt{color:var(--muted);padding:12px 0;border-bottom:1px solid #EDEFF3}
.drawer dd{margin:0;padding:12px 0;border-bottom:1px solid #EDEFF3;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.drawer footer{margin-top:auto;padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1B1F27;color:#fff;padding:10px 18px;border-radius:8px;z-index:120;box-shadow:var(--pop);max-width:90vw}
.note{color:var(--muted);font-size:13px}

/* ================= v2 additions ================= */
:root{
  --orange:#9A3A06; --orange-bg:#FDEBDC; --orange-line:#F5CDAE; --orange-solid:#C2410C;
}
.hide{display:none!important}
.ctxline{color:var(--muted);font-size:14px}
.titlerow .tw{flex-direction:column;align-items:flex-start}
.titlerow h1{font-size:26px}

/* mockup panel */
.mockbtn{position:fixed;right:16px;bottom:16px;z-index:90;height:38px;border-radius:19px;border:1px dashed var(--border-strong);background:#fff;padding:0 14px;font-weight:700;display:flex;gap:8px;align-items:center;box-shadow:var(--pop)}
.mockbtn:hover{background:var(--alt)}
.mockpanel{position:fixed;right:16px;bottom:64px;z-index:91;width:320px;max-width:calc(100vw - 32px);background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--pop);padding:16px 18px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 90px);overflow:auto}
.mockpanel h2{margin:0;font-size:15px}
.mockpanel fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.mockpanel legend{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:0;margin-bottom:4px}
.mockpanel label{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:6px;cursor:pointer}
.mockpanel label:hover{background:var(--alt)}
.mockpanel label small{display:block;color:var(--muted);font-size:12px}
.mockpanel input{margin-top:3px;accent-color:var(--primary);width:16px;height:16px}

/* indicators */
.ind{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px 0 7px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1}
.ind svg{width:15px;height:15px}
.ind.red{background:var(--red-bg);color:var(--red)}
.ind.orange{background:var(--orange-bg);color:var(--orange)}
.ind.violet{background:var(--violet-bg);color:var(--violet)}
.ind.blue{background:var(--blue-bg);color:var(--blue)}
.ind.amber{background:var(--amber-bg);color:var(--amber)}
.ind.teal{background:var(--teal-bg);color:var(--teal)}
.ind.slate{background:var(--slate-bg);color:var(--slate)}
button.ind{border:0}
button.ind:hover{box-shadow:0 0 0 2px currentColor inset}
.ind.zero{background:transparent;color:var(--muted);font-weight:500;padding:0 6px}
.role{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--border-2);border-radius:5px;padding:0 6px;height:20px;line-height:1;background:#fff}
.role.sens{color:var(--slate);background:var(--slate-bg);border-color:#CBD2DC}
.role svg{width:12px;height:12px}

/* event types */
.et-hearing{--c:#1E3A8A;--b:#E4E9F7}
.et-trial{--c:#86198F;--b:#F6E4F8}
.et-depo{--c:#0B627D;--b:#D9EFF5}
.et-prod{--c:#4D6310;--b:#E9F1CE}
.et-filing{--c:#A3194F;--b:#FBE3EC}
.et-med{--c:#17683A;--b:#DAF1E2}
.et-client{--c:#6B4600;--b:#F3E8CF}
.et-other{--c:#475569;--b:#E8ECF1}
.etd{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--b);color:var(--c);flex:none}
.etd svg{width:16px;height:16px}
.etd.lg{width:40px;height:40px;border-radius:10px}.etd.lg svg{width:22px;height:22px}
.evbtn{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:2px 4px 2px 2px;border-radius:8px;text-align:left;min-width:0;max-width:100%}
.evbtn:hover{background:var(--alt)}
.evbtn .tx{min-width:0;line-height:1.25}
.evbtn .tx b{display:block;font-weight:600;color:var(--c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evbtn .tx small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evbtn .tx small.soon{color:var(--amber);font-weight:700}
.evbtn .tx small.today{color:var(--red);font-weight:700}
.evchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--b);background:var(--b);color:var(--c);border-radius:999px;height:34px;padding:0 14px 0 8px;font-weight:600;font-size:13.5px;max-width:100%}
.evchip svg{width:16px;height:16px}
.evchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evchip small{font-weight:500;color:var(--text);font-size:12.5px;white-space:nowrap}
.evchip:hover{border-color:var(--c)}

/* filter bar extras */
.filters{row-gap:10px}
.filters .push{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.findbox{position:relative;width:240px;max-width:100%}
.findbox input{width:100%;height:40px;border:1px solid var(--border-strong);border-radius:8px;padding:0 12px 0 36px;background:#fff}
.findbox svg{position:absolute;left:11px;top:11px;color:var(--faint)}
.winbtn{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;background:var(--teal-bg);border:1px solid var(--teal-line);border-radius:8px;color:var(--teal);font-weight:700}
.winbtn:hover{border-color:var(--teal)}
.winbtn[aria-expanded=true]{box-shadow:0 0 0 3px var(--teal-bg);border-color:var(--teal)}
.pop{position:fixed;z-index:62;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--pop);padding:16px 18px;width:340px;max-width:calc(100vw - 24px)}
.pop h3{margin:0 0 4px;font-size:15px}
.pop p{margin:0 0 10px;color:var(--muted);font-size:13px}
.pop .rules{margin:0 0 12px;padding:10px 12px;background:var(--alt);border-radius:8px;font-size:13px;color:var(--text)}
.pop .rules b{font-weight:700}
.pop label{display:flex;align-items:center;gap:10px;padding:7px 4px;border-radius:6px;cursor:pointer}
.pop label:hover{background:var(--alt)}
.pop input{accent-color:var(--primary);width:16px;height:16px}
.pop hr{border:0;border-top:1px solid var(--border);margin:8px 0}

/* switch (layers) */
.sw-btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 8px;border:1px solid var(--border-strong);background:#fff;border-radius:8px;font-weight:600}
.sw-btn .box{width:18px;height:18px;border:1.5px solid var(--border-strong);border-radius:4px;display:grid;place-items:center;color:#fff}
.sw-btn[aria-pressed=true]{background:var(--blue-bg);border-color:var(--primary);color:var(--primary)}
.sw-btn[aria-pressed=true] .box{background:var(--primary);border-color:var(--primary)}
.sw-btn .box svg{width:12px;height:12px;stroke-width:3}
.sw-btn:not([aria-pressed=true]) .box svg{display:none}
.sw-btn:hover{background:var(--alt)}

/* active matter list */
.lhead,.mrow{display:grid;grid-template-columns:minmax(0,2.35fr) minmax(0,1.9fr) 84px minmax(0,1.4fr) minmax(0,1.85fr);column-gap:16px;align-items:center;padding:0 24px}
.lhead{height:38px;white-space:nowrap;background:var(--alt);border-bottom:1px solid var(--border);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.lhead button{border:0;background:none;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;display:inline-flex;align-items:center;gap:6px;padding:6px 0;border-radius:4px;justify-self:start}
.lhead button:hover{color:var(--text)}
.lhead [aria-sort] button,.lhead .on button{color:var(--text)}
.lhead .ar{opacity:.4}.lhead [aria-sort] .ar{opacity:1;color:var(--primary)}
.mlist{list-style:none;margin:0;padding:0}
.mrow{min-height:68px;padding-top:10px;padding-bottom:10px;border-bottom:1px solid #E7EAF0;cursor:pointer}
.mrow:hover{background:#F4F7FC}
.mrow:last-child{border-bottom:0}
.mname{border:0;background:none;padding:0;text-align:left;color:var(--primary);font-weight:700;font-size:15px;line-height:1.3;border-radius:4px;max-width:100%}
.mname:hover{text-decoration:underline}
.msub{color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.c-f{display:flex;gap:6px;flex-wrap:wrap}
.c-t b{font-size:16px;font-variant-numeric:tabular-nums}
.c-t small{display:block;color:var(--muted);font-size:12.5px}
.c-a .ind{max-width:100%;height:auto;min-height:26px;white-space:normal;padding:4px 9px 4px 7px;line-height:1.25}
.c-a small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.nomuted{color:var(--muted);font-size:13px}
.grp{display:flex;align-items:center;gap:10px;padding:10px 24px;background:#F3F5F9;border-bottom:1px solid var(--border);font-weight:700;font-size:13px}
.grp span{font-weight:500;color:var(--muted)}
.cnt{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 8px;border-radius:11px;background:var(--alt);color:var(--text);font-size:13px;font-weight:700;vertical-align:2px;margin-left:6px}
.sortnote{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.sortnote b{color:var(--text)}
.showall{display:flex;align-items:center;gap:12px;padding:4px 0}
.showall .btn{height:40px}
.quiet-row{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(0,3.4fr) minmax(0,1.6fr);gap:16px;align-items:center;padding:10px 24px;border-bottom:1px solid #E7EAF0;min-height:56px;cursor:pointer}
.quiet-row:hover{background:#F4F7FC}
.quiet-row:last-child{border-bottom:0}
.sortsel{display:none}

/* context header */
.chead .lead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chead .back{border:0;background:none;color:var(--primary);font-weight:600;display:inline-flex;gap:4px;align-items:center;padding:4px 6px 4px 0;border-radius:6px}
.chead .back:hover{text-decoration:underline}
.chead{padding:20px 24px;gap:14px}
.chead h2{font-size:24px}
.cnts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cnt-b{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 10px;border-radius:8px;border:1px solid var(--border-2);background:#fff;font-weight:600}
.cnt-b b{font-size:18px;font-variant-numeric:tabular-nums}
.cnt-b:hover{box-shadow:var(--pop)}
.cnt-b.red{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}
.cnt-b.orange{background:var(--orange-bg);border-color:var(--orange-line);color:var(--orange)}
.cnt-b.violet{background:var(--violet-bg);border-color:var(--violet-line);color:var(--violet)}
.cnt-b.blue{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue)}
.cnt-b.zero{color:var(--muted);font-weight:500;background:#fff}
.cnt-b[aria-pressed=true]{box-shadow:0 0 0 2px var(--text) inset}
.nextrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nextrow .lbl{font-size:13px;color:var(--muted);font-weight:600}
.why{color:var(--muted);font-size:13px;display:inline-flex;gap:6px;align-items:center}

/* tiles (design B) */
.tiles2{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.t2{border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 14px;background:#fff;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:92px;min-width:0;box-shadow:var(--shadow)}
.t2 .l{display:flex;gap:6px;align-items:center;font-weight:600;font-size:13.5px;line-height:1.2}
.t2 .n{font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:2px}
.t2 .h{font-size:12.5px;color:var(--muted);line-height:1.25}
.t2.red{background:var(--red-bg);border-color:var(--red-line)} .t2.red .l,.t2.red .n{color:var(--red)}
.t2.orange{background:var(--orange-bg);border-color:var(--orange-line)} .t2.orange .l,.t2.orange .n{color:var(--orange)}
.t2.violet{background:var(--violet-bg);border-color:var(--violet-line)} .t2.violet .l,.t2.violet .n{color:var(--violet)}
.t2.blue{background:var(--blue-bg);border-color:var(--blue-line)} .t2.blue .l,.t2.blue .n{color:var(--blue)}
.t2.amber{background:var(--amber-bg);border-color:var(--amber-line)} .t2.amber .l,.t2.amber .n{color:var(--amber)}
.t2.zero{background:var(--teal-bg);border-color:var(--teal-line)} .t2.zero .l,.t2.zero .n{color:var(--teal)}
.t2:hover{box-shadow:var(--pop)}
.t2[aria-pressed=true]{box-shadow:0 0 0 2px var(--text) inset}

/* B layout */
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;flex:1;min-height:0}
.bgrid>div{display:flex;flex-direction:column;gap:16px;min-width:0;min-height:0}
.bgrid .grow{flex:1 1 0;min-height:320px}
.scopechip{display:inline-flex;gap:8px;align-items:center;background:var(--blue-bg);border:1px solid var(--blue-line);color:var(--blue);border-radius:999px;height:34px;padding:0 6px 0 14px;font-weight:600}
.scopechip button{border:0;background:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;color:var(--blue)}
.agenda{list-style:none;margin:0;padding:8px 8px 12px}
.agenda h3{margin:10px 12px 4px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;gap:8px;align-items:center}
.agenda h3 .tdy{background:var(--primary);color:#fff;border-radius:10px;padding:0 8px;letter-spacing:0;text-transform:none;font-size:12px;height:18px;line-height:18px}
.ag{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:6px 12px;border-radius:8px}
.ag:hover{background:var(--alt)}
.ag .tm{width:46px;font-size:12.5px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.ag .tx{min-width:0;line-height:1.25}
.ag .tx b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag .tx small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{padding:12px 16px 16px}
.mini .mh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.mini .mh b{flex:1;font-size:15px}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mg .dw{font-size:11.5px;color:var(--muted);font-weight:700;padding:4px 0}
.md{border:0;background:none;height:40px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;position:relative}
.md:hover{background:var(--alt)}
.md.out{color:var(--faint)}
.md.today span{background:var(--primary);color:#fff;border-radius:10px;min-width:22px;height:20px;line-height:20px}
.md.sel{box-shadow:0 0 0 2px var(--text) inset}
.md i{display:flex;gap:2px;height:6px}
.md i u{width:6px;height:6px;border-radius:50%;background:var(--c);display:block}
.md i s{width:0;height:0;border-left:3.5px solid transparent;border-right:3.5px solid transparent;border-bottom:6px solid var(--red-solid);display:block}

/* calendar */
.calw{display:flex;flex-direction:column;min-height:0;flex:1}
.cal-h{gap:10px}
.cal-h h3{min-width:150px}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));overflow:auto;flex:1;min-height:0;grid-template-rows:34px;grid-auto-rows:minmax(104px,1fr)}
.cdow{padding:8px 12px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--alt);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:2}
.cday{border-right:1px solid #E7EAF0;border-bottom:1px solid #E7EAF0;padding:6px;min-width:0;display:flex;flex-direction:column;gap:3px;position:relative;background:#fff}
.cday.out{background:#FAFBFC}
.cday.out .dn{color:var(--faint)}
.cday.we{background:#F8F9FB}
.cday .dn{display:flex;align-items:center;justify-content:space-between;height:24px}
.cday .dn button.n{border:0;background:none;font-size:13px;font-weight:600;border-radius:11px;min-width:24px;height:22px;padding:0 6px}
.cday .dn button.n:hover{background:var(--alt)}
.cday.today .dn button.n{background:var(--primary);color:#fff}
.cday .addb{border:0;background:none;width:24px;height:22px;border-radius:6px;color:var(--muted);opacity:0;display:grid;place-items:center;padding:0}
.cday:hover .addb,.cday:focus-within .addb{opacity:1}
.addb:hover{background:var(--blue-bg);color:var(--primary)}
.ce{display:flex;align-items:center;gap:5px;border:0;background:var(--b);color:var(--c);border-radius:5px;padding:0 6px;font-size:12px;font-weight:600;text-align:left;min-width:0;height:22px;width:100%}
.ce svg{width:13px;height:13px}
.ce span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ce:hover{outline:1px solid var(--c)}
.ce.task{background:var(--slate-bg);color:var(--slate);font-weight:500}
.ce.task.over{background:var(--red-bg);color:var(--red);font-weight:700}
.cmore{border:0;background:none;color:var(--primary);font-size:12px;font-weight:700;text-align:left;padding:1px 6px;border-radius:4px}
.legendbar{display:flex;gap:6px 14px;flex-wrap:wrap;padding:12px 24px;border-top:1px solid var(--border);align-items:center}
.legendbar .lg{display:inline-flex;align-items:center;gap:6px;border:0;background:none;font-size:13px;padding:3px 8px 3px 4px;border-radius:6px;color:var(--text)}
.legendbar .lg:hover{background:var(--alt)}
.legendbar .lg[aria-pressed=false]{opacity:.5;text-decoration:line-through}
.legendbar .lg .etd{width:22px;height:22px;border-radius:6px}.legendbar .lg .etd svg{width:13px;height:13px}
.daypop{position:fixed;z-index:70;width:320px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--pop);padding:10px 8px 8px;max-height:70vh;overflow:auto}
.daypop h4{margin:4px 10px 6px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.daypop .x{border:0;background:none;border-radius:4px;padding:2px}
.daypop .sec{margin:8px 10px 2px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* dialogs */
.dlg-bg{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:95;display:grid;place-items:center;padding:16px;overflow:auto}
.dlg{background:#fff;border-radius:14px;box-shadow:var(--pop);width:640px;max-width:100%;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.dlg header{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--border)}
.dlg header h2{margin:0;font-size:20px;flex:1}
.dlg header .x{border:0;background:none;padding:6px;border-radius:6px}
.dlg form{display:flex;flex-direction:column;min-height:0;overflow:auto}
.dlg .body{padding:18px 24px;display:flex;flex-direction:column;gap:16px;overflow:auto}
.dlg footer{display:flex;gap:10px;padding:14px 24px;border-top:1px solid var(--border);align-items:center}
.dlg footer .sp{flex:1}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.fld>legend{font-weight:600;font-size:13.5px;padding:0}
.fld .opt{font-weight:400;color:var(--muted)}
.fld input[type=text],.fld input[type=date],.fld input[type=time],.fld select,.fld textarea{height:40px;border:1px solid var(--border-strong);border-radius:8px;padding:0 12px;background:#fff;width:100%}
.fld textarea{height:72px;padding:10px 12px;resize:vertical}
.fld input[aria-invalid=true],.fld .dd-btn[aria-invalid=true]{border-color:var(--red-solid);box-shadow:0 0 0 2px var(--red-bg)}
.fld .err{color:var(--red);font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.fld .help{color:var(--muted);font-size:13px}
fieldset.fld{border:0;margin:0;padding:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row3{display:grid;grid-template-columns:1.2fr 1fr 1.2fr;gap:16px}
.types{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.types label{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border:1px solid var(--border-2);border-radius:10px;cursor:pointer;text-align:center;font-size:12.5px;font-weight:600;line-height:1.2;min-height:78px;justify-content:center;background:#fff}
.types label:hover{background:var(--alt)}
.types input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.types label:has(input:checked){border-color:var(--c);background:var(--b);box-shadow:0 0 0 1px var(--c) inset;color:var(--c)}
.types label:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}

.apanel h2{font-size:18px;margin:2px 0 0;line-height:1.25}
.apanel .x,.drawer .x{margin-left:auto;border:0;background:none;padding:6px;border-radius:6px}
.abody{padding:12px 20px 24px}
.abody h3,.dbody2 h3,.bcont h3{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.achips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px;align-items:center}
.tkdl,.apanel dl{display:grid;grid-template-columns:100px 1fr;margin:0}
.tkdl dt,.apanel dt{color:var(--muted);padding:10px 0;border-bottom:1px solid #EDEFF3;font-size:13.5px}
.tkdl dd,.apanel dd{margin:0;padding:10px 0;border-bottom:1px solid #EDEFF3;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.hist{list-style:none;margin:0;padding:0}
.hist li{position:relative;padding:6px 0 6px 20px;font-size:14px}
.hist li small{display:block;color:var(--muted);font-size:12.5px}
.hd{position:absolute;left:2px;top:12px;width:9px;height:9px;border-radius:50%;background:var(--slate-solid)}
.hd.blue{background:var(--blue-solid)}.hd.amber{background:var(--amber-solid)}.hd.dark{background:#374151}
.lt{list-style:none;margin:0;padding:0}
.lt li{padding:6px 0;border-bottom:1px solid #EDEFF3}
.lt small{display:block;color:var(--muted);font-size:12.5px}
.cm{list-style:none;margin:0;padding:0}
.cm li{display:flex;gap:10px;padding:8px 0}
.cm p{margin:2px 0 0}
.addc{display:flex;gap:8px;margin-top:8px}
.addc input{flex:1;height:34px;border:1px solid var(--border-strong);border-radius:8px;padding:0 10px}
.mtool{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bd th{height:auto;padding:8px 4px;vertical-align:bottom;text-align:center}
.bd th:first-child{width:28%;text-align:left;padding-left:12px}
.bd td:first-child{text-align:left;overflow:hidden;text-overflow:ellipsis}
.thi{display:flex;flex-direction:column;align-items:center;gap:4px}
.thn{font-size:10.5px;white-space:normal;line-height:1.1;text-transform:none;letter-spacing:0}
.totr td{background:var(--alt)}
.bd td.tot{font-weight:700}
.bd td{height:48px}
.bcell{width:56px}
.acttable td:first-child{white-space:nowrap}

/* task window / drawer */
.tkdrawer{width:min(540px,100vw)}
.tkdrawer header{align-items:center}
.dact{margin-left:auto;display:flex;gap:8px;align-items:center}
.dbody2{padding:8px 24px 28px;overflow:auto;flex:1}
.tk-h{display:flex;gap:14px;align-items:flex-start;margin-top:12px}
.tk-h h2{margin:0;font-size:21px;line-height:1.25}
.tt.lgi{width:44px;height:44px;border-radius:10px;flex:none}
.desc{margin:0;color:var(--text)}
.bw-bg{position:fixed;inset:0;background:rgba(16,24,40,.55);z-index:95;display:grid;place-items:center;padding:3vh 3vw}
.bwin{width:min(1000px,100%);height:min(800px,94vh);background:#fff;border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden;border:1px solid #8A92A0}
.bchrome{background:#D5DAE2;flex:none}
.btab{display:flex;align-items:center;gap:8px;background:#fff;margin:8px 0 0 12px;max-width:360px;padding:0 6px 0 12px;height:34px;border-radius:8px 8px 0 0;font-size:13px}
.btab span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btab .x{border:0;background:none;border-radius:6px;padding:4px}
.btab .x:hover{background:var(--alt)}
.bbar{background:#fff;display:flex;gap:12px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border)}
.bdots i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#B8BEC9;margin-right:5px}
.burl{flex:1;background:var(--alt);border-radius:16px;padding:4px 14px;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;min-width:0;overflow:hidden;white-space:nowrap}
.bpage{flex:1;overflow:auto;background:var(--bg)}
.simnote{display:flex;gap:8px;background:var(--blue-bg);color:var(--blue);padding:8px 24px;font-size:13px;align-items:center}
.bcont{max-width:760px;margin:20px auto;padding:8px 28px 28px;background:#fff;border:1px solid var(--border);border-radius:12px}
.bcrumb{font-size:13px;color:var(--muted);padding:12px 0 0}
.dlg .dic{width:36px;height:36px;border-radius:10px;background:var(--blue-bg);color:var(--primary);display:grid;place-items:center;flex:none}
.dlg.ev{width:560px}
.dlg .body select{height:40px}
.dlg footer .note{max-width:260px}
.fld select{height:40px;border:1px solid var(--border-strong);border-radius:8px;padding:0 10px;background:#fff;width:100%}
.mockpanel a{color:var(--primary);font-weight:600}

/* responsive v3 */
@media (max-width:1280px){.page{padding:20px 24px 40px}.ov{grid-template-columns:minmax(0,1fr) 320px}}
@container main (max-width:1000px){
  .ov{grid-template-columns:minmax(0,1fr);height:auto}
  .ov .grow{flex:none;height:560px}
  .rcol .actcard{flex:none}
  .ov>.rcol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
}
@container main (max-width:760px){
  .ov>.rcol{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:1100px){
  .v-c .ov{height:auto}
}
@media (max-width:1000px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .assetscard{height:auto;min-height:560px}
  .hdr .sel{margin-left:0}
}
@media (max-width:760px){
  .ov>.rcol{grid-template-columns:minmax(0,1fr)}
  .hdr{display:grid;grid-template-columns:1fr auto}
  .hdr .ttl{order:1}.hdr .newwrap{order:2;margin-left:0}.hdr .sel{order:3;grid-column:1/3;margin:0}
  .hdr .sel .dd{flex:1 1 100%}.hdr .sel .dd-btn{width:100%}.hdr .sel .dd-btn .val{max-width:none;flex:1;text-align:left}
  .newmenu{width:min(300px,calc(100vw - 32px))}
  .mr{grid-template-columns:1fr;padding:12px 16px}.mr .c-n{grid-column:auto}
  .cfoot{padding:8px 16px}
  .kchips{padding-left:12px;padding-right:12px}
  .gridcard>.kchips{padding:12px 16px}
  .since{padding:12px 16px}
  .tkdl,.apanel dl{grid-template-columns:90px 1fr}
  .findbox.sm{width:100%}
  .apanel{width:100%}
  .ce.task.crit{background:var(--orange-solid)}.ce.task.high{background:var(--amber-solid)}
  .legendbar .ce.mini{width:22px;height:22px;border-radius:5px;display:inline-flex}
  .legendbar .ce.mini svg{display:block}
  .ctool .btn{width:100%;justify-content:center}
  .cn h2{min-width:0;font-size:20px}
  .bw-bg{padding:0}.bwin{border-radius:0;height:100vh}
  .bcont{margin:0;border:0;border-radius:0;padding:8px 16px 24px}
  .acttable{min-width:560px}
}

.gridcard{container:gc/inline-size}
.gridcard>.card-h{flex-wrap:nowrap}
.gridcard>.card-h .r,.mcard .card-h .r{white-space:nowrap}
.mcard .card-h,.evcard .card-h,.actcard .card-h{flex-wrap:nowrap}
.card-h .sub{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-h h2{white-space:nowrap}
@container gc (max-width:620px){.c-asg{display:none}}
.mscroll{max-height:268px}
.mr{grid-template-columns:minmax(0,1.3fr) minmax(0,1.6fr) 140px;min-height:60px}
.mname{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:left}
.msub{flex-wrap:nowrap;overflow:hidden}
.msub .cn1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.msub .role{flex:none}
.topts{flex-wrap:nowrap}
.topts .link{white-space:nowrap}
@media (max-width:760px){.mr{grid-template-columns:1fr}.gridcard>.card-h,.mcard .card-h{flex-wrap:wrap}.mcard .card-h .sub{white-space:normal}}
.h2s{display:flex;flex-direction:column;line-height:1.2}
.h2s .sub{font-size:13px}
.calw .cgrid{grid-auto-rows:minmax(92px,auto)}
.mr{grid-template-columns:minmax(0,1.1fr) minmax(0,1.9fr) 128px}
@media (max-width:760px){.hdr h1{font-size:22px;white-space:nowrap}.hdr .chip-i{width:34px;height:34px}.hdr .ttl{gap:10px}.mr{grid-template-columns:1fr}}
.drawer-bg{z-index:92}.tkdrawer{z-index:93}
.ppl{display:none}
.ttable .c-prio{display:table-cell}
.ttable col.c-prio{display:table-column}

.ttable col.c-asg{display:table-column}

function treeNodes(){

  CLIENTS.forEach(c=>{

    const cm=!q||c.name.toLowerCase().includes(q);
    let list=all.filter(m=>(!S.tree.activeOnly||ST[m.id].active)&&(cm||m.name.toLowerCase().includes(q)||m.code.toLowerCase().includes(q)));
    if(q&&!cm&&!list.length)return;if(S.tree.activeOnly&&!list.length&&!q)return;
    list=list.slice().sort((a,b)=>(ST[b.id].active-ST[a.id].active)||ST[b.id].rank-ST[a.id].rank||a.name.localeCompare(b.name));

let TYPE={s:'',t:0};
function onTreeKey(e){
  const li=e.target.closest('[role=treeitem]');if(!li)return;
  const lis=treeLis();const i=lis.indexOf(li);const node=li.dataset.node;
  const go=n=>{if(!lis[n])return;lis.forEach(x=>x.tabIndex=-1);lis[n].tabIndex=0;lis[n].focus();S.tree.focus=lis[n].dataset.node};
  const k=e.key;
  if(k==='ArrowDown'){e.preventDefault();go(Math.min(lis.length-1,i+1))}
  else if(k==='ArrowUp'){e.preventDefault();go(Math.max(0,i-1))}
  else if(k==='Home'){e.preventDefault();go(0)}
  else if(k==='End'){e.preventDefault();go(lis.length-1)}
  else if(k==='ArrowRight'){e.preventDefault();if(node[0]==='c'){const id=node.slice(2);if(li.getAttribute('aria-expanded')==='false'){S.tree.exp[id]=true;persistTree();S.tree.focus=node;refreshTree(node)}else go(i+1)}}
  else if(k==='ArrowLeft'){e.preventDefault();if(node[0]==='c'){const id=node.slice(2);if(li.getAttribute('aria-expanded')==='true'&&!S.tree.q){S.tree.exp[id]=false;persistTree();S.tree.focus=node;refreshTree(node)}}else{const p=li.parentNode.closest('[role=treeitem]');p&&go(lis.indexOf(p))}}
  else if(k==='Enter'||k===' '){e.preventDefault();treeSelect(node)}
  else if(k==='*'){e.preventDefault();CLIENTS.forEach(c=>S.tree.exp[c.id]=true);persistTree();refreshTree(node)}
  else if(k.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    const now=Date.now();TYPE.s=(now-TYPE.t>800?'':TYPE.s)+k.toLowerCase();TYPE.t=now;
    const lab=x=>$('.lbl',x).textContent.toLowerCase();
    let n=lis.findIndex((x,ix)=>ix>(TYPE.s.length>1?i-1:i)&&lab(x).startsWith(TYPE.s));if(n<0)n=lis.findIndex(x=>lab(x).startsWith(TYPE.s));
    if(n>=0){e.preventDefault();go(n)}
  }
}

function monthDays(y,m){const first=new Date(y,m,1),start=addDays(first,-first.getDay());const last=new Date(y,m+1,0);const n=Math.ceil((first.getDay()+last.getDate())/7)*7;const out=[];for(let i=0;i<n;i++)out.push(addDays(start,i));return out}

function tShown(t){const c=S.shows;if(t.status==='On hold')return false;return c.all||(c.crit&&t.prio==='Critical')||(c.high&&t.prio==='High')||(c.over&&isOver(t))}
function calData(){

}

  return '<div class="mtool"><div class="seg" role="group" aria-label="Metrics view"><button type="button" data-act="mview" data-v="breakdown" aria-pressed="'+(S.mview==='breakdown')+'">'+ic('i-table','sm')+'Breakdown</button><button type="button" data-act="mview" data-v="data" aria-pressed="'+(S.mview==='data')+'">'+ic('i-pie','sm')+'Data</button></div><span class="note">'+(S.mview==='breakdown'?'Open tasks by type. Click a number to see those tasks.':'Assets by group, with volume.')+'</span></div>'+(S.mview==='breakdown'?breakdownHTML():dataHTML());
}
function breakdownHTML(){
  const ids=sIds();const list=openTasks(ids);
  if(!list.length)return '<section class="card"><div class="empty good">'+ic('i-checkc')+'<span>Nothing open here.</span></div></section>';
  const single=!!S.matter;
  let h='<section class="card gridcard" aria-label="Breakdown"><div class="gscroll"><table class="bd">';
  if(single){
    const cols=[['New',t=>t.status==='New'],['In progress',t=>t.status==='In progress'],['On hold',t=>t.status==='On hold'],['Overdue',isOver]];
    h+='<caption class="sr">Open tasks by type and status</caption><thead><tr><th>Task type</th>'+cols.map(c=>'<th>'+c[0]+'</th>').join('')+'<th>Total</th></tr></thead><tbody>';
    TTYPES.forEach(ty=>{const l=list.filter(t=>t.type===ty.id);if(!l.length)return;
      h+='<tr><td><div class="cell"><span class="tt" style="background:'+ty.col+'">'+ic(ty.icon)+'</span><span>'+ty.name+'</span></div></td>'+cols.map((c,i)=>{const n=l.filter(c[1]).length;return '<td>'+bcell(n,i===3?'over':'',ty.id,S.matter,i===2?'hold':i===3?'overdue':'open',ty.name+' '+c[0])+'</td>'}).join('')+'<td class="tot">'+l.length+'</td></tr>'});
    h+='</tbody></table>';
  }else{
    const types=TTYPES.filter(ty=>list.some(t=>t.type===ty.id));
    const rows=inScope().map(m=>({m,l:list.filter(t=>t.m===m.id)})).filter(r=>r.l.length).sort((a,b)=>b.l.length-a.l.length);
    const pages=Math.max(1,Math.ceil(rows.length/12));if(S.bpage>pages)S.bpage=pages;
    h+='<caption class="sr">Open tasks by matter and task type</caption><thead><tr><th>Matter</th>'+types.map(ty=>'<th title="'+ty.name+'"><span class="thi"><span class="tt" style="background:'+ty.col+'">'+ic(ty.icon)+'</span><span class="thn">'+ty.name.replace(' / Analytics','').replace('Production / Export','Export')+'</span></span></th>').join('')+'<th>Total</th></tr></thead><tbody>';
    rows.slice((S.bpage-1)*12,S.bpage*12).forEach(r=>{
      h+='<tr><td><button type="button" class="lnk" data-act="pickm" data-id="'+r.m.id+'">'+esc(r.m.name)+'</button></td>'+types.map(ty=>{const l=r.l.filter(t=>t.type===ty.id);const od=l.filter(isOver).length;return '<td>'+bcell(l.length,od?'over':'',ty.id,r.m.id,'open',ty.name+' in '+r.m.name+(od?', '+od+' overdue':''))+'</td>'}).join('')+'<td class="tot">'+r.l.length+'</td></tr>'});
    const tot=types.map(ty=>list.filter(t=>t.type===ty.id).length);
    h+='<tr class="totr"><td><b>All matters</b></td>'+tot.map(n=>'<td class="tot">'+n+'</td>').join('')+'<td class="tot">'+list.length+'</td></tr></tbody></table>';
    h+='</div><div class="pager"><span>'+rows.length+' matters with open tasks</span>'+pageNav(S.bpage,pages,'bpage')+'</div><div class="legend"><span><span class="sw" style="background:var(--red-bg);color:var(--red)">3</span> has overdue tasks</span><span>Click a number to see those tasks in the Overview.</span></div></section>';
    return h;
  }
  return h+'</div><div class="legend"><span><span class="sw" style="background:var(--red-bg);color:var(--red)">3</span> Overdue (not on hold)</span><span>Click a number to see those tasks in the Overview.</span></div></section>';
}
function bcell(n,cls,ty,m,pre,label){return '<button type="button" class="bcell'+(n?(cls?' '+cls:''):' zero')+'" '+(n?'data-act="drill" data-ty="'+ty+'" data-id="'+m+'" data-v="'+pre+'"':'disabled')+' aria-label="'+esc(label)+': '+n+'">'+n+(cls==='over'&&n?'<span class="sr"> overdue</span>':'')+'</button>'}
function dataHTML(){
  const ids=sIds();const list=DB.assets.filter(a=>ids.has(a.m)).map(enrich);
  const nNew=list.filter(a=>a.added<S.win).length,nUpd=list.filter(a=>a.added>=S.win&&a.upd<S.win).length;
  const docs=list.reduce((s,a)=>s+a.docs,0),gb=list.reduce((s,a)=>s+a.gb,0);
  const key=S.dgroup;const g={};
  list.forEach(a=>{const k=key==='type'?a.type:key==='status'?a.status:mById(a.m).name;const o=g[k]||(g[k]={k,n:0,nw:0,docs:0,gb:0});o.n++;if(a.added<S.win)o.nw++;o.docs+=a.docs;o.gb+=a.gb});
  const rows=Object.values(g).sort((a,b)=>b.n-a.n);
  const COLS=['#1F4E9C','#0F766E','#6D4BC2','#B45309','#0E7490','#A3194F','#475569'];
  const max=Math.max(1,...rows.map(r=>r.n)),tot=rows.reduce((s,r)=>s+r.n,0)||1;
  const tile=(l,n,sub,cls)=>'<div class="tile '+(cls||'')+'"><div><div class="n">'+n+'</div><div class="l">'+l+(sub?'<br><small>'+sub+'</small>':'')+'</div></div></div>';
  let h='<section class="card gridcard" aria-label="Data"><div class="selbar">'+ddBtn('dgroup','i-layers','Group by: '+({type:'Asset type',status:'Asset status',matter:'Matter'})[key],true)+'<div class="seg" role="group" aria-label="View"><button type="button" data-act="dview" data-v="table" aria-pressed="'+(S.dview==='table')+'">'+ic('i-table','sm')+'Table</button><button type="button" data-act="dview" data-v="bar" aria-pressed="'+(S.dview==='bar')+'">'+ic('i-bar','sm')+'Bar</button><button type="button" data-act="dview" data-v="pie" aria-pressed="'+(S.dview==='pie')+'">'+ic('i-pie','sm')+'Pie</button></div></div>'
   +'<div class="tiles">'+tile('Assets',list.length,'in scope')+tile('Added',nNew,'last '+S.win+' days',nNew?'amber':'')+tile('Updated',nUpd,'last '+S.win+' days')+tile('Documents',docs.toLocaleString('en-US'),'in these assets')+tile('Volume',Math.round(gb).toLocaleString('en-US')+'<small>GB</small>','asset volume')+'</div><div class="dbody">';
  if(!list.length)h+='<div class="empty">'+ic('i-info')+'<span>No assets in this scope yet.</span></div>';
  else if(S.dview==='table')h+='<div style="overflow:auto;border:1px solid var(--border);border-radius:10px"><table><caption class="sr">Assets grouped</caption><thead><tr><th>'+({type:'Asset type',status:'Status',matter:'Matter'})[key]+'</th><th style="width:100px">Assets</th><th style="width:100px">New</th><th style="width:130px">Documents</th><th style="width:110px">Volume</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.k)+'</td><td>'+r.n+'</td><td>'+(r.nw?'<span class="asset-kind new">+'+r.nw+'</span>':'<span class="note">0</span>')+'</td><td>'+r.docs.toLocaleString('en-US')+'</td><td>'+(Math.round(r.gb*10)/10)+' GB</td></tr>').join('')+'</tbody></table></div>';
  else if(S.dview==='bar')h+='<div class="bars">'+rows.map((r,i)=>'<div class="barrow"><span>'+esc(r.k)+'</span><div class="track"><div class="fill" style="width:'+Math.max(5,r.n/max*100)+'%;background:'+COLS[i%7]+'">'+r.n+'</div></div><span class="v">'+r.n+' <small>assets</small></span></div>').join('')+'</div>';
  else{let a0=-Math.PI/2,paths='';rows.forEach((r,i)=>{const a1=a0+r.n/tot*Math.PI*2;const x0=110+100*Math.cos(a0),y0=110+100*Math.sin(a0),x1=110+100*Math.cos(a1),y1=110+100*Math.sin(a1);paths+=rows.length===1?'<circle cx="110" cy="110" r="100" fill="'+COLS[0]+'"/>':'<path d="M110 110L'+x0.toFixed(1)+' '+y0.toFixed(1)+'A100 100 0 '+(r.n/tot>.5?1:0)+' 1 '+x1.toFixed(1)+' '+y1.toFixed(1)+'Z" fill="'+COLS[i%7]+'" stroke="#fff" stroke-width="2"/>';a0=a1});
    h+='<div class="pie"><svg viewBox="0 0 220 220" role="img" aria-label="Assets by '+key+'">'+paths+'</svg><ul>'+rows.map((r,i)=>'<li><span class="sw2" style="background:'+COLS[i%7]+'"></span><span class="nm">'+esc(r.k)+'</span><b>'+r.n+'</b><span class="pc">'+Math.round(r.n/tot*100)+'%</span></li>').join('')+'</ul></div>'}
  return h+'</div></section>';
}

/* ---------- Activity tab ---------- */
function activityHTML(){
  const all=feedList();const list=all.filter(a=>S.ak==='all'||a.kind===S.ak);
  const unread=all.filter(a=>a.unread&&!S.read[a.id]).length;
  const pages=Math.max(1,Math.ceil(list.length/PAGE));if(S.apgA>pages)S.apgA=pages;
  const sl=list.slice((S.apgA-1)*PAGE,S.apgA*PAGE);
  let h='<section class="card gridcard grow" aria-label="Activity"><div class="since'+(unread?'':' read')+'">'+(unread?ic('i-bell','sm')+'<span><b>'+unread+' unread</b> since your last visit</span><button type="button" class="btn sm" data-act="markread">Mark as read</button>':ic('i-checkc','sm')+'You are up to date.')+'</div>'+kchips(S.ak,'ak',all);
  if(!sl.length)return h+'<div class="empty">'+ic('i-info')+'<span>No activity of this kind.</span></div></section>';
  h+='<div class="gscroll"><table class="acttable"><caption class="sr">Recent activity</caption><colgroup><col style="width:116px"><col style="width:170px" class="c-asg"><col><col style="width:24%" class="c-prio"><col style="width:22%" class="c-matter"></colgroup><thead><tr><th>When</th><th class="c-asg">Who</th><th>What</th><th class="c-prio">Task</th><th class="c-matter">Matter</th></tr></thead><tbody>'
   +sl.map(a=>{const un=a.unread&&!S.read[a.id];const t=a.task?tById(a.task):null;const as=a.asset?aById(a.asset):null;
     return '<tr><td><span class="unread'+(un?'':' n')+'" aria-hidden="true"></span>'+(un?'<span class="sr">Unread. </span>':'')+agoText(a.h)+'</td><td class="c-asg"><div class="cell">'+(a.who==='System'?'<span class="mini-av sysav" aria-hidden="true">'+ic('i-clock','xs')+'</span>':avatar(a.who))+'<span>'+esc(a.who)+'</span></div></td><td><span class="kind '+KD[a.kind].cls+'">'+ic(KD[a.kind].icon,'xs')+KD[a.kind].t.replace('New ','')+'</span> '+esc(a.text.replace(/ (on|to|in)$/,''))+'</td><td class="c-prio">'+(t?'<button type="button" class="lnk" data-act="act" data-id="'+a.id+'">'+esc(t.title)+'</button>':as?'<button type="button" class="lnk" data-act="act" data-id="'+a.id+'">'+esc(as.name)+'</button>':'-')+'</td><td class="c-matter">'+esc(mById(a.m).name)+'</td></tr>'}).join('')
   +'</tbody></table></div><div class="pager"><span>Showing '+((S.apgA-1)*PAGE+1)+'-'+Math.min(list.length,S.apgA*PAGE)+' of '+list.length+'</span>'+pageNav(S.apgA,pages,'apgA')+'</div></section>';
  return h;
}

/* ====================== overlays: task window / drawer / event / forms ====================== */
let LASTFOCUS=null,FORM=null;
function closeModal(){const m=$('#modal');if(m)m.remove();document.body.classList.remove('nomodal-scroll');if(LASTFOCUS&&document.contains(LASTFOCUS))LASTFOCUS.focus();LASTFOCUS=null}
function mountModal(html,cls,label){
  closeAllPop(false);closePop();
  if(!$('#modal'))LASTFOCUS=document.activeElement;else $('#modal').remove();
  const w=document.createElement('div');w.id='modal';w.className=cls;w.setAttribute('role','dialog');w.setAttribute('aria-modal','true');w.setAttribute('aria-label',label);w.innerHTML=html;
  $('#overlay').appendChild(w);const f=$('[data-focus]',w)||$('button,input,select',w);f&&f.focus();return w;
}
function taskBodyHTML(t){
  const m=mById(t.m),c=CL[m.client],ty=TT[t.type];const r=rng(hash(t.id));
  const created=addDays(TODAY,-(14+Math.floor(r()*40)));
  const hist=DB.feed.filter(a=>a.task===t.id).slice(0,5);
  const cmts=hist.filter(a=>a.kind==='comment').map(a=>({who:a.who,h:a.h,t:pick2(r,['Can we confirm the custodian list before Friday?','Vendor says the batch is ready, reviewing now.','Flagging this for the partner call.','Updated the coding layout as discussed.'])}));
  if(!cmts.length)cmts.push({who:PEOPLE[1+Math.floor(r()*7)],h:30+Math.floor(r()*200),t:'Picked this up, starting with the first batch.'});
  const over=isOver(t),risk=isRisk(t);
  return '<div class="tk-h"><span class="tt lgi" style="background:'+ty.col+'">'+ic(ty.icon,'lg')+'</span><div><div class="note">'+t.id+' &middot; '+ty.name+'</div><h2>'+esc(t.title)+'</h2></div></div>'
   +'<div class="achips">'+(over?'<span class="pill red">'+ic('i-warn','xs')+'Overdue</span>':'')+(t.prio==='Critical'?'<span class="pill crit2">'+ic('i-flame','xs')+'Critical</span>':t.prio==='High'?'<span class="pill high">'+ic('i-up','xs')+'High</span>':'')+(t.status==='On hold'?'<span class="pill hold">'+ic('i-pause','xs')+'On hold</span>':risk?'<span class="pill risk">'+ic('i-clock','xs')+'At risk</span>':'')+'<span class="pill blue">'+t.status+'</span></div>'
   +'<dl class="tkdl"><dt>Client</dt><dd>'+esc(c.name)+'</dd><dt>Matter</dt><dd>'+esc(m.name)+sensChip(m)+'</dd><dt>Priority</dt><dd>'+t.prio+'</dd><dt>Assignee</dt><dd>'+(t.asg?avatar(t.asg)+esc(t.asg):'<span class="una">'+ic('i-userx','sm')+'Unassigned</span>')+'</dd><dt>Due</dt><dd><span class="due '+(over?'over':risk?'soon':'')+'">'+fmtFull(addDays(TODAY,t.due))+' ('+(t.due<0?plural(-t.due,'day')+' overdue':t.due===0?'today':'in '+t.due+' days')+')</span></dd><dt>Created</dt><dd>'+fmtFull(created)+'</dd></dl>'
   +'<h3>Description</h3><p class="desc">'+ty.name+' work on '+esc(m.name)+'. Follow the matter protocol, record any privilege calls in the log, and tell the PM before the due date if the volume changes.</p>'
   +'<h3>Comments</h3><ul class="cm">'+cmts.map(c=>'<li>'+avatar(c.who)+'<div><b>'+esc(c.who)+'</b> <span class="note">'+agoText(c.h)+'</span><p>'+esc(c.t)+'</p></div></li>').join('')+'</ul>'
   +'<h3>History</h3><ol class="hist">'+hist.map(a=>'<li><span class="hd slate"></span><b>'+esc(a.who)+'</b> '+esc(a.text.replace(/ (on|to|in)$/,''))+' <span class="note">'+agoText(a.h)+'</span></li>').join('')+'<li><span class="hd blue"></span><b>Created</b> <span class="note">'+fmtFull(created)+'</span></li></ol>';
}
