     +'<div class="fld"><label for="f-aname">Asset name</label><input type="text" id="f-aname" autocomplete="off" aria-describedby="err-aname">'+fldErr('aname')+'</div><div class="fld"><label for="f-acomment">Comment <span class="opt">(optional)</span></label><textarea id="f-acomment"></textarea></div>';
  }else{
    body+='<div class="fld"><label for="f-pname">Project name</label><input type="text" id="f-pname" autocomplete="off" aria-describedby="err-pname">'+fldErr('pname')+'</div><div class="fld"><label for="f-pdesc">Description <span class="opt">(optional)</span></label><textarea id="f-pdesc"></textarea></div>';
  }
  mountModal('<form class="dlg" novalidate><header><span class="dic">'+ic({task:'i-tasks',event:'i-cal',asset:'i-box',project:'i-folder'}[kind],'lg')+'</span><h2>'+titles[kind]+'</h2><button type="button" class="x" data-act="closemodal" aria-label="Close">'+ic('i-x')+'</button></header><div class="body">'+body+'</div><footer><span class="note">'+(FORM.matter?'Prefilled from your selection.':FORM.client?'Client prefilled; choose a matter.':'Nothing chosen on the page yet.')+'</span><span class="sp"></span><button type="button" class="btn" data-act="closemodal">Cancel</button><button type="submit" class="btn primary">'+(kind==='event'?'Add event':'Create')+'</button></footer></form>','dlg-bg',titles[kind]);
  $('#f-client').focus();updateVis();
}
function updateVis(){const el=$('#vis');if(!el)return;const id=$('#f-matter').value;const m=id?mById(id):null;el.innerHTML=m&&m.sens?ic('i-lock','sm')+'<span><b>Sensitive matter.</b> Only people with access to this matter will see this event.</span>':ic('i-eye','sm')+'<span>Visible to people who can see this matter.</span>'}
function submitForm(form){
  const kind=FORM.kind;const v=id=>{const e=$('#'+id,form);return e?e.value.trim():''};
  const errs={};
  if(!v('f-client'))errs.client='Choose a client.';
  if(!v('f-matter'))errs.matter='Choose a matter.';
  if((kind==='task'||kind==='event')&&!v('f-title'))errs.title='Enter a title.';
  if(kind==='task'&&!v('f-due'))errs.due='Pick a due date.';
  if(kind==='event'&&!v('f-date'))errs.date='Pick a date.';
  if(kind==='asset'&&!v('f-aname'))errs.aname='Enter a name for the asset.';
  if(kind==='project'&&!v('f-pname'))errs.pname='Enter a project name.';
  $$('.err',form).forEach(e=>e.innerHTML='');$$('[aria-invalid]',form).forEach(e=>e.removeAttribute('aria-invalid'));
  const keys=Object.keys(errs);
  if(keys.length){keys.forEach(k=>{const el=$('#err-'+k,form);el.innerHTML=ic('i-warn','xs')+errs[k];const inp=$('#f-'+k,form);inp&&inp.setAttribute('aria-invalid','true')});$('#f-'+keys[0],form).focus();return}
  const mid=v('f-matter'),m=mById(mid);
  if(kind==='task'){
    const id='T-'+(2000+(DB.seq++));DB.tasks.push({id,m:mid,type:v('f-type'),title:v('f-title'),status:'New',due:dayDiff(parseD(v('f-due')),TODAY),prio:v('f-prio'),asg:v('f-asg')||null});S.newTask=id;
    toast('Task '+id+' created in '+m.name+'.');
  }else if(kind==='event'){
    const ty=(form.querySelector('input[name=etype]:checked')||{}).value||'other';
    DB.events.push({id:'E-'+(300+DB.seq++),m:mid,type:ty,title:v('f-title'),date:v('f-date'),time:v('f-time'),note:v('f-note'),rem:+v('f-rem'),by:PEOPLE[0]});
    const d=parseD(v('f-date'));S.month=[d.getFullYear(),d.getMonth()];toast(ET[ty].name+' added on '+fmtFull(d)+'.');
  }else if(kind==='asset'){
    const a={id:'A-'+(9000+DB.seq++),m:mid,name:v('f-aname'),type:v('f-atype'),added:0,upd:0,docs:0,status:v('f-astatus'),comment:v('f-acomment'),gb:0,owner:PEOPLE[0],_e:1};DB.assets.push(a);S.asel=null;
    toast('Asset "'+a.name+'" added to '+m.name+'.');
  }else{
    toast('Project "'+v('f-pname')+'" created'+(m?' in '+m.name:'')+'.');
  }
  closeModal();render({flash:true});
}

/* ====================== mock panel ====================== */
function mockHTML(){
  const rd=(name,val,label,small,on)=>'<label><input type="radio" name="'+name+'" value="'+val+'"'+(on?' checked':'')+'><span>'+label+(small?'<small>'+small+'</small>':'')+'</span></label>';
  const names={a:'A. Dropdowns (PM specification)',b:'B. Dropdowns plus tree view',c:'C. Recommended'};
  return '<button type="button" class="mockbtn" id="mockbtn" aria-expanded="'+S.mockOpen+'" aria-controls="mockpanel">'+ic('i-sliders','sm')+'Mockup</button>'
   +(S.mockOpen?'<div class="mockpanel" id="mockpanel" role="group" aria-label="Mockup settings"><h2>Mockup settings</h2><div class="note">'+names[V]+'. Mock data only.</div>'
   +'<fieldset><legend>How many matters</legend>'+rd('mstate','normal','40 open matters','the sample data',S.state==='normal'&&!S.stress)+rd('mstate','one','One matter','dropdowns locked',S.state==='one')+rd('mstate','empty','No matters yet','empty state',S.state==='empty')+rd('mstate','n100','100 matters','stress test',S.state==='normal'&&S.stress)+'</fieldset>'
   +'<fieldset><legend>What you may create</legend>'+rd('mperm','full','Everything','all four + New options',S.perm==='full')+rd('mperm','limited','Limited','New asset and New project disabled, with a reason',S.perm==='limited')+'</fieldset>'
   +'<fieldset><legend>Click on a task or activity</legend>'+rd('mopen','window','New window','what the PM asked for',S.open==='window')+rd('mopen','drawer','Right drawer','recommended, with Open in new window',S.open==='drawer')+'</fieldset>'
   +'<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn sm" data-act="mreset">Reset</button></div>'
   +'<div class="note">Other samples: <a href="my-matters-v3-a-dropdowns.html">A</a> &middot; <a href="my-matters-v3-b-tree.html">B</a> &middot; <a href="my-matters-v3-c-recommended.html">C</a></div></div>':'');
}
function mountMock(){$('#mockhost').innerHTML=mockHTML()}
function applyState(val){
  if(val==='n100'){S.stress=true;S.state='normal'}else{S.stress=false;S.state=val}
  setDB();S.client='';S.matter='';compute();
  if(S.state==='one'){S.client=DB.matters[0].client;S.matter=DB.matters[0].id}
  S.asel=null;S.tpage=1;S.apg=1;
}

/* ====================== hash ====================== */
function writeHash(){
  const p=[];if(S.client)p.push('client='+S.client);if(S.matter)p.push('matter='+S.matter);if(S.tab!=='overview')p.push('tab='+S.tab);
  if(S.state!=='normal')p.push('state='+S.state);if(S.stress)p.push('n=100');if(S.perm!=='full')p.push('perm='+S.perm);
  if(S.open!==(V==='c'?'drawer':'window'))p.push('open='+S.open);
  if(S.month[0]!==2026||S.month[1]!==9)p.push('month='+S.month[0]+'-'+p2(S.month[1]+1));
  if(S.mview!=='breakdown')p.push('mview='+S.mview);if(V==='b'&&S.tree.open&&(S.client||S.matter))p.push('tree=1');
  try{history.replaceState(null,'',p.length?'#'+p.join('&'):location.pathname.split('/').pop())}catch(_){}
}
function readHash(){
  const h=location.hash.replace(/^#/,'');if(!h)return false;
  const o=Object.fromEntries(h.split('&').map(x=>x.split('=')));
  if(o.n==='100'){S.stress=true;setDB()}
  if(['normal','one','empty'].includes(o.state))S.state=o.state;
  compute();
  if(o.client&&CL[o.client])S.client=o.client;
  if(o.matter&&mById(o.matter)){S.matter=o.matter;S.client=mById(o.matter).client}
  if(S.state==='one'){S.client=DB.matters[0].client;S.matter=DB.matters[0].id}
  if(['overview','calendar','assets','metrics','activity'].includes(o.tab))S.tab=o.tab;
  if(o.perm==='limited')S.perm='limited';
  if(o.open==='window'||o.open==='drawer')S.open=o.open;
  if(o.month&&/^\d{4}-\d{2}$/.test(o.month))S.month=[+o.month.slice(0,4),+o.month.slice(5)-1];
  if(o.mview==='data')S.mview='data';
  
  return true;
}

/* ====================== events ====================== */
document.addEventListener('click',e=>{
  const t=e.target;
  const chv=t.closest('[data-tchv]');
  if(chv){const id=chv.dataset.tchv;S.tree.exp[id]=!S.tree.exp[id];persistTree();S.tree.focus='c:'+id;refreshTree('c:'+id);return}
  const tn=t.closest('#treebody .tn');
  if(tn){const node=tn.closest('[role=treeitem]').dataset.node;const pop=!!$('#treepop');treeSelect(node);if(pop)closeTreePop(true);else{const rb=$('#railbtn');if(rb)rb.focus()}return}
  const ddb=t.closest('[data-dd]');
  if(ddb&&!ddb.disabled){openDD(ddb,ddDef(ddb.dataset.dd),ddb.dataset.dd);return}
  const opt=t.closest('.dd-panel li[role=option]');
  if(opt&&DD){ddPick(opt.dataset.v);return}
  if(t.closest('[data-dddone]')){closeDD(true);return}
  const nw=t.closest('[data-new]');
  if(nw){
    if(nw.getAttribute('aria-disabled')==='true'){return}
    closeMenu(false);openForm(nw.dataset.new);return;
  }
  if(t.closest('#mockbtn')){S.mockOpen=!S.mockOpen;mountMock();return}
  const tr=t.closest('#abody tr[data-aid]');
  if(tr&&!t.closest('[data-act]')){selectAsset(tr.dataset.aid,false);return}
  const el=t.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,v=el.dataset.v,id=el.dataset.id;
  switch(a){
    case 'newmenu':openMenu(el);break;
    case 'tab':S.tab=v;S.asel=null;closePop();render({top:true});break;
    case 'tpage':S.tpage=+v;render({});break;
    case 'apgA':S.apgA=+v;render({});break;
    case 'bpage':S.bpage=+v;render({});break;
    case 'apage':S.apg=+v;fillAssets();{const b=$('#apager [data-v="'+v+'"]');b&&b.focus()}break;
    case 'tsort':S.tsort=S.tsort.k===el.dataset.k?{k:el.dataset.k,d:-S.tsort.d}:{k:el.dataset.k,d:1};S.tpage=1;render({});break;
    case 'asort':S.asort=S.asort.k===el.dataset.k?{k:el.dataset.k,d:-S.asort.d}:{k:el.dataset.k,d:1};S.apg=1;render({});break;
    case 'treset':S.pre='open';S.fType='';S.tsort={k:'urg',d:1};S.tpage=1;render({});break;
    case 'clearftype':S.fType='';render({});break;
    case 'pre':S.pre=S.pre===v?'open':v;S.tpage=1;render({});break;
    case 'task':closePop();openTask(id);break;
    case 'towindow':{const tid=id;closeModal();openTask(tid,'window')}break;
    case 'closemodal':closeModal();break;
    case 'act':{
      const f=DB.feed[+id];f.unread=false;
      if(f.asset){S.tab='assets';S.aq='';S.afilt={client:'',matter:'',type:'',created:'',updated:'',status:'',comment:''};S.asel=f.asset;{const l=assetRowsData();const ix=l.findIndex(x=>x.id===f.asset);S.apg=ix<0?1:Math.floor(ix/PAGE)+1}render({top:true});const row=$('#abody tr.sel');row&&row.scrollIntoView({block:'center'})}
      else openTask(f.task);
      break}
    case 'viewall':S.ak=S.pk;S.tab='activity';render({top:true});break;
    case 'pk':S.pk=v;render({});break;
    case 'ak':S.ak=v;S.apgA=1;render({});break;
    case 'markread':feedList().forEach(f=>S.read[f.id]=true);render({});break;
    case 'event':closePop();openEvent(id);break;
    case 'evdel':{
      const bar=$('#delbar');
      if(!bar.innerHTML){bar.innerHTML='<div class="delbar">'+ic('i-warn','sm')+'<span>Delete this event?</span><button type="button" class="btn sm dsolid" data-act="evdel2" data-id="'+id+'">Yes, delete</button></div>';$('[data-act=evdel2]').focus()}
      break}
    case 'evdel2':DB.events=DB.events.filter(x=>x.id!==id);closeModal();render({});toast('Event deleted.');break;
    case 'day':openPop(el,dayPopHTML(el.dataset.d));break;
    case 'closepop':{const b=closePop();b&&b.focus()}break;
    case 'addevent':closePop();openForm('event',{date:el.dataset.d});break;
    case 'mprev':case 'mnext':{const d=new Date(S.month[0],S.month[1]+(a==='mnext'?1:-1),1);S.month=[d.getFullYear(),d.getMonth()];render({});say(MON[S.month[1]]+' '+S.month[0]);break}
    case 'mtoday':S.month=[TODAY.getFullYear(),TODAY.getMonth()];render({});break;
    case 'pickm':setMatter(id);break;
    case 'drill':{setMatter(id);S.fType=el.dataset.ty;S.pre=v==='open'?'open':v;S.tab='overview';render({top:true,flash:true});say('Showing '+TT[S.fType].name+' tasks.');break}
    case 'lgroup':S.list.group=!S.list.group;render({});break;
    case 'lgtoggle':S.tree.exp['L'+id]=S.tree.exp['L'+id]===false;render({});break;
    case 'lmore':S.list.lim+=25;render({});break;
    case 'lall':S.list.all=!S.list.all;render({});break;
    case 'mview':S.mview=v;render({});break;
    case 'dview':S.dview=v;render({});break;
    case 'aopen':selectAsset(id,true);break;
    case 'aclose':{const sid=S.asel;selectAsset(null);const b=sid&&$('#abody tr[data-aid="'+sid+'"] .lnk');b&&b.focus()}break;
    case 'aclear':S.afilt={client:'',matter:'',type:'',created:'',updated:'',status:'',comment:''};S.aq='';S.apg=1;render({});break;
    case 'browse':openTreePop(el);break;
    case 'clearctx':S.client='';S.matter='';ctxChanged();break;
    case 'texpand':S.tree.open=true;persistTree();render({});{const n=$('#treep [aria-selected=true]')||$('#treep [role=treeitem]');n&&n.focus()}break;
    case 'tcollapse':S.tree.open=false;persistTree();render({});{const b=$('#railbtn');b&&b.focus()}break;
    case 'tpin':S.tree.pin=!S.tree.pin;persistTree();render({});break;
    case 'ttoggleall':{const all=CLIENTS.every(c=>S.tree.exp[c.id]);CLIENTS.forEach(c=>S.tree.exp[c.id]=!all);persistTree();const tp=$('#treep')||$('#treepop');tp.innerHTML=treePanelHTML(tp.id);{const b=$('[data-act=ttoggleall]',tp);b&&b.focus()}break}
    case 'tclose':closeTreePop(true);break;
    case 'mreset':resetMock();break;
    case 'toast':toast(el.dataset.v);break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='aq'){S.aq=t.value;S.apg=1;fillAssets()}
  else if(t.dataset&&t.dataset.af){S.afilt[t.dataset.af]=t.value;S.apg=1;fillAssets()}
  else if(t.id==='tsearch'){S.tree.q=t.value;refreshTree()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='tactive'){S.tree.activeOnly=t.checked;refreshTree();return}
  if(t.dataset&&t.dataset.af){S.afilt[t.dataset.af]=t.value;S.apg=1;fillAssets();return}
  if(t.id==='f-client'){const sel=$('#f-matter');const m=sel.value?mById(sel.value):null;sel.innerHTML=matterOpts(t.value,m&&(!t.value||m.client===t.value)?m.id:'');updateVis();return}
  if(t.id==='f-matter'){if(t.value)$('#f-client').value=mById(t.value).client;updateVis();return}
  if(t.name==='mstate'){applyState(t.value);mountMock();render({top:true,flash:true});return}
  if(t.name==='mperm'){S.perm=t.value;closeMenu(false);render({});return}
  if(t.name==='mopen'){S.open=t.value;writeHash();return}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.classList.contains('dlg')){submitForm(f)}
  else if(f.classList.contains('addc')){
    const inp=$('input',f);const tx=inp.value.trim();if(!tx)return;const a=aById(f.dataset.aid);S.acm=S.acm||{};(S.acm[a.id]=S.acm[a.id]||[]).push({who:PEOPLE[0],d:0,t:tx});
    const p=$('#apanel');p.innerHTML=assetPanelHTML(a);$('#newc',p).focus();toast('Comment added.');
  }
});
document.addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='Escape'){
    if(DD){closeDD(true);return}
    if(MENU){closeMenu(true);return}
    if(POP){const b=closePop();b&&b.focus();return}
    if($('#treepop')){closeTreePop(true);return}
    if($('#modal')){closeModal();return}
    if(S.asel){const sid=S.asel;selectAsset(null);const b=$('#abody tr[data-aid="'+sid+'"] .lnk');b&&b.focus();return}
    if(S.mockOpen){S.mockOpen=false;mountMock();return}
    return;
  }
  if(onDDKey(e))return;
  if(onMenuKey(e))return;
  if(e.target.closest&&e.target.closest('#treebody')){onTreeKey(e);return}
  const tab=e.target.closest&&e.target.closest('[role=tab]');
  if(tab&&(k==='ArrowRight'||k==='ArrowLeft'||k==='Home'||k==='End')){
    e.preventDefault();const tabs=$$('[role=tab]');let i=tabs.indexOf(tab);i=k==='Home'?0:k==='End'?tabs.length-1:(i+(k==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
    S.tab=tabs[i].dataset.v;S.asel=null;render({top:true});$('#tab-'+S.tab).focus();return;
  }
  if(k==='Tab'){
    const m=$('#modal');if(m&&m.contains(e.target)){
      const f=$$('button:not([disabled]),input:not([disabled]),select,textarea,a[href]',m).filter(x=>x.offsetParent!==null);if(!f.length)return;
      const first=f[0],last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
    }
  }
});
$$('[data-inert]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();toast('Mockup: this menu item is not part of this page.')}));
$('#burger').addEventListener('click',()=>$('#shell').classList.toggle('navopen'));
$('#scrim').addEventListener('click',()=>$('#shell').classList.remove('navopen'));
$$('.top [data-act=toast]').forEach(b=>b.addEventListener('click',()=>toast(b.dataset.v)));
let rsz,lastDock=dock();
window.addEventListener('resize',()=>{closeDD(false);closePop();clearTimeout(rsz);rsz=setTimeout(()=>{const d=dock();if(d!==lastDock){lastDock=d;if(V==='b'){S.tree.open=d&&!(S.client||S.matter)}closeTreePop(false)}render({})},150)});
function resetMock(){
  Object.assign(S,{client:'',matter:'',tab:'overview',state:'normal',stress:false,perm:'full',open:V==='c'?'drawer':'window',pre:'open',tsort:{k:'urg',d:1},tpage:1,fType:'',pk:'all',ak:'all',apgA:1,month:[2026,9],shows:{ev:true,crit:true,high:false,all:false,over:false},aq:'',asort:{k:'updated',d:-1},afilt:{client:'',matter:'',type:'',created:'',updated:'',status:'',comment:''},apg:1,asel:null,mview:'breakdown',dview:'table',dgroup:'type',bpage:1,read:{}});
  S.tree.open=dock();S.tree.q='';S.tree.activeOnly=false;S.list={group:false,all:false,lim:25};
  delete DBS.f;delete DBS.t;setDB();closeModal();mountMock();render({top:true});toast('Mockup reset.');
}

/* ====================== init ====================== */
loadTree();
S.tree.open=dock();
readHash();
if(V==='b'){S.tree.open=dock()&&!S.client&&!S.matter;if(/tree=1/.test(location.hash))S.tree.open=dock();if(S.state==='one')S.tree.open=false}
compute();render({nohash:true});mountMock();
window.__S=S;window.__api={setMatter,setClient,render};
})();

</script>
