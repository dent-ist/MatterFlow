<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LPT Hub - Dashboard mockup v2</title>
<style>
:root{
  --navy:#1A3556; --brand:#1d4e89;
  --bg:#F4F6FA; --card:#fff; --line:#E2E6ED; --line-2:#EEF1F5;
  --ink:#101828; --ink-2:#344054; --muted:#4B5565;
  --focus:#1B5FD6;
  --red:#C62828; --red-bg:#FDEDEB; --red-ink:#A31616; --red-bd:#F4C3BE;
  --amber:#B45309; --amber-bg:#FEF5E1; --amber-ink:#8A3F06; --amber-bd:#F3D9A0;
  --blue:#1D5FD1; --blue-bg:#EAF1FD; --blue-ink:#1A4DB0; --blue-bd:#C5D8F8;
  --teal:#0F766E; --teal-bg:#E5F5F2; --teal-ink:#0B5F58; --teal-bd:#B5E2DB;
  --violet:#6A3DBE; --violet-bg:#F2ECFC; --violet-ink:#55309C; --violet-bd:#D8C9F4;
  --slate:#475569; --slate-bg:#EEF1F6; --slate-ink:#334155; --slate-bd:#D5DBE5;
  --r:12px; --gut:24px; --gap:16px;
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,Arial,sans-serif;
}
@media (min-width:1500px){:root{--gut:32px}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue-ink)}
h1,h2,h3,p{margin:0}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:15px;height:15px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.side :focus-visible,.mock>button:focus-visible{outline-color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:#fff;padding:10px 14px;border-radius:8px;z-index:200;font-weight:600}
.skip:focus{top:8px}

/* tones */
.t-red{--tone:var(--red);--tbg:var(--red-bg);--tink:var(--red-ink);--tbd:var(--red-bd)}
.t-amber{--tone:var(--amber);--tbg:var(--amber-bg);--tink:var(--amber-ink);--tbd:var(--amber-bd)}
.t-blue{--tone:var(--blue);--tbg:var(--blue-bg);--tink:var(--blue-ink);--tbd:var(--blue-bd)}
.t-teal{--tone:var(--teal);--tbg:var(--teal-bg);--tink:var(--teal-ink);--tbd:var(--teal-bd)}
.t-violet{--tone:var(--violet);--tbg:var(--violet-bg);--tink:var(--violet-ink);--tbd:var(--violet-bd)}
.t-slate{--tone:var(--slate);--tbg:var(--slate-bg);--tink:var(--slate-ink);--tbd:var(--slate-bd)}
.chip{width:32px;height:32px;border-radius:9px;background:var(--tone);color:#fff;display:grid;place-items:center;flex:none}
.chip.sm{width:28px;height:28px;border-radius:8px}
.chip.sm svg.i{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;background:var(--tbg);color:var(--tink);font-weight:600;font-size:13px;white-space:nowrap;border:1px solid var(--tbd)}
.pill svg.i{width:14px;height:14px}

/* shell */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--navy);color:#DCE6F3;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:0 12px 12px;z-index:60}
.brand{display:flex;align-items:center;gap:10px;height:60px;color:#fff;font-weight:700;font-size:18px;padding:0 6px;flex:none}
.brand svg{width:32px;height:32px;border-radius:9px;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.nav{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;height:34px;padding:0 12px;border-radius:999px;color:#DCE6F3;text-decoration:none;font-size:14px}
.nav a:hover{background:rgba(255,255,255,.1)}
.nav a[aria-current=page]{background:#fff;color:var(--navy);font-weight:700}
.nav a.ind{margin-left:22px;height:32px}
.nav svg.i{width:18px;height:18px}
.nav-h{font-size:12px;letter-spacing:.09em;font-weight:700;color:#9DB2CF;margin:14px 12px 6px}
.ver{margin-top:auto;padding:10px 12px 0;font-size:13px;color:#9DB2CF}
.scrim{display:none}
.col{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line);height:60px;display:flex;align-items:center;gap:12px;padding:0 var(--gut)}
.burger{display:none;width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:10px;align-items:center;justify-content:center}
.search{position:relative;flex:1 1 auto;max-width:520px}
.search input{width:100%;height:38px;border:1px solid #CBD2DD;border-radius:10px;padding:0 68px 0 38px;background:#fff}
.search input::placeholder{color:#5C6677}
.search>svg{position:absolute;left:12px;top:10px;color:#5C6677}
.search kbd{position:absolute;right:9px;top:7px;font:12px var(--font);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);background:var(--bg)}
.pop{position:absolute;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(16,24,40,.16);z-index:70;padding:6px}
.spop{left:0;right:0;top:44px}
.pop .it{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;min-height:44px}
.pop .it:hover{background:var(--bg)}
.pop .hd{padding:6px 10px;font-weight:700;color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;border:1px solid #CBD2DD;background:#fff;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:#17406f}
.btn.ico{width:38px;padding:0}
.btn.sm{height:32px;padding:0 12px;font-size:14px}
.btn.ghost{border-color:transparent;background:none;color:var(--blue-ink);padding:0 10px}
.btn.ghost:hover{background:var(--blue-bg)}
.spacer{flex:1 1 0}
.bell{position:relative}
.bell .n{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:999px;min-width:20px;height:20px;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
.rel{position:relative}
.user{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 4px;border-radius:999px;border:1px solid var(--line);background:#fff}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--slate-bg);color:var(--slate-ink);flex:none;position:relative}
.av.v{background:var(--violet-bg);color:var(--violet-ink)}
.av.b{background:var(--blue-bg);color:var(--blue-ink)}
.av.t{background:var(--teal-bg);color:var(--teal-ink)}
.av.lg{width:36px;height:36px;font-size:13px}
.av .ooo{position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:50%;background:var(--slate);color:#fff;display:grid;place-items:center;border:2px solid #fff}
.av .ooo svg.i{width:9px;height:9px;stroke-width:2.6}
.user small{display:block;color:var(--muted);font-size:12px;line-height:1.1}
.user b{display:block;font-size:13px;line-height:1.25}
.right-pop{right:0;top:46px;width:320px}
main{padding:20px var(--gut) 88px;max-width:1480px;width:100%;margin:0 auto}

/* page head */
.head{display:flex;align-items:flex-end;gap:var(--gap);flex-wrap:wrap}
.head h1{font-size:22px;line-height:1.25;font-weight:600}
.head p{color:var(--muted);margin-top:2px;font-size:14px}
.hr{display:flex;align-items:center;gap:12px;color:var(--muted)}
.stale{display:inline-flex;gap:6px;align-items:center;color:var(--amber-ink);font-weight:600}
.tabs{display:flex;gap:2px;margin-top:12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;height:42px;padding:0 16px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{color:var(--blue-ink);border-bottom-color:var(--blue)}

/* filters */
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px var(--gap);margin:16px 0}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>label,.fld>span.l{font-size:13px;font-weight:600;color:var(--ink-2)}
.sel{position:relative}
.fld.c{width:220px}.fld.m{width:250px}.fld.t{width:180px}
.sel select{appearance:none;-webkit-appearance:none;height:38px;border:1px solid #CBD2DD;border-radius:10px;background:#fff;padding:0 36px 0 12px;width:100%;min-width:0;font-weight:500}
.sel select:hover{border-color:#98A2B3}
.sel>svg{position:absolute;right:11px;top:11px;pointer-events:none;color:var(--muted)}
.sep{align-self:flex-end;height:38px;display:grid;place-items:center;color:#7A8597;margin:0 -8px}
.seg{display:inline-flex;background:#fff;border:1px solid #CBD2DD;border-radius:10px;padding:2px;gap:2px;height:38px}
.seg.sm{height:32px;border-radius:9px}
.seg button{border:0;background:none;border-radius:8px;padding:0 12px;font-weight:600;color:var(--ink-2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button:hover{background:var(--bg)}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.vr{align-self:stretch;width:1px;background:var(--line);margin:0 2px}
.mf-btn{display:none}
.linkbtn{background:none;border:0;color:var(--blue-ink);font-weight:600;padding:0 6px;height:38px;text-decoration:underline;text-underline-offset:3px}
.scopeline{margin-left:auto;color:var(--muted);align-self:flex-end;height:38px;display:flex;align-items:center}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.flush{padding:0}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ch h2{font-size:17px;font-weight:600;line-height:1.3}
.ch .sub{color:var(--muted);flex-basis:100%;margin-top:-4px}
.ch .grow{flex:1}
.cnt{background:var(--tbg,var(--slate-bg));color:var(--tink,var(--slate-ink));border-radius:999px;padding:1px 10px;font-weight:700;font-size:13px}
.card.flush .ch{padding:14px 16px 0;margin-bottom:10px}
.g21{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:var(--gap);align-items:start}
.g11{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:var(--gap);align-items:start}
.stack{display:flex;flex-direction:column;gap:var(--gap)}

/* compact tiles */
.tiles{display:grid;gap:var(--gap);margin-bottom:var(--gap)}
.tiles.n3{grid-template-columns:repeat(3,minmax(200px,232px)) minmax(0,440px)}
.tiles.n5{grid-template-columns:repeat(5,minmax(0,232px))}
.tiles.n2{grid-template-columns:repeat(2,minmax(200px,232px))}
.tiles.n3s{grid-template-columns:repeat(3,minmax(0,232px))}
.tile{display:grid;grid-template-columns:32px minmax(0,1fr);column-gap:12px;align-items:center;text-align:left;padding:14px;min-height:92px;border-radius:12px;border:1px solid var(--tbd);background:var(--tbg);color:var(--ink);position:relative;min-width:0;transition:box-shadow .15s}
button.tile:hover{box-shadow:0 4px 14px rgba(16,24,40,.10)}
.tile[aria-pressed=true]{box-shadow:0 0 0 2px var(--tone)}
.tile .tx{display:flex;flex-direction:column;min-width:0}
.tile .lab{font-size:13.5px;line-height:17px;font-weight:600;color:var(--ink-2)}
.tile .num{font-size:30px;line-height:33px;font-weight:600;color:var(--tink);letter-spacing:-.3px}
.tile .hint{font-size:13px;line-height:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .mark{position:absolute;right:10px;top:10px;color:var(--tink)}
.tile.static{cursor:default}

/* radar strip (design A) */
.radar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 8px;align-content:center;padding:10px 12px;min-height:92px}
.radar button{display:flex;align-items:center;gap:8px;background:none;border:0;border-radius:8px;padding:0 8px;height:34px;text-align:left;width:100%;white-space:nowrap}
.radar button:hover{background:var(--bg)}
.radar button[aria-pressed=true]{background:var(--tbg);box-shadow:inset 0 0 0 1.5px var(--tone)}
.radar svg.i{color:var(--tink)}
.radar .t{flex:1;font-weight:600;color:var(--ink-2)}
.radar .n{font-size:16px;font-weight:700;color:var(--tink)}

/* tables */
.tbl-wrap{overflow-x:auto;container-type:inline-size}
@container (max-width:780px){.tref{display:none}}
@container (max-width:560px){.c-prio{display:none}}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{height:38px;text-align:left;font-size:13px;font-weight:600;color:var(--muted);background:#F8F9FB;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 10px;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{padding-left:16px}
.tbl th:last-child,.tbl td:last-child{padding-right:16px}
.tbl th button{background:none;border:0;font-weight:600;color:inherit;display:inline-flex;gap:5px;align-items:center;height:32px;padding:0 4px;margin:0 -4px;border-radius:6px;font-size:13px}
.tbl th button:hover{color:var(--ink)}
.tbl th[aria-sort=ascending] button,.tbl th[aria-sort=descending] button{color:var(--blue-ink)}
.tbl td{height:42px;padding:0 10px;border-bottom:1px solid var(--line-2);font-size:14px;white-space:nowrap}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:#F7F9FC}
.tbl tbody tr:last-child td{border-bottom:0}
.c-task{max-width:0;width:46%}
.tlink{background:none;border:0;padding:0;text-align:left;font-weight:600;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px;height:34px;font-size:14px}
.tlink .tt{overflow:hidden;text-overflow:ellipsis}
.tlink:hover .tt{color:var(--blue-ink);text-decoration:underline}
.tref{color:var(--muted);font-weight:500;font-size:13px}
.who{display:inline-flex;align-items:center;gap:8px}
.who .av{width:24px;height:24px;font-size:11px}
.un{color:var(--violet-ink);font-weight:600;display:inline-flex;gap:5px;align-items:center}
.late{color:var(--red-ink);font-weight:700;display:inline-flex;gap:5px;align-items:center}
.soon{color:var(--amber-ink);font-weight:700;display:inline-flex;gap:5px;align-items:center}
.asap{color:var(--blue-ink);font-weight:700;display:inline-flex;gap:5px;align-items:center}
.nrm{color:var(--ink-2)}
.mut{color:var(--muted)}
.pr{display:inline-flex;gap:6px;align-items:center;font-weight:600;color:var(--ink-2)}
.pr i{width:8px;height:8px;border-radius:50%;background:#98A2B3;display:inline-block}
.pr.High i{background:var(--violet)}
.pr.Low i{background:#CBD2DD}
.pr.ASAP{color:var(--blue-ink)} .pr.ASAP i{background:var(--blue)}
.foot{display:flex;align-items:center;gap:10px;padding:8px 16px 10px;border-top:1px solid var(--line-2);flex-wrap:wrap;color:var(--muted)}
.foot .grow{flex:1}
.smallbtn{height:28px;border-radius:8px;border:1px solid var(--violet-bd);background:var(--violet-bg);color:var(--violet-ink);font-weight:700;padding:0 10px;font-size:13px}
.smallbtn:hover{background:#E6DBF9}
.minipill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--tbg);color:var(--tink);border:1px solid var(--tbd);white-space:nowrap}
.minipill svg.i{width:12px;height:12px}

/* feed */
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line-2)}
.feed li:first-child{border-top:0;padding-top:0}
.feed .tx{min-width:0}
.feed .tm{color:var(--muted);font-size:13px;margin-top:1px}
.feed b{font-weight:600}
.feed button.ev{background:none;border:0;padding:0;text-align:left;color:var(--blue-ink);font-weight:600;text-decoration:underline;text-underline-offset:2px}

/* health list (client then matter) */
.hl{display:flex;flex-direction:column;gap:2px;margin:0 -6px}
.hl button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:10px;padding:8px 8px;text-align:left;width:100%;min-height:52px}
.hl button:hover{background:var(--bg)}
.hl button[aria-pressed=true]{background:var(--blue-bg);box-shadow:inset 0 0 0 1.5px var(--blue)}
.hl .nm{flex:1;min-width:0;font-weight:600}
.hl .nm span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hl .nm small{display:block;color:var(--muted);font-weight:400;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.how{margin-top:10px;color:var(--muted);font-size:13px}
details.how summary{cursor:pointer;font-weight:600;color:var(--blue-ink);width:fit-content;border-radius:6px}
details.how p{margin-top:6px}
.bar{height:8px;border-radius:999px;background:var(--slate-bg);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--teal)} .bar .r{background:var(--red)} .bar .a{background:var(--amber)} .bar .b{background:var(--blue)} .bar .s{background:#94A3B8} .bar .v{background:var(--violet)}

/* charts */
.legend{display:flex;gap:8px;flex-wrap:wrap}
.lg{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600}
.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.lg[aria-pressed=false]{color:var(--muted);background:var(--bg)} .lg[aria-pressed=false] i{opacity:.35}
.chart{width:100%;min-height:200px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:12px var(--font);fill:#475467}
.chart .bar-c:hover{opacity:.8}
.insight{display:flex;gap:10px;align-items:flex-start;background:var(--tbg);border:1px solid var(--tbd);color:var(--ink);border-radius:10px;padding:10px 12px;margin-top:12px}
.insight svg{color:var(--tink);margin-top:2px}
.brow{display:grid;grid-template-columns:150px minmax(0,1fr) 36px;gap:10px;align-items:center;min-height:38px;width:100%;background:none;border:0;text-align:left;border-radius:8px;padding:2px 6px;margin:0 -6px}
.brow:hover{background:var(--bg)}
.brow .nmx{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .v{font-weight:700;text-align:right}
.brow .bar{height:12px}
.bdkey{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);align-items:center}
.bdkey i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.pie{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pie ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;flex:1;min-width:150px}
.pie li{display:flex;gap:8px;align-items:center}
.pie li i{width:10px;height:10px;border-radius:3px;flex:none}
.pie li b{margin-left:auto}
.stk{display:flex;height:22px;border-radius:8px;overflow:hidden;gap:2px;margin:6px 0 12px}
.stk i{display:block;height:100%;min-width:3px}

/* swimlane */
.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap);align-items:start}
.lane{background:#EDF0F5;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lane h3{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.lane h3 .cnt{background:#fff;margin-left:auto}
.sc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.sc:hover{box-shadow:0 4px 12px rgba(16,24,40,.10)}
.sc .tt{font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  const d=q.get('design')||q.get('opt'); if(d)S.design=d==='A'?'A':'R';

  if(q.get('list'))S.list=q.get('list'); if(q.get('win'))S.win=+q.get('win')===2?2:7;
  if(q.get('mock'))S.mockOpen=true;};
const saveHash=()=>{try{const q=new URLSearchParams();q.set('design',S.design);if(S.mode!=='live')q.set('state',S.mode);if(S.role!=='director')q.set('role',S.role);if(S.tab!=='summary')q.set('tab',S.tab);if(S.client)q.set('client',S.client);if(S.matter)q.set('matter',S.matter);q.set('list',S.list);if(S.win!==7)q.set('win',S.win);history.replaceState(null,'','#'+q)}catch(e){}};

/* ---------- derived ---------- */
const eff=t=>assigned[t.id]!==undefined?{...t,who:assigned[t.id]}:t;
const allTasks=()=>tasks.map(eff);
const myIds=()=>S.role==='pm'&&S.mine?matters.filter(m=>m.lead===ME.pm.id).map(m=>m.id):null;
const visMatters=()=>{const ids=myIds();return ids?matters.filter(m=>ids.includes(m.id)):matters};
const visClients=()=>{const ms=visMatters();return clients.filter(c=>ms.some(m=>m.client===c.id))};
function scope(o={}){
  if(S.mode==='empty')return[];
  const c=o.noClient?'':S.client, m=o.noMatter?'':S.matter, ids=myIds();
  return allTasks().filter(t=>(!ids||ids.includes(t.matter))&&(!c||t.client===c)&&(!m||t.matter===m)&&(!S.type||t.type===S.type));
}
function stats(L){
  const n=k=>L.filter(FIL[k]).length;
  return {open:n('open'),overdue:n('overdue'),dueSoon:n('dueSoon'),unassigned:n('unassigned'),asap:n('asap'),hold:n('hold'),
    done:L.filter(t=>!isOpen(t)&&t.doneAgo<=S.period).length,created:L.filter(t=>t.createdAgo<=S.period).length};
}
/* health rule (Recommended design): Late = 3+ overdue tasks, or any task 10+ days overdue.
   At risk = 1 or 2 overdue, or 3+ due in the next 2 days, or a task unassigned for 7+ days. On track = none of these.
   A client is as healthy as its worst matter. */
function healthOf(L){
  const ov=L.filter(FIL.overdue), worst=ov.reduce((m,t)=>Math.max(m,-t.dueIn),0);
  const soon2=L.filter(t=>isOpen(t)&&t.prio!=='ASAP'&&t.status!=='On hold'&&t.dueIn!==null&&t.dueIn>=0&&t.dueIn<=2).length;
  const old=L.filter(t=>FIL.unassigned(t)&&t.createdAgo>=7).length;
  if(ov.length>=3||worst>=10)return 'risk';
  if(ov.length>=1||soon2>=3||old>=1)return 'watch';
  return 'ok';
}
function reasonOf(L){
  const ov=L.filter(FIL.overdue), worst=ov.reduce((m,t)=>Math.max(m,-t.dueIn),0);
  const soon2=L.filter(t=>isOpen(t)&&t.prio!=='ASAP'&&t.status!=='On hold'&&t.dueIn!==null&&t.dueIn>=0&&t.dueIn<=2).length;
  const old=L.filter(t=>FIL.unassigned(t)&&t.createdAgo>=7).length;
  if(ov.length)return `${ov.length} overdue, worst ${worst} d`;
  if(soon2>=3)return `${soon2} due in 2 days`;
  if(old)return `${old} unassigned 7+ days`;
  return 'Nothing overdue';
}
const HRANK={risk:0,watch:1,ok:2};
const worstOf=a=>a.reduce((w,h)=>HRANK[h]<HRANK[w]?h:w,'ok');
const H={risk:{tone:'red',label:'Late',icon:'alert'},watch:{tone:'amber',label:'At risk',icon:'clock'},ok:{tone:'teal',label:'On track',icon:'checkCircle'}};
const hpill=h=>`<span class="minipill t-${H[h].tone}">${ic(H[h].icon)}${H[h].label}</span>`;
const pn=id=>id?pById[id].name:'Unassigned';
const init=n=>n.split(' ').map(x=>x[0]).join('');
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
const perTxt=()=>S.period===90?'quarter':S.period+' days';

/* ---------- sorting ---------- */
const PR={ASAP:0,High:1,Normal:2,Low:3};
function urg(t){
  if(!isOpen(t))return 5000+t.doneAgo;
  let k;
  if(FIL.overdue(t))k=-1000+t.dueIn;
  else if(t.prio==='ASAP')k=-500-t.createdAgo/100;
  else if(t.dueIn!==null)k=t.dueIn;
  else k=900;
  return k-(t.prio==='High'?0.5:0);
}
function sorter(k,d){
  const v={urgency:urg,task:t=>t.title.toLowerCase(),matter:t=>mById[t.matter].short,assignee:t=>t.who?pn(t.who):'~',
    due:t=>t.dueIn===null?-999:t.dueIn,priority:t=>PR[t.prio],created:t=>-t.createdAgo}[k];
  return (a,b)=>{const x=v(a),y=v(b);return (x<y?-1:x>y?1:a.i-b.i)*d};
}
function sortDefault(){
  S.sort=(S.role==='tech'||(!R()&&S.list==='unassigned'))?{k:'priority',d:1}:R()?{k:'urgency',d:1}:{k:'due',d:1};S.showAll=false;
}
function applyRole(){
  S.tab='summary';S.mine=S.role==='pm';S.tq='all';
  S.list=S.role==='tech'?'unassigned':(R()&&S.role==='pod')?'unassigned':'overdue';
  if(S.matter&&!visMatters().some(m=>m.id===S.matter))S.matter='';
  if(S.client&&!visClients().some(c=>c.id===S.client)){S.client='';S.matter=''}
  sortDefault();
}

/* ---------- small renderers ---------- */
const dueTitle=t=>t.dueIn===null?'':fmt(t.dueIn,{weekday:'long',month:'long',day:'numeric'});

  if(t.prio==='ASAP')return `<span class="asap">${ic('bolt','s')}ASAP, no date</span>`;
  if(t.dueIn<0)return `<span class="late" title="${dueTitle(t)}">${ic('alert','s')}${plural(-t.dueIn,'day')} late</span>`;
  if(t.dueIn<=winN()&&t.status!=='On hold'){const w=t.dueIn===0?'Today':t.dueIn===1?'Tomorrow':'In '+t.dueIn+' days';return `<span class="soon" title="${dueTitle(t)}">${ic('clock','s')}${w}</span>`}

}
const whoCell=(t,compact)=>t.who?`<span class="who"><span class="av ${pById[t.who].cls}">${init(pn(t.who))}</span><span class="c-who-n">${esc(pn(t.who))}</span></span>`
  :(S.role==='tech'&&!compact?`<button class="smallbtn" data-act="assign-me" data-val="${t.id}" data-k="am-${t.id}">${ic('userPlus','s')} Assign to me</button>`:`<span class="un">${ic('userPlus','s')}Unassigned</span>`);

/* Recommended: pills only for unusual values (ASAP, High, On hold) */
const oddPills=(t,noHold)=>(t.prio==='ASAP'?`<span class="minipill t-blue">${ic('bolt')}ASAP</span>`:t.prio==='High'?`<span class="minipill t-slate">${ic('up')}High</span>`:'')+(t.status==='On hold'&&!noHold?`<span class="minipill t-slate">${ic('pause')}On hold</span>`:'');
const th=(k,label,cls)=>{const on=S.sort.k===k;return `<th class="${cls}" scope="col" aria-sort="${on?(S.sort.d>0?'ascending':'descending'):'none'}"><button data-act="sort" data-val="${k}" data-k="th-${k}">${label}${on?ic(S.sort.d>0?'chevU':'chevD','s'):ic('sort','s')}</button></th>`};
function taskTable(L,opts={}){

   show.map(t=>`<tr data-act="open-task" data-val="${t.id}"><td class="c-task"><button class="tlink" data-act="open-task" data-val="${t.id}" data-k="tk-${t.id}" title="${esc(t.id+' '+t.title)}"><span class="tref">${t.id}</span><span class="tt">${esc(t.title)}</span>${rr?oddPills(t):''}</button></td><td class="c-matter nrm" title="${esc(mById[t.matter].name)}">${esc(mById[t.matter].short)}</td><td class="c-who">${whoCell(t)}</td><td class="c-due">${dueCell(t)}</td>${rr?'':`<td class="c-prio">${prCell(t)}</td>`}</tr>`).join('')
  }</tbody></table></div>${rows.length>lim||(rr&&S.sort.k!=='urgency')?`<div class="foot"><span>${rr?(S.sort.k==='urgency'?`Showing ${show.length} of ${rows.length}, most urgent first`:`Showing ${show.length} of ${rows.length}, sorted by ${sortName}`):`Showing ${show.length} of ${rows.length}`}</span>${rr&&S.sort.k!=='urgency'?`<button class="btn ghost sm" data-act="sort-reset" data-k="sr">Back to urgency order</button>`:''}<span class="grow"></span>${rows.length>lim?`<button class="btn ghost sm" data-act="show-all" data-k="showall">${S.showAll?'Show fewer':'Show all '+rows.length}${ic(S.showAll?'chevU':'chevD','s')}</button>`:''}</div>`:''}`;

const emptyBlock=(tone,icon,h,p,btn)=>`<div class="empty t-${tone}"><div class="chip">${ic(icon)}</div><h3>${h}</h3><p>${p}</p>${btn||''}</div>`;

     return `<li class="t-${k[0]}"><span class="chip sm">${ic(k[1])}</span><div class="tx">${sent}<div class="tm">${esc(mById[t.matter].short)} &middot; ${evTime(e)}</div></div></li>`}).join('')}</ul>

/* ---------- compact tiles ---------- */

/* ---------- charts ---------- */
function bins(L,P){
  const n=P===7?7:P===30?10:13, w=P/n, out=[];
  for(let b=0;b<n;b++){const hi=Math.round(b*w), lo=Math.round((b+1)*w);
    const lbl=(()=>{const a=-(lo-1), z=-hi; return w<=1?fmt(z,{month:'short',day:'numeric'}):fmt(a,{month:'short',day:'numeric'})})();
    out.push({hi,lbl,created:L.filter(t=>t.createdAgo>=hi&&t.createdAgo<lo).length,done:L.filter(t=>!isOpen(t)&&t.doneAgo>=hi&&t.doneAgo<lo).length,range:w<=1?fmt(-hi):fmt(-(lo-1),{month:'short',day:'numeric'})+' to '+fmt(-hi,{month:'short',day:'numeric'})});
  }
  return out.reverse();
}
const backlogAt=(L,a)=>L.filter(t=>t.createdAgo>=a&&!(t.status==='Completed'&&t.doneAgo>=a)).length;
function chartSVG(el,B,h,tr,L){
  const W=Math.max(el.clientWidth,260),pl=34,pb=26,pt=10,pr=8;
  const grid=(max,step)=>{let g='';for(let v=0;v<=max;v+=step)g+=`<line x1="${pl}" x2="${W-pr}" y1="${pt+(h-pt-pb)*(1-v/max)}" y2="${pt+(h-pt-pb)*(1-v/max)}" stroke="#E4E8EF"/><text x="${pl-8}" y="${pt+(h-pt-pb)*(1-v/max)+4}" text-anchor="end">${v}</text>`;return g};
  const every=Math.max(1,Math.ceil(B.length*56/(W-pl)));
  let g='',lab;
  if(tr.measure==='backlog'){
    const vals=B.map(b=>backlogAt(L,b.hi)), max=Math.max(4,Math.ceil(Math.max(...vals)/4)*4), y=v=>pt+(h-pt-pb)*(1-v/max), cw=(W-pl-pr)/B.length;
    g+=grid(max,max/4);
    const pts=vals.map((v,i)=>[pl+cw*i+cw/2,y(v)]);
    g+=`<path d="M${pts[0][0]} ${h-pb} L${pts.map(p=>p.join(' ')).join(' L')} L${pts[pts.length-1][0]} ${h-pb}Z" fill="#DCE8FB"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#1D5FD1" stroke-width="2.5" stroke-linejoin="round"/>`;
    pts.forEach((p,i)=>{g+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#fff" stroke="#1D5FD1" stroke-width="2"><title>${B[i].range}: ${vals[i]} open</title></circle>`;if(i%every===0||i===B.length-1)g+=`<text x="${p[0]}" y="${h-7}" text-anchor="middle">${B[i].lbl}</text>`});
    lab=`Open backlog over ${S.period} days, from ${vals[0]} to ${vals[vals.length-1]}.`;
  }else{
    const max=Math.max(3,...B.map(b=>Math.max(tr.created?b.created:0,tr.completed?b.done:0))), y=v=>pt+(h-pt-pb)*(1-v/max), cw=(W-pl-pr)/B.length;
    const nseries=(tr.created?1:0)+(tr.completed?1:0)||1, bw=Math.min(22,(cw-8)/nseries);
    g+=grid(max,max>8?Math.ceil(max/4):1);
    B.forEach((b,i)=>{const cx=pl+cw*i+cw/2;let k=0;const x0=cx-bw*nseries/2;
      if(tr.created){g+=`<rect class="bar-c" x="${x0+bw*k}" y="${y(b.created)}" width="${bw-2}" height="${h-pb-y(b.created)}" rx="3" fill="#3B7DE0"><title>${b.range}: ${b.created} created</title></rect>`;k++}
      if(tr.completed){g+=`<rect class="bar-c" x="${x0+bw*k}" y="${y(b.done)}" width="${bw-2}" height="${h-pb-y(b.done)}" rx="3" fill="#0F9488"><title>${b.range}: ${b.done} completed</title></rect>`}
      if(i%every===0||i===B.length-1)g+=`<text x="${cx}" y="${h-7}" text-anchor="middle">${b.lbl}</text>`;
    });
    lab=`Tasks created and completed, ${S.period} days. Created ${B.reduce((a,b)=>a+b.created,0)}, completed ${B.reduce((a,b)=>a+b.done,0)}.`;
  }
  el.innerHTML=`<svg viewBox="0 0 ${W} ${h}" width="${W}" height="${h}" role="img" aria-label="${esc(lab)}">${g}</svg>`;
}
function drawCharts(){document.querySelectorAll('[data-chart]').forEach(el=>{const L=scope();chartSVG(el,bins(L,S.period),+el.dataset.chart,S.tr,L)})}
function trendCard(L){
  const st=stats(L),net=st.created-st.done,tone=net>0?'amber':'teal',bk=S.tr.measure==='backlog';
  const b0=backlogAt(L,S.period), b1=backlogAt(L,0);
  return `<section class="card" aria-labelledby="th2"><div class="ch"><h2 id="th2">${bk?'Open backlog':'Created and completed'}</h2><span class="grow"></span>${bk?'':`<div class="legend"><button class="lg" aria-pressed="${S.tr.created}" data-act="tr" data-val="created" data-k="lg1"><i style="background:#3B7DE0"></i>Created ${st.created}</button><button class="lg" aria-pressed="${S.tr.completed}" data-act="tr" data-val="completed" data-k="lg2"><i style="background:#0F9488"></i>Completed ${st.done}</button></div>`}</div>
   ${S.mode==='empty'||!L.length?emptyBlock('slate','chart','No data yet','Charts fill in once tasks are created and completed.'):`<div class="chart" data-chart="240"></div>
   <div class="insight t-${bk?(b1>b0?'amber':'teal'):tone}">${ic(bk?(b1>b0?'up':'down'):net>0?'up':'check')}<span>${bk?`<b>Open work went from ${b0} to ${b1}</b> over the last ${perTxt()}.`:net>0?`<b>The backlog grew by ${net}.</b> ${st.created} tasks were created and ${st.done} completed in the last ${perTxt()}.`:`<b>The backlog shrank by ${-net}.</b> ${st.done} tasks were completed and ${st.created} created in the last ${perTxt()}.`}</span></div>`}</section>`;
}

/* ---------- Summary: client then matter health, team capacity ---------- */
function healthCard(){
  const Lc=scope({noClient:true,noMatter:true});
  const mrow=m=>{const l=Lc.filter(t=>t.matter===m.id);return{m,h:healthOf(l),st:stats(l),why:reasonOf(l)}};
  const byH=(a,b)=>HRANK[a.h]-HRANK[b.h]||b.st.overdue-a.st.overdue;
  const mineOnly=S.role==='pm'&&S.mine;
  let rows,title,right='',late;
  if(S.client||mineOnly){
    const ms=visMatters().filter(m=>!S.client||m.client===S.client).map(mrow).sort(byH);
    title=S.client?'Matters of '+cById[S.client].short:'Your matters';
    late=ms.filter(x=>x.h==='risk').length;
    if(S.client&&!mineOnly)right=`<button class="btn ghost sm" data-act="pick-client" data-val="${S.client}" data-k="allcl">All clients</button>`;
    rows=ms.map(x=>`<button class="t-${H[x.h].tone}" data-act="pick-matter" data-val="${x.m.id}" aria-pressed="${S.matter===x.m.id}" data-k="hm-${x.m.id}"><span class="nm"><span>${esc(x.m.short)}</span><small>${mineOnly&&!S.client?esc(cById[x.m.client].short)+' &middot; ':''}${x.why}</small></span>${hpill(x.h)}</button>`).join('');
  }else{
    const cs=clients.map(c=>{const ms=matters.filter(m=>m.client===c.id).map(mrow);return{c,ms,h:worstOf(ms.map(x=>x.h)),late:ms.filter(x=>x.h==='risk').length,od:ms.reduce((a,x)=>a+x.st.overdue,0)}}).sort((a,b)=>HRANK[a.h]-HRANK[b.h]||b.od-a.od);
    title='Clients';late=cs.filter(x=>x.h==='risk').length;
    rows=cs.map(x=>`<button class="t-${H[x.h].tone}" data-act="pick-client" data-val="${x.c.id}" aria-pressed="${S.client===x.c.id}" data-k="hc-${x.c.id}"><span class="nm"><span>${esc(x.c.name)}</span><small>${x.late?x.late+' of '+x.ms.length+' matters late':x.ms.length+' matters'} &middot; ${x.od} overdue</small></span>${hpill(x.h)}</button>`).join('');
  }
  const body=S.mode==='empty'||!rows?emptyBlock('slate','inbox','Nothing to rank yet','Clients and matters appear here once they have work.'):`<div class="hl">${rows}</div>`;
  return `<section class="card" aria-labelledby="hh"><div class="ch" style="margin-bottom:8px"><h2 id="hh">${title}</h2><span class="grow"></span>${right}</div>${body}${S.mode==='empty'?'':`<details class="how"><summary>How health is decided</summary><p><b>Late:</b> 3 or more overdue tasks, or any task 10 or more days overdue. <b>At risk:</b> 1 or 2 overdue, 3 or more due in the next 2 days, or a task unassigned for 7 days or more. <b>On track:</b> none of these. A client is as healthy as its worst matter.</p></details>`}</section>`;
}
function workload(L){
  return people.map(p=>{const l=L.filter(t=>t.who===p.id),o=l.filter(isOpen),s=stats(l);
    const state=p.ooo?{k:'ooo',tone:'slate',label:'Out of office',icon:'moon'}:o.length>=7?{k:'full',tone:'amber',label:'Full',icon:'alert'}:o.length>=4?{k:'busy',tone:'blue',label:'Busy',icon:'clock'}:{k:'room',tone:'teal',label:'Has room',icon:'checkCircle'};
    return{p,l,o,s,state}});
}
function teamCard(){
  const rows=workload(scope()).filter(r=>r.state.k!=='ooo').sort((a,b)=>a.o.length-b.o.length).slice(0,5);
  return `<section class="card" aria-labelledby="tcn"><div class="ch" style="margin-bottom:8px"><h2 id="tcn">Team capacity</h2><span class="grow"></span><button class="btn ghost sm" data-act="tab" data-val="users" data-k="tcu">Open Users ${ic('arrowR','s')}</button></div>${S.mode==='empty'?emptyBlock('slate','users','No workload yet','People appear here once tasks are assigned.'):`<div class="hl">${rows.map(r=>`<button class="t-${r.state.tone}" data-act="assign-hint" data-val="${esc(r.p.name)}" data-k="tc-${r.p.id}" style="cursor:default"><span class="av ${r.p.cls}">${init(r.p.name)}</span><span class="nm"><span>${esc(r.p.name)}</span><small>${r.o.length} open &middot; ${r.s.overdue} overdue</small></span><span class="minipill">${ic(r.state.icon)}${r.state.label}</span></button>`).join('')}</div>`}</section>`;
}

function story(){
  const L=scope(),st=stats(L);
  if(S.mode==='empty'||!L.length)return 'Nothing to report yet.';
  if(S.role==='pod'){const room=workload(L).filter(r=>r.state.k==='room').length;return `${plural(st.unassigned,'task')} waiting for an owner. ${plural(room,'teammate')} ${room===1?'has':'have'} room.`}
  const Lm=scope({noClient:true,noMatter:true});

const PALETTE=['#1D5FD1','#0F766E','#6A3DBE','#B45309','#C62828','#475569','#0E7490','#9A3412'];
function bdCard(key,title,items,note){
  const mode=S.bdv[key], tot=items.reduce((a,i)=>a+i.n,0), mx=Math.max(1,...items.map(i=>i.n));
  const seg=`<div class="seg sm" role="group" aria-label="${title} view">${[['bars','Bars'],['table','Table'],['pie','Pie']].map(([v,l])=>`<button aria-pressed="${mode===v}" data-act="bdv" data-val="${key}:${v}" data-k="bdv-${key}-${v}">${l}</button>`).join('')}</div>`;
  let body;
  if(!items.length)body='<p class="mut">No open tasks.</p>';
  else if(mode==='table')body=`<table class="tbl"><caption class="sr">${title}</caption><thead><tr><th scope="col" style="padding-left:0">${title}</th><th scope="col">Open</th><th scope="col" style="padding-right:0">Overdue</th></tr></thead><tbody>${items.map(i=>`<tr style="cursor:default"><td style="padding-left:0">${esc(i.name)}</td><td class="numc">${i.n}</td><td class="numc ${i.od?'late':'mut'}" style="padding-right:0">${i.od}</td></tr>`).join('')}</tbody></table>`;
  else if(mode==='pie'){let acc=0;const C=2*Math.PI*40;
    const arcs=items.map((i,k)=>{const len=i.n/tot*C,s=`<circle cx="60" cy="60" r="40" fill="none" stroke="${PALETTE[k%8]}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 60 60)"><title>${esc(i.name)}: ${i.n}</title></circle>`;acc+=len;return s}).join('');
    body=`<div class="pie"><svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="${title}: ${items.map(i=>i.name+' '+i.n).join(', ')}">${arcs}</svg><ul>${items.map((i,k)=>`<li><i style="background:${PALETTE[k%8]}"></i>${esc(i.name)}<b>${i.n}</b></li>`).join('')}</ul></div>`;}
  else body=items.map(i=>`<button class="brow" data-act="bd-pick" data-val="${esc(i.name)}" data-key="${key}" data-k="bd-${key}-${esc(i.name)}"><span class="nmx">${esc(i.name)}</span><span class="bar" role="img" aria-label="${i.n}, of which ${i.od} overdue"><i class="r" style="width:${i.od/mx*100}%"></i><i class="b" style="width:${(i.n-i.od)/mx*100}%"></i></span><span class="v">${i.n}</span></button>`).join('');
  return `<section class="card" aria-labelledby="bh-${key}"><div class="ch"><h2 id="bh-${key}">${title}</h2><span class="grow"></span>${seg}</div>${body}${note?`<p class="mut" style="margin-top:10px">${note}</p>`:''}</section>`;
}

   <button class="it" data-act="toast" data-val="Would open the task"><span class="chip sm t-teal">${ic('check')}</span><span>Review Batch 62 completed<br><small class="nrm">FCA Investigation, yesterday</small></span></button></div></div>
  <div class="rel"><button class="user" data-act="pop" data-val="user" aria-expanded="${S.pop==='user'}" data-k="user"><span class="av b">${me.init}</span><span class="tx2" style="text-align:left"><b>${me.name}</b><small>${me.role}</small></span>${ic('chevD','s')}</button>
   <div class="pop right-pop ${S.pop==='user'?'':'hidden'}" style="width:230px"><button class="it" data-act="toast" data-val="Profile would open">${ic('user')} Profile</button><button class="it" data-act="toast" data-val="Availability would open">${ic('calendar')} My availability</button><button class="it" data-act="toast" data-val="This is a mockup, nobody is signed in">${ic('arrowR')} Sign out</button></div></div>`;
}
function header(){
  const sub=S.role==='tech'?'Unassigned work waiting for an owner.':R()?story():'Thursday, 29 October 2026. Here is what needs you today.';
  return `<div class="head"><div><h1 id="h1">Dashboard</h1><p aria-live="polite"${R()&&S.role!=='tech'?' style="color:var(--ink-2);font-weight:500"':''}>${sub}</p></div><span class="spacer"></span><div class="hr">${S.role==='pm'?`<div class="seg sm" role="group" aria-label="Which matters"><button type="button" aria-pressed="${S.mine}" data-act="mine" data-val="1" data-k="mn1">My matters</button><button type="button" aria-pressed="${!S.mine}" data-act="mine" data-val="0" data-k="mn2">All matters</button></div>`:''}${S.mode==='stale'?`<span class="stale" role="status">${ic('clock','s')}Updated 12 min ago</span>`:''}<span aria-live="polite">${scope().length} tasks in scope</span><button class="btn ico" data-act="refresh" aria-label="Refresh${S.mode==='stale'?', figures are 12 minutes old':''}" data-k="rf">${ic('refresh')}</button></div></div>`;
}
function tabsHtml(){const T=ROLE_TABS[S.role];if(T.length<2&&S.role!=='tech')return '';return `<div class="tabs" role="tablist" aria-label="Dashboard views">${T.map(k=>`<button role="tab" id="tab-${k}" aria-selected="${S.tab===k}" aria-controls="panel" tabindex="${S.tab===k?0:-1}" data-act="tab" data-val="${k}" data-k="tab-${k}">${TAB_LABEL[k]}</button>`).join('')}</div>`}
function filtersHtml(){
  const ms=visMatters().filter(m=>!S.client||m.client===S.client), cl=visClients();
  const mopts=S.client?ms.map(m=>`<option value="${m.id}"${S.matter===m.id?' selected':''}>${esc(m.name)}</option>`).join(''):cl.map(c=>`<optgroup label="${esc(c.name)}">${ms.filter(m=>m.client===c.id).map(m=>`<option value="${m.id}"${S.matter===m.id?' selected':''}>${esc(m.name)}</option>`).join('')}</optgroup>`).join('');
  const per=[[7,'7 days'],[30,'30 days'],[90,'Quarter']];
  const tech=S.role==='tech', showP=!tech&&(S.tab==='summary'||S.tab==='trends'||S.tab==='swimlane');
  return `<form class="filters${S.moreF?' open':''}" role="group" aria-label="Scope: client, matter, period, type" onsubmit="return false">
   <div class="fld c"><label for="fc">Client</label><div class="sel"><select id="fc" data-sel="client" data-k="fc"><option value="">All clients</option>${cl.map(c=>`<option value="${c.id}"${S.client===c.id?' selected':''}>${esc(c.name)}</option>`).join('')}</select>${ic('chevD','s')}</div></div>
   <span class="sep" aria-hidden="true">${ic('chevR','s')}</span>
   <div class="fld m"><label for="fm">Matter</label><div class="sel"><select id="fm" data-sel="matter" data-k="fm"><option value="">${S.client?'All matters of '+esc(cById[S.client].short):'All matters'}</option>${mopts}</select>${ic('chevD','s')}</div></div>
   ${tech?'':`${showP?`<span class="vr f-more" aria-hidden="true"></span>
   <div class="fld f-more"><span class="l" id="pl">Period</span><div class="seg" role="group" aria-labelledby="pl">${per.map(([v,l])=>`<button type="button" aria-pressed="${S.period===v}" data-act="period" data-val="${v}" data-k="p${v}">${l}</button>`).join('')}</div></div>`:''}
   <div class="fld t f-more"><label for="ft">Task type</label><div class="sel"><select id="ft" data-sel="type" data-k="ft"><option value="">All types</option>${types.map(t=>`<option${S.type===t?' selected':''}>${esc(t)}</option>`).join('')}</select>${ic('chevD','s')}</div></div>`}
   ${tech?'':`<button type="button" class="btn sm mf-btn" data-act="more-f" aria-expanded="${!!S.moreF}" data-k="mf">${ic('sliders','s')} ${S.moreF?'Fewer filters':'Period and type'}</button>`}${isFiltered()?`<button type="button" class="linkbtn" data-act="clear" data-k="clr">Clear filters</button>`:''}
</form>`;
}
function skeleton(){return `<div class="skel" aria-busy="true" aria-label="Loading"><div class="r5">${'<div class="sk" style="height:92px"></div>'.repeat(5)}</div><div class="sk" style="height:38px;max-width:420px"></div><div class="sk" style="height:300px"></div></div>`}
function techView(){
  let L=scope().filter(FIL.unassigned); const all=L.length; const na=L.filter(t=>t.prio==='ASAP').length;
  if(S.tq==='asap')L=L.filter(t=>t.prio==='ASAP');
  const emp=S.mode==='empty';
  const tiles=R()?`<div class="tiles n2" role="group" aria-label="Queue">${tile('all','violet','userPlus','Unassigned',all,'Waiting for an owner',S.tq==='all',{act:'tq'})}${tile('asap','blue','bolt','ASAP in the queue',na,'Pick these first',S.tq==='asap',{act:'tq'})}</div>`:'';
  return tiles+`<section class="card flush t-violet" aria-labelledby="tqh"><div class="ch"><div class="chip sm">${ic('userPlus')}</div><h2 id="tqh">${S.tq==='asap'?'ASAP, unassigned':'Unassigned queue'}</h2><span class="cnt">${L.length}</span><p class="sub">Pick up work for yourself. Most urgent first.</p></div>${L.length?taskTable(L,{limit:8,cap:'Unassigned tasks'}):emptyBlock('teal','checkCircle','Queue is clear','Every task has an owner.')}</section>`;
}
function panelHtml(){
  if(S.mode==='loading')return skeleton();
  if(S.role==='tech')return techView();
  if(S.tab==='breakdowns')return tabBreakdowns();
  if(S.tab==='trends')return tabTrends();
  if(S.tab==='swimlane')return tabSwim();
  if(S.tab==='users')return tabUsers();
  return R()?summaryR():summaryA();
}
function render(){
  const ak=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.k;
  if(S.role!=='tech'&&!ROLE_TABS[S.role].includes(S.tab))S.tab='summary';
  renderTop();
  const tech=S.role==='tech', hasTabs=!tech&&ROLE_TABS[S.role].length>1;
  $('#page').innerHTML=header()+(hasTabs?tabsHtml():'')+filtersHtml()+`<div id="panel" role="${hasTabs?'tabpanel':'region'}" ${hasTabs?'aria-labelledby="tab-'+S.tab+'"':'aria-label="'+(tech?'Unassigned queue':'Summary')+'"'} tabindex="-1">${panelHtml()}</div>`;
  renderMock(); renderDrawer(); drawCharts(); saveHash(); document.title='LPT Hub - Dashboard mockup v2';
  if(ak){const el=document.querySelector('[data-k="'+ak.replace(/"/g,'\\"')+'"]');if(el)el.focus({preventScroll:true})}
}
function renderMock(){
  const o=(n,v,t,d,cur)=>`<label><input type="radio" name="${n}" value="${v}"${cur===v?' checked':''}><span>${t}${d?`<small>${d}</small>`:''}</span></label>`;
  $('#mock').innerHTML=`<button data-act="mock" aria-expanded="${S.mockOpen}" aria-controls="mpanel" id="mbtn">${ic('sliders','s')}<span class="mk">Mockup &middot; </span>${S.design==='A'?'A compact':'Recommended'} &middot; ${ROLE_NAME[S.role]}</button>${S.mockOpen?`<div class="panel" id="mpanel" role="group" aria-label="Mockup controls"><fieldset><legend>Design</legend>${o('design','A','A compact','Your option A, smaller tiles',S.design)}${o('design','R','Recommended','5 tiles, role-aware, health list',S.design)}</fieldset><fieldset><legend>View as</legend>${o('role','director','Director','All five tabs',S.role)}${o('role','pm','Project Manager','Own matters first; Summary and Swimlane',S.role)}${o('role','pod','Pod Lead','Team first; Summary, Swimlane, Users',S.role)}${o('role','tech','Technician','Unassigned queue only',S.role)}</fieldset><fieldset><legend>State</legend>${o('state','live','Live data','',S.mode)}${o('state','empty','Empty','',S.mode)}${o('state','loading','Loading','',S.mode)}${o('state','stale','Stale figures (12 min old)','',S.mode)}</fieldset></div>`:''}`;
}
function renderDrawer(){
  const el=$('#drawer'); if(!S.drawer){el.innerHTML='';return}
  const t=eff(tasks.find(x=>x.id===S.drawer)),m=mById[t.matter],c=cById[t.client];
  const evs=events.filter(e=>e.t.id===t.id).slice(0,3);
  const meTech=S.role==='tech';
  el.innerHTML=`<div class="drawer-scrim" data-act="close-drawer"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dh"><header><div style="flex:1;min-width:0"><div class="crumb">${esc(c.name)} &rsaquo; ${esc(m.name)}</div><h2 id="dh">${esc(t.title)}</h2></div><button class="btn ico sm" data-act="close-drawer" aria-label="Close" id="dclose">${ic('x')}</button></header><div class="body"><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill t-${t.status==='Completed'?'teal':t.status==='On hold'?'slate':'blue'}">${t.status}</span>${FIL.overdue(t)?`<span class="pill t-red">${ic('alert')}Overdue</span>`:''}${FIL.dueSoon(t)?`<span class="pill t-amber">${ic('clock')}Due soon</span>`:''}${t.prio==='ASAP'?`<span class="pill t-blue">${ic('bolt')}ASAP</span>`:''}${!t.who&&isOpen(t)?`<span class="pill t-violet">${ic('userPlus')}Unassigned</span>`:''}</div>
  <dl class="kv"><dt>Reference</dt><dd>${t.id}</dd><dt>Task type</dt><dd>${esc(t.type)}</dd><dt>Assignee</dt><dd>${t.who?esc(pn(t.who)):'<span class="un">Unassigned</span>'}</dd><dt>Due</dt><dd>${dueCell(t)}</dd><dt>Priority</dt><dd>${prCell(t)}</dd><dt>Created</dt><dd>${fmt(-t.createdAgo)}</dd><dt>Checklist</dt><dd>${t.sub[0]} of ${t.sub[1]} done<div class="bar" style="margin-top:8px"><i class="g" style="width:${t.sub[0]/t.sub[1]*100}%"></i></div></dd></dl>
  <div><h3 style="font-size:15px;font-weight:600;margin-bottom:8px">Recent activity</h3><ul class="feed">${evs.length?evs.map(e=>`<li><span class="chip sm t-slate">${ic('activity')}</span><div class="tx"><b>${esc(pn(e.who))}</b> ${({done:'completed this task',created:'created this task',assigned:'was assigned this task',moved:'moved the due date'})[e.kind]}<div class="tm">${evTime(e)}</div></div></li>`).join(''):'<li class="nrm">No recent activity.</li>'}</ul></div></div>
  <footer><button class="btn pri" data-act="toast" data-val="Would open the full task page" data-k="ot">Open task ${ic('ext','s')}</button>${!t.who&&isOpen(t)?`<button class="btn" data-act="assign-me" data-val="${t.id}">${ic('userPlus','s')} Assign to ${meTech?'me':S.role==='pod'?'me':'Marcus Oyelaran'}</button>`:''}<button class="btn" data-act="close-drawer">Close</button></footer></aside>`;
  $('#dclose').focus();
}
let toastT; function toast(m){const el=$('#toast');el.innerHTML=`<div class="toast">${ic('checkCircle')}<span>${esc(m)}</span></div>`;clearTimeout(toastT);toastT=setTimeout(()=>el.innerHTML='',2800)}
let lastFocus=null;
const visTabs=()=>ROLE_TABS[S.role];

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b){ if(S.pop&&!e.target.closest('.rel')){S.pop=null;render()} return }
  const a=b.dataset.act,v=b.dataset.val;
  if(a==='inert'){e.preventDefault();toast('Mockup: only Dashboard is clickable');return}
  if(a==='open-task'){ if(e.target.closest('button.smallbtn'))return; lastFocus=b.dataset.k||null;S.drawer=v;render();return}
  if(a==='close-drawer'){S.drawer=null;render();if(lastFocus){const el=document.querySelector('[data-k="'+lastFocus+'"]');if(el)el.focus()}return}
  if(a==='assign-me'){e.stopPropagation();const who=S.role==='tech'?'p3':'p2';assigned[v]=who;S.drawer=null;render();toast(`${v} assigned to ${S.role==='tech'?'you':S.role==='pod'?'you':'Marcus Oyelaran'}`);return}
  if(a==='assign-hint'){toast('Would open Tasks, to assign work to '+v);return}
  if(a==='toast'){toast(v);return}
  if(a==='nav-open'){document.body.classList.add('nav-open');return}
  if(a==='nav-close'){document.body.classList.remove('nav-open');return}
  if(a==='pop'){S.pop=S.pop===v?null:v;render();return}
  if(a==='mock'){S.mockOpen=!S.mockOpen;render();return}
  if(a==='refresh'){const was=S.mode==='stale'?'live':S.mode;S.mode='loading';render();setTimeout(()=>{S.mode=was;render();toast('Dashboard refreshed')},700);return}
  if(a==='tab'){S.tab=v;S.showAll=false;}
  else if(a==='list'){S.list=v;sortDefault()}
  else if(a==='tq'){S.tq=v;S.showAll=false}
  else if(a==='win'){S.win=+v}
  else if(a==='sort'){S.sort=S.sort.k===v?{k:v,d:-S.sort.d}:{k:v,d:1}}
  else if(a==='sort-reset'){sortDefault()}
  else if(a==='show-all'){S.showAll=!S.showAll}
  else if(a==='feed-more'){S.feedN=S.feedN>3?3:12}
  else if(a==='period'){S.period=+v}
  else if(a==='clear'){S.client='';S.matter='';S.type='';S.sw.who=''}
  else if(a==='pick-client'){S.client=S.client===v?'':v;S.matter=''}
  else if(a==='pick-matter'){if(S.matter===v)S.matter='';else{S.matter=v;S.client=mById[v].client}}
  else if(a==='mine'){S.mine=v==='1';if(S.mine){if(S.matter&&!visMatters().some(m=>m.id===S.matter))S.matter='';if(S.client&&!visClients().some(c=>c.id===S.client)){S.client='';S.matter=''}}}
  else if(a==='measure'){S.tr.measure=v}
  else if(a==='tr'){S.tr[v]=!S.tr[v]; if(!S.tr.created&&!S.tr.completed)S.tr[v==='created'?'completed':'created']=true}
  else if(a==='bdv'){const [k,m]=v.split(':');S.bdv[k]=m}
  else if(a==='bd-pick'){if(b.dataset.key==='type'){S.type=S.type===v?'':v;toast(S.type?'Filtered to task type: '+v:'Task type filter cleared')}else{toast('Would open Tasks filtered to '+b.dataset.key+': '+v)}}
  else if(a==='sw-done'){S.sw.hideDone=v==='hide'}
  else if(a==='sw-more'){S.sw.more[v]=!S.sw.more[v]}
  else if(a==='us-view'){S.us.view=v}
  else if(a==='us-mode'){S.us.mode=v}
  else if(a==='more-f'){S.moreF=!S.moreF}
  else return;
  S.pop=null;render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.name==='design'){S.design=t.value;applyRole();render();return}
  if(t.name==='state'){S.mode=t.value;render();return}
  if(t.name==='role'){S.role=t.value;applyRole();render();return}
  const s=t.dataset&&t.dataset.sel; if(!s)return;
  if(s==='client'){S.client=t.value;if(S.matter&&S.client&&mById[S.matter].client!==S.client)S.matter=''}
  else if(s==='matter'){S.matter=t.value;if(S.matter)S.client=mById[S.matter].client}
  else if(s==='type'){S.type=t.value}
  else if(s==='list'){S.list=t.value;sortDefault()}
  else if(s==='swho'){S.sw.who=t.value}
  else if(s==='usort'){S.us.sort=t.value}
  else if(s==='uav'){S.us.avail=t.value}
  render();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(S.drawer){S.drawer=null;render();if(lastFocus){const el=document.querySelector('[data-k="'+lastFocus+'"]');if(el)el.focus()}} else if(S.pop){S.pop=null;render()} else if(S.mockOpen){S.mockOpen=false;render();$('#mbtn').focus()} else document.body.classList.remove('nav-open') }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#q').focus()}
  const tb=e.target.closest&&e.target.closest('[role=tab]');
  if(tb&&(e.key==='ArrowRight'||e.key==='ArrowLeft'||e.key==='Home'||e.key==='End')){e.preventDefault();const T=visTabs();const i=T.indexOf(S.tab);const n=e.key==='Home'?0:e.key==='End'?T.length-1:(i+(e.key==='ArrowRight'?1:-1)+T.length)%T.length;S.tab=T[n];render();$('#tab-'+S.tab).focus()}
  if(e.key==='Tab'&&S.drawer){const f=[...document.querySelectorAll('.drawer button')];if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
});
document.addEventListener('input',e=>{
  if(e.target.id!=='q')return;
  const q=e.target.value.trim().toLowerCase(),box=$('#sres');
  if(!q){box.classList.add('hidden');return}
  const r=[...matters.filter(m=>m.name.toLowerCase().includes(q)).map(m=>({k:'m',m,t:m.name,s:'Matter '+m.ref})),...tasks.filter(t=>t.title.toLowerCase().includes(q)||t.id.toLowerCase().includes(q)).slice(0,5).map(t=>({k:'t',t:t.title,s:t.id,id:t.id}))].slice(0,6);
  box.innerHTML=r.length?`<div class="hd">Results</div>`+r.map(x=>`<button class="it" data-act="${x.k==='m'?'pick-matter':'open-task'}" data-val="${x.k==='m'?x.m.id:x.id}">${ic(x.k==='m'?'briefcase':'list')}<span>${esc(x.t)}<br><small class="nrm">${esc(x.s)}</small></span></button>`).join(''):'<div class="hd">No results</div>';
  box.classList.remove('hidden');
});
document.addEventListener('focusout',e=>{const box=$('#sres');if(box&&!e.relatedTarget&&e.target.id==='q'){setTimeout(()=>box.classList.add('hidden'),150)}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(drawCharts,120)});
hash();renderNav();
{const keep={tab:S.tab,list:S.list,client:S.client,matter:S.matter};applyRole();if(keep.client)S.client=keep.client;if(keep.matter)S.matter=keep.matter;if(ROLE_TABS[S.role].includes(keep.tab))S.tab=keep.tab;if(location.hash.includes('list='))S.list=keep.list;sortDefault();}
render();
})();
</script>
